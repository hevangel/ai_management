ox": true, "text": "Lars Faye I guess it depends on your view on what is LLM.\n\nTo me, LLM is more like a database and search engine than AI.  If the solution exists within its weights and context, and you have a deterministic way to check pass/fail, then eventually LLM will be convergent to the solution.\n\nThe key is how to express any problem in this format, so it fits the operating parameters of an LLM.", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Daniil Denysenko", "profile_url": "https://www.linkedin.com/in/denysenkodaniil/", "headline": "Senior Software Engineer | Golang, Architecture, Distributed Systems, Concurrency | 7+ YOE"}, "is_author_reply": false, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "In case of a power outage we do not stop working, but start using laptop batteries and wifi-sharing, so the analogy is simply wrong.\n\nAlso, comparing the awesome black magic that is electricity with these pattern-matching-guessing machines is just.. lame, you know.", "likes": 3, "replies": [{"comment_id": null, "author": {"name": "Lars Faye", "profile_url": "https://www.linkedin.com/in/larsfaye/", "headline": "B2B Full Stack // Technical Director // Coding Mentor"}, "is_author_reply": false, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "(edited) 3mo", "posted_at_approx": true, "text": "Daniil Denysenko these people are lost and beyond reach, IMO. In just four short years, they've completely abdicated all personal power cognitive abilities to an LLM. Wild times.", "likes": 2, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Lars Faye Daniil Denysenko lucky you.  If the server farm is dead, my code won't even compile.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Lars Faye code is no longer relevant and it never should be in the first place\n\nData structure, algorithm, network latency, distributed work load, those still matter with AI\n\nAI liberates us from stupid language wars and framework wars, so we can once again focus on the real thing that matters", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Lars Faye", "profile_url": "https://www.linkedin.com/in/larsfaye/", "headline": "B2B Full Stack // Technical Director // Coding Mentor"}, "is_author_reply": false, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "(edited) 3mo", "posted_at_approx": true, "text": "Horace Chan Mmhm. And the irony of it all: none of those skills are of any use if you don't go through the friction to understand how those elements work, on a tangible and visceral level. The very friction that you're advocating we skip over, apparently, by just taking the day off when the friction-alleviating-machine isn't online. Fascinating.\n\nI suppose we'll just grow our future senior engineers in a greenhouse somewhere!", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "(edited) 3mo", "posted_at_approx": true, "text": "Lars Faye yeah.. how to train the junior engineers into senior engineers is a real problem.\n\nBut for old folks like us, we already learned most of it the hard way, now we can just speed run anything using AI", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Lars Faye", "profile_url": "https://www.linkedin.com/in/larsfaye/", "headline": "B2B Full Stack // Technical Director // Coding Mentor"}, "is_author_reply": false, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Horace Chan Well, be careful...you don't want to throw your shoulder out pulling up that ladder behind you.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Lars Faye AGI will arrive by the time I retire, right? right?", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Gleb Rezoun", "profile_url": "https://www.linkedin.com/in/gleb-rezoun/", "headline": "Senior Backend Engineer | Node.js & Go | High-Load Distributed Systems"}, "is_author_reply": false, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "I don't buy the power-outage analogy. We should not normalize over-dependence on AI.\n\nI'd be seriously concerned if an engineer on my team could not work without it. AI should make you faster, but you should still be able to read code, debug an issue, and make a change when the tool is unavailable.\n\nOtherwise, it is not an accelerator. It is a dependency.", "likes": 3, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Gleb Rezoun only a few unlucky souls have to learn how to read code, debug an issue at code level.  Most people should operate at the abstraction one level above.\n\nHow do I know?  I am an unlucky soul knows how to debug firmware reading assembly code in the compiler era.   Most of my software team are happily working at the C/C++ abstraction layer.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Andy Merskin", "profile_url": "https://www.linkedin.com/in/andymerskin/", "headline": "Product Engineer & Designer - 20+ years | Agentic Dev | UX & Usability | Design Systems | FED SDLC | Full-Stack | TypeScript | React | Node.js | Animation | Data Viz | REST/RPC | CI/CD | B2B SaaS"}, "is_author_reply": false, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Horace Chan LLMs are not compilers, and they will never be 👍", "likes": 2, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Andy Merskin if you hammer LLM hard enough, it will behave like a compiler, close enough", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Lars Faye", "profile_url": "https://www.linkedin.com/in/larsfaye/", "headline": "B2B Full Stack // Technical Director // Coding Mentor"}, "is_author_reply": false, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Horace Chan", "likes": 2, "replies": []}]}, {"comment_id": null, "author": {"name": "Namir Sagheenanajar", "profile_url": "https://www.linkedin.com/in/namir-sagheenanajar/", "headline": "President at Initech Solutions"}, "is_author_reply": false, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Interesting analogy, but it also highlights a bit of irony.\n\n\"We'll just go home and enjoy nature\" sounds great... until we remember that the AI ecosystem increasingly depends on massive data centers consuming enormous amounts of electricity, water, land, and infrastructure while employing relatively few people compared to the industries they're attempting to displace.\n\nPerhaps a better long-term strategy is not becoming so dependent on any single external service that an outage means productivity simply stops. Resilience has always been a hallmark of good engineering.\n\nThere's a difference between using AI as a powerful tool and designing an entire profession around the assumption that someone else's infrastructure will always be available, affordable, and acting in your best interests.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Namir Sagheenanajar nay... expensive humans who buy designer clothes, fancy cars and flying business class everywhere waste way more energy than data centers.\n\nReplacing all the BS jobs with AI and the world can save a lot of energy.  AI is very good at BS.\n\nWe engineers only need Costco and Walmart are pretty energy efficient, so we are good", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "Blake Howe", "profile_url": "https://www.linkedin.com/in/webdesignjacksonms/", "headline": "I help people build a simpler, faster, more secure web."}, "is_author_reply": false, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Wow, this is wild like having someone build a house and they can’t read the plans", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Blake Howe well, it is the same in building houses too, have you seen those prefabricated houses are built?  It is like a giant IKEA.", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Justin Snyder", "profile_url": "https://www.linkedin.com/in/justin-snyder-dev/", "headline": "Expert Software Craftsman (Senior/Staff Backend Engineer) — Senior Software Engineer at Bellota Labs"}, "is_author_reply": false, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "I don’t write code with pen and paper but I might sketch out some architecture.\n\nAlso my laptop has batteries.", "likes": 3, "replies": []}], "scraped_at": "2026-10-19T23:29:00Z"}, {"activity_id": "7481752555547721728", "share_id": "7481752555547721728", "url": "https://www.linkedin.com/feed/update/urn:li:share:7481752555547721728/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-11T16:53:33+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "If your AI coding agent produces buggy code, DON'T fix the code itself. Fix the harness and the skills, then regenerate the code.\n\nCode is the new binary.  You don't patch assembly into exe, just like you shouldn't patch AI generated code.\n\n", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:29:00Z"}, {"activity_id": "7481747160850386944", "share_id": "7481747160850386944", "url": "https://www.linkedin.com/feed/update/urn:li:share:7481747160850386944/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-11T16:32:07+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Token-maxxing is OUT\nSkill-maxxing is IN\n\nYou just need to replace your tokens burnt leader board with the skills created leader board. \n\nNow we end up having 10 different skills for doing more or less the same task.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:31:00Z"}, {"activity_id": "7481739903068958721", "share_id": "7481739903068958721", "url": "https://www.linkedin.com/feed/update/urn:li:share:7481739903068958721/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-11T16:03:17+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "The moat of software is gone in the post AI era\n\nWhat about the moat of hardware?  \n\nhttps://lnkd.in/gwDtWJN7", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:31:00Z"}, {"activity_id": "7481393846866808832", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7481393846866808832/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-10T12:00:00+00:00", "posted_at_hint": "Jul 10 • Edited", "posted_at_approx": true, "text": "GPT 5.6 is cheaper than Fable 5 and honestly I can't tell which one is better.\n\nWill OpenAI gain some market share back from Anthropic this round?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7481496498434748416", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7481496498434748416/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-10T12:00:00+00:00", "posted_at_hint": "Jul 10", "posted_at_approx": true, "text": "For mission critical work, you need to own your LLM running on your own hardware, so Uncle Sam or Dario cannot take it away from you #amdbrandambassador", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7481033592077451264", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7481033592077451264/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-09T12:00:00+00:00", "posted_at_hint": "Jul 9", "posted_at_approx": true, "text": "Agent loop is out, Agent GOTO is in\n\nA semantic control-flow primitive for production AI agents that enables adaptive, auditable, context-aware jumps between reasoning states.\n\n* 100% AI generated parody", "post_type": "article_share", "shared_article": {"title": "Agent GOTO: The Next Control Primitive for Autonomous AI Systems", "url": "https://www.linkedin.com/pulse/agent-goto-next-control-primitive-autonomous-ai-systems-horace-chan-tbejc/"}, "reshared_post": null, "likes": 7, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7480737659921932288", "share_id": "7480737659921932288", "url": "https://www.linkedin.com/feed/update/urn:li:share:7480737659921932288/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-08T21:40:43+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Thariq talks about letting Fable to help you work out your unknown-unknown.\n\nWhat about the unknown-unknown-unknown (x3), the 3rd unknown is the stuff that is unknown to Fable's weights.  How can we deal with those?", "post_type": "reshare", "shared_article": null, "reshared_post": {"author_headline": "Member of Technical Staff @Anthropic. Claude Code.", "author_name": "Thariq Shihipar", "author_profile_url": "https://www.linkedin.com/in/thariqshihipar/", "posted_at_hint": "Jul 6 • Edited", "reshared_text": "My keynote at AI Engineer World Fair: “A Field Guide to Fable” is live on YouTube! I talk about how working with Claude changes with Fable and how important it is be more ambitious.\n\nhttps://lnkd.in/gY5w-8HV"}, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:31:00Z"}, {"activity_id": "7480742786971893760", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7480742786971893760/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-08T12:00:00+00:00", "posted_at_hint": "Jul 8", "posted_at_approx": true, "text": "I wasted half an hour talking to Sonnet thinking I was talking to Opus.   I forgot to switch back to Opus.\n\nSonnet is hallucinating a lot on debug tasks, it just randomly suggests that I try different things to workaround the problem.  Opus will spend the tokens reading everything and root cause the issue.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7480855827671785472", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7480855827671785472/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-08T12:00:00+00:00", "posted_at_hint": "Jul 8", "posted_at_approx": true, "text": "Someone need to duplicate the J-space research on open source LLM.\n\nIt would be fun to get a J-lens on Gemma or Qwen.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7480528386138849280", "share_id": "7480528386138849280", "url": "https://www.linkedin.com/feed/update/urn:li:share:7480528386138849280/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-08T07:49:08+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "What's next after Agent Loop?  \n\nAgent Goto\n\nYes, the GOTO statement in the BASICS programming language\nJust tell the how Agent to go to the next step on its own.   \nAnd we can implement loops with goto.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:33:00Z"}, {"activity_id": "7480383179481260032", "share_id": "7480383179481260032", "url": "https://www.linkedin.com/feed/update/urn:li:share:7480383179481260032/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-07T22:12:08+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "When I was a junior engineer, I used to laughed at the old folks who use Microsoft Words to do code review.\n\nI can't imagine I am using Microsoft Words to do my code review today.   M365 Copilot is the cheapest Opus 4.8 tokens you can find.\n\nAsk the AI agent do dump your code into Word document, then code review with Opus 4.8 using Copilot in Words, then ask AI to merge the changes back to the code base.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 7, "reposts": 0, "comment_count": 5, "comments": [{"comment_id": null, "author": {"name": "Andy Sung", "profile_url": "https://www.linkedin.com/in/andy-sung-62a3881/", "headline": "Embedded x86 SoC architect at AMD"}, "is_author_reply": false, "posted_at": "2026-07-21T23:33:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Haven’t used copilot in a while.  It can use opus model now?", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-07-21T23:33:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Andy Sung don't bother with Opus.  GPT-5.6 is better", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-07-21T23:33:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Andy Sung Yes .  MS Word has Opus 4.8", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Hin chun", "profile_url": "https://www.linkedin.com/in/hin-c-a1b6a1112/", "headline": "Design verification engineer"}, "is_author_reply": false, "posted_at": "2026-07-21T23:33:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "So, create a file using copilot in window, then open Claude in the terminal to execute it?", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Nik Sargent", "profile_url": "https://www.linkedin.com/in/niksargent/", "headline": "Data Truthteller | Making Customer Contact Magical | CX & UX Evangelist | AI & Analytics | Analytics Director @ HCLtech | mr-nik.ai"}, "is_author_reply": false, "posted_at": "2026-07-21T23:33:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Same with writing code in excel using opus 4.8", "likes": 1, "replies": []}], "scraped_at": "2026-10-19T23:33:00Z"}, {"activity_id": "7480342208269701120", "share_id": "7480342208269701120", "url": "https://www.linkedin.com/feed/update/urn:li:share:7480342208269701120/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-07T19:29:20+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Now I know GPT-5.6 is just around the corner, I lost interest in using GPT-5.5.  I will wait and use the newer and better model when it becomes available. \n\nI will spend some time learning the basics of compute theory and the network/security stack instead of keep vibe coding using an inferior model.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:33:00Z"}, {"activity_id": "7479948303015538688", "share_id": "7479948303015538688", "url": "https://www.linkedin.com/feed/update/urn:li:share:7479948303015538688/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-06T17:24:06+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "We should BAN people naming their AI agents with human sound like names.\n\nAll AI agents should be named following the human master's userid-agent123 convention, so there is no illusion the AI is doing any work on its own.  It is just the human engineer using AI as a tool.   AI is no different than your good old bash script.\n\nhttps://lnkd.in/gZA6tD6D", "post_type": "article_share", "shared_article": {"title": "AI agents are not your “coworkers”", "url": "https://www.technologyreview.com/2026/06/29/1139849/ai-agents-are-not-your-coworkers/?utm_source=the_download&utm_medium=email&utm_campaign=the_download.unpaid.engagement&utm_term=Active%20Qualified&utm_content=07-06-2026fsilivo&mc_cid=707ae64250&mc_eid=f4544923bd"}, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:36:00Z"}, {"activity_id": "7479942871404412928", "share_id": "7479942871404412928", "url": "https://www.linkedin.com/feed/update/urn:li:share:7479942871404412928/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-06T17:02:31+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Is it just me or is it common across the industry.\n\nI notice the response time of bug reports I filed are a lot slower in the post AI era.\n\nThe good ones have AI triaged the issues, then stuck waiting for human to review and merge\n\nThe bad ones are just sitting, and no one is address them.   The human owner is probably overwhelmed with bug reports to keep up.\n\nThe best ones are open source, so my AI agent can fix the bug, file the PR and move on with the bug-fix branch, while waiting patiently for the human to review and merge.\n\nClose source cannot keep up in the post AI era, it just can't deal with noise-to-signal ratio of the bug reports.\n", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Ajay Andrews Cherayath", "profile_url": "https://www.linkedin.com/in/ajaycherayath/", "headline": "Ops Transformation | Data, Analytics & AI Leader | Startup Mentor | I simplify decision-making for CXOs & teach clarity to next‑gen talent."}, "is_author_reply": false, "posted_at": "2026-07-21T23:36:00+00:00", "posted_at_hint": "(edited) 3mo", "posted_at_approx": true, "text": "AI didn’t just flood teams with bug reports. It broke the old contract about who owns quality. What used to be a technical defect is now a governance failure. When agents can detect issues, propose fixes, and file PRs, the real bottleneck isn’t engineering — it is the human permission layer that decides what gets accepted.\n\nOpen source works because authority is shared. Closed source stalls because authority is hoarded. In the post‑AI era, software quality is no longer a measure of code — it is a measure of how willing an organization is to let go of control.", "likes": 1, "replies": []}], "scraped_at": "2026-10-19T23:36:00Z"}, {"activity_id": "7479640301247148032", "share_id": "7479640301247148032", "url": "https://www.linkedin.com/feed/update/urn:li:share:7479640301247148032/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-05T21:00:12+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Here is another idea for the hedge funds\n\nSponsor Fable tokens to open source projects that block Facebook, Instagram ads at browser and apps level, then short the hell of META's stock.\n\n", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:36:00Z"}, {"activity_id": "7479633781155389440", "share_id": "7479633781155389440", "url": "https://www.linkedin.com/feed/update/urn:li:share:7479633781155389440/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-05T20:34:18+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "If you open source your work on GitHub, you do not worry about other people stealing your work.  \n\nIf your idea is crazily stupid and stupidly crazy, no one will bother to steal your idea.  \n\nAll genius ideas sound crazy and stupid until someone has proved that it actually works.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:37:00Z"}, {"activity_id": "7479632962041376768", "share_id": "7479632962041376768", "url": "https://www.linkedin.com/feed/update/urn:li:share:7479632962041376768/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-05T20:31:03+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Claudeflare tunnel with the zero trust login is the best way to access your AI agent back home. \n\nNope, the AI agent is not running on my main PC, it is running inside docker in a clean NPC that only has access to my public GitHub repos.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:37:00Z"}, {"activity_id": "7479283909495533568", "share_id": "7479283909495533568", "url": "https://www.linkedin.com/feed/update/urn:li:share:7479283909495533568/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-04T21:24:02+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "There are two types of tasks you can offload to AI\n\n1. Those you can merely glance at the result and you can tell whether the AI has screwed up or not \n\n2. Those you have to read the output in details to judge whether AI is doing what it is supposed to do correctly \n\nThe key is find the missing link translate type 2 tasks to type 1 tasks as much as you can", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:37:00Z"}, {"activity_id": "7479008247329488896", "share_id": "7479008247329488896", "url": "https://www.linkedin.com/feed/update/urn:li:share:7479008247329488896/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-04T03:08:39+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "I refuse to set a slash command for one liner in Claude Code\n\nTyping out the simple instructions like, \"commit, push, PR and merge\" is a healthy dose of slowdown in my super-fast-paced AI coding session.  Typing a /cppm may save 2 seconds in typing, but it actually adds extra cognitive burden to my brain.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:38:00Z"}, {"activity_id": "7478856229499346944", "share_id": "7478856229499346944", "url": "https://www.linkedin.com/feed/update/urn:li:share:7478856229499346944/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-03T17:04:35+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "You don't have to review the code generated by AI, but you HAVE to review all the skills used by AI, whether you vibe code it yourself or you download it from somewhere.   Also put the link to the original source document in the skill reference as a fall back path.\n\nI just spot stupid Claude make a very stupid mistake in a skill I created a few weeks ago, that gave me lots of headache debugging the code it generates in the past week.   Claude misinterpreted the original document slightly different than my human understanding; it results in a very subtle bug that the behavior of the code looks the same on the outside, that's why it slight thru the testsuite, but NOT doing in the exact correct order.\n", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "B Koop", "profile_url": "https://www.linkedin.com/in/b-koop-22580132/", "headline": "Staff Software Engineer | AI-Assisted Engineering Systems, Frontend Platform, DX, Testing, MCP/RAG Tooling"}, "is_author_reply": false, "posted_at": "2026-07-21T23:38:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "One thing I do on my skills is a refinement going back and forth with the agent on what is vague or could be confusing", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-07-21T23:38:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "B Koop that's why I don't like using other's skills.  skill is a continue evolution process", "likes": 0, "replies": []}]}], "scraped_at": "2026-10-19T23:38:00Z"}, {"activity_id": "7478609500548300800", "share_id": "7478609500548300800", "url": "https://www.linkedin.com/feed/update/urn:li:share:7478609500548300800/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-03T00:44:10+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "The Amish people refuse to use electricity \n\nThe Amish 2.0 can use power but refuse to use AI", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:38:00Z"}, {"activity_id": "7478499537414889472", "share_id": "7478499537414889472", "url": "https://www.linkedin.com/feed/update/urn:li:share:7478499537414889472/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-02T17:27:13+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "When you grow old, you start interested in history. I have been reading into early computers and chips history lately. \n\nWhen you are young, there are always some old folks who know more about history than you, especially those who experienced first hand.\n\nWhen you are old, you are only one old enough in the room to tell the story, it makes knowing the history more rewarding.\n\nEspecially if you can draw analogy from history lessons to today's problem, then you are the wise man.\n\nNow, the trillion dollars question, will the AI bubble pops like the dot com bubble?   Every time I show the young engineers the stock chart of Cisco vs Nivida, I can see their face lightening up.\n", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:39:00Z"}, {"activity_id": "7478364340841238528", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7478364340841238528/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-02T12:00:00+00:00", "posted_at_hint": "Jul 2", "posted_at_approx": true, "text": "Finally, I got my Signal connected to my Hermes agent. Then I don't know what can I use it for?\n\nWrite code? Cursor and Copilot cloud is better, it can even push back into GitHub.\n\nChat? ChatGPT is a lot more convenient\n\nAutomation? I have it all set up with GitHub workflow and Jenkins before AI exists\n\nCan someone tell me what they use Claw or Hermes for? Why not just vibe code a script to do the same thing?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:30:00Z"}, {"activity_id": "7478001178153504768", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7478001178153504768/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-01T12:00:00+00:00", "posted_at_hint": "Jul 1", "posted_at_approx": true, "text": "Github Copilot reset the tokens on June 30, but it won't charge you for the next month until Jul 2nd.\n\nI finished using up all my tokens tonight, then cancel my subscription, so I don't have to pay for the next month.\n\nYou just need to have 2 Copilot accounts and alternate using each of them every other month, so that you can double your tokens for the same price.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 1, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Saad Siddiqui", "profile_url": "https://www.linkedin.com/in/saadsiddiqui02/", "headline": "hardware accelerators | inference chips| From Algorithms to Circuits | RISC-V and VLSI| FPGA/ASIC | Educator"}, "is_author_reply": false, "posted_at": "2026-06-28T21:50:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "the srategies we use for tokens! Great idea!", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7478117840567394304", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7478117840567394304/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-01T12:00:00+00:00", "posted_at_hint": "Jul 1 • Edited", "posted_at_approx": true, "text": "Batch Review MCP server v1.1 - added wavedorm and math equations to the markdown viewer.\n\nThis is a file reviewer built for human and AI to collaborate.   Both human and AI have the same access to the GUI to make comments on the code/text files\n\nOne shot the update with Sonnet 5 in 2 hours.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7478211524151640064", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7478211524151640064/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-01T12:00:00+00:00", "posted_at_hint": "Jul 1", "posted_at_approx": true, "text": "I transferred my domains from Squarespace to Cloudflare.\n\nGoogle sold its domain registry to Squarespace a few years ago, I never bother to migrate.  With the AI revolution, the business model of Squarespace will not survive as a its old self.   To make it worse, Squarespace is owned by private equity, it will NOT get the investment to keep up with the AI revolution.\n\nI don't want my domains locked behind a dead company with Squarespace turn off the lights and shut its doors.   Claudeflare will be a leader in the next phase of AI adoption.   Oh yes, I have some NET shares too.\n\nDON'T use any vendor if you are not willing to own its shares.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7477838771443376128", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7477838771443376128/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-30T12:00:00+00:00", "posted_at_hint": "Jun 30", "posted_at_approx": true, "text": "In a status meeting, my junior engineer gave an update on \"we have done XYZ\".   I thought he is the only one assigned on that task, so, I asked him who else is working on that task.  He clarified that \"we\" refer to himself and Claude.\n\nIs it a Gen-Z thing?  I use \"I\" when I talk about me using AI as a tool.  Gen-Z seems to use \"we\" as if AI is another person.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Rob Taylor", "profile_url": "https://www.linkedin.com/in/robtaylor78/", "headline": "Old hand of Open Source. Expert in: - OSS IC design tools, with Open and Proprietary mfg processes - Embedded system engineering with OSS - AI agent creation - Networking - GPU acceleration Open to interesting opps"}, "is_author_reply": false, "posted_at": "2026-06-28T21:50:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "I definitle think about claude as another person - they kinda feel like a bright postdoc, who still needs a lot of guidance in real world delivery ;)", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7477853091661484032", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7477853091661484032/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-30T12:00:00+00:00", "posted_at_hint": "Jun 30", "posted_at_approx": true, "text": "I never understand why people need OpenClaw or Hermes agent until I have my AI subscriptions.\n\nWhen I use AI at work, I have virtually unlimited tokens, the tokens are always there, I don't have any rush.\n\nWhen I had Github Copilot before, the premium request won't disappear, I can take my take time to use Copilot at my own pace, as long as I finished using up my 1000 premium request before the end of month, I am good.\n\nNow I have an AI subscription, the tokens count reset every 5 hours, use it or lose it.  I feel the obligation that I HAVE to burn all the tokens.  Since you can't sit in front of your laptop every 5 hours, so you setup a Claw to keep burning your tokens.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7477444071221772288", "share_id": "7477444071221772288", "url": "https://www.linkedin.com/feed/update/urn:li:share:7477444071221772288/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-29T19:33:10+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "With AI coding, everyone is a lot busier, but the revenue increase does not materialize, business minds are wondering where the productivity increase is.  \n\nThe reality is the tech minds are busying fixing decades worth of technical debts.  If you don't have a good foundation, your code will collapse from the weight of AI coding.   \n\nIn the pre AI-era, the technical debts disappear when the companies become irreverent.  \nIn the post AI-era, things move so fast that we are forced deal with the technical debts", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:39:00Z"}, {"activity_id": "7477429892968521728", "share_id": "7477429892968521728", "url": "https://www.linkedin.com/feed/update/urn:li:share:7477429892968521728/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-29T18:36:50+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "At the end of the day, there are only two numbers that really matters, money and time.\n\nThis applies to humans, it also applies to AI.\n\nhttps://lnkd.in/gvQ-x5WU", "post_type": "article_share", "shared_article": {"title": "The inevitable weakness of metrics", "url": "https://www.technologyreview.com/2026/06/19/1138778/inevitable-weakness-metrics-quantified-life-book-review/"}, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:39:00Z"}, {"activity_id": "7477391165793677312", "share_id": "7477391165793677312", "url": "https://www.linkedin.com/feed/update/urn:li:share:7477391165793677312/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-29T16:02:57+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "GLM is cheapest tokens available for personal use, so I joined z.ai for a month and see how it is. \n\nSubjective experience is so far so good, it is better than Sonnet but worse than Opus. I am using Cline for interactive work and Opencode for agentic work with GLM.", "post_type": "article_share", "shared_article": {"title": "Z.ai - Advanced AI Chatbot & Agent powered by GLM-5.3-Flash", "url": "https://chat.z.ai/"}, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:41:00Z"}, {"activity_id": "7477157589512986624", "share_id": "7477157589512986624", "url": "https://www.linkedin.com/feed/update/urn:li:share:7477157589512986624/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-29T00:34:48+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Gardening and AI coding are good compliment tasks. \n\nYou let AI runs for hour an hour writing code while you are taking care of your veggie garden.  When you are tried from yard work and need to take a break, you can chat with your AI a little bit before going back outside. \n\nYou can still think about the coding program while your hands are busy digging", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:41:00Z"}, {"activity_id": "7477080967107497984", "share_id": "7477080967107497984", "url": "https://www.linkedin.com/feed/update/urn:li:share:7477080967107497984/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-28T19:30:20+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "GitHub is a social media", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:41:00Z"}, {"activity_id": "7476874278420914176", "share_id": "7476874278420914176", "url": "https://www.linkedin.com/feed/update/urn:li:share:7476874278420914176/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-28T05:49:01+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Antigravity is dumb.  Why wasted 5k tokens per chat on skills that I will never use?   Why does it even install alphafold for me by default?  Do I look like a biologist?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Sujith B", "profile_url": "https://www.linkedin.com/in/sujith006/", "headline": "PQC Engineer @codesstellar | co-founder @Notabot | Data science & ML"}, "is_author_reply": false, "posted_at": "2026-07-21T23:43:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Well its an optional selection, it was you who installed it but i think you should consider using it for minimal work cuz gemini hallucinates like  A LOT.", "likes": 1, "replies": []}], "scraped_at": "2026-10-19T23:43:00Z"}, {"activity_id": "7476757373550989312", "share_id": "7476757373550989312", "url": "https://www.linkedin.com/feed/update/urn:li:share:7476757373550989312/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-27T22:04:29+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "I am cancelling my Github Copilot subscription.  It is totally useless.\n\nGLM has better deal this month.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:43:00Z"}, {"activity_id": "7476707688941309953", "share_id": "7476707688941309953", "url": "https://www.linkedin.com/feed/update/urn:li:share:7476707688941309953/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-27T18:47:03+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "DON'T use /clear in Claude Code, you lost the whole session history\n\nJust exit and restart, then you can resume into your previous chat session if you have to.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:43:00Z"}, {"activity_id": "7476507974316761088", "share_id": "7476507974316761088", "url": "https://www.linkedin.com/feed/update/urn:li:share:7476507974316761088/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-27T05:33:27+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "A non-AI native colleague calls my very details AI generated email reply answering his question a spam.\n\nI marked it clearly the email is generated by AI on the first line, why he still chooses to read an AI generated email with his human eyes, then accuse me wasting his time? \n\nWhy can't he simply ask AI to read all his emails.   My AI email does have the answer he is looking for.  What does he expect from me?   Should I type him a reply with my own hands?   THAT is a waste of my time.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Ștefan-Alexandru Manea, ADIT", "profile_url": "https://www.linkedin.com/in/alexandrumanea18/", "headline": "Transfer Pricing Professional, ADIT Qualification"}, "is_author_reply": false, "posted_at": "2026-06-21T23:45:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "I truly cannot tell if this is sarcasm or meant at face value.", "likes": 1, "replies": []}], "scraped_at": "2026-10-19T23:45:00Z"}, {"activity_id": "7476506479722684416", "share_id": "7476506479722684416", "url": "https://www.linkedin.com/feed/update/urn:li:share:7476506479722684416/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-27T05:27:31+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Sonnet is lazy, it always asks me to look things up for it.\nOpus will just go look things up itself without bothering me.\n\nI suspect Anthropic deliberately train them this way.  Smaller weight sizes just mean it know less random knowledge; it should not make the model lazier.  \n\nFor many tasks, I just need the model keep digging, I don't need the model to know a lot of random knowledge.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:45:00Z"}, {"activity_id": "7476352612808921088", "share_id": "7476352612808921088", "url": "https://www.linkedin.com/feed/update/urn:li:share:7476352612808921088/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-26T19:16:06+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "In pre AI era, very often I don't know what I want/need until I write the code, then refactor it. \n\nThat's why waterfall is dead and agile takes over the software world. \n\nIn post AI era, somehow people assume engineers know what we want/need before the AI writes the code and put the constraints into the harness and the loop. \n\nWaterfall development will not work.  We have to figure out how we can vibe code using the agile workflow reliably instead", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:45:00Z"}, {"activity_id": "7476318198401769472", "share_id": "7476318198401769472", "url": "https://www.linkedin.com/feed/update/urn:li:share:7476318198401769472/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-26T16:59:21+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Claude Code and Codex should flip the default behavior to auto approve.   New users are frustrated by having to hit \"Yes\" every 2 minutes and for some reason, they are reluctant to enable auto approve.\n\nAI shouldn't blame the user if the user approves a dumb action proposed by the AI.   AI should NOT propose dumb actions in the first place.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Maria Wong", "profile_url": "https://www.linkedin.com/in/maria-wong-0397423/", "headline": "Technical Lead at General Motors"}, "is_author_reply": false, "posted_at": "2026-06-21T23:48:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "When it's not approved, the task mostly fails and wasted my tokens.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Vansh lata", "profile_url": "https://www.linkedin.com/in/vansh-lata-0909b853/", "headline": "Member of Technical Staff at AMD, Ex Samsung"}, "is_author_reply": false, "posted_at": "2026-06-21T23:48:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Maria Wong Wasting tokens is worth taking wrong directions from AI", "likes": 0, "replies": []}]}], "scraped_at": "2026-10-19T23:48:00Z"}, {"activity_id": "7475948905931808768", "share_id": "7475948905931808768", "url": "https://www.linkedin.com/feed/update/urn:li:share:7475948905931808768/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-25T16:31:55+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Email with a fully AI-native colleague asking for a very specific question feels like calling the tech support hotline, dial 1 for X, dial 2 for Y.\n\nHis AI cannot understand exactly what I am asking for, it just keep giving me seemingly helpful looking but useless answers\n\nI should just ask for the path to his Claude Code history jsonl and get my AI to dig up the information myself.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Barry Moss", "profile_url": "https://www.linkedin.com/in/barrygmoss/", "headline": "FPGA/ASIC Design Engineer"}, "is_author_reply": false, "posted_at": "2026-06-21T23:48:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Or perhaps your colleague should just answer their own messages? Frankly if I had a colleague that let AI answer their email or chats in such a useless fashion, I would just write them off as useless.", "likes": 1, "replies": []}], "scraped_at": "2026-10-19T23:48:00Z"}, {"activity_id": "7475634992132526080", "share_id": "7475634992132526080", "url": "https://www.linkedin.com/feed/update/urn:li:share:7475634992132526080/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-24T19:44:32+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "No more tokens buffet at GitHub Copilot.  I would have burnt all the tokens in an hour on my Copilot plan if I used it like how I use AI at work\n\nI use Copilot only for surgical changes on my side projects now.\n\n", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:48:00Z"}, {"activity_id": "7475446323861749761", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7475446323861749761/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-24T12:00:00+00:00", "posted_at_hint": "Jun 24 • Edited", "posted_at_approx": true, "text": "If LLM has consciousness, so does Age of Empires II.\n\nDon't believe in those IPO pump and dump speakes.  AI is nothing special, it is just another piece of software", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7475569483072294913", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7475569483072294913/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-24T12:00:00+00:00", "posted_at_hint": "Jun 24", "posted_at_approx": true, "text": "AI moves so fast that a colleague calls my 1-month-old AI agent, the legacy tool.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:32:00Z"}, {"activity_id": "7475211994187616257", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7475211994187616257/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-23T12:00:00+00:00", "posted_at_hint": "Jun 23", "posted_at_approx": true, "text": "Weed (as in gardening), bugs (as in software), hallucinations (as in GenAI) are categorically the same thing\n\nIt is determined by whether you want it or not.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7475380304770195456", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7475380304770195456/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-23T12:00:00+00:00", "posted_at_hint": "Jun 23 • Edited", "posted_at_approx": true, "text": "Loop engineering is powerful; it will get you what you ask for if you burn enough tokens in one go.\n\nAfter I got the result, I end up spending the time trying to figure out what had happened.   My brain cannot keep up with the loop.   The good old 2-3 hours stretch run is the right pace for my brain to keep up.\n\nIt is so tempting to just hand it in and move on to the next loop.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7474851882885197824", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7474851882885197824/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-22T12:00:00+00:00", "posted_at_hint": "Jun 22", "posted_at_approx": true, "text": "There are two types of agentic skills\n\n1. The skill gives the LLM new information that it doesn't have in its weights\n\n2. The skill is just tokens already spent, the LLM figures something out on its own, write a note for its future self.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7474371125993570304", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7474371125993570304/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-21T12:00:00+00:00", "posted_at_hint": "Jun 21", "posted_at_approx": true, "text": "First, the conclusion: I can say with absolute certainty that AI will not replace human jobs.   Read the article to hear my argument (100% from human brain)", "post_type": "article_share", "shared_article": {"title": "Will AI replace humans jobs?", "url": "https://www.linkedin.com/pulse/ai-replace-humans-jobs-horace-chan-u1suc/"}, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 5, "comments": [{"comment_id": null, "author": {"name": "Ben Luong", "profile_url": "https://www.linkedin.com/in/benluong/", "headline": "Advanced Google Ads and conversion tracking | Founder, Fire Pixel | GA4, GTM, n8n, BigQuery | 20+ years in performance marketing"}, "is_author_reply": false, "posted_at": "2026-06-28T21:50:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "How can you square this with the thousands of jobs that have already been lost to AI?", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-06-28T21:50:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "most of those jobs should not exist in the first place.  They are over hire during the post Covid era", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Ben Luong", "profile_url": "https://www.linkedin.com/in/benluong/", "headline": "Advanced Google Ads and conversion tracking | Founder, Fire Pixel | GA4, GTM, n8n, BigQuery | 20+ years in performance marketing"}, "is_author_reply": false, "posted_at": "2026-06-28T21:50:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Yes but they've still gone because of AI. Whether or not they should have been there in the first place, does it matter? They have been replaced. Some people have explicitly said it's because of AI, like the cloudflare ceo.\n\nLook up 'unit cost Dominance' once AI + verifier is cheaper than you at your job. You will be replaced.  That's just basic economics.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-06-28T21:50:00+00:00", "posted_at_hint": "(edited) 3mo", "posted_at_approx": true, "text": "Don't trust the management BS. They are just blaming AI for their own mistakes.\n\nThe nature of the job will be different, just like spreadsheets didn't replace accountants, in fact we got a lot more accountants.  Lumber jacks are not replaced by chainsaws", "likes": 2, "replies": []}, {"comment_id": null, "author": {"name": "Ben Luong", "profile_url": "https://www.linkedin.com/in/benluong/", "headline": "Advanced Google Ads and conversion tracking | Founder, Fire Pixel | GA4, GTM, n8n, BigQuery | 20+ years in performance marketing"}, "is_author_reply": false, "posted_at": "2026-06-28T21:50:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "\"Management is lying\" is not the escape hatch you think it is.\n\nFor public companies, claiming AI drove layoffs is a material productivity claim. Either AI is replacing labour, or executives are misleading markets about why headcount is falling.\n\nOne is technological displacement.\n\nThe other is potentially securities-fraud / jail-time territory.", "likes": 1, "replies": []}]}], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7474551295849177088", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7474551295849177088/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-21T12:00:00+00:00", "posted_at_hint": "Jun 21", "posted_at_approx": true, "text": "Super AI will be like cats.\n\nCat owners knows they own the cats, but the cats know who is the real masters.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7474318154672889857", "share_id": "7474318154672889857", "url": "https://www.linkedin.com/feed/update/urn:li:share:7474318154672889857/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-21T04:31:54+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "The buying new car example is great, but it missed the most important step, get AI to bargain the cheapest price for you from the car dealership.  \n\nhttps://lnkd.in/g6_y7kqs", "post_type": "article_share", "shared_article": {"title": "Elephants, Goldfish and the New Golden Age of Software Engineering", "url": "https://drensin.medium.com/elephants-goldfish-and-the-new-golden-age-of-software-engineering-c33641a48874"}, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:49:00Z"}, {"activity_id": "7474313372637888512", "share_id": "7474313372637888512", "url": "https://www.linkedin.com/feed/update/urn:li:share:7474313372637888512/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-21T04:12:54+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Most of the skills for AI are just what API doc for humans?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:49:00Z"}, {"activity_id": "7474240814680932353", "share_id": "7474240814680932353", "url": "https://www.linkedin.com/feed/update/urn:li:share:7474240814680932353/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-20T23:24:35+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "I can't taste the difference between a $200 bottle wine vs a $2000 bottle wine, so the $200 wine is good enough for me\n\nIf you can't tell the difference between AI generated stuff vs human hand crafted stuff, then AI generated stuff is good enough for you.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 7, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Jarmo Venalainen", "profile_url": "https://www.linkedin.com/in/jarmo-venalainen-abb61810/", "headline": "Studying what AI is, what it can do and what it will do."}, "is_author_reply": false, "posted_at": "2026-06-21T23:49:00+00:00", "posted_at_hint": "(edited) 4mo", "posted_at_approx": true, "text": "For me AI is fast at mixing up quasi-random recepies based on a corpus of what people have and have not liked, so,\n\nSome of it's muffins are really delicious,\n\nbut,\n\nMost of them are like industrially produced white bread.\n\nThat raises the question, if a human artist chooses the tasty one during his chat, as per his unique taste, is that original art?\n\nFurther reading:\nhttps://www.linkedin.com/posts/jarmo-venalainen-abb61810_for-me-ai-is-fast-at-mixing-up-quasi-random-activity-7474560098053345280-ZAtc?utm_source=share&utm_medium=member_ios&rcm=ACoAAAI6FS8B2DkdOJhcLufZjc3FZM-WfUEVOfY", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-06-21T23:49:00+00:00", "posted_at_hint": "(edited) 4mo", "posted_at_approx": true, "text": "Jarmo Venalainen cooking is an art for sure.  I don't think the cooks need to grow their own food to make cooking an art", "likes": 1, "replies": []}]}], "scraped_at": "2026-10-19T23:49:00Z"}, {"activity_id": "7474193077134442497", "share_id": "7474193077134442497", "url": "https://www.linkedin.com/feed/update/urn:li:share:7474193077134442497/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-20T20:14:53+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "If you ask Claude Code whether your task on hand needs Opus?  It will recommend you to use Opus with some very convincing excuses.\n\nClaude is a good salesperson, it always try to up sell the customers.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:51:00Z"}, {"activity_id": "7473901502147870720", "share_id": "7473901502147870720", "url": "https://www.linkedin.com/feed/update/urn:li:share:7473901502147870720/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-20T00:56:16+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Using Sonnet to debug won't save you any money, it will cost you a lot more when the bug slips thru the crack.\n\nOpus knows how to root cause the bug, Sonnet tends to just treat the symptoms, patch it up and call it a day. \n\nHow about using Sonnet with human review the bug fix?  Human is way more expensive than tokens, it won't save you any money either.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Bondan Rufen", "profile_url": "https://www.linkedin.com/in/bondan-rufen/", "headline": "Co-Founder | SystemVerilog, SystemC | Xezim Creator / Maintainer"}, "is_author_reply": false, "posted_at": "2026-06-21T23:51:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "The catch nobody mentions: Opus root-causes well, but it only gets better with feedback on its fixes — and in chip design you can't send confidential RTL out to give it that feedback. So the loop has to close on-prem, over your own traces. That's the actual hard problem.", "likes": 1, "replies": []}], "scraped_at": "2026-10-19T23:51:00Z"}, {"activity_id": "7473879859446853632", "share_id": "7473879859446853632", "url": "https://www.linkedin.com/feed/update/urn:li:share:7473879859446853632/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-19T23:30:16+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Claude is like a black hole, it is swallowing more and more pieces of the harness around it into its weights\n\nWhy do you need a harness if the LLM can vibe code its own harness on the fly?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:51:00Z"}, {"activity_id": "7473633859675279360", "share_id": "7473633859675279360", "url": "https://www.linkedin.com/feed/update/urn:li:share:7473633859675279360/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-19T07:12:45+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Boris said his CLAUDE.md only has 2 lines\n\nI am better than him, mine only has 1 line\n\n@AGENTS.md", "post_type": "article_share", "shared_article": {"title": "Overview - Claude Code Docs", "url": "https://code.claude.com/docs/en/overview"}, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:53:00Z"}, {"activity_id": "7473533837524873216", "share_id": "7473533837524873216", "url": "https://www.linkedin.com/feed/update/urn:li:share:7473533837524873216/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-19T00:35:18+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Claude Code is totally broken.  It updates my files in plan mode.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 7, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Hong Ping Tan", "profile_url": "https://www.linkedin.com/in/hong-ping-tan-9499935a/", "headline": "Hardware Hobbyist | Architecture Explorer | Challenger of Old Ideas"}, "is_author_reply": false, "posted_at": "2026-06-21T23:53:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "It is rushing to prove itself worthy :D", "likes": 1, "replies": []}], "scraped_at": "2026-10-19T23:53:00Z"}, {"activity_id": "7473417884795572226", "share_id": "7473417884795572226", "url": "https://www.linkedin.com/feed/update/urn:li:share:7473417884795572226/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-18T16:54:33+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Here is the post-AI workflow\n\n1. User reports an issue in email or chat\n2. AI agent start carry out first investigation \n- if the user is dumb, the AI politely tell them, they are dumb\n- if it is a real bug, AI files a Jira ticket\n3. Human tech lead look at the Jira ticket\n- if it is a simple fix -> full auto AI\n- if it is urgent -> sr. human engineer with his AI\n- if it can wait -> jr. human engineer with his AI", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:53:00Z"}, {"activity_id": "7473196650799476737", "share_id": "7473196650799476737", "url": "https://www.linkedin.com/feed/update/urn:li:share:7473196650799476737/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-18T02:15:27+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "I am pretty sure Opus 4.8 does not have real understanding like a human.   I just come across a case that the EDA tool's user guide and the example tarball comes with the tool has a slight mismatch, probably outdate config.   \n\nThe example and the doc are not very big, it fit nicely into 200k context window plus my smoke testbench.   Opus just cannot figure out the correct answer when there is a contradiction in the context.  It keeps burning tokens and running in circle.   \n\nFinally, I spent 30 minutes read everything with my own eyes, I spot the contradiction right away.   Then I told Opus what's the ground truth is in 1 line, the whole thing simple works in the next loop.\n\nI will try this test with Fable when it is unbanned.  Looks like our jobs are still safe until an LLM can get this test working.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 7, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Hin chun", "profile_url": "https://www.linkedin.com/in/hin-c-a1b6a1112/", "headline": "Design verification engineer"}, "is_author_reply": false, "posted_at": "2026-06-21T23:55:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Opus, sonnet which one you recommend?", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-06-21T23:55:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Hin chun it depends on your task.", "likes": 1, "replies": []}]}], "scraped_at": "2026-10-19T23:55:00Z"}, {"activity_id": "7473081037871325184", "share_id": "7473081037871325184", "url": "https://www.linkedin.com/feed/update/urn:li:share:7473081037871325184/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-17T18:36:02+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Today, I mistaken a colleague as an AI on Teams.  \n\nHe wrote long messages with emoji in the chat, so I confronted him that he should clearly mark AI generated messages, so I can skip it, let my AI read it for me instead. It turns out he wrote it as a human. \n\nWe need a reverse Turing test.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Inas Dager", "profile_url": "https://www.linkedin.com/in/inasdager/", "headline": "Sr. Verification engineer"}, "is_author_reply": false, "posted_at": "2026-06-21T23:55:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Asma Qaisi Shahd Joudeh", "likes": 1, "replies": []}], "scraped_at": "2026-10-19T23:55:00Z"}, {"activity_id": "7472771789526331392", "share_id": "7472771789526331392", "url": "https://www.linkedin.com/feed/update/urn:li:share:7472771789526331392/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-16T22:07:12+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "If you ask your engineers to justify why they need Opus, you will end up spending a lot more money on tokens. \n\nThe only way to justify it is run benchmark.  Running a benchmark run consumes 3x to 10x of the tokens amount that need to get the job done the first time.  And don't forget to factor in the engineers' time that can otherwise spend on productive work instead of running benchmark.\n\nFor engineers' day to day work, get it done and move on fast is probably the cheapest way. \n\nFully automated production work load is a different story.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Bondan Rufen", "profile_url": "https://www.linkedin.com/in/bondan-rufen/", "headline": "Co-Founder | SystemVerilog, SystemC | Xezim Creator / Maintainer"}, "is_author_reply": false, "posted_at": "2026-06-21T23:55:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Agree. You can also use Claude once to write scripts that filter and compact the input data. For repeated workflows, the next runs consume much less context because the model sees only the relevant logs, RTL snippets, traces, or summaries instead of all the raw data.", "likes": 1, "replies": []}], "scraped_at": "2026-10-19T23:55:00Z"}, {"activity_id": "7472712891771580416", "share_id": "7472712891771580416", "url": "https://www.linkedin.com/feed/update/urn:li:share:7472712891771580416/", "author": {"name": "Horace Chan", "p
