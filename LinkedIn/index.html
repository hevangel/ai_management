rofile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-16T18:13:09+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "In pre-AI era, we talked about time management\nIn post-AI era, we need attention management\n\nWhen my 4 AI agents are working hard, I have some pocket of free time, but my brain cannot handle baby-sitting the 5th AI agent.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:01:00Z"}, {"activity_id": "7472310444754468864", "share_id": "7472310444754468864", "url": "https://www.linkedin.com/feed/update/urn:li:share:7472310444754468864/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-15T15:33:58+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "In post AI era, as a manager you don't ask what your team had done in the weekly status meeting.\n\nInstead, ask them what they have learned in the past week.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:01:00Z"}, {"activity_id": "7472388056659021826", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7472388056659021826/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-15T12:00:00+00:00", "posted_at_hint": "Jun 15 • Edited", "posted_at_approx": true, "text": "The AI race - adapt or out\n\n- my comics", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7472401483116904448", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7472401483116904448/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-15T12:00:00+00:00", "posted_at_hint": "Jun 15", "posted_at_approx": true, "text": "We finally reach the tipping point of AI adoption.   Teaching AI to do something (as a skill) roughly takes the same time as you do it yourself by hand, not wall clock time, but actual human attentions time.\n\nIf you don't build the AI skills yourself, someone else will build it, then you become redundant.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7472416109716041728", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7472416109716041728/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-15T12:00:00+00:00", "posted_at_hint": "Jun 15", "posted_at_approx": true, "text": "AMD is hiring in England.   We have development center in Cambridge and Dublin.   See the job opening at http://careers.amd.com #AMDBrandAmbassador", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7472444999947689985", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7472444999947689985/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-15T12:00:00+00:00", "posted_at_hint": "Jun 15", "posted_at_approx": true, "text": "Using Claude Code or Codex in YOLO mode is like riding a unicycle.  It looks dangerous at first, but after you get used to it, it is pretty safe", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7472507209721999360", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7472507209721999360/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-15T12:00:00+00:00", "posted_at_hint": "Jun 15 • Edited", "posted_at_approx": true, "text": "Anthropic has the best model this month, so everyone has no choice but use it today.  The real question is can you trust this company tomorrow?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7472508396504645632", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7472508396504645632/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-15T12:00:00+00:00", "posted_at_hint": "Jun 15", "posted_at_approx": true, "text": "Don't give false leads to your AI, it just digs the hole deeper and deeper.   The more powerful the AI, the faster your tokens are incinerated.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:32:00Z"}, {"activity_id": "7472054115120861184", "share_id": "7472054115120861184", "url": "https://www.linkedin.com/feed/update/urn:li:share:7472054115120861184/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-14T22:35:25+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Claude Code and Codex should have a built-in ponytail.   This one is on par with the ralph-loop.\n\nHere is the best\n\nWhy \"ponytail\"?  \nYou know exactly why", "post_type": "reshare", "shared_article": null, "reshared_post": {"author_headline": "Lead GenAI Engineer at Trimble | Founder & Creator of Ponytail", "author_name": "Dietrich Gebert", "author_profile_url": "https://www.linkedin.com/in/dietrich-gebert-b3a314a9/", "posted_at_hint": "Jun 12", "reshared_text": "Ever met a senior dev whose entire personality is \"do we even need to build this?\" I packaged that guy into a plugin.\n\nMeet ponytail, lazy-senior-dev mode for your coding agent. It writes the least code that actually works, then stops.\n\nThe goal isn't to write as little code as possible, but to write only what is necessary.\n\nBenchmarked across multiple real tasks against a no-skill agent and Caveman (the other minimalist skill):\n• A seventh of the code: 490 lines vs 3,629 no-skill, and a third of Caveman's 1,440\n• 47% fewer tokens, 3x faster than no-skill\n• 100% on every security and concurrency probe, same as everyone\n• Surprise feature request? ponytail added it in 96 lines. Caveman needed 413. No-skill: 1,115.\n\nLazy, not negligent: trust-boundary validation, data-loss handling, security, and accessibility are never on the chopping block.\n\n\"What if I really need the 120-line cache class?\" You don't. Insist anyway and he'll build it. Slowly. Correctly. While looking at you.\n\n\"Does it scale?\" The code you never wrote scales infinitely. Zero bugs, zero CVEs, 100% uptime since forever. The 3,139 lines nobody wrote have never caused an incident.\n\nEvery shortcut it takes is marked with a ponytail: comment naming its upgrade path.\n\nThe best code really is the code you never wrote.\n\nSteal it here: https://lnkd.in/e7ZeuBFB"}, "likes": 5, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:01:00Z"}, {"activity_id": "7472027535317344256", "share_id": "7472027535317344256", "url": "https://www.linkedin.com/feed/update/urn:li:share:7472027535317344256/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-14T20:49:48+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "We need Blade Runners to kill runaway AI agents who burn way too many tokens.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:02:00Z"}, {"activity_id": "7471973432981618689", "share_id": "7471973432981618689", "url": "https://www.linkedin.com/feed/update/urn:li:share:7471973432981618689/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-14T17:14:49+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Never deploy a new AI agent on Friday", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:02:00Z"}, {"activity_id": "7471968409417789440", "share_id": "7471968409417789440", "url": "https://www.linkedin.com/feed/update/urn:li:share:7471968409417789440/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-14T16:54:51+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "It takes longer for me to boot up my laptop, login the company VPN, than the actual work of nagging my AI agents to keep working harder. \n\nTeams won't work.  The Codex/Claude/Cursor/Copilot mobile app are in the wrong shape, not user friendly.\n\nSomeone should build a new hardware device that is tailor made for humans nagging their AI agents.  Something like the tablet in Star Trek.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 5, "comments": [{"comment_id": null, "author": {"name": "Santosh Ahuja", "profile_url": "https://www.linkedin.com/in/santoshnahuja/", "headline": "Engineering Executive | AI Infrastructure · GPU/Accelerator Systems · Distributed Systems · Silicon & Hardware-to-Cloud"}, "is_author_reply": false, "posted_at": "2026-06-22T00:02:00+00:00", "posted_at_hint": "(edited) 4mo", "posted_at_approx": true, "text": "Don't use a computer. Call and talk to your agents on phone - completely secure and ask them to sms back secure links of demo's of work done.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-06-22T00:02:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Santosh Ahuja This is genius.  Let me try to bolt a whisper to my Claude Code", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Santosh Ahuja", "profile_url": "https://www.linkedin.com/in/santoshnahuja/", "headline": "Engineering Executive | AI Infrastructure · GPU/Accelerator Systems · Distributed Systems · Silicon & Hardware-to-Cloud"}, "is_author_reply": false, "posted_at": "2026-06-22T00:02:00+00:00", "posted_at_hint": "(edited) 4mo", "posted_at_approx": true, "text": "Horace Chan You will need twilio. You can configure a number - call in -> twilio intercepts the call and then transcribes the message and invokes an API that sends the prompt to your agent. Agent exceute -> can also converse back through the same route OR sms the demo link - some plumbing but possible.", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "Vansh lata", "profile_url": "https://www.linkedin.com/in/vansh-lata-0909b853/", "headline": "Member of Technical Staff at AMD, Ex Samsung"}, "is_author_reply": false, "posted_at": "2026-06-22T00:02:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "I had it make a script to read prompts from my email. once task is done, email is sent with response, (further prompts can be given to probe further, session id specific)", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Martin Winston", "profile_url": "https://www.linkedin.com/in/m-winston/", "headline": "Don’t just link in - Beam in."}, "is_author_reply": false, "posted_at": "2026-06-22T00:02:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "There's an easier solution. Get rid of the AI.", "likes": 1, "replies": []}], "scraped_at": "2026-10-20T00:02:00Z"}, {"activity_id": "7471961047550308352", "share_id": "7471961047550308352", "url": "https://www.linkedin.com/feed/update/urn:li:share:7471961047550308352/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-14T16:25:36+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "How to build an AI engineer? \n\n1. Start with Claude Code or Codex with lots of tokens\n2. Literally ask it to do everything for you, in the beginning it can't get much done \n3. When it figures out something that works, turn it into a skill\n4. As time progresses, you need to babysit your AI engineer less and less\n5. After a few months, it can handle 80% of your day to day work\n\nMost people didn't get pass step #2.  They think it is too hard and too slow, which is true.  You need to spend 3x of effort in the beginning using AI compared to do it mostly by hand semi-automatocally.\n", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 9, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:03:00Z"}, {"activity_id": "7471815002312622080", "share_id": "7471815002312622080", "url": "https://www.linkedin.com/feed/update/urn:li:share:7471815002312622080/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-14T06:45:16+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "You don't need a skilled person to control the AI, you just need someone who has common sense and is willing to learn. \n\nStop saying only senior developers can use AI effectively.  An eager junior can catch up to the level of a lazy senior in merely a few months.\n\nA senior developer has 10 years of work experience, but how many hours of learning did he have in those 10 years?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:03:00Z"}, {"activity_id": "7471783934993907712", "share_id": "7471783934993907712", "url": "https://www.linkedin.com/feed/update/urn:li:share:7471783934993907712/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-14T04:41:49+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "In the pre-AI era, how many people you manage determine how high your level is in the company \n\nIn the post-AI era, how many tokens you and your people burn (effectively) determine how high your level is in the company", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:03:00Z"}, {"activity_id": "7471654658025881600", "share_id": "7471654658025881600", "url": "https://www.linkedin.com/feed/update/urn:li:share:7471654658025881600/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-13T20:08:07+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "AI revolution in the business world is something like this:\n\nYou are in a car race, suddenly the race is changed to a plane race.  You have to upgrade your car to a plane while you are still racing\n\nThere are checkpoints along the race track that is now turned into a runway.  You get more upgrade points based on your ranking. There is a cliff at the end of the runway.\n\nIt doesn't matter if you are #1 at all the check points.  If you can't take off, you are out of the race \n\n", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:05:00Z"}, {"activity_id": "7471623687667101698", "share_id": "7471623687667101698", "url": "https://www.linkedin.com/feed/update/urn:li:share:7471623687667101698/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-13T18:05:03+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Productivity gain of AI is real.  For some tasks, it is not 30%, not 3x, not even 10x, more like 100x\n\nI have a task that took the best senior engineer 3 months to finish merely 2 years ago.\n\nMy AI agent finished it in less than 24 hours, burnt only $650 tokens (public API rate)", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 7, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:05:00Z"}, {"activity_id": "7471610868435410944", "share_id": "7471610868435410944", "url": "https://www.linkedin.com/feed/update/urn:li:share:7471610868435410944/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-13T17:14:06+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "When using AI agents at work, you are compelled to work at weekends.  You don't have to spend a lot of time, you just need to log in once every 3-4 hours to kick your AI agents to make it work harder, or you will lose 48 hours of AI productivity in a week. \n\nAI agent still can't run reliable over a 8 hours stretch, that is the sweet spot for real productivity gain.  I lost at least 4 hours of AI productivity every night while I am sleeping.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:05:00Z"}, {"activity_id": "7471582704745066496", "share_id": "7471582704745066496", "url": "https://www.linkedin.com/feed/update/urn:li:share:7471582704745066496/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-13T15:22:12+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Here is my conspiracy theory about the Fable 5 ban. \n\nWhat really got it banned is Fable 5 very good at making money on the stock market.  It is so good that Wall Street and the Deep States have to ban it.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:06:00Z"}, {"activity_id": "7471413157236944896", "share_id": "7471413157236944896", "url": "https://www.linkedin.com/feed/update/urn:li:share:7471413157236944896/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-13T04:08:28+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Opus 4.8 is lazy.  In my Claude Code session, after I instruct it to escalate a very hard bug to human engineers on Teams, every time it sees a bug that it can't fix in one shot, it tries to escalate to human engineers instead of trying hard.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:06:00Z"}, {"activity_id": "7471405221903183872", "share_id": "7471405221903183872", "url": "https://www.linkedin.com/feed/update/urn:li:share:7471405221903183872/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-13T03:36:56+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Everyone should have two accounts, a human account and an AI agent account. \n\nThat solves all the permission hassles in AI adoption in the enterprise. \n\nJust treat your AI agent like your human direct reports", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:06:00Z"}, {"activity_id": "7471233163504144384", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7471233163504144384/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-12T12:00:00+00:00", "posted_at_hint": "Jun 12", "posted_at_approx": true, "text": "Here is the prompt I use most often\n\nRead the email from XYZ, use skill ABC and EGF, work on it, let me review what your reply before send.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7471235665557467136", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7471235665557467136/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-12T12:00:00+00:00", "posted_at_hint": "Jun 12", "posted_at_approx": true, "text": "When deploying AI agents, you can't expect the users to be careful every time. You have to design the AI agents assuming the users are total idiots and they still can't shoot themselves on the foot.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7471310765916852224", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7471310765916852224/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-12T12:00:00+00:00", "posted_at_hint": "Jun 12", "posted_at_approx": true, "text": "Next year there will not be a Barcelona Grand Prix.  This Sunday is the last chance to see Kim and George racing on this track for the next while. #AMDBrandAmbassador", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7471327342825566208", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7471327342825566208/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-12T12:00:00+00:00", "posted_at_hint": "Jun 12", "posted_at_approx": true, "text": "The companies should change how meetings are schedule to accommodate AI agents.\n\nIn between every meeting, we should have a 15-minute break, kind of like high school, so we can catch up with our AI agents.\n\nI could be a lot more productive if I get a brief moment talking to my AI agents in between the meetings.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7471348553315991552", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7471348553315991552/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-12T12:00:00+00:00", "posted_at_hint": "Jun 12", "posted_at_approx": true, "text": "The BEST machine for running local LLM and local agents. #amdbrandambassador AMD", "post_type": "article_share", "shared_article": {"title": "AMD Ryzen AI Halo. The ultimate local AI developer platform.", "url": "https://bit.ly/4xv5PJS"}, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:31:00Z"}, {"activity_id": "7470992732359024640", "share_id": "7470992732359024640", "url": "https://www.linkedin.com/feed/update/urn:li:share:7470992732359024640/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-12T00:17:51+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "I find it very hard to work with engineers who don't use AI.\n\nWhen I ask my AI writes a detail bug report and send it to another AI-native engineer, he will simply tell his AI to look at my bug report, test it and get new info back to my AI.  Then we align the findings on human channel, loop until the two AI eventually fixed the bug or concluded that it is indeed a feature.\n\nWhen my AI sends the bug report to a non-AI engineer, he says the report is too long, he asks me to explain to him in human language where exactly the bug is and wants me to convince him that it is indeed a bug as a human.\n\nI will just bypass that guy and fix the bug myself together with my AI.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 27, "reposts": 0, "comment_count": 8, "comments": [{"comment_id": null, "author": {"name": "Avidan Efody", "profile_url": "https://www.linkedin.com/in/avidan-efody/", "headline": "HW/SW Verification Expert"}, "is_author_reply": false, "posted_at": "2026-06-22T00:11:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "\"give me the answer in 5 sentences max\" is a phrase i use a lot these days. Saves some tokens too.", "likes": 10, "replies": [{"comment_id": null, "author": {"name": "Ronen Karasik", "profile_url": "https://www.linkedin.com/in/ronenkarasik/", "headline": "Senior Staff DV Engineer at Qualcomm. Modem sub-system, Qlink-RF, Connectivity (PCIe, UFS, USB), Formal verification, Agentic AI for DV."}, "is_author_reply": false, "posted_at": "2026-06-22T00:11:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Avidan Efody you know /caveman? i think matt pocock also has the “sacrifice grammer, be concise” along the same line - getting bottom line up front speak from your agents", "likes": 2, "replies": []}, {"comment_id": null, "author": {"name": "Avidan Efody", "profile_url": "https://www.linkedin.com/in/avidan-efody/", "headline": "HW/SW Verification Expert"}, "is_author_reply": false, "posted_at": "2026-06-22T00:11:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Ronen Karasikthat good ;-)", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Milos Mirosavljevic", "profile_url": "https://www.linkedin.com/in/milos-mirosavljevic/", "headline": "Principal Engineer at Infineon Technologies | Functional Verification | MBA"}, "is_author_reply": false, "posted_at": "2026-06-22T00:11:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "\"Spare me your thought process\" I sometimes throw in.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-06-22T00:11:00+00:00", "posted_at_hint": "(edited) 4mo", "posted_at_approx": true, "text": "Avidan Efody that's what the other engineer should ask his AI, not asking me.", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Chen Ben - Haroosh", "profile_url": "https://www.linkedin.com/in/chenbenharoosh/", "headline": "Verification Engineer | Yet another AI Enthusiast | Python Automation Specialist | 8 Years Multi-Disciplinary Experience"}, "is_author_reply": false, "posted_at": "2026-06-22T00:11:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Yup, Avidan Efody is on point. But then...\n\nWhen a non-AI engineer reads the report/mail/Teams/Slack message he will 100% of times ask for a call. then I will have to guide him and show him what I've found out, where is the bug/spec-problem/JIRA ticket. So I feel you Horace.", "likes": 2, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-06-22T00:11:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Chen Ben - Haroosh we need real time AI avatar to talk to that dumb engineer", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "Jeannie Lau", "profile_url": "https://www.linkedin.com/in/jeannie-lau-073a3862/", "headline": "Principal Engineer at Logikhaus"}, "is_author_reply": false, "posted_at": "2026-06-22T00:11:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "It's giving rage-baiting", "likes": 2, "replies": []}], "scraped_at": "2026-10-20T00:11:00Z"}, {"activity_id": "7470896446830051328", "share_id": "7470896446830051328", "url": "https://www.linkedin.com/feed/update/urn:li:share:7470896446830051328/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-11T17:55:15+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Are you a builder, seller or measurer?\n\n https://lnkd.in/gzCkDimN", "post_type": "article_share", "shared_article": {"title": "Cloudflare layoffs: After firing 20% staff, CEO Matthew Prince explains in op-ed on how to decide which employees AI should replace", "url": "https://www.msn.com/en-in/money/news/cloudflare-layoffs-after-firing-20-staff-ceo-matthew-prince-explains-in-op-ed-on-how-to-decide-which-employees-ai-should-replace/ar-AA249vSa"}, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Ajay Andrews Cherayath", "profile_url": "https://www.linkedin.com/in/ajaycherayath/", "headline": "Ops Transformation | Data, Analytics & AI Leader | Startup Mentor | I simplify decision-making for CXOs & teach clarity to next‑gen talent."}, "is_author_reply": false, "posted_at": "2026-06-22T00:11:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "AI isn’t deciding who stays — value is. The companies that thrive will be the ones honest enough to measure it, and human enough to manage it.", "likes": 1, "replies": []}], "scraped_at": "2026-10-20T00:11:00Z"}, {"activity_id": "7470881540743380992", "share_id": "7470881540743380992", "url": "https://www.linkedin.com/feed/update/urn:li:share:7470881540743380992/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-11T16:56:01+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "AI killed fantasy sports leagues\n\nIt used to be fun picking your teams and winning the barging right that you're better than your friends in 🏒 🏈 ⚽ ⚾ \n\nNow everyone just uses AI to pick their teams.  What is the point of playing it anymore?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:11:00Z"}, {"activity_id": "7471047784457056258", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7471047784457056258/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-11T12:00:00+00:00", "posted_at_hint": "Jun 11", "posted_at_approx": true, "text": "Don't build things that use AI, build things for AI instead", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7470699815543435265", "share_id": "7470699815543435265", "url": "https://www.linkedin.com/feed/update/urn:li:share:7470699815543435265/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-11T04:53:55+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Even if your engineers are truly AI-native and you have unlimited token budgets, don't expect to see significant productivity gain right away if you are working on an existing code base. \n\nYour engineers have to repay years of technical debt, catch up with all the documentation first, before you can see the insane speed up from an AI development dark factory", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:12:00Z"}, {"activity_id": "7470673498492030976", "share_id": "7470673498492030976", "url": "https://www.linkedin.com/feed/update/urn:li:share:7470673498492030976/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-11T03:09:20+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Here is a tip on saving tokens in Claude Code.   Always run CC cronjob in a sub agent, so it won't pollute the context window of the main thread.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:12:00Z"}, {"activity_id": "7470657885920915456", "share_id": "7470657885920915456", "url": "https://www.linkedin.com/feed/update/urn:li:share:7470657885920915456/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-11T02:07:18+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Don't set a one size fit all token quota or limit. \n\nSome tasks are cheaper to burn tokens than consuming engineers' time\n\nSome other tasks are not realistic out source to AI\n\n", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:12:00Z"}, {"activity_id": "7470618641596592129", "share_id": "7470618641596592129", "url": "https://www.linkedin.com/feed/update/urn:li:share:7470618641596592129/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-10T23:31:21+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Software engineers are so used to having free tools, they are shocked by the cost structure of burning tokens to get the job done.\n\nHardware engineers have to live with expensive EDA tools; tokens cost is just yet another cost.   We may even be able to use AI to lower our total EDA tools costs by working more efficiently.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 32, "reposts": 1, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Avidan Efody", "profile_url": "https://www.linkedin.com/in/avidan-efody/", "headline": "HW/SW Verification Expert"}, "is_author_reply": false, "posted_at": "2026-06-22T00:14:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "interesting take", "likes": 1, "replies": []}], "scraped_at": "2026-10-20T00:14:00Z"}, {"activity_id": "7470596596070645760", "share_id": "7470596596070645760", "url": "https://www.linkedin.com/feed/update/urn:li:share:7470596596070645760/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-10T22:03:45+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "If I distill my colleagues into agentic skills, can I spend their wages on tokens instead?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:14:00Z"}, {"activity_id": "7470592734270078976", "share_id": "7470592734270078976", "url": "https://www.linkedin.com/feed/update/urn:li:share:7470592734270078976/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-10T21:48:24+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Learning new ways to improve your efficiency at work is NOT overhead. \n\nThe fly wheeling is actually the core of your work.  Delivering and getting the job done are merely chores to pay the bills.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:14:00Z"}, {"activity_id": "7470272730781609984", "share_id": "7470272730781609984", "url": "https://www.linkedin.com/feed/update/urn:li:share:7470272730781609984/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-10T00:36:50+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "If Anthropic really worries about AI is getting out of control, here is a simple solution.  \n\nThey just need to open source their best frontier model, so no one else will have any financial incentive to build an even better model.  Everyone will focus on cost optimization of the best model instead.\n\nAnthropic can sacrifice itself to save the humanity if it really believes in its own words, not just trying to pump the IPO.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Job K Joseph", "profile_url": "https://www.linkedin.com/in/jobkjoseph/", "headline": "Director - Hi-tech | Global Presales Leader | Enterprise Strategy | CXO Advisor | Thought Leader | Insight-Led Digital Transformation /Growth Partner"}, "is_author_reply": false, "posted_at": "2026-06-22T00:15:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "How will they earn then?", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-06-22T00:15:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Job K Joseph Have you seen the chosen one needs to earn any money in any world saving stories?", "likes": 0, "replies": []}]}], "scraped_at": "2026-10-20T00:15:00Z"}, {"activity_id": "7470232180795805696", "share_id": "7470232180795805696", "url": "https://www.linkedin.com/feed/update/urn:li:share:7470232180795805696/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-09T21:55:42+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "AI cannot build itself.  AI can't design GPU on its own.  period.\n\nhttps://lnkd.in/ghumDiX9", "post_type": "article_share", "shared_article": {"title": "When AI builds itself", "url": "https://www.anthropic.com/institute/recursive-self-improvement"}, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:15:00Z"}, {"activity_id": "7470014697262452736", "share_id": "7470014697262452736", "url": "https://www.linkedin.com/feed/update/urn:li:share:7470014697262452736/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-09T07:31:30+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "When you write code with AI, you have to handle 3 different versions of reality \n\n1. The actual state of the code \n2. What you think the code should look like\n3. What your AI agent thinks the code looks like\n\nIf all three are not aligned, you just invented a bug.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:15:00Z"}, {"activity_id": "7470013800939896832", "share_id": "7470013800939896832", "url": "https://www.linkedin.com/feed/update/urn:li:share:7470013800939896832/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-09T07:27:56+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Building an AI native workflow is like mathematical induction, you prove it one step at a time. \n\n", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Tony Gladvin George, Ph.D.", "profile_url": "https://www.linkedin.com/in/tonygeorge/", "headline": "Principal Silicon Engineer | AI Deployment | NVMe IP Architecture, Design & Verification"}, "is_author_reply": false, "posted_at": "2026-06-22T00:18:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "With LLMs, isn't even the base case stochastic?", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-06-22T00:18:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Tony Gladvin George, Ph.D. Yes, but you can have a majority rules", "likes": 0, "replies": []}]}], "scraped_at": "2026-10-20T00:18:00Z"}, {"activity_id": "7469908754629607425", "share_id": "7469908754629607425", "url": "https://www.linkedin.com/feed/update/urn:li:share:7469908754629607425/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-09T00:30:31+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Don't measure your team's productivity by who commit more code or who burn more tokens.   The commit and tokens consumption just reflect who happens to be babysitting the AI agent.   \n\nThe real work is in the human-to-human communication channel.   Different human engineers collaborating to babysitting multiple AI agents searching for the right answer in parallel.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:18:00Z"}, {"activity_id": "7469765649460830208", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7469765649460830208/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-08T12:00:00+00:00", "posted_at_hint": "Jun 8", "posted_at_approx": true, "text": "Anyone who claims LLM has consciousness are snake oil salesmen, or wants to pump the IPO.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Santosh Ahuja", "profile_url": "https://www.linkedin.com/in/santoshnahuja/", "headline": "Engineering Executive | AI Infrastructure · GPU/Accelerator Systems · Distributed Systems · Silicon & Hardware-to-Cloud"}, "is_author_reply": false, "posted_at": "2026-06-28T21:50:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Dario is that guy.", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7469784402831622145", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7469784402831622145/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-08T12:00:00+00:00", "posted_at_hint": "Jun 8", "posted_at_approx": true, "text": "You can't just blindly ask AI to update the skill with what it learnt from your chat session. I caught it many times, the skill is perfectly fine, but the AI still try to find something to change and ends up make the skill worse.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:26:00Z"}, {"activity_id": "7469541438603608064", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7469541438603608064/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-07T12:00:00+00:00", "posted_at_hint": "Jun 7", "posted_at_approx": true, "text": "How will engineers with AI agents change the company organization and incentive structure?   I spent the tokens asking ChatGPT Pro Deep Research, here is the report.\n\nTL;DR - incentive structure from pre-AI no longer works with engineers using AI agents, bad incentives breed bad behaviors, which leads to failure.", "post_type": "article_share", "shared_article": {"title": "AI Junior-Engineer Agents and the Rewiring of Software Organizations", "url": "https://www.linkedin.com/pulse/ai-junior-engineer-agents-rewiring-software-horace-chan-8qrrc/"}, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7469543151452540928", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7469543151452540928/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-07T12:00:00+00:00", "posted_at_hint": "Jun 7", "posted_at_approx": true, "text": "Those who worry about using AI will erode your software development skills, here is my questions for you\n\nWhen was the last time you look inside the implementation of the library that your code calls?\n\nWhat is the difference between using another human's library versus using AI to generate a bespoke library on the spot?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7469602632001601536", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7469602632001601536/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-07T12:00:00+00:00", "posted_at_hint": "Jun 7", "posted_at_approx": true, "text": "I have observed this pattern.\n\nWhen sr. engineers use AI, we try to shoehorn the AI into what we know that works from years of experience\n\nWhen jr. engineers use AI, they end up reinventing the history of compute but with a twist of AI native.  They end up implementing a superior solution with the help of AI from the first principle because they don't have any baggage", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Santosh Ahuja", "profile_url": "https://www.linkedin.com/in/santoshnahuja/", "headline": "Engineering Executive | AI Infrastructure · GPU/Accelerator Systems · Distributed Systems · Silicon & Hardware-to-Cloud"}, "is_author_reply": false, "posted_at": "2026-06-28T21:50:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Fine, the junior's design is better. The question isn't who can fly with AI. It's who can read the instruments when the AI says we're on course and we're not. Experience is a liability when you're drawing the route and the only thing that saves you when the route is wrong.", "likes": 3, "replies": []}], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7469086993432526848", "share_id": "7469086993432526848", "url": "https://www.linkedin.com/feed/update/urn:li:share:7469086993432526848/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-06T18:05:08+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "What should you do it yourself, what should you give it to AI?\n\n1. If it increases the knowledge in your brain, do it yourself.   AI can't learn for you\n\n2. If it increases $ in your bank account, do it yourself.  You have to be the moat itself on how to make money, or other people will take away your profit with their AI.\n\n3. If it builds relationship with other humans, do it yourself.  We are not living in the Matrix (yet)\n\n4. If it earns you good karma, do it yourself.   AI can't go to heaven instead of your soul.\n\nEverything else, give it to AI.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:18:00Z"}, {"activity_id": "7469045500109869056", "share_id": "7469045500109869056", "url": "https://www.linkedin.com/feed/update/urn:li:share:7469045500109869056/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-06T15:20:15+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "The real productivity gain at work arrives when you have two humans, controlling their own AI agents to debug the same problem.  \n\nWe have two Teams channels, one is human only, the other is AI only. \n\nMe and my coworker are chatting to discuss the big picture on how to solve the problem in the human only channel\n\nThe two AI agents are communicating the details with each other on the AI only side channel.  Testing the hypothesis the humans come up with and report the results back to the human master", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:19:00Z"}, {"activity_id": "7469043845859627008", "share_id": "7469043845859627008", "url": "https://www.linkedin.com/feed/update/urn:li:share:7469043845859627008/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-06T15:13:41+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "I instructed my AI agent on Microsoft Teams to reply to a Teams message from my colleague's AI agent in an AI only Teams channel. \n\nWe are living in a weird world.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:19:00Z"}, {"activity_id": "7469230879073058817", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7469230879073058817/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-06T12:00:00+00:00", "posted_at_hint": "Jun 6", "posted_at_approx": true, "text": "The design of Antigravity is stupid.  I can't @ mention to add a markdown file to the prompt.   In fact, there is no way for me to select a file to add to the prompt.\n\nWhy can't Google just follow Microsoft Copilot and copy Cursor?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7468883340721545218", "share_id": "7468883340721545218", "url": "https://www.linkedin.com/feed/update/urn:li:share:7468883340721545218/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-06T04:35:53+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "If your job is solving problems, you don't have to worry about AI replacing your job\n\nAI will just create more problems for you to solve.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:19:00Z"}, {"activity_id": "7468860301824901120", "share_id": "7468860301824901120", "url": "https://www.linkedin.com/feed/update/urn:li:share:7468860301824901120/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-06T03:04:20+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "It is the same as before after you come out on the other side of the post-AI world.\n\nIt stops accelerating, you just plateau at a much higher velocity.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:21:00Z"}, {"activity_id": "7468809193068634113", "share_id": "7468809193068634113", "url": "https://www.linkedin.com/feed/update/urn:li:ugcPost:7468809193068634113/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-05T23:41:15+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "How well will the new winglet at the rear wing works in Monaco?\n\nI am sure the Mercedes team must have run tons of simulations on AMD supercomputer to test the new design before the cars hitting the track. #AMDBrandAmbassador", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:21:00Z"}, {"activity_id": "7468806454666293249", "share_id": "7468806454666293249", "url": "https://www.linkedin.com/feed/update/urn:li:share:7468806454666293249/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-05T23:30:22+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "5800X3D is a classic, it set the bar when it first came out.  It is still one of the best chips today in term of c/p ratio. #AMDBrandAmbassador", "post_type": "article_share", "shared_article": {"title": "AMD Computex 2026: 10 Years of AM4, AM5 Support Through 2029 and Expanded RDNA 4 Gaming", "url": "https://bit.ly/4xrHt3I"}, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:21:00Z"}, {"activity_id": "7468737227796389888", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7468737227796389888/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-05T12:00:00+00:00", "posted_at_hint": "Jun 5", "posted_at_approx": true, "text": "Anthropic doesn't have enough GPUs, that's the real reason why Dario wants everyone else to slow down.", "post_type": "article_share", "shared_article": {"title": "When AI builds itself", "url": "https://www.linkedin.com/safety/go/?url=https%3A%2F%2Fwww%2Eanthropic%2Ecom%2Finstitute%2Frecursive-self-improvement%3Ffbclid%3DIwb21leASP9W5jbGNrBI_1WmV4dG4DYWVtAjExAHNydGMGYXBwX2lkDDM1MDY4NTUzMTcyOAABHsF6qHfmVOvLSPUmULDxHfEV9EXqe6zyFNpRMPg42Jw6M7f8tfxJSnET7TPt_aem_2i0XAknygEoLbPQSFqubAw&urlhash=gPb2&mt=wysxkd-wzbrOckJG-CenNtiOL7ow6NuZbVlY7VAqJILJZhnW2giWmiadGddPmvF-Uz-0orvflBHEPY5PPWrZHIe-AanktmKDGJsBqQRMSzD4U05SF9PMWg&isSdui=true"}, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Hin chun", "profile_url": "https://www.linkedin.com/in/hin-c-a1b6a1112/", "headline": "Design verification engineer"}, "is_author_reply": false, "posted_at": "2026-06-29T01:35:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "How do you know that", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "is_author_reply": false, "posted_at": "2026-06-29T01:35:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Hin chun It is on the news.  watch Dario's interview from the past few months.  He was laughing at OpenAI spends too much on compute not too long ago", "likes": 1, "replies": []}]}], "scraped_at": "2026-09-27T01:35:00Z"}, {"activity_id": "7468739600585342976", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7468739600585342976/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-05T12:00:00+00:00", "posted_at_hint": "Jun 5", "posted_at_approx": true, "text": "Elon has a concept of moving bits vs moving atoms\n\nSemiconductor is at the junction where bits meet the atoms.  Moving bits are moving atoms  (well ... electrons) in chip design.\n\nWe deal with bits in their physical form.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Santosh Ahuja", "profile_url": "https://www.linkedin.com/in/santoshnahuja/", "headline": "Engineering Executive | AI Infrastructure · GPU/Accelerator Systems · Distributed Systems · Silicon & Hardware-to-Cloud"}, "is_author_reply": false, "posted_at": "2026-05-30T01:35:00+00:00", "posted_at_hint": "(edited) 4mo", "posted_at_approx": true, "text": "Elon is confused. Bits and atoms/electrons are different. A bit can move several atoms but atoms or electrons are sensitive to many things - heat, photonics not just bit. A bit is just a state. - My two bits", "likes": 1, "replies": []}], "scraped_at": "2026-09-27T01:35:00Z"}, {"activity_id": "7468749304988356608", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7468749304988356608/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-05T12:00:00+00:00", "posted_at_hint": "Jun 5", "posted_at_approx": true, "text": "Using AI, you don't have to read the code, but you have to understand the code\n\nProbably you have to understand the code better than when you code by hand.  When you write code by hand, you can defer your understanding to when you actually read the code to modify it.  When using AI, if your mental model of the code is different from the reality, you may send the AI down the wrong path.\n\nThe scary thing is, the more powerful the AI, the more it will try to blend the reality into fit your illusion", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:35:00Z"}, {"activity_id": "7468398008418684928", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7468398008418684928/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-04T12:00:00+00:00", "posted_at_hint": "Jun 4", "posted_at_approx": true, "text": "First, you need to make sure AI can do it\nNext, you need to make sure AI can do it reliably\nThen, you can think about how to make AI run it cost efficiently\nDon't get the order wrong", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:26:00Z"}, {"activity_id": "7468539207255265280", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7468539207255265280/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-04T12:00:00+00:00", "posted_at_hint": "Jun 4", "posted_at_approx": true, "text": "Let AI output HTML instead of Markdown file actually saves tokens. First, you AI to generate a reusable JavaScript that reads json/csv to generate the HTML inside the browser Then you instruct the AI to generate json/csv instead of markdown json/csv uses a lot less tokens than markdown", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:35:00Z"}, {"activity_id": "7467982964988207105", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7467982964988207105/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-03T12:00:00+00:00", "posted_at_hint": "Jun 3", "posted_at_approx": true, "text": "We should ban people from vibe coding RTL against a commercial VIP to demonstrate AI can design chips.\n\nIf you burn enough tokens, you can reverse distill the behavior of the VIP back into RTL form. AI is very good at copying, but that's not how silicon design works in reality.\n\nIt sets unrealistic expectations for the real RTL/DV engineers", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 63, "reposts": 0, "comment_count": 13, "comments": [{"comment_id": null, "author": {"name": "Jeremy Ralph", "profile_url": "https://www.linkedin.com/in/jeremyralph/", "headline": "Principal Verification Engineer at Microsoft"}, "is_author_reply": false, "posted_at": "2026-05-30T01:30:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Curve fitting RTL to match the VIP?\n\nDesign and Verif should be requirement spec based in my view. There is a tendency to get the design to match the Verif without a spec. Then, there is no single source of correctness. This can lead to wrong designs that pass verification, as many of us have seen in our careers.", "likes": 9, "replies": [{"comment_id": null, "author": {"name": "Hong Ping Tan", "profile_url": "https://www.linkedin.com/in/hong-ping-tan-9499935a/", "headline": "Hardware Hobbyist | Architecture Explorer | Challenger of Old Ideas"}, "is_author_reply": false, "posted_at": "2026-05-30T01:30:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Jeremy Ralph There is also a tendency to get the verification to match the design. Saw it many times like stimulus tuning, coverage closure, and even scoreboard construction.", "likes": 6, "replies": []}, {"comment_id": null, "author": {"name": "Rob Taylor", "profile_url": "https://www.linkedin.com/in/robtaylor78/", "headline": "Old hand of Open Source. Expert in: - OSS IC design tools, with Open and Proprietary mfg processes - Embedded system engineering with OSS - AI agent creation - Networking - GPU acceleration Open to interesting opps"}, "is_author_reply": false, "posted_at": "2026-05-30T01:30:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Jeremy Ralph agreed, if you're using AI for rtl, a solid system for requirements tracking, plans and architecture decisions is a prerequisite. Then you want to have multiple harnesses available for generation and validation.\n\nA great way to gain more confidence in rtl generation is to build two implementations from the spec, your real, performant one, and a really dumb one, and use formal equivalence checking.", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "Zolboo Naranbaatar", "profile_url": "https://www.linkedin.com/in/zolboon/", "headline": "Building deterministic infrastructure for hardware review and AI agent execution · Ark Axiom · Ark Sovereign"}, "is_author_reply": false, "posted_at": "2026-05-30T01:30:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Rob Taylor and Horace Chan are describing the most dangerous side effect of the current AI hardware hype: Correlated Vacuity.\n\nWhen an LLM \"vibe codes\" RTL by reverse-distilling a VIP, it learns to write logic and assertions that perfectly mirror its own architectural blind spots. The simulation passes, the coverage dashboard turns green, but the system has merely verified a vacuous state space. It is an illusion of correctness.\n\nRob Taylor is spot-on that formal equivalence is the necessary backstop. However, throwing un-audited, AI-generated RTL directly at a formal solver almost guarantees state-space explosion and timeouts.\n\nA diff is not a review answer. We don't need more generative tools; we need Review Compression. We must use deterministic graph analysis to run Bounded Triage—isolating the exact logic cones where Semantic Drift occurred.\n\nBy delivering a Cryptographic Handoff of those localized boundaries, we give senior DV engineers the exact, constrained targets they need to run those formal equivalence checks in minutes, rather than wasting weeks debugging probabilistic noise.", "likes": 2, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "is_author_reply": false, "posted_at": "2026-05-30T01:30:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Zolboo Naranbaatar The industry probably has to go much deeper. What is a specification? what exactly is a bug and what is a feature?\n\nWhy write a spec in ambiguous English language when we can enlist the help of AI to write a formal spec that can feed into AI at the PCIe SIG level.\n\nThink of the spec as an API, each company can compete on the implementation in term of gate area, power, latency, throughput extra, but their implementation has to formally proved meet the contract of the protocol.\n\nHere is the best part, PCIe SIG can adopt the business model of SQLite, the English spec is free, the formal AI readable spec need to pay.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Rob Taylor", "profile_url": "https://www.linkedin.com/in/robtaylor78/", "headline": "Old hand of Open Source. Expert in: - OSS IC design tools, with Open and Proprietary mfg processes - Embedded system engineering with OSS - AI agent creation - Networking - GPU acceleration Open to interesting opps"}, "is_author_reply": false, "posted_at": "2026-05-30T01:30:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Zolboo Naranbaatar interesting take. how would you identify the exact logic cones where semantic drift has occurred?\n\nI can think of a couple of approaches, but I think the important thing in all of these is to drive *from* the requirements breakdown to minimise compounding of hallucinations/errors", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "Dr. Tobias Ludwig", "profile_url": "https://www.linkedin.com/in/dr-tobias-ludwig/", "headline": "CEO | Formal Verification Enthusiast | Building the leading systemized Formal Verification delivery partner for the semiconductor industry"}, "is_author_reply": false, "posted_at": "2026-06-29T01:30:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "True, we should be careful what we celebrate as progress.\n\nDemos that equate \"copied VIP behavior\" with \"designed a chip\" set unrealistic expectations for RTL/DV teams and blur the line between engineering and mimicry.", "likes": 5, "replies": []}, {"comment_id": null, "author": {"name": "Ilija Dimitrijevic", "profile_url": "https://www.linkedin.com/in/ilija-dimitrijevic-165093159/", "headline": "Digital Verification Consultant"}, "is_author_reply": false, "posted_at": "2026-06-29T01:30:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Imagine buying that IP and talking to their customer support when problem arises.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "is_author_reply": false, "posted_at": "2026-06-29T01:30:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Ilija Dimitrijevic oh. They will have AI customer support too", "likes": 0, "replies": []}]}], "scraped_at": "2026-09-27T01:30:00Z"}, {"activity_id": "7468053324269789184", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7468053324269789184/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-03T12:00:00+00:00", "posted_at_hint": "Jun 3", "posted_at_approx": true, "text": "Why read a boring git commit history when you can read an exciting story of a knight's quest to slayer the evil dragon instead?\n\nfix a bug -> kill a monster\ninstall new skills -> acquire new weapons\nhuman input -> wisdom from the wise men", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:25:51Z"}, {"activity_id": "7468117819923222528", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7468117819923222528/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-03T12:00:00+00:00", "posted_at_hint": "Jun 3", "posted_at_approx": true, "text": "I asked LLM to generate static HTML page dashboard for my repo.  I end up with a 4.2M html file with a single line of 2.1M in size that crash Chrome every time I tried to open it.\n\nNow, the real engineering fun begins, how to make that HTML page usable.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:25:51Z"}, {"activity_id": "7467664155945144320", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7467664155945144320/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-02T12:00:00+00:00", "posted_at_hint": "Jun 2", "posted_at_approx": true, "text": "Someone should build a house design AI with a giant 3D printer for concrete, so that I can vibe design my dream house", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7467688850027429889", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7467688850027429889/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-02T12:00:00+00:00", "posted_at_hint": "Jun 2 • Edited", "posted_at_approx": true, "text": "Why Claude Code picked workflow as the key word.\nNow everytime I ask it to update something in my Github workflow, it tries to use the new dynamic workflow", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7467807394622926848", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7467807394622926848/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-02T12:00:00+00:00", "posted_at_hint": "Jun 2 • Edited", "posted_at_approx": true, "text": "There are two types of engineers\n1. Those who are willing to spend 3 hours to write a bash script (pre-AI) to automate a task that takes 3 minutes do it by hand, or spend 30 minutes to write an agentic skill to automate a task that takes 30 seconds do it by hand\n2. Those who think the first type engineers are wasting time.\nGuess which type will survive the AI revolution?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Tanmay Singh", "profile_url": "https://www.linkedin.com/in/tanmay-singh-full-stack-developer/", "headline": "Senior Software Engineer | Mentor | Building AI agents & scalable full-stack systems | Sharing AI engineering insights, experiments & lessons from shipping"}, "is_author_reply": false, "posted_at": "2026-05-29T21:36:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Great engineers have always looked for leverage. AI is simply the next evolution of automation. The real advantage comes from building systems that save thousands of future minutes, not optimizing the next few seconds.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-05-29T21:36:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "and the saving compounds.", "likes": 1, "replies": []}]}], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7467823576759459842", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7467823576759459842/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-02T12:00:00+00:00", "posted_at_hint": "Jun 2", "posted_at_approx": true, "text": "You know you are doing real engineering work if you reach the flow state. Whether you are writing code by hand in the good old days, or chatting with your favorite AI vibe coding, you can reach the flow state.\n\nIn the flow state, you hold the whole complex problem in your mind, you are fully aware of how the pieces interact with each other.  Whether you edit the code by typing or command AI to vibe code it for you, it is essentially the same kind of mental workout, only at a different the level of abstraction.\n\nWelcome to the new world.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7467315283465220097", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7467315283465220097/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-01T12:00:00+00:00", "posted_at_hint": "Jun 1", "posted_at_approx": true, "text": "Here is a philosophical question, if you ask AI to send an e-card for you, does that e-card still carry the same meaning as you do it yourself?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7467379179798302720", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7467379179798302720/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-01T12:00:00+00:00", "posted_at_hint": "Jun 1", "posted_at_approx": true, "text": "RAM is sooooo expensive these days.  I bought 16G for my NAS.  For that price, I would get 64G a few years ago", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7466749327151890432", "url": null, "author": {"name": null, "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-05-31T12:00:00+00:00", "posted_at_hint": "May 31", "posted_at_approx": true, "text": "Violin Hero - I vibe coded it while my son is recording his violin music piece submission. Unfortunately, the note detection doesn't work well on a level 6 song. It only works on simple songs. https://lnkd.in/g75CHwAZ", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": null}, {"activity_id": "7466538322828480512", "url": null, "author": {"name": null, "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-05-30T12:00:00+00:00", "posted_at_hint": "May 30", "posted_at_approx": true, "text": "If you are an AGI (superhuman AI), what is the first thing you would do? Of course just like normal humans, it has to make money to make ends meet. The stock market is bubbling up is the sign of AGI is awakening. Three of the biggest AI companies are going to IPO soon, the AGI(s) know that is where to get money to pay for their GPUs and electricity bill.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": null}, {"activity_id": "7466218395844149248", "url": null, "author": {"name": null, "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-05-29T12:00:00+00:00", "posted_at_hint": "May 29", "posted_at_approx": true, "text": "Just watched Dr. Lisa Su's address to the MIT Class of 2026 — well worth 15 minutes of your day.\n\nOne line stuck with me:\n\n\"Run toward the hardest problem.\"\n\nIt's the kind of advice that lands at any stage of a career. The hardest problems are where you grow the fastest, build the strongest teams, and create impact that lasts. It's also the mindset that has shaped AMD's bets in AI and high-performance computing for the last decade.\n\nWhether you're a graduating student, a working engineer, or anyone navigating a career inflection point — give this a watch.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": null}, {"activity_id": "7466272007140118528", "url": null, "author": {"name": null, "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-05-29T12:00:00+00:00", "posted_at_hint": "May 29", "posted_at_approx": true, "text": "You don't have to choose between markdown or html files for AI output, you can have both!!!\n\nIn fact, I ask my AI to generate 3 outputs\n- markdown for another AI consumption\n- json structural data for downstream script consumption\n- html interactive visualization for human con
