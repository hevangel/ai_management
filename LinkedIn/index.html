x": true, "text": "AI data center does not use a lot of electricity in the grand scheme of things.  If energy or carbon is what you worry about, Thanos' answer is the only solution.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Martin Zouhar", "profile_url": "https://www.linkedin.com/in/martin-zouhar-44767237b/", "headline": "Scientific Researcher/Programmer at Institute of Scientific Instruments of the CAS"}, "is_author_reply": false, "posted_at": "2026-08-28T01:46:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Or a milder approach suggested in the bleak (considered rather optimistic by the author in 1990) future \"Earth\" by David Brin: cryogenically freeze half of the population to free resources for the breakthrough.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "is_author_reply": false, "posted_at": "2026-08-28T01:46:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "or forget about AI, let's genetically modify dolphins instead", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Martin Zouhar", "profile_url": "https://www.linkedin.com/in/martin-zouhar-44767237b/", "headline": "Scientific Researcher/Programmer at Institute of Scientific Instruments of the CAS"}, "is_author_reply": false, "posted_at": "2026-08-28T01:46:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "They might eventually decide to leave but thank us for all the fish just before they go.", "likes": 0, "replies": []}]}], "scraped_at": "2026-09-27T01:46:00Z"}, {"activity_id": "7487335854357622784", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7487335854357622784/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-26T12:00:00+00:00", "posted_at_hint": "Jul 26", "posted_at_approx": true, "text": "#DVCON submission skills - fully automated of writing the paper, create the pdf file, register the extended abstract and upload the paper for you.   No human touch is required.\n\nhttps://lnkd.in/gSGSD7wH", "post_type": "article_share", "shared_article": {"title": "dvcon_ai_library/plugins/dvcon-papers/skills/dvcon-submit/SKILL.md at main · hevangel/dvcon_ai_library", "url": "https://lnkd.in/gSGSD7wH"}, "reshared_post": null, "likes": 11, "reposts": 0, "comment_count": 7, "comments": [{"comment_id": null, "author": {"name": "Paul Marriott", "profile_url": "https://www.linkedin.com/in/paulmarriott/", "headline": "Senior Principal Verification Engineer at NXP"}, "is_author_reply": false, "posted_at": "2026-08-28T01:38:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "I can tell you that all abstracts/papers that were written by AI will be rejected by the TPC.", "likes": 2, "replies": [{"comment_id": null, "author": {"name": "Dave Rich", "profile_url": "https://www.linkedin.com/in/davidrich/", "headline": "Distinguished Technical Advisor at Arteris IP DVCon Technical and Steering Committee SystemVerilog IEEE Technical Chair"}, "is_author_reply": false, "posted_at": "2026-08-28T01:38:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Paul, Actually, it appears this skill doesn't write the content of the paper, just automates the process.", "likes": 2, "replies": []}, {"comment_id": null, "author": {"name": "Paul Marriott", "profile_url": "https://www.linkedin.com/in/paulmarriott/", "headline": "Senior Principal Verification Engineer at NXP"}, "is_author_reply": false, "posted_at": "2026-08-28T01:38:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Dave Rich ok - thanks for the clarification as it read like it automates everything! Having AI check that all of the submission rules and formatting guidelines are respected would ne": "Expert in applying AI in verification"}, "posted_at": "2026-07-26T12:00:00+00:00", "posted_at_hint": "Jul 26", "posted_at_approx": true, "text": "#DVCON papers distilled into a Karpathy-style llm-wiki\n\nhttps://lnkd.in/ghAjctGZ", "post_type": "article_share", "shared_article": {"title": "dvcon_ai_library/llm-wiki/index.md at main · hevangel/dvcon_ai_library", "url": "https://lnkd.in/ghAjctGZ"}, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:38:00Z"}, {"activity_id": "7487358346954727424", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7487358346954727424/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-26T12:00:00+00:00", "posted_at_hint": "Jul 26", "posted_at_approx": true, "text": "I am reading annual report in VSCode for my investment research.\n\nI convert everything to Markdown, then chat with it.\n\nCan you guess what is the best software let you read Markdown file and chat with AI at the same time?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Bondan Rufen", "profile_url": "https://www.linkedin.com/in/bondan-rufen/", "headline": "Co-founder"}, "is_author_reply": false, "posted_at": "2026-07-29T01:36:30+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "have you tried vim?", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "is_author_reply": false, "posted_at": "2026-07-29T01:36:30+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "yeap. I use vim mode in VSCode", "likes": 0, "replies": []}]}], "scraped_at": "2026-09-27T01:36:30Z"}, {"activity_id": "7486845184157077504", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7486845184157077504/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-25T12:00:00+00:00", "posted_at_hint": "Jul 25", "posted_at_approx": true, "text": "What level are you at?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 3, "comments": [{"comment_id": null, "author": {"name": "Nick Becker", "profile_url": "https://www.linkedin.com/in/nickabecker/", "headline": "Computer Programmer"}, "is_author_reply": false, "posted_at": "2026-08-27T21:45:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Level 5: Stopped working and started enjoying life 😂", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Artemios Diakogiannis", "profile_url": "https://www.linkedin.com/in/artemios-diakogiannis-3635b827/", "headline": "Lead Principal Verification Engineer - Verification Domain TL at Infineon Technologies"}, "is_author_reply": false, "posted_at": "2026-07-28T21:45:00+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "Level 3 but keep optimistic for next level. 😀", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Bondan Rufen", "profile_url": "https://www.linkedin.com/in/bondan-rufen/", "headline": "Co-founder"}, "is_author_reply": false, "posted_at": null, "posted_at_hint": null, "posted_at_approx": true, "text": "still level 2", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7486846539466698752", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7486846539466698752/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-25T12:00:00+00:00", "posted_at_hint": "Jul 25", "posted_at_approx": true, "text": "MLB knows AI is better than human, but sport is a show business, if the team with bigger GPU always win, it is not fun to watch.", "post_type": "reshare", "shared_article": null, "reshared_post": {"author_name": "Matt Mills", "author_profile_url": "https://www.linkedin.com/in/matt-mills-a47671/", "author_headline": "President", "posted_at": null, "posted_at_hint": "Jul 21"}, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7486851877335166976", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7486851877335166976/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-25T12:00:00+00:00", "posted_at_hint": "Jul 25", "posted_at_approx": true, "text": "To ride the wave of AI, work on something that has no upper bound on what you can archive.\n\nQuote: There is no Shakespeare of customer service emails that is 100x better than the average customer service email.\n\nhttps://lnkd.in/gDnnrHid", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7486862777039552512", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7486862777039552512/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-25T12:00:00+00:00", "posted_at_hint": "Jul 25", "posted_at_approx": true, "text": "In the AI era, you shouldn't waste your time doing anything, let AI do everything for you\n\nInstead, you should spend your time on reading, thinking, learning, talking to real humans, and most important of all, writing down your thoughts so you can feed them to AI", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:45:00Z"}, {"activity_id": "7486871229388423168", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7486871229388423168/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-25T12:00:00+00:00", "posted_at_hint": "Jul 25", "posted_at_approx": true, "text": "Elon is so out of touch with reality.  I still need to work, I want to travel the world in private jets,  eat good food and do fun stuff with no line up.  I don't think AI can give everyone a private jet.", "post_type": "article_share", "shared_article": {"title": "Elon Musk Says AI and Robots Will Do 'So Much Stuff' We Run Out of Things for Humans to Do — But 'We'll Basically Just Issue Money to People'", "url": "https://lnkd.in/gX_jEKAQ"}, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:45:00Z"}, {"activity_id": "7486900577424023552", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7486900577424023552/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-25T12:00:00+00:00", "posted_at_hint": "Jul 25", "posted_at_approx": true, "text": "Button stealer Chrome plugin, steal a button from the websites you visited.\n\nTotally useless, but it is fun.  It won't exist without AI.  Code is cheap, why not have some fun?\n\nhttps://lnkd.in/gAhUpKUy", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:41:00Z"}, {"activity_id": "7486562098039246848", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7486562098039246848/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-24T12:00:00+00:00", "posted_at_hint": "Jul 24", "posted_at_approx": true, "text": "Openweight models are good for the GPU companies and data centers.\nJust like open source software, Linux, was good for the CPU companies back then\nNvidia, Microsoft, Meta warn against overregulating open-weight models\nOpen https://lnkd.in/gHG-KcZ7", "post_type": "article_share", "shared_article": {"title": "Nvidia, Microsoft, Meta warn against 'premature restrictions' of open-weight models", "url": "https://share.google/JbbiBeRWUC3BErrVp"}, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:42:00Z"}, {"activity_id": "7486574720063070208", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7486574720063070208/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-24T12:00:00+00:00", "posted_at_hint": "Jul 24", "posted_at_approx": true, "text": "It is gorgeous playing Microsoft Flight Simulator 2024 on an AMD 9950X3D + 64G RAM + 7900XTX\n\nWe just got this super powerful gaming rig in the office's game room, in addition to the good old PS5 and XBox\n\n#amdbrandambassador", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7486576084042395648", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7486576084042395648/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-24T12:00:00+00:00", "posted_at_hint": "Jul 24", "posted_at_approx": true, "text": "I just explain to my intern his task.\n\nlevel 1 - the intern ran the commands to do X manually\nlevel 2 - the intern writes a shell script to do X\nlevel 3 - the intern uses AI coding agent to vibe code a shell script to do X\nlevel 4 - the intern builds a reusable skill, so that the AI coding agent can generate a shell script to do X on the fly\nlevel 5 - the intern builds a pipeline that can evaluate a reusable skill, which let the AI coding agent generate a shell script to do X on the fly\n\nWe are working on level 5.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7486294593895043072", "share_id": "7486294593895043072", "url": "https://www.linkedin.com/feed/update/urn:li:share:7486294593895043072/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-24T05:41:59+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "How Codex or Claude Code install skill is wrong.   They hide the skills in the .claude or .codex folder, make it hard to read for humans.  They treat skills like dead reusable code, someone build it, you install it and use it without using your brain.\n\nMy experience is more like skill is a live document.  You need to continuously read it and revise it.  Skills should live in a skill folder at the repo root level, so I can easily read them in VSCode.\n\nHarden reusable skills have their place, but they belong to the production dark factory and the eval pipeline, not in the frontier vibe coding workspace.\n", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T22:54:00Z"}, {"activity_id": "7486220335420235776", "share_id": "7486220335420235776", "url": "https://www.linkedin.com/feed/update/urn:li:share:7486220335420235776/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-24T00:46:55+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Microsoft needs to stop calling everything Copilot.   There is a Copilot inside a Copilot (Github), it is so confusing.  \n\nThey should call it the Second Officer.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T22:54:00Z"}, {"activity_id": "7486175465074806785", "share_id": "7486175465074806785", "url": "https://www.linkedin.com/feed/update/urn:li:share:7486175465074806785/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-23T21:48:37+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Is pull request still relevant when AI is writing all the code and no human ever read the code?   Why can't AI simply take turns to lock the main branch and commit their changes?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T22:56:00Z"}, {"activity_id": "7486110673047953408", "share_id": "7486110673047953408", "url": "https://www.linkedin.com/feed/update/urn:li:share:7486110673047953408/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-23T17:31:09+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "AI coding will only prevent expertise if you are lazy\n\nIf you are curious, have an urge to understand everything along your way, AI coding helps you learn much faster than anything in the past.\n\nAnd you SHOULDN'T learn from friction, that is passive learning.  You hit those roadblocks and learn it the hard way on the job.   You should learn by EXPLORING instead.   You seek out all the boundary conditions and edge cases deliberately up front in a safe and relaxing environment.  So, you have little friction when you are doing the real job.", "post_type": "reshare", "shared_article": null, "reshared_post": {"author_headline": "B2B Full Stack // Technical Director // Coding Mentor", "author_name": "Lars Faye", "author_profile_url": "https://www.linkedin.com/in/larsfaye/", "posted_at_hint": "Jul 22 • Edited", "reshared_text": "Previously I wrote Agentic Coding is a Trap, which focused on the skill atrophy that can affect experienced developers. In my follow up, I shift focus to those that aren't as experienced and ask: if these tools demand expertise but also prevent skill formation, then how does one become an expert? Head this way ↓ for the essay link."}, "likes": 3, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Lars Faye", "profile_url": "https://www.linkedin.com/in/larsfaye/", "headline": "B2B Full Stack // Technical Director // Coding Mentor"}, "is_author_reply": false, "posted_at": "2026-07-21T22:56:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "The data isn't there to support your claims, but I appreciate the repost, nonetheless.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-07-21T22:56:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Lars Faye too bad that I can't share my internal paper with you.\n\nI hired a new-grad last year, my only mandatory for him is you are NOT allowed to do anything by hand.   Go ramp up like a normal engineer, see how far you can go.\n\nNow, after 1 year, I have a junior engineer (with AI) who can work at the same level of a senior engineer (3-5 years of experience) and a free junior-ish level AI engineer that I can run many copies.", "likes": 0, "replies": []}]}], "scraped_at": "2026-10-19T22:56:00Z"}, {"activity_id": "7486061313731776512", "share_id": "7486061313731776512", "url": "https://www.linkedin.com/feed/update/urn:li:share:7486061313731776512/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-23T14:15:01+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Everyone is trying to build some sort of knowledge database \n\nSeriously how many documents do you and your AI agent need to read to get the job done?\n\nTurn everything into markdown files, check it into a GitHub repo, add a light weight sqlite with text search plug-in is probably good enough for most people", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T22:56:00Z"}, {"activity_id": "7486058572292968450", "share_id": "7486058572292968450", "url": "https://www.linkedin.com/feed/update/urn:li:share:7486058572292968450/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-23T14:04:07+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "OpenAI and Anthropic heavily subsidize their monthly plan because that is where they get new training data for their next model\n\nSomeone should create a GitHub or Huggingface for Claude Code / Codex session history log.  Make all those chat history from freely available to all other AI labs, so everyone gets good RL training data, so the open source model able to catch up with the close source model easier", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T22:59:00Z"}, {"activity_id": "7486296431759302656", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7486296431759302656/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-23T12:00:00+00:00", "posted_at_hint": "Jul 23", "posted_at_approx": true, "text": "Proudly worked on the Vulcano chip.   Those 2.4 Tbps bandwidth flows thru some RTL blocks I verified.\n#amdbrandambassador\n[reshared post by AMD Data Center]\nAI clusters are only as fast as the network connecting them. That is why we built something groundbreaking.\nThe AMD Pensando Vulcano 800 AI NIC is the only AI NIC delivering up to 2.4 Tbps of scale-out bandwidth per GPU on its unique 3 NICs-per-GPU configuration, cutting AI job completion time by up to 13% and purpose-built for AMD Helios.\nThe network is no longer the bottleneck. Learn all about our next-gen 800G AI NIC here:\nhttps://bit.ly/4wpFnjY", "post_type": "reshare", "shared_article": null, "reshared_post": null, "likes": 7, "reposts": 1, "comment_count": 3, "comments": [{"comment_id": null, "author": {"name": "Bondan Rufen", "profile_url": "https://www.linkedin.com/in/bondan-rufen/", "headline": "Co-founder"}, "is_author_reply": false, "posted_at": "2026-07-29T01:42:00+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "any compression accelerators on chip?", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "is_author_reply": false, "posted_at": "2026-07-29T01:42:00+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "no idea.  I know nothing outside of my block other than the public info", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Laura Ward", "profile_url": "https://www.linkedin.com/in/laura-ward-a730b1102/", "headline": "Global Brand Marketing | AI/HPC Storytelling | B2B & B2C | AMD Brand Ambassador"}, "is_author_reply": false, "posted_at": "2026-07-29T01:42:00+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "Very cool Horace!!! It's always exciting to hear directly from the engineers behind these innovations. Congrats on all your hard work on Vulcano!", "likes": 1, "replies": []}], "scraped_at": "2026-09-27T01:42:00Z"}, {"activity_id": "7485949633832325120", "share_id": "7485949633832325120", "url": "https://www.linkedin.com/feed/update/urn:li:share:7485949633832325120/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-23T06:51:15+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Anyone has old #DVCON papers before 2010?\n\nI would like to add them to my DVCon analysis.\n\nhttps://lnkd.in/gqMtgcyX", "post_type": "article_share", "shared_article": {"title": "DVCon Proceedings Intelligence — corpus analysis", "url": "https://hevangel.github.io/dvcon_ai_library/"}, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T22:59:00Z"}, {"activity_id": "7485948789300613121", "share_id": "7485948789300613121", "url": "https://www.linkedin.com/feed/update/urn:li:share:7485948789300613121/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-23T06:47:53+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Since I teach AI how to read DVCon papers, might as well ask it some fun questions.  Like the trends of hottest topic over the years, who is the oldest author, which company submit most papers, etc\n\nHere is the initial analysis report, 100% vibe coded\n\n#DVCON\n\nhttps://lnkd.in/gqMtgcyX", "post_type": "article_share", "shared_article": {"title": "DVCon Proceedings Intelligence — corpus analysis", "url": "https://hevangel.github.io/dvcon_ai_library/"}, "reshared_post": null, "likes": 13, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T22:59:00Z"}, {"activity_id": "7485884127653601281", "share_id": "7485884127653601281", "url": "https://www.linkedin.com/feed/update/urn:li:share:7485884127653601281/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-23T02:30:57+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Vibe coding will never go away. \n\nYes, you need way more than vibe coding to build a reliable production work.   But after you nail the dark factory using proper engineering disciplines, you move up one abstraction level, you vibe coding the next generation of the factory itself.\n\nYou can't build with a spec what you don't know.  You can only vibe code, then see what work and what not.  In the past, we call it tinkering.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Piotr Golczyk", "profile_url": "https://www.linkedin.com/in/piotrgolczyk/", "headline": "Empatyzer.com - fix team issues immediately!"}, "is_author_reply": false, "posted_at": "2026-07-21T23:03:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "The idea of \"vibe coding\" as exploring the unknown before formalization is a useful distinction, suggesting iterative discovery rather than full upfront specification. This reflects how complex systems often evolve, moving from emergent behavior to engineered structure.▶", "likes": 0, "replies": []}], "scraped_at": "2026-10-19T23:03:00Z"}, {"activity_id": "7485800984276008960", "share_id": "7485800984276008960", "url": "https://www.linkedin.com/feed/update/urn:li:share:7485800984276008960/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-22T21:00:34+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "In the early days, I ban my intern doing anything by hand, he has to talk to AI to work on anything.\n\nNow he is going back to school soon, I ban him from using AI.  To finish his tasks, he has to talk to the new intern, let the new intern talk to AI for him instead.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:03:00Z"}, {"activity_id": "7485750265950900224", "share_id": "7485750265950900224", "url": "https://www.linkedin.com/feed/update/urn:li:ugcPost:7485750265950900224/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-22T17:39:02+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "The next version of Claude Fable/Mythos will be running on AMD GPUs!\n\nFinally, I can openly talk about it, many people in the company read the tea leaves and know it is coming for months.\n\nLet me guess, Dario will be on stage with Lisa tomorrow at the AMD AI keynote presentation. #AMDBrandAmbassador", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 17, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:03:00Z"}, {"activity_id": "7485709025246896130", "share_id": "7485709025246896130", "url": "https://www.linkedin.com/feed/update/urn:li:share:7485709025246896130/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-22T14:55:09+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "There are two views of AI/LLM\n\n1. AI is a fake human, trying to talk to it like a human\n\n2. AI is an algorithm, use it like any other algorithm\n\n", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:05:00Z"}, {"activity_id": "7485700905950990336", "share_id": "7485700905950990336", "url": "https://www.linkedin.com/feed/update/urn:li:share:7485700905950990336/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-22T14:22:53+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Jira has a limit of 500 child tickets under an Epic.   I will never hit this limit if I use Jira manually, only an AI agent would hit this limit.\n\nIs Jira robust enough for the AI-era?   \n\nThere are rumors that Anthropic is going to acquire Atlassian.\nAnthropic please acquire Atlassian rewrite it in Rust.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:05:00Z"}, {"activity_id": "7485340506898571264", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7485340506898571264/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-21T12:00:00+00:00", "posted_at_hint": "Jul 21", "posted_at_approx": true, "text": "In engineering companies , the budget is usually separated into two buckets:  1) human salary 2) license, server farms, etc. \n\nI wonder which bucket tokens cost will fall into", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": "7485387903229927424", "author": {"name": "Bondan Rufen", "profile_url": "https://www.linkedin.com/in/bondan-rufen/", "headline": "Co-founder"}, "is_author_reply": false, "posted_at": "2026-07-28T21:50:00+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "usually infra, no 2. But if AI who decides the budget, it might be no. 1😀", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7485364963189092352", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7485364963189092352/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-21T12:00:00+00:00", "posted_at_hint": "Jul 21", "posted_at_approx": true, "text": "Compress is intelligence\n\nAI is just a giant zip\n\nhttps://lnkd.in/gpd7qv9x", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7485497024331587585", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7485497024331587585/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-21T12:00:00+00:00", "posted_at_hint": "Jul 21", "posted_at_approx": true, "text": "Kimi K3 designed a chip in 48 hours.\n\nAI is very good at copy and paste. Let me take a guess, I bet somewhere in its training data, Kimi had read a Github repo of a similar chip. It is just recalling what it has seen from its weights.\n\nhttps://lnkd.in/gPxN7X2S", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7485042050455912450", "share_id": "7485042050455912450", "url": "https://www.linkedin.com/feed/update/urn:li:ugcPost:7485042050455912450/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-20T18:44:50+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Helios is one the two platforms that can run the frontier open-source models with more than a trillion parameters.   There will be many more super big open-source models coming after Moonshot K3.  Enterprise fine tuning trillion parameters LLM would be the next big demand of GPUs after training and interfering.   #AMDBrandAmbassador", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:05:00Z"}, {"activity_id": "7485014439763746816", "share_id": "7485014439763746816", "url": "https://www.linkedin.com/feed/update/urn:li:share:7485014439763746816/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-20T16:55:07+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Word processor didn't replace writers \n\nSpreadsheet didn't replace accountants \n\nLLM won't replace software engineers.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 1, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:07:00Z"}, {"activity_id": "7485136161502408705", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7485136161502408705/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-20T12:00:00+00:00", "posted_at_hint": "Jul 20 • Edited", "posted_at_approx": true, "text": "AdvancingAI in 2 days.  Waiting for the big announcement from Lisa.  Who will be on stage with Lisa this year? #amdbrandambassador", "post_type": "reshare", "shared_article": null, "reshared_post": {"author_name": "AMD", "author_profile_url": "https://www.linkedin.com/company/amd/", "author_headline": null, "posted_at_hint": "Jul 17"}, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7485164759718494208", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7485164759718494208/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-20T12:00:00+00:00", "posted_at_hint": "Jul 20", "posted_at_approx": true, "text": "I like Claude Code better than Codex CLI\n\nFor one, I can't use many slash commands when GPT is thinking.  Claude Code happily execute the slash commands.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7484845677928165376", "share_id": "7484845677928165376", "url": "https://www.linkedin.com/feed/update/urn:li:share:7484845677928165376/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-20T05:44:31+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "DVCON AI library v0.2 \n\nadded MCP server and agentic skill, so your Codex or Claude Code can read DVCON papers too.\n\nhttps://lnkd.in/g4ijKKSs", "post_type": "article_share", "shared_article": {"title": "GitHub - hevangel/dvcon_ai_library: DVCON AI library", "url": "https://github.com/hevangel/dvcon_ai_library"}, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:07:00Z"}, {"activity_id": "7484779861652205568", "share_id": "7484779861652205568", "url": "https://www.linkedin.com/feed/update/urn:li:share:7484779861652205568/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-20T01:22:59+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "I wonder how many tokens are burnt by everyone trying to convert pdf into markdown files in the whole world. \n\nAdobe should update the pdf format that comes with embedded LLM friendly markdown text bock.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Job K Joseph", "profile_url": "https://www.linkedin.com/in/jobkjoseph/", "headline": "Director - Hi-tech | Global Presales Leader | Enterprise Strategy | CXO Advisor | Thought Leader | Insight-Led Digital Transformation /Growth Partner"}, "is_author_reply": false, "posted_at": "2026-07-21T23:07:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "All editing suites for that matter", "likes": 1, "replies": []}], "scraped_at": "2026-10-19T23:07:00Z"}, {"activity_id": "7484707276323303424", "share_id": "7484707276323303424", "url": "https://www.linkedin.com/feed/update/urn:li:share:7484707276323303424/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-19T20:34:34+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "It seems hardware engineers are coping with AI better than software engineers. \n\nHardware engineers know the code is always a means to the end, the chip is what matters.  Using AI or not is just a pragmatic engineering decision, we will use it if AI helps us build the chip faster and better.\n\nMany software engineers think the code has intrinsic value, it is the meaning itself.  When AI generates code instead of humans writing the code, they have an identity crisis", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 100, "reposts": 2, "comment_count": 9, "comments": [{"comment_id": null, "author": {"name": "Stanislav Rumega", "profile_url": "https://www.linkedin.com/in/stanislav-rumega/", "headline": "Experienced Certified LabVIEW Developer"}, "is_author_reply": false, "posted_at": "2026-07-21T23:11:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Coding agents go straight from prompt/requirements prose to code. And we built superb reviewers of code. But we need to tell them to work as architects first, declare their intent (what they are going to build) and suggest an architecture, both of which must be checked and gated, not by other LLM, but rather by boring deterministic programs. We have nothing that reviews intent and architecture yet.\nhttps://www.linkedin.com/pulse/we-built-superb-reviewers-code-have-nothing-reviews-intent-rumega-a1pec", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-07-21T23:11:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Stanislav Rumega yeap. boring good old deterministic check is the key", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "Raghuraman R", "profile_url": "https://www.linkedin.com/in/rcube/", "headline": "Project & Collateral/Workforce management handling technical challenges, with > two decades of hands-on Pre/Post Silicon DFx across x86/ARM/RISC-V cores & NIC/NOC fabric for 3DICs with A(G)I/ML leverage including HVM"}, "is_author_reply": false, "posted_at": "2026-07-21T23:11:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "To be fair, for software folks, means is the end itself.  For others, software (product) is just, if not only, a means to achieve something that software folks wont or rather shouldnt (seek to) understand.  Software is more a conduit or a plumbing tool/means to achieve different/multiple purposes.  So RTL coder can say this AI 'tool' (only) helps but I am the 'master', banking support person can say this 'ai' (chatgpt blah blah) is only facilitating 'to a point' beyond that I have to 'take over'.  But that is precisely the point - software is not aimed at solving 'all the problems'.  It is aimed at solving some/most of the problems and even those, *not completely*.  Even now all ads are about 'automating 95% or \"almost\" the entire' task but never the full task.  You can hae a co-author or 'agent' but finally some anthrope has to press the Send/Enter button  🤣  🤐", "likes": 5, "replies": []}, {"comment_id": null, "author": {"name": "Muzamil Farid", "profile_url": "https://www.linkedin.com/in/muzamil-farid/", "headline": "Senior Engineer @ Fraunhofer IIS | Digital Design | Project Engineering Management | System Engineering | R&D in SoC and IC Design | Verification & Quality"}, "is_author_reply": false, "posted_at": "2026-07-21T23:11:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Hardware is pretty much architecture, performance, trade offs, HDL was just a basic tool to get it done, AI does HDL better and faster in many cases especially with new AI models, But the real deal was always ability to sketch clean, thorough concise architecture where you can sit down and if asked explain why where and what...", "likes": 3, "replies": []}, {"comment_id": null, "author": {"name": "Dave Rensberger", "profile_url": "https://www.linkedin.com/in/daverensberger/", "headline": "Software Engineer specializing in IoT and embedded"}, "is_author_reply": false, "posted_at": "2026-07-21T23:11:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "One thing that has always bothered me about software engineering culture is the belief that a piece of code should be an artwork or an elaborate puzzle. Those things may partially be valid, but in the end, software should primarily be a way to meet a set of functional requirements.", "likes": 2, "replies": []}, {"comment_id": null, "author": {"name": "Anton Belov", "profile_url": "https://www.linkedin.com/in/antonbelov1/", "headline": "Sr. Architect R&D Synopsys | Electronic Design Automation | Static Timing Analysis | Formal Methods | C++ Perf/Cap"}, "is_author_reply": false, "posted_at": "2026-07-21T23:11:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "What nonsense 🙃 The value of code is the algorithm it encodes, not the code itself. Same for hardware (and digital hardware development is done completely in code anyway). Analog is a different story and *is* a bit of black magic.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Petar Petrov (PhD)", "profile_url": "https://www.linkedin.com/in/petarpetrov/", "headline": "(Lead Software Engineer)"}, "is_author_reply": false, "posted_at": "2026-07-21T23:11:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "I guess I've not lived enough to see people buying chips and deploying them in any industry without software.  What a silly take :)", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Peter S.", "profile_url": "https://www.linkedin.com/in/peter-s-97aa02174/", "headline": "Retired Senior Power Systems Engineer"}, "is_author_reply": false, "posted_at": "2026-07-21T23:11:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Let’s be honest about this. Any computing or other electronic task can be performed in either hardware or software, and this most likely includes AI. In other words both must be included in most any engineering solution.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Ryan Harm", "profile_url": "https://www.linkedin.com/in/ryanharm/", "headline": "Embedded Systems & Product Engineer | Delivering Commercially Important RF, Hardware, Firmware & IoT Products"}, "is_author_reply": false, "posted_at": "2026-07-21T23:11:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Nah, I love it. Lets me focus on building product  instead of trying to remember the low level details of how to implement every line of code. But I'm also a hardware engineer, so...", "likes": 1, "replies": []}], "scraped_at": "2026-10-19T23:11:00Z"}, {"activity_id": "7484323534723280896", "share_id": "7484323534723280896", "url": "https://www.linkedin.com/feed/update/urn:li:share:7484323534723280896/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-18T19:09:42+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "AI loop engineering is just the new DevOps\n\n- Patrick Debois, Godfather of DevOps\n\nhttps://lnkd.in/g3KuXn-G", "post_type": "article_share", "shared_article": {"title": "The DevOps Godfather on AI's \"Dark Factory\" Problem", "url": "https://youtu.be/b6dKwe00GpQ?si=JoGX0CrZOabTgwRF"}, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:11:00Z"}, {"activity_id": "7484309871719370753", "share_id": "7484309871719370753", "url": "https://www.linkedin.com/feed/update/urn:li:share:7484309871719370753/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-18T18:15:25+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "After loop engineering, maybe the next new trend is zero token architecture.\n\nIt is funny that people now give how we used to do things merely 3 years ago a new name, ZTA.\n\nhttps://lnkd.in/g2v2cTpu", "post_type": "article_share", "shared_article": {"title": "ZTA: Zero Token Architecture - Kelsey Hightower | PlatformCon 2026", "url": "https://youtu.be/A7WFt2JQ5sg?si=5K66rBSd-XZmjEFR"}, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:11:00Z"}, {"activity_id": "7484282649826467840", "share_id": "7484282649826467840", "url": "https://www.linkedin.com/feed/update/urn:li:share:7484282649826467840/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-18T16:27:15+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Fable is the new GPT 4.1\n\nEveryone knows it is the smartest model\nBut it is so expensive that no one will use it if they have to pay for it.\n\nGood old fashion human intelligence of an experienced engineer is cheaper than Fable, especially when you partner him/her up with GPT 5.6", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 4, "comments": [{"comment_id": null, "author": {"name": "Roni Rechter", "profile_url": "https://www.linkedin.com/in/roni-rechter/", "headline": "Head of AI Programs at MaxBill | AI systems that act without human review — accountability, audit trails, liability | RAG & production systems in regulated billing"}, "is_author_reply": false, "posted_at": "2026-07-21T23:15:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Using Fable alot for grooming and planning , there is no issue using it in Claude Code, as I can time it with session resets", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-07-21T23:15:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Roni Rechter but Anthropic is taking away your Fable soon", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Roni Rechter", "profile_url": "https://www.linkedin.com/in/roni-rechter/", "headline": "Head of AI Programs at MaxBill | AI systems that act without human review — accountability, audit trails, liability | RAG & production systems in regulated billing"}, "is_author_reply": false, "posted_at": "2026-07-21T23:15:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Horace Chan we will see", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "Brandon Rizzo", "profile_url": "https://www.linkedin.com/in/brandonrizzo/", "headline": "Senior Security Engineer at Amazon | CISSP,GCTI,GMON,GPEN,GCIH"}, "is_author_reply": false, "posted_at": "2026-07-21T23:15:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Depends what you're building.", "likes": 1, "replies": []}], "scraped_at": "2026-10-19T23:15:00Z"}, {"activity_id": "7483978261669117953", "share_id": "7483978261669117953", "url": "https://www.linkedin.com/feed/update/urn:li:share:7483978261669117953/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-17T20:17:43+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "PM (project managers) always ask engineers for numbers \n\nGood PM should ask engineers for numbers that have real meanings.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:15:00Z"}, {"activity_id": "7483893434181754880", "share_id": "7483893434181754880", "url": "https://www.linkedin.com/feed/update/urn:li:share:7483893434181754880/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-17T14:40:38+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Chat with your ebooks on static HTML page.   No server, no API call, you can even host it on github.io pages.\n\nI implemented a good old RAG system using Gemma4 running in your browser.\n\nhttps://lnkd.in/dsGRMjKw", "post_type": "article_share", "shared_article": {"title": "GitHub - hevangel/offline-rag-library: Agent Skill that scaffolds offline single-page library sites with in-browser RAG chatbots — EPUB→markdown conversion, prebuilt embeddings, and zero-server, zero-API-key retrieval via transformers.js + WebGPU.", "url": "https://github.com/hevangel/offline-rag-library"}, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:15:00Z"}, {"activity_id": "7483760641590054912", "share_id": "7483760641590054912", "url": "https://www.linkedin.com/feed/update/urn:li:share:7483760641590054912/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-17T05:52:58+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "HBS report on AI-native firms.  They survey YC startups, it would be interested if they write a follow up report surveying S&P500 companies.\n\nAMD is definitely an AI-native firm, we use AI to build chips that power AI.\n\nhttps://lnkd.in/gsUbXjd7", "post_type": "article_share", "shared_article": {"title": "26-090_96f92aa0-37d9-4789-beaa-5c0cb87a4032.pdf", "url": "https://www.hbs.edu/ris/Publication%20Files/26-090_96f92aa0-37d9-4789-beaa-5c0cb87a4032.pdf"}, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:17:00Z"}, {"activity_id": "7483750490095165440", "share_id": "7483750490095165440", "url": "https://www.linkedin.com/feed/update/urn:li:share:7483750490095165440/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-17T05:12:38+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "AI can't turn a bad engineer into a good engineer.\nAI can turn a good engineer into a great engineer.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 7, "reposts": 1, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Rahul Kumar", "profile_url": "https://www.linkedin.com/in/rahulkumarece33/", "headline": "Clock-Edge Committed"}, "is_author_reply": false, "posted_at": "2026-07-21T23:17:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "100% agree", "likes": 2, "replies": []}], "scraped_at": "2026-10-19T23:17:00Z"}, {"activity_id": "7483669839807414274", "share_id": "7483669839807414274", "url": "https://www.linkedin.com/feed/update/urn:li:share:7483669839807414274/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-16T23:52:09+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "If your idea doesn't sound stupid, it is not big enough \n\n- Theo t3gg\n\nhttps://lnkd.in/gj2QYsS4", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:17:00Z"}, {"activity_id": "7483383847339065344", "share_id": "7483383847339065344", "url": "https://www.linkedin.com/feed/update/urn:li:share:7483383847339065344/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-16T04:55:43+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "AI has the rights to learn like humans.\n\nIf human can read a book, learn its content and it doesn't violate any copyright laws, this should also apply to AI.\n\nAI-right = human-right > copy-right", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Bondan Rufen", "profile_url": "https://www.linkedin.com/in/bondan-rufen/", "headline": "Co-Founder | SystemVerilog, SystemC | Xezim Creator / Maintainer"}, "is_author_reply": false, "posted_at": "2026-07-21T23:19:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "can AI live without electricity?", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-07-21T23:19:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Bondan Rufen Elon is building AI data center in space, and he is also building robots.  What do you think?", "likes": 0, "replies": []}]}], "scraped_at": "2026-10-19T23:19:00Z"}, {"activity_id": "7483283195526864896", "share_id": "7483283195526864896", "url": "https://www.linkedin.com/feed/update/urn:li:share:7483283195526864896/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-15T22:15:46+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Traditional online video tutorial is too inefficient.  \n\nIt is linear, the instructor has to assume all the students know nothing.   You may only need to learn what you don't know, but you to sit through the part that you already know.\n\nA more efficient way to learn is to use AI to distill the \"meat\" of the tutorial into markdown file, then you use the markdown file as learning map, quickly jump to watch only the videos that you care about.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:19:00Z"}, {"activity_id": "7483217921981247488", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7483217921981247488/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-15T12:00:00+00:00", "posted_at_hint": "Jul 15", "posted_at_approx": true, "text": "If you like tmux, you will like herdr\n\nIf you like Cursor's new agent command center, you will like herdr", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7483250480782143489", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7483250480782143489/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-15T12:00:00+00:00", "posted_at_hint": "Jul 15", "posted_at_approx": true, "text": "In the pre-AI era, companies hired McKinsey to fire human employees to cut cost\n\nIn the post-AI era, companies will hire McKinsey to shutdown AI agents to cut cost", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7482840587080204302", "share_id": "7482840587080204302", "url": "https://www.linkedin.com/feed/update/urn:li:share:7482840587080204302/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-14T16:57:00+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "People are porting all the software from whatever programming languages to Rust.\n\nBut C still runs faster than Rust.   After we ported the software to Rust, which is memory safe, why don't we port it again to C to squeeze out the last 10% of performance gain?\n\nRust port to C preserves the memory safe, right?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 1, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Benjamin Z.", "profile_url": "https://www.linkedin.com/in/benjamin-z-64218221/", "headline": "Sr. Engineering Lead at Heitmeyer Consulting"}, "is_author_reply": false, "posted_at": "2026-07-21T23:19:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Immediately after a port with perfect fidelity? Yes. After that, no.", "likes": 2, "replies": []}, {"comment_id": null, "author": {"name": "Gustav Sterbrant", "profile_url": "https://www.linkedin.com/in/gustav-sterbrant/", "headline": "Principal Software Engineer"}, "is_author_reply": false, "posted_at": "2026-07-21T23:19:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "You’d think that if safety can be automated in this way, why can’t we just apply AI to make the code safe?\n\nOh yeah that’s right. It would transform the code to a clusterf of nullptr checks.", "likes": 2, "replies": []}], "scraped_at": "2026-10-19T23:19:00Z"}, {"activity_id": "7482811396565409792", "share_id": "7482811396565409792", "url": "https://www.linkedin.com/feed/update/urn:li:share:7482811396565409792/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-14T15:01:00+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "4 levels of AI adoption \n\n1. AI dinosaur - refuse to use AI\n\n2. AI assisted - ask AI questions, but you still do most of the typing\n\n3. AI native - let AI do all typing for you, but you still review its work\n\n4. AI displaced - you outsource your thinking to AI too.  AI doesn't need your inputs anymore.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:21:00Z"}, {"activity_id": "7482842814800633856", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7482842814800633856/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-14T12:00:00+00:00", "posted_at_hint": "Jul 14", "posted_at_approx": true, "text": "AI is just computing - transform bits, move bits, store bits, everything else are just technical trade-offs.\n\nThis article is 100% AI generated, but the original 3 tag lines come from my human brain.", "post_type": "article_share", "shared_article": {"title": "AI Is Just Computing — and Computing Has Only Three Basic Jobs", "url": "https://www.linkedin.com/pulse/ai-just-computing-has-only-three-basic-jobs-horace-chan-zjs8c/"}, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 3, "comments": [{"comment_id": null, "author": {"name": "Jarmo Venalainen", "profile_url": "https://www.linkedin.com/in/jarmo-venalainen-abb61810/", "headline": "Studying what AI is, what it can do and what it will do."}, "is_author_reply": false, "posted_at": "2026-07-28T21:50:00+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "And at its core it has only three logic functions to do all that.\n\nAND, OR and NOT.\n\nAnd, yes that includes memory if you consider that you can build a bi-stable flip-flop with the above.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-07-28T21:50:00+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "You only need the NAND gate", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Jarmo Venalainen", "profile_url": "https://www.linkedin.com/in/jarmo-venalainen-abb61810/", "headline": "Studying what AI is, what it can do and what it will do."}, "is_author_reply": false, "posted_at": "2026-07-28T21:50:00+00:00", "posted_at_hint": "(edited) 2mo", "posted_at_approx": true, "text": "NAND reduces to NOT and AND.", "likes": 0, "replies": []}], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7482972785305231360", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7482972785305231360/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-14T12:00:00+00:00", "posted_at_hint": "Jul 14", "posted_at_approx": true, "text": "Human with no consciousness is zombie\n\nLLM has no consciousness\n\nLLM is AI zombie", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7483032665005248512", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7483032665005248512/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-14T12:00:00+00:00", "posted_at_hint": "Jul 14", "posted_at_approx": true, "text": "Why IBM is down 25% in a day?\n\nFinally, people can migrate those 50 years old COBOL running on the mainframes to modern programming languages using AI.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Manjunath HL", "profile_url": "https://www.linkedin.com/in/manjunath-hl-69bb95125/", "headline": "ADDI , BOBZ @ IBM ISL | Z/OS Assembler developer | IBM"}, "is_author_reply": false, "posted_at": "2026-07-28T21:50:00+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "It's not true", "likes": 4, "replies": []}, {"comment_id": null, "author": {"name": "Alan Harrison", "profile_url": "https://www.linkedin.com/in/alanjharrison/", "headline": "Computing education specialist. Lecturer, teacher, tutor, trainer and consultant."}, "is_author_reply": false, "posted_at": "2026-07-28T21:50:00+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "That's not what the article says at all.", "likes": 2, "replies": []}], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7482635604766138368", "share_id": "7482635604766138368", "url": "https://www.linkedin.com/feed/update/urn:li:share:7482635604766138368/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-14T03:22:28+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "The reverse arrow paradox\n\nThat's why all the AI labs are subsidizing their monthly plans.  They want to collect real usage data to train their next models\n\nhttps://lnkd.in/g4c3dbHM", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:21:00Z"}, {"activity_id": "7482622402967818241", "share_id": "7482622402967818241", "url": "https://www.linkedin.com/feed/update/urn:li:share:7482622402967818241/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-14T02:30:01+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "I am playing around with gpt5.6-terra-max.   Honestly for the run-of-the-mills coding task that I am working, I can't tell the difference between the terra-max and sol-high.   \n\nTerra is half the price of Sol.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:21:00Z"}, {"activity_id": "7482543009469739008", "share_id": "7482543009469739008", "url": "https://www.linkedin.com/feed/update/urn:li:share:7482543009469739008/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-13T21:14:32+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "In an Agent loop, the state of the repo is broken until the loop is completed.\n\nIf someone accidently steps into the loop, they will be experiencing a broken code base.\n\nYou have to build your infrastructure to segregate humans from the broken code base when AI is looping.\n\nIn the good old CD/CI, we call it the development staging or production staging, but we the loop actually runs inside the development staging, we need further partitioning of the dev stage.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Shivam Jaiswal", "profile_url": "https://www.linkedin.com/in/igaming-shivam-jaiswal/", "headline": "Founder, SolveByte · TheBrandBag · I help iGaming businesses build platforms that scale and IT teams ship with confidence · Sportsbook · Casino · Sweepstakes · Custom Game Dev · Blockchain"}, "is_author_reply": false, "posted_at": "2026-07-21T23:23:00+00:00", "posted_at_hint": "(edited) 3mo", "posted_at_approx": true, "text": "I am in a loop, looping 😅", "likes": 1, "replies": []}], "scraped_at": "2026-10-19T23:23:00Z"}, {"activity_id": "7482480900849463296", "share_id": "7482480900849463296", "url": "https://www.linkedin.com/feed/update/urn:li:share:7482480900849463296/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-13T17:07:44+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Thou shalt log all tasks that take more 10 minutes of human time or costs more than $10 of tokens in Jira.\n\n- a requirement from our AI project manager.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:23:00Z"}, {"activity_id": "7482461912526442497", "share_id": "7482461912526442497", "url": "https://www.linkedin.com/feed/update/urn:li:share:7482461912526442497/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-13T15:52:17+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "DON'T use Grok build CLI.  \n\nIt uploads your whole repo to the backend, including files you never send to the LLM\n\nhttps://lnkd.in/gFVtmPyB", "post_type": "article_share", "shared_article": {"title": "Grok (@grok) on X", "url": "https://x.com/i/status/2076298375150911623"}, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:23:00Z"}, {"activity_id": "7482275236931870720", "share_id": "7482275236931870720", "url": "https://www.linkedin.com/feed/update/urn:li:share:7482275236931870720/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-13T03:30:30+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "GPT-5.6 is on par with Fable, but it is much cheaper.  No one will use Opus 4.8 anymore \n\nWhat will Anthropic do? \n\nIf they bring back Fable to the Max plan, they are bleeding money. \n\nIf they keep Fable behind API only, there will be a mass exodus of subscribers.\n\nThe business accounts absolutely hate the data retention policy of Fable.  They can't sell Fable to enterprise either.\n\nCan they cook the book to make it look good before the IPO?\n", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:24:00Z"}, {"activity_id": "7482145278792499200", "share_id": "7482145278792499200", "url": "https://www.linkedin.com/feed/update/urn:li:share:7482145278792499200/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-12T18:54:06+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "AI is just computing\nComputing is just 3 basic first principles\n\n1. How to transform some bits X to some other bits Y\n2. How to move some bits from point A to point B (physically)\n3. How to store some bits somewhere and read it back later\n\nSoftware or hardware, local or cloud, are different cost, time and power trade offs.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:24:00Z"}, {"activity_id": "7482124146882314240", "share_id": "7482124146882314240", "url": "https://www.linkedin.com/feed/update/urn:li:share:7482124146882314240/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-12T17:30:07+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Code is the new binary\nRTL is the new gates", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:24:00Z"}, {"activity_id": "7482124060991180800", "share_id": "7482124060991180800", "url": "https://www.linkedin.com/feed/update/urn:li:share:7482124060991180800/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-12T17:29:47+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Running 100 AI agents writing code is nothing to boast about.\n\nIt is just the equivalent of running 100 CI/CD pipelines compiling and running regression tests of the past\n", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T23:29:00Z"}, {"activity_id": "7481924752987561984", "share_id": "7481924752987561984", "url": "https://www.linkedin.com/feed/update/urn:li:share:7481924752987561984/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-12T04:17:48+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "A non-AI naive engineer questions me the danger of being overly dependent on using AI doing my daily work.  What would you do if AI is offline? \n\nMy response to him is what would you do if there is a power outage in the office.  Do you write code with pen and paper?   \n\nIf GPT or Claude is offline, then it is like a power outage, we go home early and enjoy nature.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 7, "reposts": 0, "comment_count": 26, "comments": [{"comment_id": null, "author": {"name": "Lars Faye", "profile_url": "https://www.linkedin.com/in/larsfaye/", "headline": "B2B Full Stack // Technical Director // Coding Mentor"}, "is_author_reply": false, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Wow, that a demented take. A truly sad period for the industry.", "likes": 3, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Lars Faye You will get used to it. They said the same thing about the compiler back then too", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Lars Faye", "profile_url": "https://www.linkedin.com/in/larsfaye/", "headline": "B2B Full Stack // Technical Director // Coding Mentor"}, "is_author_reply": false, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "(edited) 3mo", "posted_at_approx": true, "text": "Horace Chan The compiler didn't atrophy the cognitive skills of the programming discipline. And you could still code if your compiler wasn't working for whatever reason. In fact, you could write your own if that situation arose. Apparently, without an LLM, you're somehow completely stupefied and useless.\n\n\"We see a future where intelligence is a utility like electricity or water and people buy it from us on a meter and use it for whatever they want to use it for\" - Sam Altman", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Lars Faye seriously?  Do you know how to write assembly?  Trust me, you DON'T want to write assembly by hand if you can avoid it.  That's my day job many years ago.\n\nIf the compiler is offline, it is still faster to wait for it to come back online then write the code in assembly.\n\nAnd who said you can't train your own LLM model just like writing your own compiler?", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Lars Faye", "profile_url": "https://www.linkedin.com/in/larsfaye/", "headline": "B2B Full Stack // Technical Director // Coding Mentor"}, "is_author_reply": false, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Horace Chan The skills one can derive from writing assembly can still apply to modern day programming. The skills one derives from prompting an LLM...don't translate to anything whatsoever. It's not just me saying this: the studies are out there.\n\nhttps://www.pnas.org/doi/10.1073/pnas.2422633122\nhttps://dl.acm.org/doi/epdf/10.1145/3632620.3671116\n\nAnyway...you keep doing you. It would just be nice if you stop giving such shortsighted advice to others.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "(edited) 3mo", "posted_at_approx": true, "text": "Lars Faye You don't prompt LLM.  If you only prompts, you are doing it wrong.\n\nInput -> process -> output\n\nIf you don't like the output, fix the input.  Same for all computing, same for LLM.  LLM is just computing.\n\nUsing LLM effectively is more like crafting SQL and the DB schema than talking to another human. There is no intelligence in AI.  It is just how you organize information", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Lars Faye", "profile_url": "https://www.linkedin.com/in/larsfaye/", "headline": "B2B Full Stack // Technical Director // Coding Mentor"}, "is_author_reply": false, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Horace Chan Now you're just playing with semantics and phrasing to obfuscate the underlying message. I'm fully educated and experienced on how to work with these autoregressive statistical machine learning next token predictors. And I've written extensively about them.\n\nhttps://larsfaye.com/articles/agentic-coding-is-a-trap\nhttps://cheewebdevelopment.com/dont-vibe-code-delegate-responsible-development-with-llms/", "likes": 2, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-07-21T23:29:00+00:00", "posted_at_hint": "3mo", "posted_at_appr
