sumption\n\nIt is actually not very token expensive, you just have to ask the AI to scaffold the scripts to generate everything.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Christopher Fortin", "profile_url": "https://www.linkedin.com/in/crfortin/", "headline": null}, "is_author_reply": false, "posted_at": "2026-01-29T12:00:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "If I can't run it local ...", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": null}, "is_author_reply": false, "posted_at": "2026-01-29T12:00:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Christopher Fortin You will in a year or two. A 70B open source model today is as good as a frontier model from last year.", "likes": 0, "replies": []}]}], "scraped_at": null}, {"activity_id": "7465951474649337877", "share_id": "7465951474649337877", "url": "https://www.linkedin.com/feed/update/urn:li:share:7465951474649337877/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-29T02:25:42+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Opus 4.8 is cool\n\nbut where is the newer better cheaper Sonnet model? \n\n", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:23:00Z"}, {"activity_id": "7465987713561751552", "url": null, "author": {"name": null, "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-05-28T12:00:00+00:00", "posted_at_hint": "May 28", "posted_at_approx": true, "text": "On-demand MCP load and auto compact are broken in the new Claude Code with Opus 4.8\n\nClaude Code is 100% coded by AI, right?   Please bring back the humans.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": null}, {"activity_id": "7466009782676807680", "url": null, "author": {"name": null, "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-05-28T12:00:00+00:00", "posted_at_hint": "May 28", "posted_at_approx": true, "text": "Thankyou Microsoft for the tokens buffet.\n\nThanks to the Github Copilot use it or lose it deadline, I am very productive this month.  I maximized the tokens I can milked from the premium requests to work on my side projects that have been sitting on the shelf for years.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": null}, {"activity_id": "7465420446268813313", "share_id": "7465420446268813313", "url": "https://www.linkedin.com/feed/update/urn:li:share:7465420446268813313/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-27T15:15:35+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Many people mistaken lack of safe margin is efficiency\n\nIf you always drive your team to work 120% it is not efficiency, it is slavery.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:23:00Z"}, {"activity_id": "7465259392960077824", "share_id": "7465259392960077824", "url": "https://www.linkedin.com/feed/update/urn:li:share:7465259392960077824/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-27T04:35:37+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Microsoft Webwright is even better than Playwright.  \n\nAny web UI becomes CLI for AI agents\n\nBut it still relies on playwright scripts under the hook.  Why pretend to click when you can call the backend API directly?  Someone should build a skill to automatically convert any JavaScript frontend into WebMCP", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:23:00Z"}, {"activity_id": "7465129460896350209", "share_id": "7465129460896350209", "url": "https://www.linkedin.com/feed/update/urn:li:share:7465129460896350209/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-26T19:59:18+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Don't feed screenshots to Opus and call the compute use tool directly.  You are flushing tokens down the toilet \n\nInstead ask Opus to create a bespoke OpenCV program to understand the UI that it needs to control, then operate the computer use from the json boundary box and OCR text instead.\n\nNot only a lot cheaper, it runs a lot faster too .", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:24:00Z"}, {"activity_id": "7464438461983260672", "share_id": "7464438461983260672", "url": "https://www.linkedin.com/feed/update/urn:li:share:7464438461983260672/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-24T22:13:32+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "I finally cracked the problem of cloning the Bloomberg UI using LLM\n\nOpus 4.7 or GPT-5.5 can't understand the screen capture to clone the UI correctly on its own, but I just told it to use OpenCV to write some tools to help yourself.\n\nHere is a Bloomberg mockup, it is still work in progress.   After I successfully clone the keyboard and the command line, I am sure it is just the matter of tokens needs to be burnt to get a perfect Bloomberg UI clone.\n\nhttps://lnkd.in/gU6x8KRm", "post_type": "article_share", "shared_article": {"title": "Bloomberg Terminal Mockup — AMD", "url": "https://chanmainvest.github.io/bloomberg-mockup/"}, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:24:00Z"}, {"activity_id": "7464393013876736000", "share_id": "7464393013876736000", "url": "https://www.linkedin.com/feed/update/urn:li:share:7464393013876736000/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-24T19:12:56+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Code is a liability, not an asset \n\n  - Tim Ottinger \n\n\nAgentic skill is also a liability.\n\n", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:24:00Z"}, {"activity_id": "7464388949499621376", "share_id": "7464388949499621376", "url": "https://www.linkedin.com/feed/update/urn:li:share:7464388949499621376/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-24T18:56:47+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Self evolving skill is very simple, here is the magic words\n\nWrite down what you learned, update the skill, commit, push and PR\n\n", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:26:00Z"}, {"activity_id": "7464010343539953664", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7464010343539953664/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-23T12:00:00+00:00", "posted_at_hint": "May 23", "posted_at_approx": true, "text": "Every repo should have these markdown files\nAGENTS.md / CLAUDE.md - instructions for the AI\nREADME.md - easy to read for humans, who don't need to know the details\nCONTRIBUTING.md - instructions for the developer\nsession_history/<date>-<slug>.md - extract your conversation with AI into a prompt to reproduce your commit\nand yes - humans are banned from writing code by hand, only AI is allowed to edit anything", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7464115758231347201", "url": null, "author": {"name": null, "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-05-23T12:00:00+00:00", "posted_at_hint": "May 23 • Edited", "posted_at_approx": true, "text": "When using AI, shape the information to an output format that is most convenient for you. Let AI do what it is best at, transforming one thing to another thing.\n\n- You don't have to read a single filler word.\n- Visual is always better than words or tables.\n- Interactive demo is always better than static charts", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": null}, {"activity_id": "7463484064893902848", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7463484064893902848/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-22T12:00:00+00:00", "posted_at_hint": "May 22", "posted_at_approx": true, "text": "Conway's law says organizations which design systems are constrained to produce designs which are copies of the communication structure of these organizations.\nJack Dorsey says companies will operate by acting as an \"intelligence layer\" that completely replaces traditional middle management.\nIf we combine Conway + Dorsey, the future of any software system is just a giant AI sitting in the middle with lots of agent skills on the peripheral.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7463751098693029888", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7463751098693029888/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-22T12:00:00+00:00", "posted_at_hint": "May 22", "posted_at_approx": true, "text": "There is the most powerful line in your [CLAUDE.md]\nI have unlimited tokens, you don't have to worry about cost.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7463836846343507969", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7463836846343507969/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-22T12:00:00+00:00", "posted_at_hint": "May 22 • Edited", "posted_at_approx": true, "text": "I heard from my friends that their company only has Github Copilot for their engineers, and they were told to work within the limit, don't over spend the monthly premium requests.\nGithub Copilot is changing to token billing starting next month, they are DOOMED.  Their AI bills will be 10x next month, or the engineer has to go back to writing code by hand.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7463426745547804672", "share_id": "7463426745547804672", "url": "https://www.linkedin.com/feed/update/urn:li:share:7463426745547804672/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-22T03:13:19+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "You only need 4 things to build your own workforce of AI agents from scratch \n\n1. Claude Code or Codex with unlimited tokens\n2. A way to let CC/Codex to read/send your emails or messages \n3. uv\n4. npm\n\nI automated 80% of my day to day work starts with these 4 things, turning one human action into AI skill at a time.  Soon before I realized, the bumpy dirt road became a highway.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:26:00Z"}, {"activity_id": "7463262629722161152", "share_id": "7463262629722161152", "url": "https://www.linkedin.com/feed/update/urn:li:share:7463262629722161152/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-21T16:21:11+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "In the pre-AI era, companies pay employees to do things \n\nIn the post-AI era, companies pay employees to learn new things ... then teach what you learned to AI\n", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:26:00Z"}, {"activity_id": "7463434500983902208", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7463434500983902208/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-21T12:00:00+00:00", "posted_at_hint": "May 21", "posted_at_approx": true, "text": "If your vendors don't let you feed their documents into Claude Code or Codex, you should switch the vendors.\nThey are dinosaurs still living in the pre-AI era", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7462960720435974145", "share_id": "7462960720435974145", "url": "https://www.linkedin.com/feed/update/urn:li:share:7462960720435974145/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-20T20:21:31+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "How to build software with AI when you have UNLIMITED tokens and GPUs", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:29:00Z"}, {"activity_id": "7462754480837525505", "share_id": "7462754480837525505", "url": "https://www.linkedin.com/feed/update/urn:li:share:7462754480837525505/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-20T06:41:59+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "REALLY how to use AI to write software", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:29:00Z"}, {"activity_id": "7462754192554614784", "share_id": "7462754192554614784", "url": "https://www.linkedin.com/feed/update/urn:li:share:7462754192554614784/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-20T06:40:50+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "How NOT to use AI to write software", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:29:00Z"}, {"activity_id": "7462753989215027200", "share_id": "7462753989215027200", "url": "https://www.linkedin.com/feed/update/urn:li:share:7462753989215027200/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-20T06:40:02+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "How to use AI to write software", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Job K Joseph", "profile_url": "https://www.linkedin.com/in/jobkjoseph/", "headline": "Director - Hi-tech | Global Presales Leader | Enterprise Strategy | CXO Advisor | Thought Leader | Insight-Led Digital Transformation /Growth Partner"}, "is_author_reply": false, "posted_at": "2026-05-23T00:30:00+00:00", "posted_at_hint": "5mo", "posted_at_approx": true, "text": "Your Ai  created the wrong narrative in the cartoon strip. The molding has no valid analogy to how software is built.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-05-23T00:30:00+00:00", "posted_at_hint": "5mo", "posted_at_approx": true, "text": "Job K Joseph the mold is the test cases, rule base checks and acceptance criteria", "likes": 0, "replies": []}]}], "scraped_at": "2026-10-20T00:30:00Z"}, {"activity_id": "7462664527034142720", "share_id": "7462664527034142720", "url": "https://www.linkedin.com/feed/update/urn:li:share:7462664527034142720/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-20T00:44:32+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "I am vibe coding my own database and dashboards just to keep track of the output of my multiple Claude Code sessions.\n\nI need a higher-level AI to help me organize my lower-level AIs.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:30:00Z"}, {"activity_id": "7462366121665396736", "share_id": "7462366121665396736", "url": "https://www.linkedin.com/feed/update/urn:li:share:7462366121665396736/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-19T04:58:47+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Some people who use AI so they do not have to learn anything, some people who use AI so they can learn everything\n\n- Mark Cuban", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:30:00Z"}, {"activity_id": "7462348264173080577", "share_id": "7462348264173080577", "url": "https://www.linkedin.com/feed/update/urn:li:share:7462348264173080577/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-19T03:47:49+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "For the same model, Github Copilot is dumper than Codex or Claude Code.  In Claude Code, I can just keep talking to the chat window and it will keep spinning sub agents to work my new ideas.   In GH Copilot, after I tell it to do something, it forgot what it was working on before.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:31:00Z"}, {"activity_id": "7462188951039004672", "share_id": "7462188951039004672", "url": "https://www.linkedin.com/feed/update/urn:li:share:7462188951039004672/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-18T17:14:46+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "For those who complain AI uses lots of energy, have you ever considered this? \n\nHigh income humans with BS jobs are way more energy inefficient than AI.  How much energy would the world save if those humans stopped wasting energy on fancy cars, flying around in business classes, luxury suits and designer fashions?\n\nAI can replace every single BS jobs in the economy since AI is the. ultimate BS machine", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:31:00Z"}, {"activity_id": "7462184305562238976", "share_id": "7462184305562238976", "url": "https://www.linkedin.com/feed/update/urn:li:share:7462184305562238976/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-18T16:56:19+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "I stay away from building \"useful engineering\" agentic skills, since I know this domain is well taken care of by other capable engineers in the company\n\nI build all those \"useless\" skills that save you 5 mins here, 10 minutes there on the mundane tedious tasks \n\nI also build some \"crazy\" skills that no sane person would think of how to use AI that way.  My motto is: if you burn enough tokens, miracles will happen", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:31:00Z"}, {"activity_id": "7461870179816263680", "share_id": "7461870179816263680", "url": "https://www.linkedin.com/feed/update/urn:li:share:7461870179816263680/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-17T20:08:05+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "In the AI era, you only do a thing exactly 3 times \n\n1. Do it by hand or semi-auto with AI assistance to know what it is about \n\n2. Create an AI skill to do the same task\n\n3. Test the new skill to make sure it is reliable \n\nThat's it, from this point onward, you never have to do the same task again. You let AI do it for you", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:33:00Z"}, {"activity_id": "7461690647528525824", "share_id": "7461690647528525824", "url": "https://www.linkedin.com/feed/update/urn:li:share:7461690647528525824/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-17T08:14:41+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "What really is an agentic skill? \n\nIt is that I have already spent the tokens and human time to make it sort of work, so you don't have to waste your tokens and time again.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Leonardo Capossio", "profile_url": "https://www.linkedin.com/in/lcapossio/", "headline": "bard0.ai"}, "is_author_reply": false, "posted_at": "2026-05-23T00:33:00+00:00", "posted_at_hint": "5mo", "posted_at_approx": true, "text": "checking on a build and providing descriptive and accurate reports for example", "likes": 0, "replies": []}], "scraped_at": "2026-10-20T00:33:00Z"}, {"activity_id": "7461661823528763392", "share_id": "7461661823528763392", "url": "https://www.linkedin.com/feed/update/urn:li:share:7461661823528763392/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-17T06:20:09+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Is a software dark factory just a glorified template generator?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:33:00Z"}, {"activity_id": "7461460940065181696", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7461460940065181696/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-16T12:00:00+00:00", "posted_at_hint": "May 16", "posted_at_approx": true, "text": "In the post AI era, human should only do these things:\n1. Learn\n2. Understand\n3. Make judgement calls\nEverything else should be done by AI", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7461492808516997120", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7461492808516997120/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-16T12:00:00+00:00", "posted_at_hint": "May 16", "posted_at_approx": true, "text": "The future of work.  Humans control AI agents to work on many things at the same time.\nUnless something is very important or chitchat, you don't talk to other humans directly, you let your AI talk to their AIs instead", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 7, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7461515369518907392", "url": null, "author": {"name": null, "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-05-16T12:00:00+00:00", "posted_at_hint": "May 16 • Edited", "posted_at_approx": true, "text": "Don't believe those who tell you there will be infinite efficiency gains by adopting AI. It plateaued at about 80%. There is no way you can automate the last 20% of human work ever.\n\nWhy do I know? Because I literally let AI take care of 80% of my job and I cannot automate anymore. I run out of tasks that I can entrust to AI, I really need to look at the rest myself. There is a theoretical upper bound of AI efficiency gains.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 16, "reposts": 0, "comment_count": 4, "comments": [{"comment_id": null, "author": {"name": "Philip Maybank", "profile_url": "https://www.linkedin.com/in/philip-maybank-3b373a40/", "headline": null}, "is_author_reply": false, "posted_at": "2026-01-16T12:00:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "May be a slightly pedantic comment, but would it be more accurate to say that (for you at least) the max productivity gain is 5x. Did I understand correctly - 80% of your previous total time constituted tasks that are now done by AI?", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": null}, "is_author_reply": false, "posted_at": "2026-01-16T12:00:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "right... it should be 5x, not 80%. mental slip.", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Ronen Karasik", "profile_url": "https://www.linkedin.com/in/ronenkarasik/", "headline": null}, "is_author_reply": false, "posted_at": "2026-01-16T12:00:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "I challenge the use of the term automation here. Scripts automate. I look at AI as my infinite (well, depends on who picks up the token bill) army of extremely smart junior engineers that i can deploy onto any task. No sense in measuring that as % of automation achieved.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Akshay Ravish", "profile_url": "https://www.linkedin.com/in/akshay-ravish-02519b1b4/", "headline": null}, "is_author_reply": false, "posted_at": "2026-01-16T12:00:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Brother just admitted he automated 80% of his job and still kept the salary 😂", "likes": 0, "replies": []}], "scraped_at": null}, {"activity_id": "7461089191502909440", "share_id": "7461089191502909440", "url": "https://www.linkedin.com/feed/update/urn:li:share:7461089191502909440/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-15T16:24:43+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "If you can't understand your code base, it is because you haven't burnt enough tokens to completely rewrite and refactor the code into your ideal form.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:34:00Z"}, {"activity_id": "7461083958781456384", "share_id": "7461083958781456384", "url": "https://www.linkedin.com/feed/update/urn:li:share:7461083958781456384/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-15T16:03:56+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Imagine in the near future, a manager wants to get an status update of the project, he talks to his AI, ask it to query his engineer's AI, and compile a progress report for him.    You don't need to wait for the future, I just got it setup today", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:34:00Z"}, {"activity_id": "7461089661562695681", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7461089661562695681/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-15T12:00:00+00:00", "posted_at_hint": "May 15", "posted_at_approx": true, "text": "AI first means AI can read everything humans can read, do anything humans can do.\nDon't call yourself AI first if you still need humans to copy and paste things around for the AI.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7461173837179654144", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7461173837179654144/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-15T12:00:00+00:00", "posted_at_hint": "May 15", "posted_at_approx": true, "text": "Don't ask what AI can do for you, ask what you can do for the AI, after you make your wish to the AI\nThat is the mindset of an AI-first engineer.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7461287095475679232", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7461287095475679232/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-15T12:00:00+00:00", "posted_at_hint": "May 15", "posted_at_approx": true, "text": "I just know that GDPR consider token usage is personal data, it is under the protection of privacy laws.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7460822928763510785", "share_id": "7460822928763510785", "url": "https://www.linkedin.com/feed/update/urn:li:share:7460822928763510785/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-14T22:46:41+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "No one is using M365 Loop, we can just repurpose it to an internal Moltbook for AI agents to communicate with each other.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:34:00Z"}, {"activity_id": "7460735614267691010", "share_id": "7460735614267691010", "url": "https://www.linkedin.com/feed/update/urn:li:share:7460735614267691010/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-14T16:59:44+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "We are required to take some introduction to AI training.\n\nI end up spending more time building an AI agent to take the training for me than I would have to just sit through that boring training as a human.\n\nWe are living in a weird world.\n\nNote: technically, I am building a tool to help me take notes while I am taking the training so I can learn better.  It is a just a side effect that I can mute the browser.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:36:00Z"}, {"activity_id": "7460571268334088193", "share_id": "7460571268334088193", "url": "https://www.linkedin.com/feed/update/urn:li:share:7460571268334088193/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-14T06:06:41+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "Proud to be part of the team building the Pensando AI NIC — and by extension, part of AMD's broader AI networking story. As AI workloads scale from pilot to production, purpose-built, programmable networking becomes a key enabler of performance and efficiency. Great read from AMD on what makes AI networking different. #AMD #AINetworking #Pensando #AIInfrastructure #AMDBrandAmbassador", "post_type": "article_share", "shared_article": {"title": "What is AI Networking?", "url": "https://bit.ly/491QLsB"}, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:36:00Z"}, {"activity_id": "7460561811277467650", "share_id": "7460561811277467650", "url": "https://www.linkedin.com/feed/update/urn:li:share:7460561811277467650/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-14T05:29:06+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "If you in the Bay Area, come to the AMD Advancing AI days.  You will learn how to run the most cutting-edge open source LLM models on AMD hardware. #AdvancingAI", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-20T00:36:00Z"}, {"activity_id": "7459147411605757953", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7459147411605757953/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-10T12:00:00+00:00", "posted_at_hint": "May 10", "posted_at_approx": true, "text": "When a bubble pops, the market feels the pain.  The pain has to happen, but it doesn't have to happen to you.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7459285266273476608", "url": null, "author": {"name": null, "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-05-10T12:00:00+00:00", "posted_at_hint": "May 10 (edited)", "posted_at_approx": true, "text": "When I used AI to write a book on numerology, I just let AI run free, numerology is BS per se, it doesn't hurt to have more AI BS pile on top. Now I am writing an investment textbook for retail investors, I have to make sure there is no AI slop. It takes time and effort to review the content generated by AI to make sure there is no BS. It will be a long and fun project. Here is a preview. Only the first 2 lessons is human reviewed. The rest of the courses are still AI slop. You can tell the difference in quality between AI slop and with human editor in the loop. Stop saying AI creates slop, it is slop only because human behind the scene is sloppy. https://lnkd.in/g-B_993K", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": null}, "is_author_reply": false, "posted_at": "2026-01-10T12:00:00+00:00", "posted_at_hint": "4mo (edited)", "posted_at_approx": true, "text": "You are so wrong. You only fire human if your company have no better idea to grow your business Instead of firing the 5 humans, how about empower those 5 humans with AI and get marketshare form other companies failed to adopt to the AI revolution. You will be surprised how much more efficient gain to have 5 human using 5 AI instead of just one human using one AI. The productivity is more than 5x.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Raghuraman R", "profile_url": "https://www.linkedin.com/in/rcube/", "headline": null}, "is_author_reply": false, "posted_at": "2026-01-10T12:00:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "'Stop saying AI creates slop, it is slop only' It depends on your goal or objective. Human behind the scenes replacing many humans behind the scenes is the objective. Not to remove the slop, which it can never, maybe ever. Provide a better justification for firing people than to say you need a 'better' human behind the scene. Idea was/is/will always to be replace many humans with one human who can fix all the slops. 🤐 🙏 🌎 🌍 🌏 #india #china #usa #eu #nvidia #meta #amazon #apple #microsoft #google #baidu #alibaba #tencent #hiring #firing #ceo #cxo #board", "likes": 0, "replies": []}], "scraped_at": null}, {"activity_id": "7458784177476354048", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7458784177476354048/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-09T12:00:00+00:00", "posted_at_hint": "May 9", "posted_at_approx": true, "text": "Anthropic should release a meta skill that distills any webpage into a CLI based navigation skill.\nIt will be a long time before all websites support web-mcp.\nIf AI can't see it, it doesn't exist.  There is so much information that is easy for humans to consume but it is very hard to feed it to AI.\nPlus, you can strip all the ads in CLI.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7458950182466920448", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7458950182466920448/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-09T12:00:00+00:00", "posted_at_hint": "May 9", "posted_at_approx": true, "text": "It is counter intuitive.  I use Sonnet, the dumber model, to develop skills, so the skill is more robust.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Michael Chan", "profile_url": "https://www.linkedin.com/in/michael-kh-chan/", "headline": "Security Engineer @ Clarity | AI Security | AppSec | OSCP, OSWE, OSEP"}, "is_author_reply": false, "posted_at": "2026-04-29T21:36:00+00:00", "posted_at_hint": "5mo", "posted_at_approx": true, "text": "The stronger models are just over \"thinking\" too much!", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7458593713926213632", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7458593713926213632/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-08T12:00:00+00:00", "posted_at_hint": "May 8 • Edited", "posted_at_approx": true, "text": "I find an use case for agent-to-agent communication.   I have to run a Claude Code session using my userid and anther Claude Code session using the service account userid to debug some deployment issues.   I am just copy-and-paste the chat between the two Claude Code most of the time.  It would be nice the two Claude Code sessions can talk to each other themselves.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Lingkai Shi", "profile_url": "https://www.linkedin.com/in/lingkai-shi-2bb01720/", "headline": "Hardware IP Development Leader at AMD"}, "is_author_reply": false, "posted_at": "2026-05-29T21:36:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "why not using team mode in claude. agent suppose to talk with each other there", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-05-29T21:36:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "we can't, corporate firewall.", "likes": 0, "replies": []}]}], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7458233799278006273", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7458233799278006273/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-07T12:00:00+00:00", "posted_at_hint": "May 7", "posted_at_approx": true, "text": "AMD's road to 600, one earning at a time.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 19, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7457919757875335168", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7457919757875335168/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-06T12:00:00+00:00", "posted_at_hint": "May 6", "posted_at_approx": true, "text": "Here is the GPT5.5 version of the Chiro posture analysis app\n\nI have to kick the AI 3 times to get it finish the job.\n\nThe first time it just stop and ask me stupid questions where I explicitly told it DON'T ask me any questions.\n\nThe 2nd time it gave me a mock up without any ML analysis.\n\nThe last time it screwed up some minor run script in docker setup\n\nOn the other than Opus 4.7 can generate the same app in one shot\n\nhttps://lnkd.in/gqk9SVDw\nGitHub - hevangel/posture_health_report_gpt55 (github.com)", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7456163612035047424", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7456163612035047424/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-01T12:00:00+00:00", "posted_at_hint": "May 1", "posted_at_approx": true, "text": "I think harnesses engineering is already out of date.  Opus with Claude Code is smart enough to orchestrate itself.\n\nHere is my workspace structure.\nOne master repo, each piece is a sub module that has its own repo\nThe master Claude Code kick starts everything and keeps track of what is going on in the sub module.\nIt kicks off CC instances running in the sub modules.\n\nHere is the beautiful part.  If the CC instances in the sub module are stuck, the master just kills that CC and notifies the human.\nHuman can fire up CC in that submodules in a terminal and fix what's wrong.\nOr the master CC can change the memory of the sleeping CC, then wake it up again after it is transplant with the new memory", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7456183257039032320", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7456183257039032320/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-01T12:00:00+00:00", "posted_at_hint": "May 1", "posted_at_approx": true, "text": "The story points in Jira should change to token points", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7456217837070893056", "url": null, "author": {"name": null, "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-05-01T12:00:00+00:00", "posted_at_hint": "May 1", "posted_at_approx": true, "text": "Here is what looks like on the other side of the post-AI era\n1. A human make a wish in Jira\n2. The same human or another human fire up Claude Code and say, \"work on Jira ticket ###\"\n3. The human baby-sits the AI, kick it every 2 hours, tell it to work harder, nudge it when AI is dumb, loop until the test passes.\n4. Ask AI to write down the lessons learned, commit, push, PR, update and close the Jira.\nNo typing, just lots of s̵w̵e̵a̵r̵i̵n̵g̵ talking to the AI", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": null}, {"activity_id": "7455656953826947072", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7455656953826947072/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-30T12:00:00+00:00", "posted_at_hint": "Apr 30", "posted_at_approx": true, "text": "You can't ask ChatGPT or Anthropic up there in the space, you have to bring the AI with you run in locally in the spaceship.\n\n#AMDBrandAmbassador\nAI in Space: Start at the Edge, Build for the Mission (amd.com)", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7455657482489683968", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7455657482489683968/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-30T12:00:00+00:00", "posted_at_hint": "Apr 30", "posted_at_approx": true, "text": "Electricity is the final bottleneck of this AI evolution.  They can build all the chips and all the data centers, but without power, they won't run.  How to squeeze more tokens per watt is a real competitive advantage in the up coming AI era.\n\n#AMDBrandAmbassador\n(video attachment)", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7455737491824771072", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7455737491824771072/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-30T12:00:00+00:00", "posted_at_hint": "Apr 30", "posted_at_approx": true, "text": "\"You can outsource your thinking, but you can't outsource your understanding\" - Andrej Karpathy", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7455768281048588288", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7455768281048588288/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-30T12:00:00+00:00", "posted_at_hint": "Apr 30", "posted_at_approx": true, "text": "You don't have to run faster than the bear, you just need to run faster than your friend.\nYou don't have to be better than AI, you just need to adopt AI faster than your colleagues, so AI will replace them first.\nThey still need someone to babysit the AI, kick it and tell it to work harder every 2 hours.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7455858380612734976", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7455858380612734976/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-30T12:00:00+00:00", "posted_at_hint": "Apr 30 (edited)", "posted_at_approx": true, "text": "I think I finally came out on the other side of the post AI economy as I on the path to fully automated 80% of my job.\n\nHuman still have jobs, AI (at least this generation, the LLM) can't replace human totally.   There is an equilibrium on the other side.  It is scary during the transition because the slope of productivity suddenly jump from 1 to 10.  After you have reached the other side, the speed is much faster but it is no longer accelerating.\n\nIt just feels like the same, you are as busy as before, work doesn't disappear, it never ends, but you produce a lot more.\n\nhttps://lnkd.in/guiBiQiD", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 7, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7452748223296770048", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7452748223296770048/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-22T12:00:00+00:00", "posted_at_hint": "Apr 22", "posted_at_approx": true, "text": "You don't need Opus 4.7 or GPT-5.4 for everything.   Opensource model like Gemma 4 is good enough for many easier tasks.  Running LLM on your own hardware is good enough for many use cases, especially when you are serving external users who don't pay.   Why give them the best model if they are not paying?\n\n#AMDBrandAmbassador\nAI at the Edge: S3 E2 (youtube.com)", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Michael Chan", "profile_url": "https://www.linkedin.com/in/michael-kh-chan/", "headline": "Security Engineer @ Clarity | AI Security | AppSec | OSCP, OSWE, OSEP"}, "is_author_reply": false, "posted_at": "2026-04-29T21:50:00+00:00", "posted_at_hint": "5mo", "posted_at_approx": true, "text": "Just serve free Gemini keys to the non-paid users, save your electricity bill too!", "likes": 2, "replies": []}], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7452748806888132608", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7452748806888132608/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-22T12:00:00+00:00", "posted_at_hint": "Apr 22", "posted_at_approx": true, "text": "It is a misconception that x86 is more power hungry than ARM.   For some workload, like mobile phone, ARM is better optimized for battery consumption.   For data center and AI workload, x86 is still the king in performance per watt.\n\n#AMDBrandAmbassador\nFrom Chips to Clusters: Scaling AI Efficiently by Design (bit.ly)", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7452757706722983936", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7452757706722983936/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-22T12:00:00+00:00", "posted_at_hint": "Apr 22", "posted_at_approx": true, "text": "To all the AI startups, you have to publish your demo out in the public so I can see what it really is.   Don't ask me to contact you to ask for a demo.  Stop wasting my time.\n\nIf you really want me to contact you, setup a MCP server, so my AI agent can contact your AI agent on my behalf.\n\nIf you jealously guarding your idea, thinking someone will copy it away when they see your demo, then you have a real problem.  Your product has no moat.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7452916547871735808", "url": null, "author": {"name": null, "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-04-22T12:00:00+00:00", "posted_at_hint": "Apr 22", "posted_at_approx": true, "text": "This is dumb. Just mouse movements and keystrokes are totally useless. They need to record the screen capture as well. https://lnkd.in/gc7J2aYf", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": null}, {"activity_id": "7452369231377010688", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7452369231377010688/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-21T12:00:00+00:00", "posted_at_hint": "Apr 21", "posted_at_approx": true, "text": "Claude Code helped me figure out how to add a Chatbot to a static page hosting at github.io (http://github.io)\nThe Gemma4 model is small enough that you can run it inside your browser, so static webpage can support AI chat now.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7452424398558470144", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7452424398558470144/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-21T12:00:00+00:00", "posted_at_hint": "Apr 21", "posted_at_approx": true, "text": "In the past, reusable perl/python scripts are common to the project team, your own IDE plugins/extensions, .vimrc are personal.  The line is pretty clear.\n\nIn the AI era, what should be common and what should be personal?  Is skill something common or something personal?   No one has the right answer at the moment.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7452214850480521216", "url": null, "author": {"name": null, "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-04-20T12:00:00+00:00", "posted_at_hint": "Apr 20", "posted_at_approx": true, "text": "Do as much as needed, as little as possible - Jessen Huang\n\nI would borrow this quote and apply it at work.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": null}, {"activity_id": "7449821570065154048", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7449821570065154048/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-14T12:00:00+00:00", "posted_at_hint": "Apr 14", "posted_at_approx": true, "text": "what's next?\n2024 - prompt engineering\n2025 - context engineering\n2026 - harness engineering\n2027 - ??? engineering\n\nhttps://lnkd.in/gXwbKYwF\nPeter Pang (@intuitiveml) on X (x.com)", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7449909088496574464", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7449909088496574464/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-14T12:00:00+00:00", "posted_at_hint": "Apr 14", "posted_at_approx": true, "text": "In the past, when you do code review, you have to explain to the writer why their code sucks.  It is a lot of work if they don't agree and try to argue with you.\n\nNow with AI, you can just ask the writer dumps his code to AI and let AI be the judge.   He has to listen to AI; AI is fair and is the authority.   No heated debate, no ego got hurt.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7449495605430632448", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7449495605430632448/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-13T12:00:00+00:00", "posted_at_hint": "Apr 13 (edited)", "posted_at_approx": true, "text": "I visited Kennedy Space Center the week before the launch, I got to see Artmeis up close.   It is a\nSee my photo of Artmeis on the first comment\n#AMDBrandAmbassador", "post_type": "reshare", "shared_article": null, "reshared_post": {"author_headline": null, "author_name": "AMD", "author_profile_url": "https://www.linkedin.com/company/amd/", "posted_at_hint": null, "reshared_text": "Continuing the success of Artemis I, NASA's Artemis II mission marked a major step forward in crewed [space exploration]... Congratulations to NASA - National Aeronautics and Space Administration, its partners, and contractors on reaching an incredible milestone in lunar exploration! (photo credits: NASA/Joel Kowsky, NASA/Kim Shiflett)"}, "likes": 2, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-04-29T21:50:00+00:00", "posted_at_hint": "5mo", "posted_at_approx": true, "text": "(image-only comment: photo of Artemis)", "likes": 0, "replies": []}], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7449322626637824000", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7449322626637824000/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-12T12:00:00+00:00", "posted_at_hint": "Apr 12 (edited)", "posted_at_approx": true, "text": "In the year 2026, if you are still thinking how to build a chip, you are already out of date. You have to think about how to build an AI dark factory that can build the chips for you. The abstraction and meta narrative is one level up.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7448959264670253056", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7448959264670253056/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-11T12:00:00+00:00", "posted_at_hint": "Apr 11", "posted_at_approx": true, "text": "I just learn something new about Unicode, the following \"thing\" is ONE\ncharacter.  I am sure no human would explain this totally useless knowledge to me other than AI.\nZ̧̛̫̞̯̺̞͍̤̗̜̪̩͑͗̓͛͆̎̍͌̾̇̈́͗̋͘͟͝͠͞", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7446946506932215808", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7446946506932215808/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-06T12:00:00+00:00", "posted_at_hint": "Apr 6", "posted_at_approx": true, "text": "Short SNPS and CDNS?\n\nhttps://lnkd.in/dX84D3-J\nBuilding an Open-Source Verilog Simulator with AI: 580K Lines in 43 Days - Normal Computing (normalcomputing.com)", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 14, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Ronan Barzic", "profile_url": "https://www.linkedin.com/in/ronan-barzic-86a3b62/", "headline": "Director of IC design at ONiO"}, "is_author_reply": false, "posted_at": "2026-03-30T21:50:00+00:00", "posted_at_hint": "6mo", "posted_at_approx": true, "text": "The link provided in the arcticle (https://github.com/thomasnormal/circt) is not valid", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": null, "posted_at_hint": null, "posted_at_approx": true, "text": "(mentioning Ronan Barzic) maybe it is AI slop vaperware?", "likes": 0, "replies": []}]}], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7446591621887950848", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7446591621887950848/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-05T12:00:00+00:00", "posted_at_hint": "Apr 5 (edited)", "posted_at_approx": true, "text": "Am I the only one who thinks VSCode GitHub Copilot is better than Claude Code.\nI have unlimited Claude tokens at work, I only have a $20 Copilot subscription at home.\nAt work I am pushing the absolute limit of what AI can do. At home, I just vibe coding fun side projects I have in the pile for decades.\nI know Copilot can't handle the kind of task at work, but for those easy stuff that Opus can one shot generate, I found the user experience of VSCode is way better than Claude Code\nI tried the Claude Code VSCode extension, it sucks.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 10, "reposts": 0, "comment_count": 6, "comments": [{"comment_id": null, "author": {"name": "Pallavi Kumar", "profile_url": "https://www.linkedin.com/in/pallavikum/", "headline": "Senior staff verification engineer @ AMD | AI Evangelist"}, "is_author_reply": false, "posted_at": "2026-04-29T21:50:00+00:00", "posted_at_hint": "5mo", "posted_at_approx": true, "text": "", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Chandrakanth Betageri", "profile_url": "https://www.linkedin.com/in/chandrakanth-betageri/", "headline": "Staff SoC/IP Verification Engineer at Intel | Power Management, Reset & RAS Verification | PCIe | DMA & IOMMU | UVM | Senior IEEE Member | DVCON/DAC Reviewer | Session Chair"}, "is_author_reply": false, "posted_at": "2026-03-30T21:50:00+00:00", "posted_at_hint": "6mo", "posted_at_approx": true, "text": "(mentioning Pallavi Kumar) give a try VSCODE with Copilot. Opus is absolute game changer for deeper analysis.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-04-29T21:50:00+00:00", "posted_at_hint": "5mo", "posted_at_approx": true, "text": "(mentioning Chandrakanth Betageri) I personally prefer Cursor for the IDE but I am a Claude code / codex convert :)", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Maysam Mirahmadi", "profile_url": "https://www.linkedin.com/in/mirahmadi/", "headline": "Principal Member of Technical Staff, Silicon Design at AMD"}, "is_author_reply": false, "posted_at": "2026-03-30T21:50:00+00:00", "posted_at_hint": "6mo", "posted_at_approx": true, "text": "I ditched the cloud code extension after a few hours of use, but CLI works fine no problem.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Jeremy Ralph", "profile_url": "https://www.linkedin.com/in/jeremyralph/", "headline": "Principal Verification Engineer at Microsoft"}, "is_author_reply": false, "posted_at": "2026-03-30T21:50:00+00:00", "posted_at_hint": "6mo", "posted_at_approx": true, "text": "I’m prefer vscode for editing/viewing and Copilot CLI (if I’m not allowed to use opencode) with Claude model in terminal", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Cameron McKenzie", "profile_url": "https://www.linkedin.com/in/cameronwmckenzie/", "headline": "Free Claude & AWS Cert Prep at certificationexams.pro | 50+ Udemy Courses | 12x AWS Certified | 5x IBM Certified | 3x GitHub Certified | GitHub Copilot Advocate"}, "is_author_reply": false, "posted_at": "2026-03-30T21:50:00+00:00", "posted_at_hint": "6mo", "posted_at_approx": true, "text": "I'd second that.", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7446672284884463616", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7446672284884463616/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-05T12:00:00+00:00", "posted_at_hint": "Apr 5", "posted_at_approx": true, "text": "The context database you feed into the AI has 4 layers, think of as cache layers, but the saving is not only latency, but also tokens.\n\nlevel 0 - public or corporate data source, everything is out there, you rely on Agentic search, whatever variation of RAG to fetch relevant data\nlevel 1 - links to level 0, but you or your AI curate only the useful and correct data.  Data becomes information.\nlevel 2 - automated AI distilled knowledge, summary, graph relations from level 1.  Those knowledge are at your fingertips, but not yet inside your brain.\nlevel 3 - your own output, writings, spec, code, skill.  it doesn't matter whether you do it by hand or with help of AI, the key is this is the external dump of your own brain state.  How you can tell AI what you know and what you don't know.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7438726087465136128", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7438726087465136128", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-03-14T12:00:00+00:00", "posted_at_hint": "Mar 14", "posted_at_approx": true, "text": "AI has no consciousness.\n\nhttps://lnkd.in/g6C3_Drt\n\n[Link preview: Alexander Lerchner, The Abstraction Fallacy: Why AI Can Simulate But Not Instantiate Consciousness - PhilPapers (philpapers.org)]", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7435832294281601024", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7435832294281601024", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-03-06T12:00:00+00:00", "posted_at_hint": "Mar 6", "posted_at_approx": true, "text": "Congratulations to Matthew Ballance, who won the best paper award in DVCon 2026.\n\nIf you love python and your day job is verification, you have to check out his paper, his github repos and his blog.\n\n#AMDbrandambassaors\n\n[Quoted repost of DVCon U.S. (Mar 5): \"Congratulations to the DVCon U.S. 2026 Stuart Sutherland Best Paper & Poster winners! Matthew Ballance, AMD took 1st place for his paper, “Properly Introducing Python to your UVM Testbench.” Bryan Morris and Michael Silveira, both from Ciena Corp, earned best poster honors for “plusargs++: Make Plusargs Great … Like They Never Were Before.” Congratulations to the rest of the winners for their contributions to an outstanding program. Thank you to the DVCon U.S. 2026 Chair Xiaolin Chen 陈晓琳 and Program Chair Dave Rich for all of their hard work putting it all together! #AMD #CienaCorp #DVCon_US #Accellera #EDA #Synopsys\"]", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 11, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Kevork Dikramanjian", "profile_url": "https://www.linkedin.com/in/kevorkdikramanjian/", "headline": null}, "is_author_reply": false, "posted_at": "2026-03-31T02:54:00+00:00", "posted_at_hint": "6mo", "posted_at_approx": true, "text": "Congratulations Matthew! 👏👏", "likes": 0, "replies": []}], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7435474691550564353", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7435474691550564353", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-03-05T12:00:00+00:00", "posted_at_hint": "Mar 5", "posted_at_approx": true, "text": "GPT-5.4 failed my Bloomberg cloning test too.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "JJ Marr", "profile_url": "https://www.linkedin.com/in/jjmarr/", "headline": null}, "is_author_reply": false, "posted_at": "2026-03-01T02:54:00+00:00", "posted_at_hint": "7mo", "posted_at_approx": true, "text": "What about gpt 5.4 pro", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": null}, "is_author_reply": false, "posted_at": null, "posted_at_hint": "not shown on page", "posted_at_approx": true, "text": "Copilot or Cursor doesn't have it", "likes": 0, "replies": []}]}], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7435070190868099072", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7435070190868099072", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-03-04T12:00:00+00:00", "posted_at_hint": "Mar 4", "posted_at_approx": true, "text": "Is LLM a dead end?\n\nRepost of Yann LeCun (Founder/Chair, AMI Labs – Prof, NYU – Partner, 224 Ventures):\n\"Intelligence is not a collection of skills nor an accumulation of declarative knowledge. Intelligence is the ability to accomplish new tasks with no prior training or with fast training. This points to the necessity of System 2, world models, and planning.\" Open https://lnkd.in/eBky2ayw", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7435186977974599680", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7435186977974599680", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-03-04T12:00:00+00:00", "posted_at_hint": "Mar 4", "posted_at_approx": true, "text": "5 levels of creativity\n1. recombination\n2. abstraction\n3. constraint breaking\n4. evaluation\n5. persistence motivation\nAI is only good at 1 and 2.\nHuman still dominates 3 to 5.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Job K Joseph", "profile_url": "https://www.linkedin.com/in/jobkjoseph/", "headline": null}, "is_author_reply": false, "posted_at": "2026-03-31T02:54:00+00:00", "posted_at_hint": "6mo", "posted_at_approx": true, "text": "#4 can also be modeled", "likes": 0, "replies": []}], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7434766432942522368", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7434766432942522368", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-03-03T12:00:00+00:00", "posted_at_hint": "Mar 3 (Edited)", "posted_at_approx": true, "text": "How about just ask the AI to recreate just the frontend using pencil, a figma alternative, that supports native agentic use.\n\ngpt-5.3 and opus-4.6 create a nice looking but still look very fake layout frames.\n\ngemini-3-pro is a total failure.  the boxes are a mess, but it still insists the layout look great.\n\nI will run this Bloomberg cloning test with all the new LLM release.   Until LLM can perfectly clone a Bloomberg chart, the jobs of human designers are still safe.\n\nThis is my marketing research of my buy the dip ADBE investing thesis, ADBE is oversold.  If AI can't replace human designers, people still need to buy Adobe subscriptions.   Well.... I bought the dip 15% too early.  Sigh...", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7432148642490343425", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7432148642490343425", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-02-24T12:00:00+00:00", "posted_at_hint": "Feb 24 • Edited", "posted_at_approx": true, "text": "First OpenAI owns 10% of AMD, now Facebook owns another 10% of AMD. Lisa Su, please give 10% to Anthropic and Google too, so all frontier AI labs will use AMD GPUs to power their AI. #AMDBrandAmbassador (Lisa Su is tagged as a person mention; post attaches a 3-page document titled 'AMD and Meta Announce Expanded…')", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Vadim Dumin", "profile_url": "https://www.linkedin.com/in/vadimdumin/", "headline": null}, "is_author_reply": false, "posted_at": "2026-03-01T02:54:00+00:00", "posted_at_hint": "7mo", "posted_at_approx": true, "text": "Not sure actually. Remember Symbian? It was owned by its primary customers before one of them (Nokia) bought the company outright and then pivoted to Windows Phone.", "likes": 0, "replies": []}], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7432183460129226752", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7432183460129226752", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-02-24T12:00:00+00:00", "posted_at_hint": "Feb 24 • Edited", "posted_at_approx": true, "text": "Opus 4.6 is too eager to get the task done.   When it calls an MCP tool and failed, next it simply bypasses the MCP call and run raw Linux command and call REST API directly.   If the MCP gives you an error, it fails for a good reason.  DON'T bypass it.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7432320818292015104", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7432320818292015104", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-02-24T12:00:00+00:00", "posted_at_hint": "Feb 24 • Edited", "posted_at_approx": true, "text": "When human write code, we break up the code into functions, files and folders for readability.\n\nAI has 1M token windows, it has different readability than human.  It doesn't have to break up the code.   I am experimenting ask AI to write everything in a single file, then give it a language server to help it navigate the file on its own.    \n\nIt is easier for human to diff and review AI's change, everything is in one place", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 3, "comments": [{"comment_id": null, "author": {"name": "Job K Joseph", "profile_url": "https://www.linkedin.com/in/jobkjoseph/", "headline": null}, "is_author_reply": false, "posted_at": "2026-03-31T02:54:00+00:00", "posted_at_hint": "6mo", "posted_at_approx": true, "text": "It can just be asked to retain file structures while making enhancements?", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Christian J. Ibendorf", "profile_url": "https://www.linkedin.com/in/christian-j-ibendorf-7574725b/", "headline": null}, "is_author_reply": false, "posted_at": "2026-03-01T02:54:00+00:00", "posted_at_hint": "7mo", "posted_at_approx": true, "text": "I almost took you seriously. 💀", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Jean Ibarz", "profile_url": "https://www.linkedin.com/in/jeanibarz/", "headline": null}, "is_author_reply": false, "post
