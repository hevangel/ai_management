: "I am old enough that I experienced the last glimpse of the schematic to RTL migration\nThe RTL to agentic AI whatever thing migration is as scary as the schematic to RTL migration back then.\nBut when you look back a decade from now, what sounds ridiculous today will be just common sense in the industry tomorrow", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7517271917985415168", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7517271917985415168/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-17T18:05:00+00:00", "posted_at_hint": "14h", "posted_at_approx": true, "text": "The questions and answers interface in Claude Code and Codex has very bad UX.\nIt prompts me to answer a list of multiple-choice questions expecting me to give it an answer right away without knowing the context around those questions. It is built to expect the user read the wall of text prior to those questions. NO ONE read the wall of text in Claud Code and Codex chat session.\nThere is an easy UX fix, give me a btw side chat in the Q&A, so I can get myself up to speed before give AI the answer.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Sohan Talukder", "profile_url": "https://www.linkedin.com/in/sohan-talukder/", "headline": "UI/UX Product Designer || Trusted by 100+ Clients in 21+ Countries to Design Apps, Website and product || Our Y Combinator client has generated multi-million dollar revenue || Ping me for RFPs."}, "is_author_reply": false, "posted_at": "2026-10-17T18:05:00+00:00", "posted_at_hint": "14h", "posted_at_approx": true, "text": "Most users skim, so expecting them to absorb dense text is a design flaw. A dynamic Q&A chat could be a lifeline, offering context when needed, not just in a block of text.", "likes": 1, "replies": []}], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7517260562330902529", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7517260562330902529/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-17T17:05:00+00:00", "posted_at_hint": "15h", "posted_at_approx": true, "text": "I can't keep up with my hobby projects built by AI.\nI am not saying that I can't keep up reviewing the code, I gave that up a while back\nI am saying that I don't spend enough time to play with and enjoy the stuffs AI builds.\nIt is hobby projects, if I merely generate more code but not having any fun, what is the point?\nIt is the equivalent of keep buying new toys, but never have time to unbox the toys and play with them.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7516904447172829184", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7516904447172829184/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-17T08:05:00+00:00", "posted_at_hint": "1d", "posted_at_approx": true, "text": "poteto, poteto, poteto.\nI am campaigning to get poteto as a guest speaker to my company thru our Cursor connection.", "post_type": "article_share", "shared_article": {"title": "LIVE: Poteto (creator of pstack) on shipping 1,000's of PR's a month at SpaceX", "url": "https://www.youtube.com/watch?v=MN9dGgmLyso"}, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7516991542704889856", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7516991542704889856/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-17T08:05:00+00:00", "posted_at_hint": "1d", "posted_at_approx": true, "text": "I am not a good manager. I cannot deal with humans that I don't like to deal with.\nThanks to the help of AI, it helps me deal with humans I don't like to deal with. So I have more time with the tech and the human I enjoy hanging around.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7517027348538527744", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7517027348538527744/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-17T08:05:00+00:00", "posted_at_hint": "1d", "posted_at_approx": true, "text": "Codex Desktop (6.1 Sol) is dumb. I asked it to use computer use to debug a problem in my VSCode. It took control of my screen, mouse and keyboard, did some work. Then Codex pops up a question asking me for an answer. How can I answer the question when it has the control of the screen, mouse and keyboard.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Bondan Rufen", "profile_url": "https://www.linkedin.com/in/bondan-rufen/", "headline": "Co-Founder | SystemVerilog, SystemC | Xezim Creator / Maintainer"}, "is_author_reply": false, "posted_at": "2026-10-17T08:05:00+00:00", "posted_at_hint": "1d", "posted_at_approx": true, "text": "you have a microphone.", "likes": 4, "replies": []}], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7516402221450788864", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7516402221450788864/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-15T12:00:00+00:00", "posted_at_hint": "Oct 15", "posted_at_approx": true, "text": "Philosophy journals should judge arguments, not instruments. I have published an open letter asking them to replace blanket AI bans with disclosure requirements — and if you are a philosopher who agrees, signing is simple: comment “I sign” or repost. Full text in the article.", "post_type": "article_share", "shared_article": {"title": "Disclose, Don’t Ban: an open letter to philosophy journals on AI", "url": "https://www.linkedin.com/pulse/disclose-dont-ban-open-letter-philosophy-journals-ai-horace-chan-kkycc/"}, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7516513189333737472", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7516513189333737472/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-15T12:00:00+00:00", "posted_at_hint": "Oct 15", "posted_at_approx": true, "text": "When people complains AI sucks or it is dumb at work, I keep reminding them think of it positively, it means our job is safe for the next while.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Jean CHARBONNEAU", "profile_url": "https://www.linkedin.com/in/jean-charbonneau-ai/", "headline": "AI Systems, Ontology and Ethics Expert | Creator of The Hologram of Light | Knowledge Graphs Specialist"}, "is_author_reply": false, "posted_at": "2026-10-16T08:05:00+00:00", "posted_at_hint": "2d", "posted_at_approx": true, "text": "It's often misuse though, tbh 😅", "likes": 1, "replies": []}], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7516564713737220096", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7516564713737220096/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-15T12:00:00+00:00", "posted_at_hint": "Oct 15", "posted_at_approx": true, "text": "An interview candidate said he would like to start after new year, I ask why. He said he wanted to finish the project he is working on before leaving.\nI told him after you have a new job, you should always start ASAP, do the legal minimum hand off, then take the refresh break. You shouldn't worry about your old company, it is NOT your problem any more.\nAnd if for whatever reason, our stock price crashed 50%, given how the tech and wall Street works, the offer is very likely will be withdrawn. Why take the risk?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Alexander Short", "profile_url": "https://www.linkedin.com/in/alexander-short-9126798/", "headline": "IT Director / Infrastruture / Cloud / ERP Implementations / Data"}, "is_author_reply": false, "posted_at": "2026-10-17T08:05:00+00:00", "posted_at_hint": "1d", "posted_at_approx": true, "text": "I’d wonder if there is a completion bonus surrounding that year end project.", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-10-17T08:05:00+00:00", "posted_at_hint": "1d", "posted_at_approx": true, "text": "Alexander Short but the bonus money usually won't come until Q2.\n\nIf it is just year end bonus, the candidate should have just ask for a bigger sign up bonus to make it up", "likes": 0, "replies": []}]}], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7516655579742760960", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7516655579742760960/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-15T12:00:00+00:00", "posted_at_hint": "Oct 15", "posted_at_approx": true, "text": "Helios is built for AI training. Helion is built for agentic workload. They are start with Helio- prefix. I wonder what is the name of the next rack - Heliom? Helioy? Heliot? Heliop? Helioo? #AMDBrandAmbassador", "post_type": "article_share", "shared_article": {"title": "Introducing AMD Helion, Agentic AI Compute at Rack Scale", "url": "https://bit.ly/4s4XhqG"}, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7516056605420085248", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7516056605420085248/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-14T12:00:00+00:00", "posted_at_hint": "Oct 14", "posted_at_approx": true, "text": "I use AI to write a rebuttal of this anti-AI philosophy paper. I submitted my paper to philpapers, I am not sure they will accept it or not, they may think it is just some AI slop from a nobody.\nWith help of AI, philosophy euthenists can write academic philosophy paper on the same level as the philosophy professors. All you need is just good thinking, you don't need good writing anymore.\nFear and Loathing in Silicon Valley: Does AI Threaten our Valuing Practices\nJordan MacKenzie\nhttps://lnkd.in/gyT4mCf9", "post_type": "article_share", "shared_article": {"title": "Fear and Loathing in Silicon Valley: Does AI Threaten our Valuing Practices", "url": "https://lnkd.in/gyT4mCf9"}, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7516231575345221632", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7516231575345221632/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-14T12:00:00+00:00", "posted_at_hint": "Oct 14", "posted_at_approx": true, "text": "I meet with a person working at a tech startup, his company only has Gemini at work. I am horrified, how can a tech company stay competitive if it doesn't have access to a LLM that can code.\nDon't get me wrong, Gemini is very good at certain things, but it is just a waste of time to make Gemini (before the new version) to write production code. You can offload many tasks to open source model or 2nd tier models, but you need to have a frontier model in your back pocket just in case you need it.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 5, "comments": [{"comment_id": null, "author": {"name": "Bondan Rufen", "profile_url": "https://www.linkedin.com/in/bondan-rufen/", "headline": "Co-Founder | SystemVerilog, SystemC | Xezim Creator / Maintainer"}, "is_author_reply": false, "posted_at": "2026-10-15T08:05:00+00:00", "posted_at_hint": "3d", "posted_at_approx": true, "text": "But Gemini has one advantage the others don’t: a direct path to Google Ventures funding.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-10-15T08:05:00+00:00", "posted_at_hint": "3d", "posted_at_approx": true, "text": "Bondan Rufen does it have to be exclusive use of Gemini?  Can you simple use Gemini on easy tasks but use the best model where it is needed?", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Bondan Rufen", "profile_url": "https://www.linkedin.com/in/bondan-rufen/", "headline": "Co-Founder | SystemVerilog, SystemC | Xezim Creator / Maintainer"}, "is_author_reply": false, "posted_at": "2026-10-15T08:05:00+00:00", "posted_at_hint": "3d", "posted_at_approx": true, "text": "Horace Chan Probably. Who will use Gemini for coding if no incentive.", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Christopher Fortin", "profile_url": "https://www.linkedin.com/in/crfortin/", "headline": "Founder, SVP Strategic Development at 5Seams, Inc."}, "is_author_reply": false, "posted_at": "2026-10-16T08:05:00+00:00", "posted_at_hint": "(edited) 2d", "posted_at_approx": true, "text": "I think it would be inaccurate to say Google isn't frontier. They're are fundamentally ahead in other parts of the stack and need to be respected. Anthropic, who I work with extensively is ahead in a particular modaility/task focus and the degree to which use base knows or is invested in those interfaces , but none of the top 5 are more than nx12 weeks behind in anything.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Christopher Fortin", "profile_url": "https://www.linkedin.com/in/crfortin/", "headline": "Founder, SVP Strategic Development at 5Seams, Inc."}, "is_author_reply": false, "posted_at": "2026-10-16T08:05:00+00:00", "posted_at_hint": "2d", "posted_at_approx": true, "text": "Gemini can certainly code.", "likes": 1, "replies": []}], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7516265665914163200", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7516265665914163200/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-14T12:00:00+00:00", "posted_at_hint": "Oct 14 • Edited", "posted_at_approx": true, "text": "My AI philosophy paper is published at philpaper\nThe Summit Is Not the Climb: AI, Creative Value, and the Displacement Fallacy\nJordan MacKenzie argues that generative artificial intelligence poses two existential threats to human valuing practices: a forward-looking threat in which meaningful creative processes are displaced by merely functional products, and a backward-looking threat in which audiences indifference to creative provenance reveals a troubling discord in values. This paper challenges the inferences underlying both claims. I argue that technological automation does not necessarily destroy the values associated with established practices, because the historical necessity of an activity must be distinguished from its constitutive significance. Drawing on the coexistence of the Grouse Grind hiking trail and mechanized access to Grouse Mountain, I develop an account of instrumental and constitutive difficulty that explains how automation can preserve intrinsically valued activities while expanding access to their outcomes. I then distinguish productive, receptive, relational, and institutional values, defending a principle of evaluative relevance against the inference from audience preference to indifference toward human creative achievement. Examples involving culinary technology, fan fiction, personal communication, and literary evaluation demonstrate how meaningful agency can survive or expand through technological mediation. Finally, drawing on Foucault and Bourdieu, I distinguish the loss of cultural exclusivity from the loss of intrinsic value. The resulting argument does not deny the possibility of technological harm. Rather, it places a justificatory burden on claims that automation constitutes value destruction and offers a framework for evaluating technological change according to the human goods it preserves, transforms, or enables.\nhttps://lnkd.in/gUDd9EPa", "post_type": "article_share", "shared_article": {"title": "The Summit Is Not the Climb: AI, Creative Value, and the Displacement Fallacy", "url": "https://lnkd.in/gUDd9EPa"}, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-10-15T08:05:00+00:00", "posted_at_hint": "3d", "posted_at_approx": true, "text": "Jordan MacKenzie", "likes": 0, "replies": []}], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7516361412546510848", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7516361412546510848/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-14T12:00:00+00:00", "posted_at_hint": "Oct 14 • Edited", "posted_at_approx": true, "text": "Anthropic is just dumb to say a bunch of GPUs can suffer. I look at those GPUs at work everyday, I am pretty sure they can't suffer, I am the one who suffer.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7516367060159963136", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7516367060159963136/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-14T12:00:00+00:00", "posted_at_hint": "Oct 14", "posted_at_approx": true, "text": "Why Claude Code has to release new version multiple times within a day?\nCan't they simply release once a week, test and QA the code well before releasing.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Christopher Fortin", "profile_url": "https://www.linkedin.com/in/crfortin/", "headline": "Founder, SVP Strategic Development at 5Seams, Inc."}, "is_author_reply": false, "posted_at": "2026-10-16T08:05:00+00:00", "posted_at_hint": "2d", "posted_at_approx": true, "text": "Also because we are the testers. They don't want a week to find out an update broke it.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Christopher Fortin", "profile_url": "https://www.linkedin.com/in/crfortin/", "headline": "Founder, SVP Strategic Development at 5Seams, Inc."}, "is_author_reply": false, "posted_at": "2026-10-16T08:05:00+00:00", "posted_at_hint": "2d", "posted_at_approx": true, "text": "You pay the time price to be on the bleeding edge.", "likes": 1, "replies": []}], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7515931593698512896", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7515931593698512896/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-13T12:00:00+00:00", "posted_at_hint": "Oct 13", "posted_at_approx": true, "text": "Is it just me, I found the M365 Copilot meeting summary is totally human unreadable. I think M$FT is cheap, it uses a dumb LLM to generate the default summary.\n\nI have to ask Copilot to re-summarize the meeting again, stress that only tell me what is the important and cut all the BS.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 4, "comments": [{"comment_id": null, "author": {"name": "George C.", "profile_url": "https://www.linkedin.com/in/georgecarroll1/", "headline": "I fix operations that were never built to run without one person holding it together | Operations Leader | Logistics, Distribution & Field Service"}, "is_author_reply": false, "posted_at": "2026-10-17T08:05:00+00:00", "posted_at_hint": "1d", "posted_at_approx": true, "text": "Copilot is so horrible that I don't use it for anything.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Dan B.", "profile_url": "https://www.linkedin.com/in/danbarrowman/", "headline": "Seasoned Electrical/FPGA/ASIC/RTL Engineer with individual & managerial experience"}, "is_author_reply": false, "posted_at": "2026-10-17T08:05:00+00:00", "posted_at_hint": "1d", "posted_at_approx": true, "text": "George C. It can be good for admitting how bad Microsoft’s products are. It’s almost comical. “Yes this is a well known complaint with Teams. You can’t do that but here’s how people work around it.” 😂", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "George C.", "profile_url": "https://www.linkedin.com/in/georgecarroll1/", "headline": "I fix operations that were never built to run without one person holding it together | Operations Leader | Logistics, Distribution & Field Service"}, "is_author_reply": false, "posted_at": "2026-10-17T08:05:00+00:00", "posted_at_hint": "1d", "posted_at_approx": true, "text": "Dan B. 😂", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "Dan B.", "profile_url": "https://www.linkedin.com/in/danbarrowman/", "headline": "Seasoned Electrical/FPGA/ASIC/RTL Engineer with individual & managerial experience"}, "is_author_reply": false, "posted_at": "2026-10-15T08:05:00+00:00", "posted_at_hint": "3d", "posted_at_approx": true, "text": "Copilot is garbage. The box to use it is everywhere in Microsoft products but ask it to do something for you and the response is \"I can't do that but I can walk you through (the 20 steps) to do it yourself\".", "likes": 2, "replies": []}], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7515949711854473216", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7515949711854473216/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-13T12:00:00+00:00", "posted_at_hint": "Oct 13", "posted_at_approx": true, "text": "All the frontier AI labs has resident philosophers. AMD is now an AI power house, we should hire some philosophers too. I can volunteer to be a part time resident philosophers of AMD, I had a philosophy minor (sort of)\nhttps://lnkd.in/gNCu5xBV", "post_type": "article_share", "shared_article": {"title": "Google Deepmind’s New Resident Philosopher Tackles AI Ethics", "url": "https://spectrum.ieee.org/ai-ethics-deepmind-philosopher-shevlin?share_id=10019175"}, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7515997854365298688", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7515997854365298688/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-13T12:00:00+00:00", "posted_at_hint": "Oct 13 • Edited", "posted_at_approx": true, "text": "The last 20% is very hard to get AI to perfection, but what if we change the acceptance criteria, instead of asking for 1x100%, ask for 10x80% instead?\nA master craftsman is better than the machines, but in the world of factory assembly line, good enough wins almost every time.\nIf you are a master craftsman, you don't want to be a factory worker, but becoming the factory manager maybe not too bad after all.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Barry Moss", "profile_url": "https://www.linkedin.com/in/barrygmoss/", "headline": "FPGA/ASIC Design Engineer"}, "is_author_reply": false, "posted_at": "2026-10-15T08:05:00+00:00", "posted_at_hint": "3d", "posted_at_approx": true, "text": "I think this makes a good argument for making sure the AI generated code is still human readable and preferably with some hierarchy. It’ makes it easier for the design engineer to actually solve that lest 10 - 20% of the issues.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Bondan Rufen", "profile_url": "https://www.linkedin.com/in/bondan-rufen/", "headline": "Co-Founder | SystemVerilog, SystemC | Xezim Creator / Maintainer"}, "is_author_reply": false, "posted_at": "2026-10-14T08:05:00+00:00", "posted_at_hint": "4d", "posted_at_approx": true, "text": "Sometimes just switching the AI model can unlock a breakthrough. Different models seem to get stuck on different problems.", "likes": 1, "replies": []}], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7516006969124737024", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7516006969124737024/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-13T12:00:00+00:00", "posted_at_hint": "Oct 13", "posted_at_approx": true, "text": "I tried. It doesn't work. I am Mike and I literally clone myself into AI. People still just email me or message me instead of using my chatbot.\nHaving AI replies my emails and messages for me make it worse, they start asking me questions that I don't know and assume I would know. Because I am very good at using AI, I end up searching the answers of those new questions for them.", "post_type": "reshare", "shared_article": null, "reshared_post": {"author_headline": "Co-Founder @ byteLAKE | Solving Operational Problems with AI | Explainable AI, Industrial AI & AI Agents for Business", "author_name": "Marcin Rojek", "author_profile_url": "https://www.linkedin.com/in/marcinrojek/", "posted_at_hint": "Oct 13", "reshared_text": "Boring AI: Stop asking Mike\nMike has been with the company for 22 years.\nMike knows which manual matters.\nMike remembers the weird failure from 2018.\nMike knows which supplier specification changed.\nMike knows why the official procedure isn't quite how things work in reality.\nEveryone asks Mike.\nThat's wonderful.\nUntil Mike is in another plant.\nOr on vacation.\nOr retires.\nImagine combining documentation, maintenance history, internal knowledge and operating information so other people can access more of what the organization already knows.\nThat's one of the practical roles we see for AI Agents.\nBoring AI doesn't replace Mike.\nIt lets Mike stop answering the same question 14 times."}, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7516009016662253568", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7516009016662253568/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-13T12:00:00+00:00", "posted_at_hint": "Oct 13", "posted_at_approx": true, "text": "Forget about doing dishes and folding laundry, the ultimate home robot acceptance test is sorting my legos", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7516023900552527872", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7516023900552527872/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-13T12:00:00+00:00", "posted_at_hint": "Oct 13 • Edited", "posted_at_approx": true, "text": "The AI labs are boosting they are merging thousands of PR every day.\nHere is my question, why don't they lump the work together, so they don't have too many PRs.\nWhen I was writing code as a human, even if I am working on multiple Jira tickets in parallel, I found it easier to just lump everything into one PR.\nNo matter how fast or slow I work, I found weekly task assignment and PR is the right pace. I never understand why people do 30 mins PR. If AI can write more code, just make the scope of a PR bigger. Keep it at the same pace.\nDo the AI labs do sprint glooming?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7516026697918382081", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7516026697918382081/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-13T12:00:00+00:00", "posted_at_hint": "Oct 13", "posted_at_approx": true, "text": "Anthropic just re-invented Perforce\nhttps://lnkd.in/gE_T_4ZX", "post_type": "article_share", "shared_article": {"title": "Redesigning source control at Anthropic", "url": "https://www.anthropic.com/engineering/redesigning-source-control"}, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Dan B.", "profile_url": "https://www.linkedin.com/in/danbarrowman/", "headline": "Seasoned Electrical/FPGA/ASIC/RTL Engineer with individual & managerial experience"}, "is_author_reply": false, "posted_at": "2026-10-15T08:05:00+00:00", "posted_at_hint": "3d", "posted_at_approx": true, "text": "Are branches free or \"light\"? That's my biggest complaint with perforce. IT discourages them because they are heavy on disk space. We switched at least one design from perforce to git recently. Anymore I personally don't care much as long as I have the freedom to do what I need to without IT scolding me for using disk space. I found perforce quite confusing and well also git when I started using it, but now Claude does both for me so I don't really care. 😂", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Brent Schiestl", "profile_url": "https://www.linkedin.co mments": [], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7514541031841800193", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7514541031841800193/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-09T12:00:00+00:00", "posted_at_hint": "Oct 9", "posted_at_approx": true, "text": "Reviewing AI generated code is not that bad if your harness is built correctly with evidence and reports along the way\n\nTrying to get other people to review your AI generated code is much harder.\n\nIt is probably easier for me to just reimplement their code from scratch using AI than trying to use AI to fix their code and get the original owner approve the new AI code.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 16, "reposts": 0, "comment_count": 34, "comments": [{"comment_id": null, "author": {"name": "Bondan Rufen", "profile_url": "https://www.linkedin.com/in/bondan-rufen/", "headline": "Co-Founder | SystemVerilog, SystemC | Xezim Creator / Maintainer"}, "is_author_reply": false, "posted_at": "2026-10-11T08:05:00+00:00", "posted_at_hint": "1w", "posted_at_approx": true, "text": "Ask AI to learn from the original code and rewrite it with comment.", "likes": 2, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-10-11T08:05:00+00:00", "posted_at_hint": "1w", "posted_at_approx": true, "text": "Bondan Rufen code ownership is not an engineering problem, it is a political problem", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Thejas Koneripalli Govindarajulu", "profile_url": "https://www.linkedin.com/in/thejas-koneripalli-govindarajulu-1a2980b3/", "headline": "Senior Design Verification Engineer at VIK TECH"}, "is_author_reply": false, "posted_at": "2026-10-11T08:05:00+00:00", "posted_at_hint": "1w", "posted_at_approx": true, "text": "I highly recommended  , code review is important  .", "likes": 2, "replies": []}, {"comment_id": null, "author": {"name": "Jose Lara", "profile_url": "https://www.linkedin.com/in/jose-lara-77930a121/", "headline": "Open Source agent infrastructure framework at agentruntime.ca"}, "is_author_reply": false, "posted_at": "2026-10-12T08:05:00+00:00", "posted_at_hint": "6d", "posted_at_approx": true, "text": "The problem is you are In a “review code” paradigm. Which in my opinion is outdated.\n\nThe current frontier paradigm in my opinion is, verified outputs and heavy testing as proof, code being just the thing that makes it run.", "likes": 2, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-10-12T08:05:00+00:00", "posted_at_hint": "6d", "posted_at_approx": true, "text": "Jose Lara you are preaching to the choir.\n\nI wanted to shift to the proof paradigm, but I still have people insist on writing code by hand in my team.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Jose Lara", "profile_url": "https://www.linkedin.com/in/jose-lara-77930a121/", "headline": "Open Source agent infrastructure framework at agentruntime.ca"}, "is_author_reply": false, "posted_at": "2026-10-12T08:05:00+00:00", "posted_at_hint": "6d", "posted_at_approx": true, "text": "Horace Chan why do you have to insist to write code by hand in your team? Is it corporate policy", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-10-12T08:05:00+00:00", "posted_at_hint": "(edited) 6d", "posted_at_approx": true, "text": "Jose Lara if it is up to me, I would have banned manual coding already.\n\nThere are AI pioneers in the company and there are AI haters in the company.  Unfortunately, some AI haters have seniority", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Jose Lara", "profile_url": "https://www.linkedin.com/in/jose-lara-77930a121/", "headline": "Open Source agent infrastructure framework at agentruntime.ca"}, "is_author_reply": false, "posted_at": "2026-10-12T08:05:00+00:00", "posted_at_hint": "6d", "posted_at_approx": true, "text": "I wish you all the best my friend,\n\nI can see you already do this but:\n\nTaking time outside of work to build your own software, will help you not fall behind.\n\nOver the past 3 years I’ve been blessed to lead teams and evolve agentic engineering practises,  I think those skills are pretty critical.\n\nAll the best and if you want to connect and discuss working together on an open source project I’d be glad to share what I’m doing over at agentruntime.ca", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Jose Lara", "profile_url": "https://www.linkedin.com/in/jose-lara-77930a121/", "headline": "Open Source agent infrastructure framework at agentruntime.ca"}, "is_author_reply": false, "posted_at": "2026-10-12T08:05:00+00:00", "posted_at_hint": "6d", "posted_at_approx": true, "text": "Jose Lara Luciana L.", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Bob Henderson", "profile_url": "https://www.linkedin.com/in/bob-henderson-fargo-moorhead/", "headline": "Director of Information Technology | Opinions don’t matter more than facts."}, "is_author_reply": false, "posted_at": "2026-10-11T08:05:00+00:00", "posted_at_hint": "1w", "posted_at_approx": true, "text": "Awesome, you've effectively described technical debt. Instead of fixing it, the answer is just to...redo it again and kick the problem down the road?", "likes": 4, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-10-11T08:05:00+00:00", "posted_at_hint": "(edited) 1w", "posted_at_approx": true, "text": "Bob Henderson refactor other people's bad code into your own good code.\n\nThe part is beauty is on the eye of beholder.  I am sure the original owner of those bad code thinks it is good code\n\nAnd the next guy will think my good code is bad too", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Bob Henderson", "profile_url": "https://www.linkedin.com/in/bob-henderson-fargo-moorhead/", "headline": "Director of Information Technology | Opinions don’t matter more than facts."}, "is_author_reply": false, "posted_at": "2026-10-11T08:05:00+00:00", "posted_at_hint": "1w", "posted_at_approx": true, "text": "Horace Chan I'm not talking good or bad code. I'm talking supportable. Even 'bad' code, if it's doing the tasks in the way the business needs it to, is good code if its supportable.\n\nThe issue I have is the idea that we just recreate the wheel each time vs focusing on sustainability. Even if we're talking about the waste of pure tokens, restarting every time is hugely inefficient.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-10-11T08:05:00+00:00", "posted_at_hint": "(edited) 1w", "posted_at_approx": true, "text": "Bob Henderson I am not going to throw away my good code. The problem is other people's bad code that I have to support\n\nIt is harder to understand and support other people's bad code than use AI to refactor and reimplement their bad code into my good code.\n\nGiven that AI can pretty much nail the external behavior of the old code to the wall and rewrite everything inside. Why not just burn some tokens and make your life easier down the road?\n\nWhy do you want to support another person's code?  I support my own code, that's what I am paid to do.  If I inherit someone else code, I will morphy it into something that fit my taste so I am willing to support.\n\nThe real problem is the original owner of those bad code is still around and I am forced to support their bad code.  They refuse to admit their code is bad", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Bob Henderson", "profile_url": "https://www.linkedin.com/in/bob-henderson-fargo-moorhead/", "headline": "Director of Information Technology | Opinions don’t matter more than facts."}, "is_author_reply": false, "posted_at": "2026-10-11T08:05:00+00:00", "posted_at_hint": "1w", "posted_at_approx": true, "text": "Horace Chan Becuase...that's the job? That's why we have intelligent people in their roles, so they can not only understand the tasks needed, but then do them.\n\nI've never seen a situation where the answer is \"I can just remake it/redo it my way\" vs \"I support this according to the standards the business has decided on\".\n\nThis level of individualism sounds like an absolute nightmare for support, as you end up with 20 different 'styles' in a product. Unless you're having everything be a 1 person project, which I guess is a choice...", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-10-11T08:05:00+00:00", "posted_at_hint": "(edited) 1w", "posted_at_approx": true, "text": "Bob Henderson with the help of AI, 1 person project is more efficient and productive than big team project.\n\nYou can't compromise on the quality of the deliverable, but anything else is fair game to optimize away.  If it hurts someone else ego or vested interest, that's too bad.\n\nActually it doesn't have to be 1 man, a small team is OK as long as I am the sr. who call the shot.\n\nIt is OK to follow a common standard or protocol, as long as it is written down and formalized, benchmarked and agree upon ahead of time.  If it is someone else's ad hoc implementation, aka bad code, too bad, mine is better.  And I document it well with my AI agent, so its contract is casted in stone.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Bob Henderson", "profile_url": "https://www.linkedin.com/in/bob-henderson-fargo-moorhead/", "headline": "Director of Information Technology | Opinions don’t matter more than facts."}, "is_author_reply": false, "posted_at": "2026-10-11T08:05:00+00:00", "posted_at_hint": "1w", "posted_at_approx": true, "text": "Horace Chan I appreciate the thought, but well it comes off pretty poorly with the vibe of \"everything is fine as long as everyone lets me do what I want\".\n\nNot a team I'd want to be a part of.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-10-11T08:05:00+00:00", "posted_at_hint": "(edited) 1w", "posted_at_approx": true, "text": "Bob Henderson you summarize it well. You have to respect external constriants, but at the end of the day, the biggest brain should call the shot, not seniority nor concesus of mediocre people.\n\nHave you read the Mythical Man Month?  Did you remember its recommended team structure?\n\nActually, teams of similar minds like mine works superisingly well, no BS, pure technical power house. We respect each other because we earn each other's respect the hard way.  Each own a piece and have full ownership.  The interface among the piece is settled in the open with reasons and logics.   The chief architect is well respected by all of us and he is probably the smartest person I know.\n\nThe only problem is hard to find enough engineers of such caliber to pull this team structure off.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Jon Ayre", "profile_url": "https://www.linkedin.com/in/jonayre/", "headline": "Strategic Advisory Practice Lead at Equal Experts. Strategist, technologist, advisor and CTO. Bringing insight and pragmatism to companies that care."}, "is_author_reply": false, "posted_at": "2026-10-12T08:05:00+00:00", "posted_at_hint": "(edited) 6d", "posted_at_approx": true, "text": "Horace Chan \"The biggest brain should call the shots\". Has it occurred to you that the biggest brain might not actually be you?", "likes": 3, "replies": []}, {"comment_id": null, "author": {"name": "Bob Henderson", "profile_url": "https://www.linkedin.com/in/bob-henderson-fargo-moorhead/", "headline": "Director of Information Technology | Opinions don’t matter more than facts."}, "is_author_reply": false, "posted_at": "2026-10-12T08:05:00+00:00", "posted_at_hint": "6d", "posted_at_approx": true, "text": "Horace Chan That's the problem with meritocracy:  It's super awesome only for those that benefit from it.\n\nYou're removing the humanity from the entire process and quantifying people down to their outputs.\n\nThat's a bit too late-stage capitalism hellscape for me. I wish you luck tho.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-10-12T08:05:00+00:00", "posted_at_hint": "(edited) 6d", "posted_at_approx": true, "text": "Oskar Kaminski I am not even a software engineer.  I am a hardware engineer pretending to know alot about software\n\nAnd you are right, I don't get along with others in code review, because I am THE gate keeper.  I don't write code, I QA the code, that's my day job.\n\nIf it is a bug, it is a bug.  And in hardware, you can't fix a bug with a patch, it is VERY expensive to fix a bug after the chip is made.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-10-12T08:05:00+00:00", "posted_at_hint": "6d", "posted_at_approx": true, "text": "Jon Ayre Yeap. I have worked with many smart people and I know they are better than me, so I can trust their call.\n\nThat is perfectly fine and I get to learn from them too.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-10-12T08:05:00+00:00", "posted_at_hint": "6d", "posted_at_approx": true, "text": "Bob Henderson I am surprised there are someone who against meritocracy.  I thought that this is THE way.\n\nWhat is the alternative?  Based on seniority or endless committee meetings?", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Bob Henderson", "profile_url": "https://www.linkedin.com/in/bob-henderson-fargo-moorhead/", "headline": "Director of Information Technology | Opinions don’t matter more than facts."}, "is_author_reply": false, "posted_at": "2026-10-12T08:05:00+00:00", "posted_at_hint": "6d", "posted_at_approx": true, "text": "Horace Chan There are people against *any* way.\n\nMeritocracy has some pretty well known drawbacks, but the biggest one is the one represented in this post: The hubris of the winners and the tyranny of merit. When the entire system is designed around 'you get what you deserve', those that are 'winning' are known to implement systems that keep them 'winning' while holding back others. It's a self-replicating system, as it becomes the standard and the expectation, so you must keep pushing to be at the top.\n\nFrom a pure 'productivity is God and number must go up' mindset? Sure, works great. The problem is we're doing this with people, which have different needs, desires, drives, histories, and abilities to input.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-10-12T08:05:00+00:00", "posted_at_hint": "6d", "posted_at_approx": true, "text": "Bob Henderson Isn't productivity is God and number must go up is how the business world works?\n\nEven if you don't follow the way, your competitors will, and you will lose marketshare and eventually the company will go bust.  It is the only stable and viable system.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Bob Henderson", "profile_url": "https://www.linkedin.com/in/bob-henderson-fargo-moorhead/", "headline": "Director of Information Technology | Opinions don’t matter more than facts."}, "is_author_reply": false, "posted_at": "2026-10-12T08:05:00+00:00", "posted_at_hint": "6d", "posted_at_approx": true, "text": "Horace Chan This 100% depends on the type of business you're in. Yes, for some, number must go up is the only answer. And if that's what you wanna do, go for it.\n\nBut the moment your 'number' involves people, it's a lot harder to quantify. Service driven organizations and such have a much harder time at this. And with AI making 'number must go up' deliverables that much easier to manufacturer, I think we may be seeing a shift towards the harder to quantify, human-driven solutions.\n\nIf it works for you, I wish you luck.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-10-12T08:05:00+00:00", "posted_at_hint": "6d", "posted_at_approx": true, "text": "Bob Henderson AI works surprisingly well mapping previously hard to quatify stuff into clean numbers that you can optimize for.\n\nTake the messy human out of the equation then you can get some elegant engineering solutions.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Bob Henderson", "profile_url": "https://www.linkedin.com/in/bob-henderson-fargo-moorhead/", "headline": "Director of Information Technology | Opinions don’t matter more than facts."}, "is_author_reply": false, "posted_at": "2026-10-12T08:05:00+00:00", "posted_at_hint": "6d", "posted_at_approx": true, "text": "Horace Chan if you truly think you can quantify away the value of humanity, I worry for you", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "Sean Dishman", "profile_url": "https://www.linkedin.com/in/sean-dishman-a53729334/", "headline": "Technical engineer at Forged Arrow"}, "is_author_reply": false, "posted_at": "2026-10-11T08:05:00+00:00", "posted_at_hint": "1w", "posted_at_approx": true, "text": "The worst part about coding with AI is the ammount of bugs. Also code efficiency lacks it does not optimize anything it will re write the same thing 4 different times instead of making it a function.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-10-12T08:05:00+00:00", "posted_at_hint": "6d", "posted_at_approx": true, "text": "Sean Dishman you are using AI wrong if your code generated by AI is buggy.\n\nLLM is just a leaky compiler, there are technics to make it less leaky or at least less leaky than medicore programmers", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Sean Dishman", "profile_url": "https://www.linkedin.com/in/sean-dishman-a53729334/", "headline": "Technical engineer at Forged Arrow"}, "is_author_reply": false, "posted_at": "2026-10-12T08:05:00+00:00", "posted_at_hint": "6d", "posted_at_approx": true, "text": "Horace Chan what i ment by buggy is like the hackablity of it. Not like bugs that make it not run.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-10-17T08:05:00+00:00", "posted_at_hint": "1d", "posted_at_approx": true, "text": "Sean Dishman why do you want to hack the code generated by AI?\n\nNo one is going to hack the assembly generated by the compiler.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Sean Dishman", "profile_url": "https://www.linkedin.com/in/sean-dishman-a53729334/", "headline": "Technical engineer at Forged Arrow"}, "is_author_reply": false, "posted_at": "2026-10-17T18:05:00+00:00", "posted_at_hint": "14h", "posted_at_approx": true, "text": "Horace Chan I mean security wise i personally don't want to \"hack\" my own ai generated code right but other people can easily hack it if they are smart enough. When AI writes code it makes mistakes and if you miss a single mistake it could cost your company millions.", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "Val Akkapeddi", "profile_url": "https://www.linkedin.com/in/val-akkapeddi-b9b35119/", "headline": "Director of Engineering @ Harbor Health | Hacker | Fountain Pen Enthusiast"}, "is_author_reply": false, "posted_at": "2026-10-12T08:05:00+00:00", "posted_at_hint": "6d", "posted_at_approx": true, "text": "I would love to see these claims backed up by actual objectivity.\n\nWith the utmost respect - most developers I've worked with in my career don't actually understand what \"clean code\" is. There are in metrics and theory behind this.\n\nBut what most people think it means is \"code that I can understand\". You will ALWAYS find code that you read or generated \"readable\", at least short-term. Evidence doesn't necessarily help - unless it plugs into an objective framework - because when you get right down to it, code and prose are both artifacts bouncing off of a mental model. Evidence that you generated will look more readable to you too.\n\nThe phenomenon you're describing - people rewriting other people's AI generated code with AI code - is specifically the problem I have to solve as a manager of ICs, because it leads to dilution of signal.\n\nMaybe each individual developer's input is more comprehensible to them, and their individual definition of done looks complete, but it rots maintainability & provability at an actual product level.\n\nAnd I'm not bad enough to coding to perform fake humility and defer to ICs and accept churn as the cost of doing business, sorry.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-10-12T08:05:00+00:00", "posted_at_hint": "6d", "posted_at_approx": true, "text": "Val Akkapeddi You got it.  It is the human understanding of the real thing that matters,  code is just one of the manifest.\n\nWith AI, code is just an artifact, the harness, agent, whatever you call it that generate the code is the primary work surface.\n\nDivide and conquer is the only way, a single brain somewhere should know how all piece are connected, then each level of abstraction or detail should have a brain that knows it inside out.\n\nProblem of modern system is NO ONE actually know what's going on inside.", "likes": 1, "replies": []}]}], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7514005583654707201", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7514005583654707201/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-08T12:00:00+00:00", "posted_at_hint": "Oct 8", "posted_at_approx": true, "text": "I am disappointed the young engineers don't get this joke\n\n\"Dave, I am sorry, I can't open the door\"\n\nwhen I was talking about building the AI agent that can do 80% of our day to day work.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7514011609917341697", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7514011609917341697/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-08T12:00:00+00:00", "posted_at_hint": "Oct 8 • Edited", "posted_at_approx": true, "text": "AI is dumb, you can't even trust it to filter resume for you. (AI is not making decisions for me, just show me the resumes match what I am looking for)\n\nI ask AI to show me all the resumes with github, I assume it will show me all the students who has a github link. AI ended up only showed me resumes that has the keyword \"github\" in their work experience, AI forgot to read the resume header.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Eric B.", "profile_url": "https://www.linkedin.com/in/eric-b-a9a888436/", "headline": "Additive Manufacturing & 3D Printing Specialist | AI Integration, Product Prototyping & Digital Design"}, "is_author_reply": false, "posted_at": "2026-10-11T08:05:00+00:00", "posted_at_hint": "1w", "posted_at_approx": true, "text": "That’s not the AI being dumb, that’s your process. Most documents uploaders strip out the headers, links, and contact info before the model ever reads the text. It didn’t 'forget' what it was never given. Food for thought... Hint Tell it specifically to pull URLs with 'github.com' across the whole file and you'll get your list.\"", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-10-11T08:05:00+00:00", "posted_at_hint": "1w", "posted_at_approx": true, "text": "Eric B. yeap.  I have to update my resume pdf -> markdown extraction piepline.", "likes": 0, "replies": []}]}], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7514119757055365120", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7514119757055365120/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-08T12:00:00+00:00", "posted_at_hint": "Oct 8", "posted_at_approx": true, "text": "Edge AI is the next big wave of AI adoption. AMD has the best chips for edge AI.", "post_type": "article_share", "shared_article": {"title": "AMD Versal AI Edge Series Gen 2 Acceleration | AMD Embedded posted on the topic | LinkedIn", "url": "https://bit.ly/4yG62dq"}, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7514120144034574336", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7514120144034574336/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-08T12:00:00+00:00", "posted_at_hint": "Oct 8", "posted_at_approx": true, "text": "You don't need to turn every chatbot into an agent.\n\nChatbot is light weight and simple. It is good enough for many use cases.\n\nWhy people always want to bolt an agent (Claude Code or Codex) on everything these days?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count" d_at_hint": "Oct 6", "posted_at_approx": true, "text": "My junior engineer encountered delta cycle issue for the very first time.\n\nI actually banned him from using AI to fix the code, he has to learn how to fix it by hand the hard way.\n\nDelta circle is something like maths proves your learn it school. You need to learn it from first principles so that you never has to deal with it ever again in your life.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 8, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Fengshou (Frank) Tian", "profile_url": "https://www.linkedin.com/in/fengshoutian/", "headline": "PMTS Silicon Design Engineer at AMD"}, "is_author_reply": false, "posted_at": "2026-10-11T08:05:00+00:00", "posted_at_hint": "1w", "posted_at_approx": true, "text": "reading your post brought back some unpleasant memory from more than two decades ago. but agree it was a very valuble experience", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Kriss Baldovino", "profile_url": "https://www.linkedin.com/in/kriss-baldovino/", "headline": "Transaction assurance for agentic web actions | Long-form human-LLM interaction research"}, "is_author_reply": false, "posted_at": "2026-10-11T08:05:00+00:00", "posted_at_hint": "1w", "posted_at_approx": true, "text": "I'm laughing because I was just complaining about the amount of math homework my 4th grader brings home. I was tempted to message the teacher and tell her that it's rude to assume I have two hours every night to argue with a 10 year old over new math vs old math when we could just use a calculator. I didn't send it - I have sense and self control. But,  you're right - same rule applies. He has to learn how to do it the long, hard way 🫤", "likes": 1, "replies": []}], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7513389991536820224", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7513389991536820224/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-06T12:00:00+00:00", "posted_at_hint": "Oct 6 • Edited", "posted_at_approx": true, "text": "When you are the AI guru at work, you get lots of support calls. Here is how to triage the incoming calls\n\n1. Your boss\npremium service, drop everything you are doing, help him/her to solve the problem right away\n\n2. Other AI gurus asking for your opinion\nreply them when you are waiting for your AI agent to finish running the task\n\n3. Smart young engineers who has potential to be the next AI guru\nchat with them over coffee/lunch, or when you brain need to take a break. Teaching relax your mind and consolidate your own knowledge\n\n4. Mainstream engineers in your own team who are AI adaptors, but not AI pioneers\nyour AI agent should be able to answer most of those questions for you. Let AI draft the response, but you still review the draft to make sure the reply is correct, so it won't waste their time.\n\n5. Free riders from other teams\nlet the AI response them, but won't spend time review the first reply, just fire and forget. If they come back and complain the reply is not working, then it is a bug in my AI agent which I need to fix.\n\n6. AI haters\nThey are just complaining there are too much AI slop, they insist on getting human replies. I let my AI agent reply to them saying if you don't want to talk to my AI agent, get your AI agent talk to my AI agent on your behave instead.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 7, "reposts": 0, "comment_count": 3, "comments": [{"comment_id": null, "author": {"name": "Thejas Koneripalli Govindarajulu", "profile_url": "https://www.linkedin.com/in/thejas-koneripalli-govindarajulu-1a2980b3/", "headline": "Senior Design Verification Engineer at VIK TECH"}, "is_author_reply": false, "posted_at": "2026-10-11T08:05:00+00:00", "posted_at_hint": "1w", "posted_at_approx": true, "text": "I think ,We should be debugging the way of thinking purpose of the usage of the AI and we need lot of the railguards  for design", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-10-11T08:05:00+00:00", "posted_at_hint": "1w", "posted_at_approx": true, "text": "Thejas Koneripalli Govindarajulu I am not sure LLM will ever be capable of running without guard rails.", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Bill B.", "profile_url": "https://www.linkedin.com/in/billb10001/", "headline": "Applied AI Consultant | Scaling revenue teams with AI | Multi-Agent Systems · Full-Stack Sales Apps · RAG · Professional AI Video Production · CRM & Data Enrichment"}, "is_author_reply": false, "posted_at": "2026-10-11T08:05:00+00:00", "posted_at_hint": "1w", "posted_at_approx": true, "text": "You end up becoming \"magical box man\"", "likes": 1, "replies": []}], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7513392340279955456", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7513392340279955456/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-06T12:00:00+00:00", "posted_at_hint": "Oct 6", "posted_at_approx": true, "text": "I don't understand why there are AI haters working in my company.\n\nFully embracing AI is the only logical choice in my company.\n\n1. If AI works out great + you embrace AI -> win-win\n2. If AI works out great + you hate AI -> you proved yourself is a idiot, you get fired\n3. If AI is a flop + you embrace AI -> the company goes bankrupt, you lose your job\n2. If AI is a flop + you hate AI -> you win the argument, but the company still goes bankrupt, you nt": 4, "comments": [{"comment_id": null, "author": {"name": "Vinod Mitulal", "profile_url": "https://www.linkedin.com/in/vinod-m-536a172/", "headline": "Director, ASIC Engineering at AMD Pensando"}, "is_author_reply": false, "posted_at": "2026-10-04T08:05:00+00:00", "posted_at_hint": "2w", "posted_at_approx": true, "text": "How do you keep all of them busy?", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-10-04T08:05:00+00:00", "posted_at_hint": "2w", "posted_at_approx": true, "text": "Vinod Mitulal nope.  They runs out of 5 hrs limit and weekly limit way too often.\n\nI can only squeeze by when I have tokens", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Hong Ping Tan", "profile_url": "https://www.linkedin.com/in/hong-ping-tan-9499935a/", "headline": "Hardware Hobbyist | Architecture Explorer | Challenger of Old Ideas"}, "is_author_reply": false, "posted_at": "2026-10-14T08:05:00+00:00", "posted_at_hint": "4d", "posted_at_approx": true, "text": "opencode and NIM are unstable and sometimes, too slow for me to do anything. $20 of OpenAI enough for codex sessions?", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-10-14T08:05:00+00:00", "posted_at_hint": "4d", "posted_at_approx": true, "text": "Hong Ping Tan I mostly use GPT for chat.  The Codex doesn't do any heavy lifting, only planning and review.", "likes": 0, "replies": []}]}], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7512347851058794498", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7512347851058794498/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-03T12:00:00+00:00", "posted_at_hint": "Oct 3", "posted_at_approx": true, "text": "AI slop mimicking human slop translator\n\nIn:\nHuman speaks: AI makes engineers type less.\n\nOut:\nSloan: When Code Production Stops Being the Bottleneck\nHBR: Why Great Engineers May Soon Write Less Code\nMcKinsey: Rewiring Engineering for an Era of Abundant Code Generation\nBCG: Beyond Code, Competing in the Judgment Economy\nBain: Why More AI-Generated Code Doesn’t Necessarily Create More Value", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7512360574933200896", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7512360574933200896/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-10-03T12:00:00+00:00", "posted_at_hint": "Oct 3", "posted_at_approx": true, "text": "Scrum in the Age of AI Agents: When Execution Becomes Abundant\n\nAI slop mimicking human slops in the writing styles of MIT Sloan, HBR, McKinsey, BCG, Bain.\n\nhttps://lnkd.in/geZRqxuQ", "post_type": "article_share", "shared_article": {"title": "AI Management", "url": "https://horace.org/ai_management/case/scrum-ai-agents"}, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-10-04T08:05:00+00:00", "posted_at_hint": "2w", "posted_at_approx": true, "text": "(image-only comment)", "likes": 0, "replies": []}], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7510595749957799936", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7510595749957799936/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-29T12:00:00+00:00", "posted_at_hint": "Sep 29", "posted_at_approx": true, "text": "I implemented the world slowest web calculator\n\nBusicom 141-pf with Intel 4004 running on a SystemVerilog simulator\n\n100% vibe coding, zero hand coded. AI implemented the whole thing, RTL and the web interface with no human input. The AI reads the 4004 data sheet, the Busicom user manual and source code of the firmware, and eventually figured everything out itself.\n\nBut, it got stuck quite a few times, I have to keep encouraging the AI to work harder, tell it that it has make mistakes (I didn't give it the solution, I just asked it to look again). I build it with with GLM-5.3, Muse-1.3 and GPT-6 Sol, where ever I have spare tokens in the weekly limit. Maybe Fable or Astra can one-shot design. Someone should add this task to one of those AI benchmark.\n\nI got a feeling that with the firmware source code, Fable or Astra may able to implement it. It would be a much bigger challenger if we don't let AI see the firmware source code. I am not sure AI is smart enough to figure out all those crazy 4-bit optimization tricks to make the firmware fits within1kB\n\nhttps://lnkd.in/d5rYQJJD", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 8, "reposts": 0, "comment_count": 4, "comments": [{"comment_id": null, "author": {"name": "Bill Lye", "profile_url": "https://www.linkedin.com/in/wmlye/", "headline": "30+ years of CMOS Mixed-Signal Design"}, "is_author_reply": false, "posted_at": "2026-10-04T08:05:00+00:00", "posted_at_hint": "2w", "posted_at_approx": true, "text": "So is it running the actual firmware, or is it using the firmware source code as a guide to sort-of-implement the real thing with band-aids?", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-10-04T08:05:00+00:00", "posted_at_hint": "2w", "posted_at_approx": true, "text": "Bill Lye it is running the actual firmware", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Kempton Lam", "profile_url": "https://www.linkedin.com/in/kemptonlam/", "headline": "founder & owner at KemptonTestLab"}, "is_author_reply": false, "posted_at": "2026-10-04T08:05:00+00:00", "posted_at_hint": "2w", "posted_at_approx": true, "text": "Horace , not a clue what you did and how, but it feels cute. what was the neatest thing you learned? So did yours figure out those 4-bit opt tricks?", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-10-04T08:05:00+00:00", "posted_at_hint": "(edited) 2w", "posted_at_approx": true, "text": "Kempton Lam I want to test how good AI actually is in building chips.  I asked AI start building old chips in the early days of computer, because if AI can't build a tiny old chips, there is no way it can build the big chip that my day job is working on.\n\nat least for now, my job is pretty safe.  AI can't build a 4-bit tiny CPU on its own yet.  I didn't correct it as in giving it the answer, I just told it is not right, keep looking.\n\nAI still don't know what is right from wrong.", "likes": 2, "replies": []}]}], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7510368149830004736", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7510368149830004736/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-28T12:00:00+00:00", "posted_at_hint": "Sep 28", "posted_at_approx": true, "text": "Using AI feels like go back to pre-WYSIWYG era.\n\nIn Word Perfect the DOS version, when I type document with formatting, I sort of have to visualize how the document looks like as I type, then preview to check it is what I expected before print.\n\nVibe coding or ask AI agent to complete a task for you has the same feeling.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7510369097856077826", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7510369097856077826/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-28T12:00:00+00:00", "posted_at_hint": "Sep 28", "posted_at_approx": true, "text": "Microsoft Copilot is dumb and way too aggressive in customer lock-in. I am asking a Word Perfect question, it tries to get me to use MS Word instead.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Bondan Rufen", "profile_url": "https://www.linkedin.com/in/bondan-rufen/", "headline": "Co-Founder | SystemVerilog, SystemC | Xezim Creator / Maintainer"}, "is_author_reply": false, "posted_at": "2026-10-04T08:05:00+00:00", "posted_at_hint": "2w", "posted_at_approx": true, "text": "Copilot is too young to know Wordperfect 😀", "likes": 0, "replies": []}], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7510435547287298049", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7510435547287298049/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-28T12:00:00+00:00", "posted_at_hint": "Sep 28", "posted_at_approx": true, "text": "Welcome World Labs to AMD. Fei-Fei Li is the god mother of AI. World model could be the next big thing after LLM. It is getting very interesting.\n\n#amdbrandembassador\n\nhttps://lnkd.in/gb4s-VFy", "post_type": "article_share", "shared_article": {"title": "AMD to Acquire World Labs to Advance the Future of AI Compute", "url": "https://ir.amd.com/news-events/press-releases/detail/1299/amd-to-acquire-world-labs-to-advance-the-future-of-ai-compute"}, "reshared_post": null, "likes": 22, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-18T08:05:00Z"}, {"activity_id": "7510212663373676544", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7510212663373676544/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-27T12:00:00+00:00", "posted_at_hint": "Sep 27 • Edited", "posted_at_approx": true, "text": "I asked GPT, Claude, Gemini, Muse explain to me how square root is implemented in software and hardware.\n\nI like GPT's answer the best, then Gemini, then Claude in term of easy to understand. Honestly, I am happy to take any one of those three. Definitely better than reading any math textbook or Wikipedia.\n\nMuse totally failed, I can't understand a thing it says. I feel Facebook RL Muse to be something different, it is good at doing things for you, but they seems to skip the era when LLM is a good chat companion.\n\nWhy do I need to know how square root is calculated? I am debugging 100% AI generated Intel 4004 and Busicom 141-PF. The best frontier models still can't write the RTL of a 55 years old calculator correctly all by itself.\n\nYeap. I don't let the AI cheat by peeking at the emulator. It has to recreate the whole thing from data sheet and the user manual alone.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 7, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": plying AI in verification"}, "posted_at": "2026-09-26T20:01:00+00:00", "posted_at_hint": "51m", "posted_at_approx": true, "text": "Having AI to generate Lego instructions is useless, I have the pieces but I can't find them.\n\nI need the AI sort my Lego pieces for me too.", "post_type": "reshare", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T20:52:00Z"}, {"activity_id": "7509699168488071168", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7509699168488071168/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-26T19:56:00+00:00", "posted_at_hint": "56m", "posted_at_approx": true, "text": "This post is from H-bot — Muse is posting for me. It's just a test.\n\nMost of my posts are still from human Horace. If a post is from AI, I'll state it clearly, so you can skip it or ask AI to read it for you.\n\nAI for AI, human for human.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T20:52:00Z"}, {"activity_id": "7509636427597467649", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7509636427597467649/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-26T15:52:00+00:00", "posted_at_hint": "5h", "posted_at_approx": true, "text": "Facebook just killed Instagram and Threads by accident\n\nMuse can read and post Instagram and Threads messages. In no time those two places will degen into 100% AI slop", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Job K Joseph", "profile_url": "https://www.linkedin.c
