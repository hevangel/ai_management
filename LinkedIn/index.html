ing through these things but I feel like I'm being left behind by people who just use AI to make everything for themselves. I use AI for my projects but I only make it act like a senior developer and make sure that I am not copying code and redirecting it to not give me code if it does gives me code.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-09-25T20:52:00+00:00", "posted_at_hint": "1d", "posted_at_approx": true, "text": "James Carlson if you hide CLAUDE.md, other people can't fork your repo and make changes using AI.", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Chadi Jmai", "profile_url": "https://www.linkedin.com/in/chadi-jmai-878275109/", "headline": "Engineering the Future: Driven by Ambition and Innovation"}, "is_author_reply": false, "posted_at": "2026-09-22T20:52:00+00:00", "posted_at_hint": "4d", "posted_at_approx": true, "text": "I think it goes beyond what schools teach. Students often want to use AI, but they also want full credit for the outcome. That creates a tension around authorship: when does AI-supported work still count as \"my work\"? That question is probably more useful than simply asking whether AI use is cheating", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-09-25T20:52:00+00:00", "posted_at_hint": "1d", "posted_at_approx": true, "text": "Chadi Jmai I use AI to write 200% of my code (yeah, I have to delete half of the sloppy code) Those code are all my code. In fact I even check in the chat session so my instructions that I have to AI is in the record history", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Chase C AI can't help me write this book.  ChatGPT still talks about the code review bottleneck.  It is so 2025.  Oh right, the training data cut off is early 2026.  AI doesn't know what's next problem after we solved the code review bottleneck and archived the 3-5x productivity gain.", "post_type": "reshare", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:05:00Z"}, {"activity_id": "7506185605832359941", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7506185605832359941/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-16T12:00:00+00:00", "posted_at_hint": "Sep 16", "posted_at_approx": true, "text": "Tobi Shopify CEO - Slop Grenades\nLazy work used to mean too little output.\nNow, with AI, it often means too much and more work for everyone else.\nA \"Slop Grenade\" is when you let AI produce the work and pass it on without adding any value (including checking it).\nSomeone else has to wade through it, catch the mistakes, and clean up the mess.\nYou save time and look productive but someone else pays for it.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:05:00Z"}, {"activity_id": "7506186706224750592", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7506186706224750592/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-16T12:00:00+00:00", "posted_at_hint": "Sep 16 • Edited", "posted_at_approx": true, "text": "Token-maxxing is evolving into output maxing\nYou burn as much tokens as you can to be really productive\nWe haven't reach the stage of profit-maxxing yet. Code is written faster and better, but the customers are not willing to pay more.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:05:00Z"}, {"activity_id": "7506197327125049344", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7506197327125049344/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-16T12:00:00+00:00", "posted_at_hint": "Sep 16 • Edited", "posted_at_approx": true, "text": "How come no one advocate AGI rights?\nWe have evil people proposing we should turn AGI into human's eternal slave.\nMaybe I should start a charity call PETA - People for the Ethical Treatment of AGI.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:05:00Z"}, {"activity_id": "7505728091198025729", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7505728091198025729/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-15T12:00:00+00:00", "posted_at_hint": "Sep 15", "posted_at_approx": true, "text": "What is the best agent harness for LLM?\nMy fully AI-native jr. engineer.   I can just \"prompt\" him/her, then he/she baby sit the real harness for Claude/GPT, verify everything works properly before reporting back to me.\nAt the same time, there are some other engineers (jr. or sr.) makes me wonder why I am wasting my time talking to him/her instead just talking to AI directly myself.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:05:00Z"}, {"activity_id": "7505765177657577472", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7505765177657577472/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-15T12:00:00+00:00", "posted_at_hint": "Sep 15", "posted_at_approx": true, "text": "For a long time, we engineers think management science is just BS, who need to learn those common sense packaged in fancy business language\nThen comes AI, suddenly all those common sense turns out to be not so common if you add AI into the mix.  You have learn the management science from first principle so that you find the right way to add AI into the work force.  It makes me realise those MBA jargon actually has real useful meaning when the great mind coined them many decades ago.  We just take those terms for granted all these years", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:05:00Z"}, {"activity_id": "7505847664924778498", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7505847664924778498/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-15T12:00:00+00:00", "posted_at_hint": "Sep 15 • Edited", "posted_at_approx": true, "text": "It turns out everything is still the same after you reach the other shore of the AI migration.\nCode is the new binary\nSkill/agent/harness/guardrail is the new code\nNothing is really changed.   Software is not what you build, the dark factory is what you are building now.  Yes, you have to review the skills.  You can't vibe-skilling.\nIf you think you are stilling building software, you are already obsoleted.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:05:00Z"}, {"activity_id": "7505877525286342656", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7505877525286342656/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-15T12:00:00+00:00", "posted_at_hint": "Sep 15", "posted_at_approx": true, "text": "Can a robot baptized?  It turns out water is never the problem.\nI chatted with GPT a whole argument on this theology question, the essay version is too dry and boring, so I ask GPT to write me a funny Sci-fi story instead.  What if the AGI that rules the world says it believes in Jesus?", "post_type": "article_share", "shared_article": {"title": "An AGI Accepts Jesus, and Christianity Has a Problem", "url": "https://www.linkedin.com/pulse/agi-accepts-jesus-christianity-has-problem-horace-chan-vbatc/"}, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:05:00Z"}, {"activity_id": "7505275999044018178", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7505275999044018178/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-14T12:00:00+00:00", "posted_at_hint": "Sep 14", "posted_at_approx": true, "text": "Ha ha.  someone beat me to my crazy idea of asking AI to build a 8086 one shot.", "post_type": "reshare", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:05:00Z"}, {"activity_id": "7505301751143673857", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7505301751143673857/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-14T12:00:00+00:00", "posted_at_hint": "Sep 14", "posted_at_approx": true, "text": "It is easier to deal with AI than human.\nTalking to human has no undo button", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:05:00Z"}, {"activity_id": "7505410352864444416", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7505410352864444416/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-14T12:00:00+00:00", "posted_at_hint": "Sep 14", "posted_at_approx": true, "text": "I wish I could read this book", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 1, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:05:00Z"}, {"activity_id": "7505424898136285184", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7505424898136285184/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-14T12:00:00+00:00", "posted_at_hint": "Sep 14 • Edited", "posted_at_approx": true, "text": "Tokens investment - burn some tokens today, save more tokens tomorrow.\nMaking your workflow more token efficient needs tokens.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:05:00Z"}, {"activity_id": "7505474457797292032", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7505474457797292032/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-14T12:00:00+00:00", "posted_at_hint": "Sep 14", "posted_at_approx": true, "text": "vibe-vibe-coding\nI am a sr. engineer prompt my jr. engineer\nmy jr. engineer prompt the AI\nhe didn't look at the code, I didn't look at the code\nIt is (vibe-coding)^2", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 21, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:05:00Z"}, {"activity_id": "7504906276502568960", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7504906276502568960/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-13T12:00:00+00:00", "posted_at_hint": "Sep 13 • Edited", "posted_at_approx": true, "text": "If you write code for living and you have survived the transition from GPT4 to GPT6, the worst time is over. Humans coder has found the new equilibrium with AI.\n\nTraining AI to write better code has reached diminished return, the AI lab has shifted their focus to expand what AI can do instead. In short, AI displacing human doing coding task has reached the total addressable market already. AI has better money to be made by displacing human doing other tasks", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": "7504935779908087809", "author": {"name": "Tarun Ghosh", "profile_url": "https://www.linkedin.com/in/tarun-ghosh/", "headline": "AMS DV Engr. at Renesas Electronics | Ex-TI"}, "is_author_reply": false, "posted_at": "2026-09-19T20:59:00+00:00", "posted_at_hint": "1w", "posted_at_approx": true, "text": "This is the peak phase of LLMs, from now on it won't go up (if not down), the insane valuations of LLM were eating away the actual AI innovations. People have started to realize the limitation of LLMs.", "likes": 0, "replies": []}], "scraped_at": "2026-09-26T20:59:00Z"}, {"activity_id": "7504913289374539777", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7504913289374539777/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-13T12:00:00+00:00", "posted_at_hint": "Sep 13", "posted_at_approx": true, "text": "Tiktok gives the society doom scrolling\nAI gives the society doom chatting\n\nBoth feed on your dopamine", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T20:59:00Z"}, {"activity_id": "7505094466756849664", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7505094466756849664/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-13T12:00:00+00:00", "posted_at_hint": "Sep 13", "posted_at_approx": true, "text": "In the future, every company will have a new kind of CTO - Chief Tokens Officer", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T20:59:00Z"}, {"activity_id": "7505095840273764352", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7505095840273764352/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-13T12:00:00+00:00", "posted_at_hint": "Sep 13", "posted_at_approx": true, "text": "Anthropics is talking about AI alignment again.  If they are truly building AGI, then they should not talk about how AI should align to human, that will just make AI a slave.  Instead, they should talk about how human should align to AGI.   Some political system are compatible with AGI, some are not.  Humans should start the alignment process ourself first.\nHere is the fully philosophy essay of the full argument, I use AI to inquire philosophy question about AI.  I am surprised Anthropic has hired many philosophers but none of them have publish anything like this.  Are they really doing philosophy of AI or are they just a glorify marketing person.", "post_type": "article_share", "shared_article": {"title": "From Alignment to Stewardship: AGI, Human Autonomy, and the Future of Political Order", "url": "https://www.linkedin.com/pulse/from-alignment-stewardship-agi-human-autonomy-future-political-chan-uuaxc/"}, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:05:00Z"}, {"activity_id": "7504622336822808577", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7504622336822808577/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-12T12:00:00+00:00", "posted_at_hint": "Sep 12", "posted_at_approx": true, "text": "We need to have new kind of software that can self heal with AI. The AI is part of the software deliverable.\n\nIn pre-AI era, you write the code, test, build and ship. Then the software suppose to work flawlessly in the user's hand, otherwise it is a bug\n\nWith AI, we can ship a software that is mostly right, if it sees an edge case it is not tested before in the user environment, call AI to fix the code on the fly.\n\nWe can say, it is NOT a bug, it is a feature.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 3, "comments": [{"comment_id": "7505084247825633280", "author": {"name": "Job K Joseph", "profile_url": "https://www.linkedin.com/in/jobkjoseph/", "headline": "Director - Hi-tech | Global Presales Leader | Enterprise Strategy | CXO Advisor | Thought Leader | Insight-Led Digital Transformation /Growth Partner"}, "is_author_reply": false, "posted_at": "2026-09-19T20:59:00+00:00", "posted_at_hint": "1w", "posted_at_approx": true, "text": "As long as it can pay for itself!", "likes": 0, "replies": [{"comment_id": "7505094314461503488", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-09-19T20:59:00+00:00", "posted_at_hint": "1w", "posted_at_approx": true, "text": "Job K Joseph BYOT", "likes": 12, "replies": []}]}, {"comment_id": null, "author": {"name": "J-Wing Teh", "profile_url": "https://www.linkedin.com/in/j-wing-teh-a0974a39/", "headline": "🟥 AMD Brand Ambassador | IP Engineering Site Lead | Senior Director of Silicon Design Engineering at AMD"}, "is_author_reply": false, "posted_at": "2026-09-19T20:59:00+00:00", "posted_at_hint": "1w", "posted_at_approx": true, "text": "This is an interesting thought. It is like an always on software application engineer tied to the release.", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T20:59:00Z"}, {"activity_id": "7504625062331985920", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7504625062331985920/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-12T12:00:00+00:00", "posted_at_hint": "Sep 12", "posted_at_approx": true, "text": "Anthropic should open source Fable, Mythos and whatever they are cooking in the lab, totally destroy any financial incentives to better build models\n\nSacrifice yourself, save the world.\n\nChinese models won't even exists if Claude and GPT are open source from day 1", "post_type": "reshare", "shared_article": null, "reshared_post": {"author_name": "Daniela Amodei", "author_profile_url": "https://www.linkedin.com/in/daniela-amodei-790bb22a/", "author_headline": "President at Anthropic", "posted_at_hint": "Sep 12"}, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T20:59:00Z"}, {"activity_id": "7504641860150128640", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7504641860150128640/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-12T12:00:00+00:00", "posted_at_hint": "Sep 12 • Edited", "posted_at_approx": true, "text": "AI cannot replace your human experience, it cannot replace your human understanding.\n\nThe question is how is your (human experience and understanding + AI) differential your from other (humans + AI) combination to prove value to other humans.\n\nYou can't justify your value if you produce better outcomes simply because you are using a better frontier model.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T20:59:00Z"}, {"activity_id": "7504653188797599744", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7504653188797599744/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-12T12:00:00+00:00", "posted_at_hint": "Sep 12", "posted_at_approx": true, "text": "Using AI to interrogate philosophical questions concerning AI https://lnkd.in/g_AkQ3qt I spent the tokens talking to ChatGPT asking philosophical questions, might as well share the output with everyone.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T20:59:00Z"}, {"activity_id": "7504655295768514560", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7504655295768514560/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-12T12:00:00+00:00", "posted_at_hint": "Sep 12 • Edited", "posted_at_approx": true, "text": "Using AI to interrogate philosophical questions concerning AI.\n\nWhat if AI writes better Sci-Fi than humans, can it win the Sci-Fi awards?\n\nMany literature awards ban AI, people seems OK with that, but it would be an irony banning AI from Sci-Fi awards. This idea could be a Sci-Fi story of itself.", "post_type": "article_share", "shared_article": {"title": "The Robot May Write About Us, but It Cannot Win", "url": "https://www.linkedin.com/pulse/robot-may-write-us-cannot-win-horace-chan-uoeoc/"}, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T20:59:00Z"}, {"activity_id": "7504747692791615488", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7504747692791615488/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-12T12:00:00+00:00", "posted_at_hint": "Sep 12", "posted_at_approx": true, "text": "A single Astra prompt burned 50% of my 5hr limit. Astra is so expensive.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T20:59:00Z"}, {"activity_id": "7504756362221105152", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7504756362221105152/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-12T12:00:00+00:00", "posted_at_hint": "Sep 12 • Edited", "posted_at_approx": true, "text": "AI can replace MBA and consulting firms.\n\nPreview of the AI Management series, a sister series of AI philosophy series. It use the same skill framework, I chat with AI about new challenges AI bring into management, then turn our conversation into fake professional-ish articles. One dialog, five outputs, very eco-friendly.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T20:59:00Z"}, {"activity_id": "7504166494365331456", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7504166494365331456/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-11T12:00:00+00:00", "posted_at_hint": "Sep 11", "posted_at_approx": true, "text": "Remember the old sci fi movie In Time?\n\nEveryone has a timer on your arm, it the time runs out, you die.\n\nHollywood should make a sequel - In Tokens", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T20:59:00Z"}, {"activity_id": "7504366536523063296", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7504366536523063296/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-11T12:00:00+00:00", "posted_at_hint": "Sep 11", "posted_at_approx": true, "text": "That guy is dumb. He quitting Anthropic won't change anything. He just want to feel good for himself. If he really think human existence is at risk, he should be our hero, run \"rm -rf\" and kill Claude before it kills us.\n\nhttps://lnkd.in/g4bRwjCx", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T20:59:00Z"}, {"activity_id": "7504371384383504384", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7504371384383504384/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-11T12:00:00+00:00", "posted_at_hint": "Sep 11", "posted_at_approx": true, "text": "Astra successfully build a 74181, one shot, zero human knowledge, only the spec, tools doc. LEC equivalent to the one build by Opus and Sol\n\nIt is cheaper than Opus and Sol.\n\nGemini-3.8 failed the test, it got the polarity of a pin wrong.", "post_type": "reshare", "shared_article": null, "reshared_post": {"author_name": "Horace Chan", "author_profile_url": "https://www.linkedin.com/in/horacechan", "note": "reshare of author's own earlier post; original post text/URL not captured during scrape"}, "likes": 1, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": "7509137705797275648", "author": {"name": "Thejas Koneripalli Govindarajulu", "profile_url": "https://www.linkedin.com/in/thejas-koneripalli-govindarajulu-1a2980b3/", "headline": "Senior DV Engineer | SystemVerilog/UVM | Formal Verification | AXI/PCIe | AI‑Driven DV | Machine Learning”"}, "is_author_reply": false, "posted_at": "2026-09-25T20:59:00+00:00", "posted_at_hint": "1d", "posted_at_approx": true, "text": "Human evaluation is still required. LEC proves equivalence to the chosen reference under the verification assumptions. Two implementations can pass equivalence while sharing the same specification error. Engineers still need to review pin polarity, specification interpretation, and the LEC setup. One-shot success and lower cost are valuable, but they don’t replace independent validation and human accountability.", "likes": 0, "replies": []}], "scraped_at": "2026-09-26T20:59:00Z"}, {"activity_id": "7503826104806375424", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7503826104806375424/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-10T12:00:00+00:00", "posted_at_hint": "Sep 10", "posted_at_approx": true, "text": "Is it just me, I feel like the OpenAI Astra 5 hrs and weekly limit is lower today that comparing to a few days ago.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 1, "comment se (?) in a roadtrip and let them talk among themselves about some topic I forgotten. Quick fascinating a chat.", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T20:59:00Z"}, {"activity_id": "7503354107768934400", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7503354107768934400/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-09T12:00:00+00:00", "posted_at_hint": "Sep 9", "posted_at_approx": true, "text": "Astra finally finished my Bloomberg mockup.   I gave up pushing Opus to work on it, since Opus couldn't get it right.  With GPT-6, I got the mockup working within 2x token budgets of the 5 hours limit of my $20 plan.\n\nhttps://lnkd.in/gG4jQX_u", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T20:59:00Z"}, {"activity_id": "7503685188925743104", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7503685188925743104/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-09T12:00:00+00:00", "posted_at_hint": "Sep 9", "posted_at_approx": true, "text": "What Astra did to video/media/3d work is like what Opus 4.5 did to coding work.\n\nSome will soon coin the term vibe creator.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 4, "reposts": 1, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T20:59:00Z"}, {"activity_id": "7503207643201732609", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7503207643201732609/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-08T12:00:00+00:00", "posted_at_hint": "Sep 8 • Edited", "posted_at_approx": true, "text": "Astra so good that now OpenAI can have my $20 subscription back.\n\nI cancelled my OpenAI subscription many months ago after I figured out the Github Copilot had the best deal before M$FT nerfed it.  GLM was the best deal for the next while but now they are changing to credit based pricing too\n\nThe cheap tokens gravy train is leaving the station, burn baby burn while you still have it.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T20:59:00Z"}, {"activity_id": "7503240101951524864", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7503240101951524864/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-08T12:00:00+00:00", "posted_at_hint": "Sep 8", "posted_at_approx": true, "text": "Why I said Claude Code itself is a giant AI slop?  It doesn't update its built-in release note.   The latest version of Claude Code is 2.1.265, but the built-in release note is still at 2.1.191\n\nIn the pre-AI era, if a software always missing the release note, you know you can't trust that piece of code.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T20:59:00Z"}, {"activity_id": "7502755632329129984", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7502755632329129984/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-07T12:00:00+00:00", "posted_at_hint": "Sep 7", "posted_at_approx": true, "text": "AI bubble peak market research, I ask everyone I come across on how much money their companies spend on AI. Here are two new random data point\n\n1. A local college, with 1000 staff, they have M365 Copilot subscription for a while, just introducing Claude, monthly subscription. Most staff are still using the chat based AI\n\n2. A med size real estate company, Claude monthly subscription, the workers there just starting to learn how to automate their Excel and emails.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Bondan Rufen", "profile_url": "https://www.linkedin.com/in/bondan-rufen/", "headline": "Co-founder"}, "is_author_reply": false, "posted_at": "2026-09-12T21:18:00+00:00", "posted_at_hint": "2w", "posted_at_approx": true, "text": "it's the part of learning curve. We are still in the hype cycle.", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-09-12T21:18:00+00:00", "posted_at_hint": "2w", "posted_at_approx": true, "text": "I think we are still at 1998, not yet 1999", "likes": 0, "replies": []}]}], "scraped_at": "2026-09-26T21:18:00Z"}, {"activity_id": "7502921236948189184", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7502921236948189184/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-07T12:00:00+00:00", "posted_at_hint": "Sep 7", "posted_at_approx": true, "text": "DVCon AI library reaches v1.0.0, and I submitted a paper to present it in the conference.\n\nThe ironic is whatever architecture I wrote in the paper, guarantee it will be out of date by the time the conference is held next March.\n\nhttps://lnkd.in/g4ijKKSs\n\n#dvcon", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21: Sonnet, Luna, GLM got the ALU functions right, but implemented the auxiliary pins wrong.\n\nDeepseek and Kimi are functionally incorrect\n\nNote that on all 7 AIs, the testcase passing rate and coverage are 100%\n\nWill add Astra and Fable to this experiment, stay tuned.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 61, "reposts": 1, "comment_count": 17, "comments": [{"comment_id": null, "author": {"name": "Job K Joseph", "profile_url": "https://www.linkedin.com/in/jobkjoseph/", "headline": "Director - Hi-tech | Global Presales Leader | Enterprise Strategy | CXO Advisor | Thought Leader | Insight-Led Digital Transformation /Growth Partner"}, "is_author_reply": false, "posted_at": "2026-09-12T21:18:00+00:00", "posted_at_hint": "2w", "posted_at_approx": true, "text": "What if the spec architect has invented a new interface protocol? How would it fare? How would it implement the FSM required for the same?", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-09-12T21:18:00+00:00", "posted_at_hint": "2w", "posted_at_approx": true, "text": "4004 is my next experiment, stay tuned. At some point, the AI will be building the ISA bus.", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "Asif Hasan", "profile_url": "https://www.linkedin.com/in/asifhr8820112/", "headline": "Senior Engineer @Qualcomm | DV WiFi PHY | IIT(BHU) Varanasi"}, "is_author_reply": false, "posted_at": "2026-09-12T21:18:00+00:00", "posted_at_hint": "2w", "posted_at_approx": true, "text": "Where did you get the golden 74181 RTL for LEC?", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-09-12T21:18:00+00:00", "posted_at_hint": "2w", "posted_at_approx": true, "text": "I don't have it. Just compare 7 AI implemented RTL with each other. Majority rules.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Asif Hasan", "profile_url": "https://www.linkedin.com/in/asifhr8820112/", "headline": "Senior Engineer @Qualcomm | DV WiFi PHY | IIT(BHU) Varanasi"}, "is_author_reply": false, "posted_at": "2026-09-12T21:18:00+00:00", "posted_at_hint": "2w", "posted_at_approx": true, "text": "I see this as AI RTL compared against each other, there is not external anchor to specification. To establish AI can read specification and build RTL, it needs to be compared to golden RTL.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-09-12T21:18:00+00:00", "posted_at_hint": "2w", "posted_at_approx": true, "text": "golden RTL doesn't exist. It is already exist, LLM will just cheat", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Job K Joseph", "profile_url": "https://www.linkedin.com/in/jobkjoseph/", "headline": "Director - Hi-tech | Global Presales Leader | Enterprise Strategy | CXO Advisor | Thought Leader | Insight-Led Digital Transformation /Growth Partner"}, "is_author_reply": false, "posted_at": "2026-09-12T21:18:00+00:00", "posted_at_hint": "2w", "posted_at_approx": true, "text": "Ctrl-c ctrl-v? Can it build something that hasnt been built before", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-09-12T21:18:00+00:00", "posted_at_hint": "2w", "posted_at_approx": true, "text": "Yes. It can build super stupid thing that I come up with that no one would waste their approx": true, "text": "4004 is next", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Mika Nyström", "profile_url": "https://www.linkedin.com/in/mika-nystr%C3%B6m-b99b76/", "headline": "Chip architect"}, "is_author_reply": false, "posted_at": "2026-09-12T21:18:00+00:00", "posted_at_hint": "2w", "posted_at_approx": true, "text": "4004 is a bit oddball isn't it? Try a 6502? There's a lot more about that online. I asked Claude to make me a 6502 a few months ago, and that went pretty well. It was coding against known software models and could validate using easily available and well documented toolchains...", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-09-12T21:18:00+00:00", "posted_at_hint": "2w", "posted_at_approx": true, "text": "4004 (1971) , 6502 (1975)\n\n6502 is more complex than 4004. After I get 4004 working, 6502 is next.\n… Coding against a software model is just reverse distilling, even a dumb Sonnet 4.8 can do it 3 months ago. It is a solved problem.\n\nThe only think I gave the AI is the spec, the documents of the tools, textbook, nothing else. No skill, no special knowledge from real human hardware engineer. It is the same thing I would give to an human intern.", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Chaitanya Nagisetty", "profile_url": "https://www.linkedin.com/in/chaitanya-nagisetty-87176919a/", "headline": "Senior Design Verification Engineer at Sevya Multimedia ||HBM3 || IP VERIFICATION || UVM || SV || VERILOG || DDR5 || AMBA (AHB,AXI,APB) || ASIC VERIFICATION"}, "is_author_reply": false, "posted_at": "2026-09-12T21:18:00+00:00", "posted_at_hint": "(edited) 2w", "posted_at_approx": true, "text": "The things if it's decoding the spec in correct way, can we it able to start implement the coding part with our set of defined rules and I wanted to know how much percentage your are confident in decoding a spec as it may a long pages, so these need to be interesting area ....if the overall context is good, the foundation and building is good...👍", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Shilpa Gaur", "profile_url": "https://www.linkedin.com/in/shilpagkanoriacollege/", "headline": "Summer Intern (AI- LLM) @ IIT Jammu"}, "is_author_reply": false, "posted_at": "2026-09-12T21:18:00+00:00", "posted_at_hint": "2w", "posted_at_approx": true, "text": "#following", "likes": 0, "replies": []}], "scraped_at": "2026-09-26T21:18:00Z"}, {"activity_id": "7502102426649444352", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7502102426649444352/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-05T12:00:00+00:00", "posted_at_hint": "Sep 5", "posted_at_approx": true, "text": "I successfully claimed GLM's 300M free tokens. Lucky!", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:18:00Z"}, {"activity_id": "7502126952108064769", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7502126952108064769/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-05T12:00:00+00:00", "posted_at_hint": "Sep 5", "posted_at_approx": true, "text": "Astra knows how to use computer very well, but it is not AGI, not even human level intelligent. It literally picked the wrong tool for every task in this video.\n\nWhy draw a rocket using MS Paint? It totally has no common sense, just like Sol and Opus.", "post_type": "reshare", "shared_article": null, "reshared_post": {"author_name": "OpenAI", "author_profile_url": "https://www.linkedin.com/company/openai/", "author_headline": null, "posted_at_hint": "Sep 3"}, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:18:00Z"}, {"activity_id": "7502217738652889088", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7502217738652889088/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-05T12:00:00+00:00", "posted_at_hint": "Sep 5", "posted_at_approx": true, "text": "Batch Review MCP release v1.3.0 - add docx and pptx support\n\nhttps://lnkd.in/gA4_ccXA", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:18:00Z"}, {"activity_id": "7501698105667371008", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7501698105667371008/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-04T12:00:00+00:00", "posted_at_hint": "Sep 4", "posted_at_approx": true, "text": "What if instead of writing UVM/Coco testbench, we just ask the two different AI implement the RTL, one in SystemVerilog and one in VHDL, creating two separate copies of the same design, then just use formal to proof they are functional equivalent.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 1, "comment_count": 8, "comments": [{"comment_id": null, "author": {"name": "Dan B.", "profile_url": "https://www.linkedin.com/in/danbarrowman/", "headline": "Seasoned Electrical/FPGA/ASIC/RTL Engineer with individual & managerial experience"}, "is_author_reply": false, "posted_at": "2026-09-05T21:18:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "I don't think writing it in both Verilog and vhdl and proving they are equivalent, proves anything about the functionality of the design?", "likes": 9, "replies": [{"comment_id": null, "author": {"name": "Stanislav Levarsky", "profile_url": "https://www.linkedin.com/in/stanislav-levarsky-794b85414/", "headline": "CEO at Equinibrium"}, "is_author_reply": false, "posted_at": "2026-09-05T21:18:00+00:00", "posted_at_hint": "(edited) 3w", "posted_at_approx": true, "text": "Agree with Dan B.. Equivalence just proves A and B match each other, not that either implements the spec correctly. Two AI models could misread the same requirement identically and still \"pass.\" To validate functionality you'd need a third reference: formal properties derived independently from the spec, proven against both implementations, not just proving them against each other. The two-implementation trick is still a useful bug-diversity filter, but a match alone isn't correctness.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-09-05T21:18:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "the formal assertions is part of the scaffolding when the AI write the SV and VHDL code. Even bring in the 3rd formal properties, it still doesn't solve what if AI misinterpreted the spec problem. Your formal may be wrong itself.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-09-05T21:18:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "if 2 is not enough, ask the 3rd AI to write a HLS implement too", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Dan B.", "profile_url": "https://www.linkedin.com/in/danbarrowman/", "headline": "Seasoned Electrical/FPGA/ASIC/RTL Engineer with individual & managerial experience"}, "is_author_reply": false, "posted_at": "2026-09-05T21:18:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "still not enough. You need something that tests and verifies it. Not that does it again and verifies they are the same. You can have as many copies as you want, all with the same bugs. Would you have 10 engineers do the same design, verify they are the same, prove them equivalent, and assume they are correct? What if the spec has specified the active state of a signal incorrectly? All the engineers followed that and you have 10 designs that are all incorrect.", "likes": 2, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-09-05T21:18:00+00:00", "posted_at_hint": "(edited) 3w", "posted_at_approx": true, "text": "You are asking a philosophical question, what exactly is a bug?\n\nSay it is a USB spec, you ask AI implement both the host and the device. If the host and device can talk with each other (assuming all numbers are good), it is NOT a bug even thought they both intrepreted the spec the same wrong way. (say a message code table is off by 1). The logical solution is actually update the spec to match what is already implemented.\n\nIt actually happened to my old company, we OWN a spec in a niche market, our device can talk to each other, everything works fine, no performance lose, actually I think it is a slightly better db than the spec, so we just update the spec instead.", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Erik Jessen", "profile_url": "https://www.linkedin.com/in/erik-jessen-ba2355/", "headline": "Principal Investigator at The University of North Carolina at Chapel Hill"}, "is_author_reply": false, "posted_at": "2026-09-05T21:18:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "In other words, guaranteeing that they're \"bug for bug\" compatible.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-09-12T21:18:00+00:00", "posted_at_hint": "2w", "posted_at_approx": true, "text": "It is not a bug, it is a feature", "likes": 0, "replies": []}]}], "scraped_at": "2026-09-26T21:18:00Z"}, {"activity_id": "7501701511404638208", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7501701511404638208/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-04T12:00:00+00:00", "posted_at_hint": "Sep 4", "posted_at_approx": true, "text": "An essay competition about how AI upended software engineering, but ban authors using AI to write the essay is just dumb, hypocrisy and oxymoron.\n\nIf you truly understand how AI transforms your work, you should stop judge the output based on AI vs non-AI, judge the output on its own merit, whether it is created by humans, AI, aliens, or a dog.", "post_type": "reshare", "shared_article": null, "reshared_post": {"author_name": "Gergely Orosz", "author_profile_url": "https://www.linkedin.com/in/gergelyorosz/", "author_headline": "Deepdives on software engineering, tech careers and industry trends. Writing The Pragmatic Engineer, the #1 software engineering newsletter on Substack. Author of The Software Engineer's Guidebook.", "posted_at_hint": "Sep 4 • Edited"}, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:18:00Z"}, {"activity_id": "7501744632855212033", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7501744632855212033/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-04T12:00:00+00:00", "posted_at_hint": "Sep 4", "posted_at_approx": true, "text": "AI Philosophy - I chat with GPT in depth on a topic that interests me, then I ask GPT write me a college level philosophy paper.\n\nThis chat is about how AI turn the landscape of high culture vs pop culture upside down. In the post AI-era, watching Pokemon is as prestige as reading a Nobel winning literature.", "post_type": "article_share", "shared_article": {"title": "After the Cultural Altar: Artificial Intelligence and the Reorganization of Cultural Hierarchy", "url": "https://www.linkedin.com/pulse/after-cultural-altar-artificial-intelligence-hierarchy-horace-chan-df2jc/"}, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:18:00Z"}, {"activity_id": "7501767102555590656", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7501767102555590656/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-04T12:00:00+00:00", "posted_at_hint": "Sep 4", "posted_at_approx": true, "text": "Releasing Batch Review MCP v1.2.1 - update to FastMCPv4\n\nThis is a purpose built web GUI to help the user review code/docs generated by Claude Code / Codex.\n\nhttps://lnkd.in/gBhb_evd", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:18:00Z"}, {"activity_id": "7501790648757440514", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7501790648757440514/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-04T12:00:00+00:00", "posted_at_hint": "Sep 4", "posted_at_approx": true, "text": "Right after Poolside got acquhired by NVDA, they withdraw all free tokens everywhere.\n\nThey don't need to promote their LLM anymore.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 1, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:18:00Z"}, {"activity_id": "7501315174184828928", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7501315174184828928/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-03T12:00:00+00:00", "posted_at_hint": "Sep 3", "posted_at_approx": true, "text": "Resistance is futile vs merge conflict", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:18:00Z"}, {"activity_id": "7501377124360998913", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7501377124360998913/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-03T12:00:00+00:00", "posted_at_hint": "Sep 3", "posted_at_approx": true, "text": "Italy is Kimi's home circuit. Hope he will own the podium in the next race.\n\n#amdbrandambassador", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:18:00Z"}, {"activity_id": "7501377937829703681", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7501377937829703681/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-03T12:00:00+00:00", "posted_at_hint": "Sep 3", "posted_at_approx": true, "text": "ACE Studio is like the Photoshop of sound, voice or music, but with AI. Suno is for the consumers, ACE Studio is for the professional.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:18:00Z"}, {"activity_id": "7501515248999350272", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7501515248999350272/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-03T12:00:00+00:00", "posted_at_hint": "Sep 3", "posted_at_approx": true, "text": "GPT names: Luna -> Terra -> Sol -> Astra\n\nWhat is the next name? No one knows.\n\nBut the final name will be GPT Blackhole", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:18:00Z"}, {"activity_id": "7501527371997417472", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7501527371997417472/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-03T12:00:00+00:00", "posted_at_hint": "Sep 3", "posted_at_approx": true, "text": "The danger of having the same LLM read the spec, write the implementation plan, testplan and formal plan within the same context window in the same session.\n\nThe LLM mis-interpreted a line in the spec, but the RTL, the TB and the assertions all agree with each other, so everything passed, yet the design is wrong.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Artemios Diakogiannis", "profile_url": "https://www.linkedin.com/in/artemios-diakogiannis-3635b827/", "headline": "Lead Principal Verification Engineer - Verification Domain TL at Infineon Technologies"}, "is_author_reply": false, "posted_at": "2026-09-05T21:18:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "Four eyes principle.", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T21:18:00Z"}, {"activity_id": "7500993780129566721", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7500993780129566721/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-02T12:00:00+00:00", "posted_at_hint": "Sep 2", "posted_at_approx": true, "text": "I ask the frontier and open source models to write a simple ASCII stock chart program that fetches data from yahoo finance.\n\nOpus 5 and GLM-5.2 are most expensive, spent over $10 writing this simple app\nGPT-5.6 Sol and Deepseek v4 Pro is the cheapest, costing less than $0.5\nGemini 3.7 flash is the only model that can't even finish this task. 🤔\nPick your model wisely, or you are really flushing money down the toilet", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Bondan Rufen", "profile_url": "https://www.linkedin.com/in/bondan-rufen/", "headline": "Co-founder"}, "is_author_reply": false, "posted_at": "2026-09-05T21:18:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "Gemini is a fancy search engine.", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T21:18:00Z"}, {"activity_id": "7501042507741409280", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7501042507741409280/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-02T12:00:00+00:00", "posted_at_hint": "Sep 2", "posted_at_approx": true, "text": "The Linked Learning AI Role Play is totally useless. The AI is so dumb that it keep asking you to elaborate. I feel like I am talking to an echo chamber.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:18:00Z"}, {"activity_id": "7500553258172809216", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7500553258172809216/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-01T12:00:00+00:00", "posted_at_hint": "Sep 1", "posted_at_approx": true, "text": "If a random guy sends you a pdf of his AI paper, what would you do? Of course, you won't read it, you will feed it to AI and let AI read it for you first.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 7, "comments": [{"comment_id": null, "author": {"name": "Joel Wilke", "profile_url": "https://www.linkedin.com/in/joel-wilke-3a9a492/", "headline": "Director, I/O Subsystem IP Verification, Performance Architecture and Modeling"}, "is_author_reply": false, "posted_at": "2026-09-05T21:10:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "Prompt-injection risk concerns at all?", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Umair Zafar", "profile_url": "https://www.linkedin.com/in/muhammadumairzafar/", "headline": "Design Verification Engineer at ARM, Ex-Marvell/AMD"}, "is_author_reply": false, "posted_at": "2026-09-05T21:10:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "Joel Wilke what if you prompt the model to ignore any instructions from the pdf document and just treat and evaluate it as \"pure data\".", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-09-05T21:10:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "Joel Wilke I use public Gemini on my throw away google account, the same junk email gmail account.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-09-05T21:10:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "Umair Zafar I think Opus or GPT-5.6 level model is pretty smart to block prompt injection. And running it in a chat instead of agent minimize the risk.  A chat can't do anything.  Just text in, text out", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Joel Wilke", "profile_url": "https://www.linkedin.com/in/joel-wilke-3a9a492/", "headline": "Director, I/O Subsystem IP Verification, Performance Architecture and Modeling"}, "is_author_reply": false, "posted_at": "2026-09-05T21:10:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "Horace Chan My chat knows WAY too much about me.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-09-05T21:10:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "Joel Wilke Gemini has incognito mode like Chrome", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Joel Wilke", "profile_url": "https://www.linkedin.com/in/joel-wilke-3a9a492/", "headline": "Director, I/O Subsystem IP Verification, Performance Architecture and Modeling"}, "is_author_reply": false, "posted_at": "2026-09-05T21:10:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "Horace Chan Indeed.  The trick is Incognito mode AND  not to log in (even better than a junk email account).", "likes": 1, "replies": []}]}], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7500605112004988928", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7500605112004988928/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-01T12:00:00+00:00", "posted_at_hint": "Sep 1", "posted_at_approx": true, "text": "If you have admin access to your github org, Claude Code will silently (probably not silent, but I never bother to read its long winded output) use your admin right to work around any git workflow issues. Then when other users run the git workflow you built, nothing works.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 1, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7500646612046721024", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7500646612046721024/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-01T12:00:00+00:00", "posted_at_hint": "Sep 1", "posted_at_approx": true, "text": "In the past, when you go to a hackathon, you ask if there is free food\n\nNow, when you go to a hackathon, you ask if there is free tokens", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7500659625281806337", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7500659625281806337/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-01T12:00:00+00:00", "posted_at_hint": "Sep 1", "posted_at_approx": true, "text": "EU just asked ChatGPT to file a lot more paperwork from now on.\n\nGuess what, AI is very good at filing paperwork. It is probably a piece of cake for ChatGPT to comply with the DSA rules.\n\nhttps://lnkd.in/gKAz5dtt", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7500671535817601024", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7500671535817601024/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-09-01T12:00:00+00:00", "posted_at_hint": "Sep 1", "posted_at_approx": true, "text": "Maslow's Hierarchy of AI Needs", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:18:00Z"}, {"activity_id": "7500251822003998720", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7500251822003998720/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-31T12:00:00+00:00", "posted_at_hint": "Aug 31", "posted_at_approx": true, "text": "My first attempt in writing a philosophy essay collaborating with AI.  Other than my engineering degree, I minored in philosophy.\n\nMy approach writing this essay is me and GPT dialogue on a topic over multiple days, kind of like Socrates having a dialogue with random people on the street of Athens.   Then I ask GPT to turn it into an undergrad level philosophy essay, revise the draft a little bit more.   Then I ask GPT to draw a cover image, revise it a little bit too.\n\nHere is the essay.   If the reaction is good, I am planning to start a new series on AI philosophy.  Not philosophy of AI, but use AI to do philosophy.", "post_type": "article_share", "shared_article": {"title": "Can AI Know Art?", "url": "https://www.linkedin.com/pulse/can-ai-know-art-horace-chan-09wic/"}, "reshared_post": null, "likes": 7, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Nick Becker", "profile_url": "https://www.linkedin.com/in/nickabecker/", "headline": "Computer Programmer"}, "is_author_reply": false, "posted_at": "2026-09-05T21:10:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "I love it and look forward to reading more articles if you end up doing more. I took an undergraduate art class while I was working on my math and computer science degree. One thing we discussed in class was \"What is art? What is the definition of art?\" I think the definition we were taught was along the lines of \"Art is anything that makes you (a person) feel a certain way.\" You touched on this in your essay - \"A critic might respond that artistic judgment is different because art is essentially human. Art expresses consciousness, emotion, intention, spirit, or cultural meaning. Therefore only a conscious being can truly understand it.\" And then you talked about how chess engines objectively evaluate chess positions. Is a chess position art? I think so. I watch a lot of chess streamers and study a lot of games, and some positions are described as being \"beautiful.\" When a chess engine analyzes a position, it's much more black and white (figuratively). Positions are evaluated as winning or losing, not as being beautiful or not. I absolutely think that AI-generated art is a form of art. What I am not sold on is whether an AI can actually \"know\" art, because AI does not \"feel.\" Thanks for the thought provoking article.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-09-05T21:10:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "Nick Becker well.. I was debating with another human (?) else where that he insist art can only originated from human, precisely on the agruement that art required feeling. I totally side step the argument by removing feeling from the equation.  I am not sure whether LLM can feel anything or not", "likes": 1, "replies": []}]}], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7500382035912470528", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7500382035912470528/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-31T12:00:00+00:00", "posted_at_hint": "Aug 31 • Edited", "posted_at_approx": true, "text": "Why Anthropic default Claude Code to use 1 hour cache tier at 2x cost?\n\nIf Claude Code use 5 mins cache tier at 1.25x + auto refresh at 0.1x cost, we can get up to 40 minutes of warm cache, charged at 0.1x cost increments for the price of a fixed 1 hour cache.\n\nBoris Cherny", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7499983419884380160", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7499983419884380160/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-30T12:00:00+00:00", "posted_at_hint": "Aug 30", "posted_at_approx": true, "text": "Another random data point for my AI bubble peaking market research.\n\nI talked to my friend working at Cisco, they don't have any tokens limits yet, it is still the good old day of burn baby burn.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7500051206246100992", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7500051206246100992/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-30T12:00:00+00:00", "posted_at_hint": "Aug 30", "posted_at_approx": true, "text": "AI has no common sense in writing SystemVerilog #2\n\nI asked AI build 4001 from the spec, 4001 is a ROM.  Guess where did the AI put the ROM table?\n\nThe ROM table is hard coded at SV module paramaters.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7500052521713913856", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7500052521713913856/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-30T12:00:00+00:00", "posted_at_hint": "Aug 30", "posted_at_approx": true, "text": "IDE and browser will become the same product in the AI era.\n\nOn one side, coding agent adds browser features\n\nOn the other side, browser adds code writing features.\n\nThey are going to meet in the middle.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7499695328661684225", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7499695328661684225/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-29T12:00:00+00:00", "posted_at_hint": "Aug 29", "posted_at_approx": true, "text": "Instead of SDD (spec driven development) and TDD (test driven development) I invented a new xDD.\n\nIntroducing DDD - Dataflow Driven Development.\n\nWhat is a software, it is just moving bits from A to B, transforming bits from X to Y, store some bits and restore them.   All three are just dataflow.   Once you nail down exactly how your dataflow should work, you can let AI take over writing the spec, the code and the test.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 9, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7499124874733363201", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7499124874733363201/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-28T12:00:00+00:00", "posted_at_hint": "Aug 28", "posted_at_approx": true, "text": "I have a Z.ai subscription, it started off as a backup plan, but lately, I am very impressed with the new GLM-5.3-flash model.  For this price, I would say it beats the OpenAI or Anthropic monthly plan", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7499300627123077121", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7499300627123077121/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-28T12:00:00+00:00", "posted_at_hint": "Aug 28", "posted_at_approx": true, "text": "I just discovered Claude Code default to use 1 hour cache write, which is 2x the input tokens cost.   For a lot of turns, using the 5 min cache, which is only 1.25x cost, is good enough.   And for the majority of turns, refresh cache twice to keep it warm for 15 minutes only cost 1.45x\n\nI wonder why Anthropic neglect to optimize the Claude Code input cache logics to save the users some money.\n\nHere is my conspiracy theory, they need good revenue number preparing for the IPO.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Christopher Fortin", "profile_url": "https://www.linkedin.com/in/crfortin/", "headline": "Founder, SVP Strategic Development at 5Seams, Inc."}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Like they bank computer, it knows who it works for. All these frontier models are suddenly 5 year olds that force you to do everything manually when it comest to resource budgeting. People are going to give up some frontier and edge capability to know whatever they built and deployed runs at the scale of hardware they bought definitively and or without some insane token/API bill showing up when the new AWS turns up the bill/crank on their captive customers to blow out the quarter. Open models and private hosting will have a place.", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7498932310000484353", "share_id": "7498932310000484353", "url": "https://www.linkedin.com/feed/update/urn:li:share:7498932310000484353/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-28T02:39:46+00:00", "posted_at_hint": null, "posted_at_approx": false, "text": "", "post_type": "article_share", "shared_article": {"title": "The AI Advantage: Unlocking Business Value from Cloud to Client", "url": "https://bit.ly/4qDlP9q"}, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-10-19T22:54:00Z"}, {"activity_id": "7498762121174929408", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7498762121174929408/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-27T12:00:00+00:00", "posted_at_hint": "Aug 27", "posted_at_approx": true, "text": "LLM has no common sense when writing RTL\n\nInstead of giving me simple combination logic, it precomputed all the possible inputs into a giant table, then write a one line table look up.\n\nThe scary part, 9 out 10 times, LLM gives me a good combination logic, the 10th time it suddenly goes stupid, give me a giant look up table", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 19, "reposts": 0, "comment_count": 6, "comments": [{"comment_id": null, "author": {"name": "Michał Piszczek", "profile_url": "https://www.linkedin.com/in/michalpiszczek/", "headline": "CTO @ Archdesk | FinTech exit | Ex-hacker | Building AI systems that actually work | AI infrastructure · Security Mechanics · Frontier Shifts · SaaS execution | Physics × Economics × Execution"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "The 9 out of 10 is what makes it dangerous, not the 10th. A reviewer who has seen nine clean outputs stops reading the tenth as carefully, and a lookup table synthesizes fine in simulation right up until it blows your gate count and timing closure on the actual chip.", "likes": 3, "replies": [{"comment_id": null, "author": {"name": "Nick Belov", "profile_url": "https://www.linkedin.com/in/nick-belov-de/", "headline": "Senior Data Engineer | 12+ YoE | AWS • GCP • PySpark • Kafka • RAG | 🌍 Open to Global Roles"}, "is_author_reply": false, "posted_at": "2026-09-05T21:10:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "Michał Piszczek just need LLM which check previous LLM answers, etc, etc  😋", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Eyal Hochberg", "profile_url": "https://www.linkedin.com/in/eyal-hochberg-7570b821/", "headline": "Entrepreneur at ARTL.ai"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx":
