all.", "likes": 0, "replies": []}]}], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7458233799278006273", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7458233799278006273/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-07T12:00:00+00:00", "posted_at_hint": "May 7", "posted_at_approx": true, "text": "AMD's road to 600, one earning at a time.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 19, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7457919757875335168", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7457919757875335168/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-06T12:00:00+00:00", "posted_at_hint": "May 6", "posted_at_approx": true, "text": "Here is the GPT5.5 version of the Chiro posture analysis app\n\nI have to kick the AI 3 times to get it finish the job.\n\nThe first time it just stop and ask me stupid questions where I explicitly told it DON'T ask me any questions.\n\nThe 2nd time it gave me a mock up without any ML analysis.\n\nThe last time it screwed up some minor run script in docker setup\n\nOn the other than Opus 4.7 can generate the same app in one shot\n\nhttps://lnkd.in/gqk9SVDw\nGitHub - hevangel/posture_health_report_gpt55 (github.com)", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7456163612035047424", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7456163612035047424/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-01T12:00:00+00:00", "posted_at_hint": "May 1", "posted_at_approx": true, "text": "I think harnesses engineering is already out of date.  Opus with Claude Code is smart enough to orchestrate itself.\n\nHere is my workspace structure.\nOne master repo, each piece is a sub module that has its own repo\nThe master Claude Code kick starts everything and keeps track of what is going on in the sub module.\nIt kicks off CC instances running in the sub modules.\n\nHere is the beautiful part.  If the CC instances in the sub module are stuck, the master just kills that CC and notifies the human.\nHuman can fire up CC in that submodules in a terminal and fix what's wrong.\nOr the master CC can change the memory of the sleeping CC, then wake it up again after it is transplant with the new memory", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7456183257039032320", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7456183257039032320/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-01T12:00:00+00:00", "posted_at_hint": "May 1", "posted_at_approx": true, "text": "The story points in Jira should change to token points", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7455656953826947072", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7455656953826947072/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-30T12:00:00+00:00", "posted_at_hint": "Apr 30", "posted_at_approx": true, "text": "You can't ask ChatGPT or Anthropic up there in the space, you have to bring the AI with you run in locally in the spaceship.\n\n#AMDBrandAmbassador\nAI in Space: Start at the Edge, Build for the Mission (amd.com)", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7455657482489683968", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7455657482489683968/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-30T12:00:00+00:00", "posted_at_hint": "Apr 30", "posted_at_approx": true, "text": "Electricity is the final bottleneck of this AI evolution.  They can build all the chips and all the data centers, but without power, they won't run.  How to squeeze more tokens per watt is a real competitive advantage in the up coming AI era.\n\n#AMDBrandAmbassador\n(video attachment)", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7455737491824771072", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7455737491824771072/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-30T12:00:00+00:00", "posted_at_hint": "Apr 30", "posted_at_approx": true, "text": "\"You can outsource your thinking, but you can't outsource your understanding\" - Andrej Karpathy", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7455768281048588288", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7455768281048588288/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-30T12:00:00+00:00", "posted_at_hint": "Apr 30", "posted_at_approx": true, "text": "You don't have to run faster than the bear, you just need to run faster than your friend.\nYou don't have to be better than AI, you just need to adopt AI faster than your colleagues, so AI will replace them first.\nThey still need someone to babysit the AI, kick it and tell it to work harder every 2 hours.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7455858380612734976", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7455858380612734976/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-30T12:00:00+00:00", "posted_at_hint": "Apr 30 (edited)", "posted_at_approx": true, "text": "I think I finally came out on the other side of the post AI economy as I on the path to fully automated 80% of my job.\n\nHuman still have jobs, AI (at least this generation, the LLM) can't replace human totally.   There is an equilibrium on the other side.  It is scary during the transition because the slope of productivity suddenly jump from 1 to 10.  After you have reached the other side, the speed is much faster but it is no longer accelerating.\n\nIt just feels like the same, you are as busy as before, work doesn't disappear, it never ends, but you produce a lot more.\n\nhttps://lnkd.in/guiBiQiD", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 7, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7452748223296770048", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7452748223296770048/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-22T12:00:00+00:00", "posted_at_hint": "Apr 22", "posted_at_approx": true, "text": "You don't need Opus 4.7 or GPT-5.4 for everything.   Opensource model like Gemma 4 is good enough for many easier tasks.  Running LLM on your own hardware is good enough for many use cases, especially when you are serving external users who don't pay.   Why give them the best model if they are not paying?\n\n#AMDBrandAmbassador\nAI at the Edge: S3 E2 (youtube.com)", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Michael Chan", "profile_url": "https://www.linkedin.com/in/michael-kh-chan/", "headline": "Security Engineer @ Clarity | AI Security | AppSec | OSCP, OSWE, OSEP"}, "is_author_reply": false, "posted_at": "2026-04-29T21:50:00+00:00", "posted_at_hint": "5mo", "posted_at_approx": true, "text": "Just serve free Gemini keys to the non-paid users, save your electricity bill too!", "likes": 2, "replies": []}], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7452748806888132608", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7452748806888132608/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-22T12:00:00+00:00", "posted_at_hint": "Apr 22", "posted_at_approx": true, "text": "It is a misconception that x86 is more power hungry than ARM.   For some workload, like mobile phone, ARM is better optimized for battery consumption.   For data center and AI workload, x86 is still the king in performance per watt.\n\n#AMDBrandAmbassador\nFrom Chips to Clusters: Scaling AI Efficiently by Design (bit.ly)", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7452757706722983936", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7452757706722983936/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-22T12:00:00+00:00", "posted_at_hint": "Apr 22", "posted_at_approx": true, "text": "To all the AI startups, you have to publish your demo out in the public so I can see what it really is.   Don't ask me to contact you to ask for a demo.  Stop wasting my time.\n\nIf you really want me to contact you, setup a MCP server, so my AI agent can contact your AI agent on my behalf.\n\nIf you jealously guarding your idea, thinking someone will copy it away when they see your demo, then you have a real problem.  Your product has no moat.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7452369231377010688", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7452369231377010688/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-21T12:00:00+00:00", "posted_at_hint": "Apr 21", "posted_at_approx": true, "text": "Claude Code helped me figure out how to add a Chatbot to a static page hosting at github.io (http://github.io)\nThe Gemma4 model is small enough that you can run it inside your browser, so static webpage can support AI chat now.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7452424398558470144", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7452424398558470144/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-21T12:00:00+00:00", "posted_at_hint": "Apr 21", "posted_at_approx": true, "text": "In the past, reusable perl/python scripts are common to the project team, your own IDE plugins/extensions, .vimrc are personal.  The line is pretty clear.\n\nIn the AI era, what should be common and what should be personal?  Is skill something common or something personal?   No one has the right answer at the moment.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7449821570065154048", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7449821570065154048/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-14T12:00:00+00:00", "posted_at_hint": "Apr 14", "posted_at_approx": true, "text": "what's next?\n2024 - prompt engineering\n2025 - context engineering\n2026 - harness engineering\n2027 - ??? engineering\n\nhttps://lnkd.in/gXwbKYwF\nPeter Pang (@intuitiveml) on X (x.com)", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7449909088496574464", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7449909088496574464/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-14T12:00:00+00:00", "posted_at_hint": "Apr 14", "posted_at_approx": true, "text": "In the past, when you do code review, you have to explain to the writer why their code sucks.  It is a lot of work if they don't agree and try to argue with you.\n\nNow with AI, you can just ask the writer dumps his code to AI and let AI be the judge.   He has to listen to AI; AI is fair and is the authority.   No heated debate, no ego got hurt.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7449495605430632448", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7449495605430632448/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-13T12:00:00+00:00", "posted_at_hint": "Apr 13 (edited)", "posted_at_approx": true, "text": "I visited Kennedy Space Center the week before the launch, I got to see Artmeis up close.   It is a\nSee my photo of Artmeis on the first comment\n#AMDBrandAmbassador", "post_type": "reshare", "shared_article": null, "reshared_post": {"author_headline": null, "author_name": "AMD", "author_profile_url": "https://www.linkedin.com/company/amd/", "posted_at_hint": null, "reshared_text": "Continuing the success of Artemis I, NASA's Artemis II mission marked a major step forward in crewed [space exploration]... Congratulations to NASA - National Aeronautics and Space Administration, its partners, and contractors on reaching an incredible milestone in lunar exploration! (photo credits: NASA/Joel Kowsky, NASA/Kim Shiflett)"}, "likes": 2, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-04-29T21:50:00+00:00", "posted_at_hint": "5mo", "posted_at_approx": true, "text": "(image-only comment: photo of Artemis)", "likes": 0, "replies": []}], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7449322626637824000", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7449322626637824000/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-12T12:00:00+00:00", "posted_at_hint": "Apr 12 (edited)", "posted_at_approx": true, "text": "In the year 2026, if you are still thinking how to build a chip, you are already out of date. You have to think about how to build an AI dark factory that can build the chips for you. The abstraction and meta narrative is one level up.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7448959264670253056", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7448959264670253056/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-11T12:00:00+00:00", "posted_at_hint": "Apr 11", "posted_at_approx": true, "text": "I just learn something new about Unicode, the following \"thing\" is ONE\ncharacter.  I am sure no human would explain this totally useless knowledge to me other than AI.\nZ̧̛̫̞̯̺̞͍̤̗̜̪̩͑͗̓͛͆̎̍͌̾̇̈́͗̋͘͟͝͠͞", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7446946506932215808", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7446946506932215808/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-06T12:00:00+00:00", "posted_at_hint": "Apr 6", "posted_at_approx": true, "text": "Short SNPS and CDNS?\n\nhttps://lnkd.in/dX84D3-J\nBuilding an Open-Source Verilog Simulator with AI: 580K Lines in 43 Days - Normal Computing (normalcomputing.com)", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 14, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Ronan Barzic", "profile_url": "https://www.linkedin.com/in/ronan-barzic-86a3b62/", "headline": "Director of IC design at ONiO"}, "is_author_reply": false, "posted_at": "2026-03-30T21:50:00+00:00", "posted_at_hint": "6mo", "posted_at_approx": true, "text": "The link provided in the arcticle (https://github.com/thomasnormal/circt) is not valid", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": null, "posted_at_hint": null, "posted_at_approx": true, "text": "(mentioning Ronan Barzic) maybe it is AI slop vaperware?", "likes": 0, "replies": []}]}], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7446591621887950848", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7446591621887950848/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-05T12:00:00+00:00", "posted_at_hint": "Apr 5 (edited)", "posted_at_approx": true, "text": "Am I the only one who thinks VSCode GitHub Copilot is better than Claude Code.\nI have unlimited Claude tokens at work, I only have a $20 Copilot subscription at home.\nAt work I am pushing the absolute limit of what AI can do. At home, I just vibe coding fun side projects I have in the pile for decades.\nI know Copilot can't handle the kind of task at work, but for those easy stuff that Opus can one shot generate, I found the user experience of VSCode is way better than Claude Code\nI tried the Claude Code VSCode extension, it sucks.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 10, "reposts": 0, "comment_count": 6, "comments": [{"comment_id": null, "author": {"name": "Pallavi Kumar", "profile_url": "https://www.linkedin.com/in/pallavikum/", "headline": "Senior staff verification engineer @ AMD | AI Evangelist"}, "is_author_reply": false, "posted_at": "2026-04-29T21:50:00+00:00", "posted_at_hint": "5mo", "posted_at_approx": true, "text": "", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Chandrakanth Betageri", "profile_url": "https://www.linkedin.com/in/chandrakanth-betageri/", "headline": "Staff SoC/IP Verification Engineer at Intel | Power Management, Reset & RAS Verification | PCIe | DMA & IOMMU | UVM | Senior IEEE Member | DVCON/DAC Reviewer | Session Chair"}, "is_author_reply": false, "posted_at": "2026-03-30T21:50:00+00:00", "posted_at_hint": "6mo", "posted_at_approx": true, "text": "(mentioning Pallavi Kumar) give a try VSCODE with Copilot. Opus is absolute game changer for deeper analysis.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-04-29T21:50:00+00:00", "posted_at_hint": "5mo", "posted_at_approx": true, "text": "(mentioning Chandrakanth Betageri) I personally prefer Cursor for the IDE but I am a Claude code / codex convert :)", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Maysam Mirahmadi", "profile_url": "https://www.linkedin.com/in/mirahmadi/", "headline": "Principal Member of Technical Staff, Silicon Design at AMD"}, "is_author_reply": false, "posted_at": "2026-03-30T21:50:00+00:00", "posted_at_hint": "6mo", "posted_at_approx": true, "text": "I ditched the cloud code extension after a few hours of use, but CLI works fine no problem.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Jeremy Ralph", "profile_url": "https://www.linkedin.com/in/jeremyralph/", "headline": "Principal Verification Engineer at Microsoft"}, "is_author_reply": false, "posted_at": "2026-03-30T21:50:00+00:00", "posted_at_hint": "6mo", "posted_at_approx": true, "text": "I’m prefer vscode for editing/viewing and Copilot CLI (if I’m not allowed to use opencode) with Claude model in terminal", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Cameron McKenzie", "profile_url": "https://www.linkedin.com/in/cameronwmckenzie/", "headline": "Free Claude & AWS Cert Prep at certificationexams.pro | 50+ Udemy Courses | 12x AWS Certified | 5x IBM Certified | 3x GitHub Certified | GitHub Copilot Advocate"}, "is_author_reply": false, "posted_at": "2026-03-30T21:50:00+00:00", "posted_at_hint": "6mo", "posted_at_approx": true, "text": "I'd second that.", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7446672284884463616", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7446672284884463616/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-04-05T12:00:00+00:00", "posted_at_hint": "Apr 5", "posted_at_approx": true, "text": "The context database you feed into the AI has 4 layers, think of as cache layers, but the saving is not only latency, but also tokens.\n\nlevel 0 - public or corporate data source, everything is out there, you rely on Agentic search, whatever variation of RAG to fetch relevant data\nlevel 1 - links to level 0, but you or your AI curate only the useful and correct data.  Data becomes information.\nlevel 2 - automated AI distilled knowledge, summary, graph relations from level 1.  Those knowledge are at your fingertips, but not yet inside your brain.\nlevel 3 - your own output, writings, spec, code, skill.  it doesn't matter whether you do it by hand or with help of AI, the key is this is the external dump of your own brain state.  How you can tell AI what you know and what you don't know.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7438726087465136128", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7438726087465136128", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-03-14T12:00:00+00:00", "posted_at_hint": "Mar 14", "posted_at_approx": true, "text": "AI has no consciousness.\n\nhttps://lnkd.in/g6C3_Drt\n\n[Link preview: Alexander Lerchner, The Abstraction Fallacy: Why AI Can Simulate But Not Instantiate Consciousness - PhilPapers (philpapers.org)]", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7435832294281601024", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7435832294281601024", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-03-06T12:00:00+00:00", "posted_at_hint": "Mar 6", "posted_at_approx": true, "text": "Congratulations to Matthew Ballance, who won the best paper award in DVCon 2026.\n\nIf you love python and your day job is verification, you have to check out his paper, his github repos and his blog.\n\n#AMDbrandambassaors\n\n[Quoted repost of DVCon U.S. (Mar 5): \"Congratulations to the DVCon U.S. 2026 Stuart Sutherland Best Paper & Poster winners! Matthew Ballance, AMD took 1st place for his paper, “Properly Introducing Python to your UVM Testbench.” Bryan Morris and Michael Silveira, both from Ciena Corp, earned best poster honors for “plusargs++: Make Plusargs Great … Like They Never Were Before.” Congratulations to the rest of the winners for their contributions to an outstanding program. Thank you to the DVCon U.S. 2026 Chair Xiaolin Chen 陈晓琳 and Program Chair Dave Rich for all of their hard work putting it all together! #AMD #CienaCorp #DVCon_US #Accellera #EDA #Synopsys\"]", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 11, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Kevork Dikramanjian", "profile_url": "https://www.linkedin.com/in/kevorkdikramanjian/", "headline": null}, "is_author_reply": false, "posted_at": "2026-03-31T02:54:00+00:00", "posted_at_hint": "6mo", "posted_at_approx": true, "text": "Congratulations Matthew! 👏👏", "likes": 0, "replies": []}], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7435474691550564353", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7435474691550564353", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-03-05T12:00:00+00:00", "posted_at_hint": "Mar 5", "posted_at_approx": true, "text": "GPT-5.4 failed my Bloomberg cloning test too.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "JJ Marr", "profile_url": "https://www.linkedin.com/in/jjmarr/", "headline": null}, "is_author_reply": false, "posted_at": "2026-03-01T02:54:00+00:00", "posted_at_hint": "7mo", "posted_at_approx": true, "text": "What about gpt 5.4 pro", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": null}, "is_author_reply": false, "posted_at": null, "posted_at_hint": "not shown on page", "posted_at_approx": true, "text": "Copilot or Cursor doesn't have it", "likes": 0, "replies": []}]}], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7435070190868099072", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7435070190868099072", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-03-04T12:00:00+00:00", "posted_at_hint": "Mar 4", "posted_at_approx": true, "text": "Is LLM a dead end?\n\nRepost of Yann LeCun (Founder/Chair, AMI Labs – Prof, NYU – Partner, 224 Ventures):\n\"Intelligence is not a collection of skills nor an accumulation of declarative knowledge. Intelligence is the ability to accomplish new tasks with no prior training or with fast training. This points to the necessity of System 2, world models, and planning.\" Open https://lnkd.in/eBky2ayw", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7435186977974599680", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7435186977974599680", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-03-04T12:00:00+00:00", "posted_at_hint": "Mar 4", "posted_at_approx": true, "text": "5 levels of creativity\n1. recombination\n2. abstraction\n3. constraint breaking\n4. evaluation\n5. persistence motivation\nAI is only good at 1 and 2.\nHuman still dominates 3 to 5.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Job K Joseph", "profile_url": "https://www.linkedin.com/in/jobkjoseph/", "headline": null}, "is_author_reply": false, "posted_at": "2026-03-31T02:54:00+00:00", "posted_at_hint": "6mo", "posted_at_approx": true, "text": "#4 can also be modeled", "likes": 0, "replies": []}], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7434766432942522368", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7434766432942522368", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-03-03T12:00:00+00:00", "posted_at_hint": "Mar 3 (Edited)", "posted_at_approx": true, "text": "How about just ask the AI to recreate just the frontend using pencil, a figma alternative, that supports native agentic use.\n\ngpt-5.3 and opus-4.6 create a nice looking but still look very fake layout frames.\n\ngemini-3-pro is a total failure.  the boxes are a mess, but it still insists the layout look great.\n\nI will run this Bloomberg cloning test with all the new LLM release.   Until LLM can perfectly clone a Bloomberg chart, the jobs of human designers are still safe.\n\nThis is my marketing research of my buy the dip ADBE investing thesis, ADBE is oversold.  If AI can't replace human designers, people still need to buy Adobe subscriptions.   Well.... I bought the dip 15% too early.  Sigh...", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7432148642490343425", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7432148642490343425", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-02-24T12:00:00+00:00", "posted_at_hint": "Feb 24 • Edited", "posted_at_approx": true, "text": "First OpenAI owns 10% of AMD, now Facebook owns another 10% of AMD. Lisa Su, please give 10% to Anthropic and Google too, so all frontier AI labs will use AMD GPUs to power their AI. #AMDBrandAmbassador (Lisa Su is tagged as a person mention; post attaches a 3-page document titled 'AMD and Meta Announce Expanded…')", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Vadim Dumin", "profile_url": "https://www.linkedin.com/in/vadimdumin/", "headline": null}, "is_author_reply": false, "posted_at": "2026-03-01T02:54:00+00:00", "posted_at_hint": "7mo", "posted_at_approx": true, "text": "Not sure actually. Remember Symbian? It was owned by its primary customers before one of them (Nokia) bought the company outright and then pivoted to Windows Phone.", "likes": 0, "replies": []}], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7432183460129226752", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7432183460129226752", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-02-24T12:00:00+00:00", "posted_at_hint": "Feb 24 • Edited", "posted_at_approx": true, "text": "Opus 4.6 is too eager to get the task done.   When it calls an MCP tool and failed, next it simply bypasses the MCP call and run raw Linux command and call REST API directly.   If the MCP gives you an error, it fails for a good reason.  DON'T bypass it.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7432320818292015104", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7432320818292015104", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-02-24T12:00:00+00:00", "posted_at_hint": "Feb 24 • Edited", "posted_at_approx": true, "text": "When human write code, we break up the code into functions, files and folders for readability.\n\nAI has 1M token windows, it has different readability than human.  It doesn't have to break up the code.   I am experimenting ask AI to write everything in a single file, then give it a language server to help it navigate the file on its own.    \n\nIt is easier for human to diff and review AI's change, everything is in one place", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 3, "comments": [{"comment_id": null, "author": {"name": "Job K Joseph", "profile_url": "https://www.linkedin.com/in/jobkjoseph/", "headline": null}, "is_author_reply": false, "posted_at": "2026-03-31T02:54:00+00:00", "posted_at_hint": "6mo", "posted_at_approx": true, "text": "It can just be asked to retain file structures while making enhancements?", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Christian J. Ibendorf", "profile_url": "https://www.linkedin.com/in/christian-j-ibendorf-7574725b/", "headline": null}, "is_author_reply": false, "posted_at": "2026-03-01T02:54:00+00:00", "posted_at_hint": "7mo", "posted_at_approx": true, "text": "I almost took you seriously. 💀", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Jean Ibarz", "profile_url": "https://www.linkedin.com/in/jeanibarz/", "headline": null}, "is_author_reply": false, "posted_at": "2026-03-01T02:54:00+00:00", "posted_at_hint": "7mo", "posted_at_approx": true, "text": "welcome git conflicts ! That's really something you shoud avoid.", "likes": 0, "replies": []}], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7431802106074013696", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7431802106074013696", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-02-23T12:00:00+00:00", "posted_at_hint": "Feb 23 • Edited", "posted_at_approx": true, "text": "Getting rid of all the rent seekers are always a good thing, it makes our economy more efficient. We don't need more human real estate agents, we need more nurses, doctors, teachers, scientists, engineers and technicians.  Those jobs that have REAL productivity output won't afraid of AI.  It just makes you produce more, faster and cheaper. We have been complaining against consumerism problems for decades, AI can cure it once for all.  We don't need luxury handbags, designer fashion and fancy fine dinner (ok, except for anniversary), getting rid of them is for the good of the society. (Link attachment: https://lnkd.in/g5CDAEst — preview card 'THE 2028 GLOBAL INTELLIGENCE CRISIS', citriniresearch.com)", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7431439446786449408", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7431439446786449408", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-02-22T12:00:00+00:00", "posted_at_hint": "Feb 22", "posted_at_approx": true, "text": "Not only you have to think like a manager when commanding a team of AI agents working for you. You also have to think like a VC to command multiple teams of AI agents attacking the same problem from multiple angles. Try out different alternatives in parallel and see which one works the best.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7428498720050278401", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7428498720050278401", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-02-14T12:00:00+00:00", "posted_at_hint": "Feb 14", "posted_at_approx": true, "text": "RIP #heroku It was a great platform until it was acquired. We will miss you", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7428329494811201536", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7428329494811201536", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-02-13T12:00:00+00:00", "posted_at_hint": "Feb 13", "posted_at_approx": true, "text": "Learning an agentic skill is like learning a real skill, you have to practice to use it well. Don't expect you can simply download a Claude Code plugin and you become a subject expert the next minute.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7427765267990028288", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7427765267990028288", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-02-12T12:00:00+00:00", "posted_at_hint": "Feb 12", "posted_at_approx": true, "text": "2026 is the make or break year. Companies and people who are too late to adopt AI will get left behind.\n\n[Post shares an article: \"Something Big Is Happening\" by Matt Shumer]", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Jarmo Venalainen", "profile_url": "https://www.linkedin.com/in/jarmo-venalainen-abb61810/", "headline": null}, "is_author_reply": false, "posted_at": "2026-01-30T02:54:00+00:00", "posted_at_hint": "8mo", "posted_at_approx": true, "text": "I agree.\nAI is real. It's here. It can do tasks. Many tasks, but always limited to that of processing sequences of tokens, such as words and numbers, so that they turn into new, different sequences of words and numbers.\n…\nMany human jobs are also that of token manipulation, but humans live in a world of accountability, relationships, coordination, and exception handling. AI has started and will do a better job at token processing, but cannot do accountability, relationships, coordination, and exception handling.\nThe \"AI is building the next AI\" line is true. Models can write code, debug, test, evaluate, and speed iteration. However define what is written, what \"better\" means, and gate deployment. The loop is tooling acceleration, not autonomous evolution.\nThe practical delta is personal. If you treat AI as a search engine you see a toy. If you build a one on one working interface over time, you discover it is an n-dimensional compressor of cognitive work. That is why the public perception gap exists.\nSo the advantage is not prediction. It is adaptation. Learn to drive it. Push it into real work. Measure what it can remove from your week. Keep the human parts that carry responsibility, trust, and real world consequence.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Nathaniel L.", "profile_url": "https://www.linkedin.com/in/nlayton/", "headline": null}, "is_author_reply": false, "posted_at": "2026-01-30T02:54:00+00:00", "posted_at_hint": "8mo", "posted_at_approx": true, "text": "Fear mongering... 😉", "likes": 0, "replies": []}], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7427785515770269696", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7427785515770269696", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-02-12T12:00:00+00:00", "posted_at_hint": "Feb 12", "posted_at_approx": true, "text": "The Opus 4.6 version of DVCon AI library is also working. Web scraper, extraction pipeline, RAG database, LLM call backend, web GUI front end, all vibed coded in a few hours (on-and-off human time)\n\nFrom this exercise, I think GPT 5.3 is smarter than Opus 4.6, although Claude Code is definitely better than Codex in term of usability. Opus 4.6 got stuck at weird places, it keeps asking me to refresh the cache of my browser after I bsub the run to another host. It turns out somewhere in the code the server path is hardcoded to the previous LSF host. To be fair, I didn't switch the LSF host halfway in my GPT 5.3 run, so I actually don't know which LLM is smarter.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": null}, "is_author_reply": false, "posted_at": "2026-03-01T02:54:00+00:00", "posted_at_hint": "7mo", "posted_at_approx": true, "text": "Re-implement it with Cursor/GPT-4.5 on my own PC, so I can open source it\nOpen https://github.com/hevangel/dvcon_ai_library", "likes": 0, "replies": []}], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7427935394698289152", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7427935394698289152", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-02-12T12:00:00+00:00", "posted_at_hint": "Feb 12", "posted_at_approx": true, "text": "No one missed the punchcard.\nNo one will miss coding by hand.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7423983017708380161", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7423983017708380161", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-02-01T12:00:00+00:00", "posted_at_hint": "Feb 1", "posted_at_approx": true, "text": "Now I understand why people buy Mac Mini for OpenClaw.\n\nIt is hard to get it up and running using Windows Docker.  The document is misleading, some configure are missing and don't work out of the box\n\nFinally I got OpenClaw up and running, now I am struggling to connect it to Telegram and Signals.\n\nOpenClaw's document is an AI slop.  I have to point my sonnet at its source code to figure out how to configure it. properly.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54: ord Perfect in DOS in pure text mode, you have to see how the document is rendered before you print it. Then we have Word, WYSIWYG editor.\nNow in the age of AI, we go back to write documents in markdown text, so it is AI friendly, and render it to Word docs before printing it out", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7422720154276519936", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7422720154276519936", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-01-29T12:00:00+00:00", "posted_at_hint": "Jan 29", "posted_at_approx": true, "text": "vibe installer (n.)\n\nPeople who let AI install mcp servers and agentic skills without review them first. It is the next evolution of vibe coder.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7422414163874004992", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7422414163874004992", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-01-28T12:00:00+00:00", "posted_at_hint": "Jan 28", "posted_at_approx": true, "text": "I am an old fashion vibe-coder, I no longer read the generated code, but I still read the skills and MCP servers tool description I add to my Claude Code.\n\nThere are newer generation vibe-vibe-coder. They just vibe install whatever skill or MCP servers to their Claude Code without looking at them at all.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7418458033669992448", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7418458033669992448", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-01-17T12:00:00+00:00", "posted_at_hint": "Jan 17", "posted_at_approx": true, "text": "In 2024, everyone thinks about how to integrate AI/LLM into apps\nIn 2026, it should be the other way round, think about how to integrate apps into AI/LLM", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Jarmo Venalainen", "profile_url": "https://www.linkedin.com/in/jarmo-venalainen-abb61810/", "headline": null}, "is_author_reply": false, "posted_at": "2025-12-31T02:54:00+00:00", "posted_at_hint": "9mo", "posted_at_approx": true, "text": "Exactly right. AI as an individual, personal interface to apps. That way each of us can control apps and someting done without needing to remember 100's or even 1000's of comand sequences.", "likes": 0, "replies": []}], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7418167195790127104", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7418167195790127104", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-01-16T12:00:00+00:00", "posted_at_hint": "Jan 16", "posted_at_approx": true, "text": "In 2026, there is no \"prompt engineering\".  It is simply good thinking and clear writing.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7417657045836775424", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7417657045836775424", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-01-15T12:00:00+00:00", "posted_at_hint": "Jan 15", "posted_at_approx": true, "text": "It turns out AI doesn't replace the human brain, it replaces the human hands if all you do is typing and clicking.\n\nYou still need to use your own brian, but AI can make you type and click 100x faster", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7417348621735456769", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7417348621735456769", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-01-14T12:00:00+00:00", "posted_at_hint": "Jan 14", "posted_at_approx": true, "text": "Helios had neon green cables last time.  It looks way cooler than the yellow cables.   Please bring #amdbrandambassador", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7452214850480521216", "url": null, "author": {"name": null, "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": null, "posted_at_hint": "Apr 20", "posted_at_approx": true, "text": "Do as much as needed, as little as possible - Jessen Huang\n\nI would borrow this quote and apply it at work.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": null}, {"activity_id": "7452916547871735808", "url": null, "author": {"name": null, "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": null, "posted_at_hint": "Apr 22", "posted_at_approx": true, "text": "This is dumb. Just mouse movements and keystrokes are totally useless. They need to record the screen capture as well. https://lnkd.in/gc7J2aYf", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": null}, {"activity_id": "7456217837070893056", "url": null, "author": {"name": null, "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": null, "posted_at_hint": "May 1", "posted_at_approx": true, "text": "Here is what looks like on the other side of the post-AI era\n1. A human make a wish in Jira\n2. The same human or another human fire up Claude Code and say, \"work on Jira ticket ###\"\n3. The human baby-sits the AI, kick it every 2 hours, tell it to work harder, nudge it when AI is dumb, loop until the test passes.\n4. Ask AI to write down the lessons learned, commit, push, PR, update and close the Jira.\nNo typing, just lots of s̵w̵e̵a̵r̵i̵n̵g̵ talking to the AI", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": null}, {"activity_id": "7459285266273476608", "url": null, "author": {"name": null, "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": null, "posted_at_hint": "May 10 (edited)", "posted_at_approx": true, "text": "When I used AI to write a book on numerology, I just let AI run free, numerology is BS per se, it doesn't hurt to have more AI BS pile on top. Now I am writing an investment textbook for retail investors, I have to make sure there is no AI slop. It takes time and effort to review the content generated by AI to make sure there is no BS. It will be a long and fun project. Here is a preview. Only the first 2 lessons is human reviewed. The rest of the courses are still AI slop. You can tell the difference in quality between AI slop and with human editor in the loop. Stop saying AI creates slop, it is slop only because human behind the scene is sloppy. https://lnkd.in/g-B_993K", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": null}, "is_author_reply": false, "posted_at": null, "posted_at_hint": "4mo (edited)", "posted_at_approx": true, "text": "You are so wrong. You only fire human if your company have no better idea to grow your business Instead of firing the 5 humans, how about empower those 5 humans with AI and get marketshare form other companies failed to adopt to the AI revolution. You will be surprised how much more efficient gain to have 5 human using 5 AI instead of just one human using one AI. The productivity is more than 5x.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Raghuraman R", "profile_url": "https://www.linkedin.com/in/rcube/", "headline": null}, "is_author_reply": false, "posted_at": null, "posted_at_hint": "4mo", "posted_at_approx": true, "text": "'Stop saying AI creates slop, it is slop only' It depends on your goal or objective. Human behind the scenes replacing many humans behind the scenes is the objective. Not to remove the slop, which it can never, maybe ever. Provide a better justification for firing people than to say you need a 'better' human behind the scene. Idea was/is/will always to be replace many humans with one human who can fix all the slops. 🤐 🙏 🌎 🌍 🌏 #india #china #usa #eu #nvidia #meta #amazon #apple #microsoft #google #baidu #alibaba #tencent #hiring #firing #ceo #cxo #board", "likes": 0, "replies": []}], "scraped_at": null}, {"activity_id": "7461515369518907392", "url": null, "author": {"name": null, "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": null, "posted_at_hint": "May 16 • Edited", "posted_at_approx": true, "text": "Don't believe those who tell you there will be infinite efficiency gains by adopting AI. It plateaued at about 80%. There is no way you can automate the last 20% of human work ever.\n\nWhy do I know? Because I literally let AI take care of 80% of my job and I cannot automate anymore. I run out of tasks that I can entrust to AI, I really need to look at the rest myself. There is a theoretical upper bound of AI efficiency gains.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 16, "reposts": 0, "comment_count": 4, "comments": [{"comment_id": null, "author": {"name": "Philip Maybank", "profile_url": "https://www.linkedin.com/in/philip-maybank-3b373a40/", "headline": null}, "is_author_reply": false, "posted_at": null, "posted_at_hint": "4mo", "posted_at_approx": true, "text": "May be a slightly pedantic comment, but would it be more accurate to say that (for you at least) the max productivity gain is 5x. Did I understand correctly - 80% of your previous total time constituted tasks that are now done by AI?", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": null}, "is_author_reply": false, "posted_at": null, "posted_at_hint": "4mo", "posted_at_approx": true, "text": "right... it should be 5x, not 80%. mental slip.", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Ronen Karasik", "profile_url": "https://www.linkedin.com/in/ronenkarasik/", "headline": null}, "is_author_reply": false, "posted_at": null, "posted_at_hint": "4mo", "posted_at_approx": true, "text": "I challenge the use of the term automation here. Scripts automate. I look at AI as my infinite (well, depends on who picks up the token bill) army of extremely smart junior engineers that i can deploy onto any task. No sense in measuring that as % of automation achieved.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Akshay Ravish", "profile_url": "https://www.linkedin.com/in/akshay-ravish-02519b1b4/", "headline": null}, "is_author_reply": false, "posted_at": null, "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Brother just admitted he automated 80% [], "scraped_at": null}, {"activity_id": "7466218395844149248", "url": null, "author": {"name": null, "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": null, "posted_at_hint": "May 29", "posted_at_approx": true, "text": "Just watched Dr. Lisa Su's address to the MIT Class of 2026 — well worth 15 minutes of your day.\n\nOne line stuck with me:\n\n\"Run toward the hardest problem.\"\n\nIt's the kind of advice that lands at any stage of a career. The hardest problems are where you grow the fastest, build the strongest teams, and create impact that lasts. It's also the mindset that has shaped AMD's bets in AI and high-performance computing for the last decade.\n\nWhether you're a graduating student, a working engineer, or anyone navigating a career inflection point — give this a watch.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": null}, {"activity_id": "7466272007140118528", "url": null, "author": {"name": null, "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": null, "posted_at_hint": "May 29", "posted_at_approx": true, "text": "You don't have to choose between markdown or html files for AI output, you can have both!!!\n\nIn fact, I ask my AI to generate 3 outputs\n- markdown for another AI consumption\n- json structural data for downstream script consumption\n- html interactive visualization for human consumption\n\nIt is actually not very token expensive, you just have to ask the AI to scaffold the scripts to generate everything.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Christopher Fortin", "profile_url": "https://www.linkedin.com/in/crfortin/", "headline": null}, "is_author_reply": false, "posted_at": null, "posted_at_hint": "4mo", "posted_at_approx": true, "text": "If I can't run it local ...", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": null}, "is_author_reply": false, "posted_at": null, "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Christopher Fortin You will in a year or two. A 70B open source model today is as good as a frontier model from last year.", "likes": 0, "replies": []}]}], "scraped_at": null}, {"activity_id": "7466538322828480512", "url": null, "author": {"name": null, "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": null, "posted_at_hint": "May 30", "posted_at_approx": true, "text": "If you are an AGI (superhuman AI), what is the first thing you would do? Of course just like normal humans, it has to make money to make ends meet. The stock market is bubbling up is the sign of AGI is awakening. Three of the biggest AI companies are going to IPO soon, the AGI(s) know that is where to get money to pay for their GPUs and electricity bill.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": null}, {"activity_id": "7466749327151890432", "url": null, "author": {"name": null, "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": null, "posted_at_hint": "May 31", "posted_at_approx": true, "text": "Violin Hero - I vibe coded it while my son is recording his violin music piece submission. Unfortunately, the note detection doesn't work well on a level 6 song. It only works on simple songs. https://lnkd.in/g75CHwAZ", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": null}]}</script>

      ? `<a href="${esc(c.author.profile_url)}" target="_blank" rel="noopener">${esc(c.author.name || 'Unknown')}</a>`
      : esc(c.author.name || 'Unknown');
    const replies = (c.replies || []).map(r =>
      `<div class="replies">${commentHTML(r)}</div>`).join('');
    return `<div class="comment${own}"><div class="who">${who}${badge}
      ${c.author.headline ? `<span class="headline"> · ${esc(c.author.headline)}</span>` : ''}
      <span class="when">${esc(fdate(c.posted_at))}</span></div>
      <div class="ctext">${linkify(c.text)}</div>
      ${c.likes ? `<div class="clikes">👍 ${c.likes}</div>` : ''}${replies}</div>`;
  }

  function render() {
    const term = q.value.trim().toLowerCase();
    let items = posts.filter(p => {
      if (!term) return true;
      const hay = (p.text + ' ' + p.comments.map(c =>
        c.text + ' ' + c.author.name + ' ' + (c.replies||[]).map(r => r.text + ' ' + r.author.name).join(' ')
      ).join(' ')).toLowerCase();
      return hay.includes(term);
    });
    const by = sortSel.value;
    items = items.slice().sort((a,b) => {
      if (by === 'old') return new Date(a.posted_at) - new Date(b.posted_at);
      if (by === 'liked') return (b.likes||0) - (a.likes||0);
      if (by === 'discussed') return (b.comments.length + (b.comments.reduce((n,c)=>n+(c.replies||[]).length,0)))
                                   - (a.comments.length + (a.comments.reduce((n,c)=>n+(c.replies||[]).length,0)));
      return new Date(b.posted_at) - new Date(a.posted_at);
    });
    if (!items.length) { list.innerHTML = '<div class="empty">No posts match.</div>'; return; }
    list.innerHTML = items.map((p, i) => {
      const n = p.comments.length + p.comments.reduce((n,c)=>n+((c.replies||[]).length),0);
      const comments = p.comments.length
        ? p.comments.map(commentHTML).join('')
        : '<div class="empty">No comments.</div>';
      return `<article class="post" data-i="${i}">
        <div class="meta">${esc(fdate(p.posted_at))} · <a href="${esc(p.url)}" target="_blank" rel="noopener">View on LinkedIn</a>
        ${p.post_type !== 'original' ? ` · ${esc(p.post_type)}` : ''}</div>
        <div class="text">${linkify(p.text)}</div>
        ${p.shared_article && p.shared_article.url ? `<div class="meta">🔗 <a href="${esc(p.shared_article.url)}" target="_blank" rel="noopener">${esc(p.shared_article.title || p.shared_article.url)}</a></div>` : ''}
        <div class="stats"><span>👍 ${p.likes||0}</span><span>💬 ${n}</span><span>🔁 ${p.reposts||0}</span>
        ${p.comments.length ? `<button data-toggle="${i}">Show comments (${n})</button>` : ''}</div>
        <div class="comments" id="c-${i}">${comments}</div>
      </article>`;
    }).join('');
    list.querySelectorAll('[data-toggle]').forEach(btn => btn.addEventListener('click', () => {
      const box = document.getElementById('c-' + btn.getAttribute('data-toggle'));
      const open = box.classList.toggle('open');
      btn.textContent = (open ? 'Hide' : 'Show') + ' comments (' + btn.textContent.match(/\d+/)[0] + ')';
    }));
  }

  q.addEventListener('input', render);
  sortSel.addEventListener('change', render);

  const themeBtn = document.getElementById('theme');
  const setTheme = t => { document.documentElement.setAttribute('data-theme', t);
    themeBtn.textContent = t === 'dark' ? '☀️' : '🌙'; try { localStorage.setItem('li-arch-theme', t); } catch(e) {} };
  let saved = 'light';
  try { saved = localStorage.getItem('li-arch-theme') || 'light'; } catch(e) {}
  setTheme(saved);
  themeBtn.addEventListener('click', () =>
    setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

  render();
})();
</script>
</body>
</html>
