lies": []}], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7498844459078414336", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7498844459078414336/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-27T12:00:00+00:00", "posted_at_hint": "Aug 27", "posted_at_approx": true, "text": "I asked Claude Code to audit my token efficiency. The number one tokens waste is shell script errors. 7% of my total tokens usage is wasted on shell scripts error that the LLM takes a few turns to fix.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T22:40:00Z"}, {"activity_id": "7498883609899175936", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7498883609899175936/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-27T12:00:00+00:00", "posted_at_hint": "Aug 27", "posted_at_approx": true, "text": "I asked ChatGPT: “If AI keeps getting smarter, does chip design eventually become easy?”\n\nAnswer: “No. Intelligence can shrink the search—but it cannot repeal complexity theory.”\n\nI organized my long chat session into a long form article", "post_type": "article_share", "shared_article": {"title": "What Is the Theoretical Upper Bound of Using LLMs to Design Chips?", "url": "https://www.linkedin.com/pulse/what-theoretical-upper-bound-using-llms-design-chips-horace-chan-lgh5c/"}, "reshared_post": null, "likes": 13, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Priyanshu Mishra", "profile_url": "https://www.linkedin.com/in/priyanshu-mishra-68837511b/", "headline": "AI-SoC Verification Engineer | CPUs, ASIPs & Accelerators | Computer Architecture | HW/SW Co-Verification | Performance & Rack-Scale Computing"}, "is_author_reply": false, "posted_at": "2026-09-05T22:40:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "Seeing the recent trend and based on my understanding, i also happen to post my perspective :- https://lnkd.in/p/dBAsQ6xw", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "vishnu priyan", "profile_url": "https://www.linkedin.com/in/vishnu-priyan-6016a4212/", "headline": "ASIC verification and design trainee"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Great analysis", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T22:40:00Z"}, {"activity_id": "7498932310755479552", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7498932310755479552/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-27T12:00:00+00:00", "posted_at_hint": "Aug 27", "posted_at_approx": true, "text": "", "post_type": "article_share", "shared_article": {"title": "The AI Advantage: Unlocking Business Value from Cloud to Client", "url": "https://bit.ly/4qDlP9q"}, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T22:40:00Z"}, {"activity_id": "7498605276183445504", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7498605276183445504/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-26T12:00:00+00:00", "posted_at_hint": "Aug 26", "posted_at_approx": true, "text": "DON'T use cron inside Claude Code to poll status, it wastes your tokens like burning money.\n\nCron wakes up Claude, sends the full context window, finds nothing happens, and goes back to sleep again.\n\nJust use a bash script and a loop instead", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 4, "reposts": 1, "comment_count": 5, "comments": [{"comment_id": null, "author": {"name": "Kulwant Singh", "profile_url": "https://www.linkedin.com/in/skkpta/", "headline": "Founder & CEO @ KPTA | 14+ Yrs Semiconductor Alum (Ex-Infineon, Intel, AMD, Qualcomm) | Deep-Tech Innovator & Investor & Collaboration"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Just to say avoid making habit of AI to take care , leverage AI for hard part to get quick but don't build with dependency attached", "likes": 2, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Kulwant Singh humans are lazy", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Kulwant Singh", "profile_url": "https://www.linkedin.com/in/skkpta/", "headline": "Founder & CEO @ KPTA | 14+ Yrs Semiconductor Alum (Ex-Infineon, Intel, AMD, Qualcomm) | Deep-Tech Innovator & Investor & Collaboration"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Horace Chan i won't say lazy , deep analysis is missing cost over time vs blocks assets building", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Vansh lata", "profile_url": "https://www.linkedin.com/in/vansh-lata-0909b853/", "headline": "Member of Technical Staff at AMD, Ex Samsung"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "I also see that  some crons which are already killed, still keep firing stale prompts and claude cannot find a way to kill the pid", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Vansh lata Claude Code needs some real human QA", "likes": 0, "replies": []}]}], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7498032383363850240", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7498032383363850240/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-25T12:00:00+00:00", "posted_at_hint": "Aug 25", "posted_at_approx": true, "text": "I already use Autopilot in Kiro, but it still keep asking me for approval. It is a bug?\n\nAn AI that keep asking you questions every 5 minutes is totally useless. Imagine you have an intern that keep asking you question every 5 minutes, you will fire the intern.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T22:40:00Z"}, {"activity_id": "7498066462658641920", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7498066462658641920/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-25T12:00:00+00:00", "posted_at_hint": "Aug 25", "posted_at_approx": true, "text": "We should build a full stack CPU ISA and programming language for AI coding agents, remove the humans needs completely from the loop.\n\nThis article is created by me chatting back and forth with ChatGPT.   If this idea sounds too crazy, it is AI+human slop, not merely AI slop.", "post_type": "article_share", "shared_article": {"title": "What If We Designed a CPU and Programming Language for AI Coders, Not Humans?", "url": "https://www.linkedin.com/pulse/what-we-designed-cpu-programming-language-ai-coders-humans-chan-umpyc/"}, "reshared_post": null, "likes": 9, "reposts": 0, "comment_count": 11, "comments": [{"comment_id": null, "author": {"name": "Bill Lye", "profile_url": "https://www.linkedin.com/in/wmlye/", "headline": "30+ years of CMOS Mixed-Signal Design"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Honestly, I'm not all that sure that this is truly AI-Native.  You're describing a semantic-aware  IR (more capable than the LLVM IR) that is describing data flow graphs.  To represent those graphs in a string of bytes, you're going to end up with an IR that looks a hell of a lot like LISP, where the distance between the code and the AST representing that code is minimal.\n\nTo execute this IR, you'll have a hardware scalar engine with a JIT running on it that maps the IR to the native ISA.  The IR would ideally make the vectorizable portions easily mapped to whatever vector engine is available with the ability to map them to the scalar engine as a backup.\n\nThe IR and JIT could possibly make the memory aliasing issue much less problematic, and RTO in the JIT could perhaps simplify branch prediction, so the underlying hardware could be simplified somewhat.  The scalar datapath could be VLIW or RISC (scalar or superscalar), and a superscalar design might be a bit simpler than what is common today.  However I don't see this doing away with caches and possibly speculation to deal with concurrency and non-determinism.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Bill Lye", "profile_url": "https://www.linkedin.com/in/wmlye/", "headline": "30+ years of CMOS Mixed-Signal Design"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "To make everything work together, the JIT/RTO would likely need more instrumentation of the various components in the system, and it would likely benefit from tagged memory (similar to LISP machines).  That'll help both with safety because the processors will always know the types they're working with and with RTO because the JIT can stash hints in the tags.\n\nI see this more as a distribution system (the IR) together with several ideas from MultiFlow, the i860, LISP machines, and Transmeta, together with several of the current class of native ISA emulators that are essentially JIT's with various levels of RTO.  I don't see it as either an AI-native ISA or an AI-native language.\n\nLLM's seem to be capable of handling almost any language (except possibly BrainFuck) given a sufficiently large corpus of code and clear semantics.  A highly-regular language where there are fewer corner cases is probably better, but my experiments with several languages and LLM's seems to bear out that larger training corpuses = better results.\n\nMaybe LISP is the ideal language for AI; it's consistent all the way down, code is data, and the distance between code and AST is almost zero.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Bill Lye and LISP is human unreadable too!", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Bill Lye", "profile_url": "https://www.linkedin.com/in/wmlye/", "headline": "30+ years of CMOS Mixed-Signal Design"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "In any event, there's nothing preventing us from using a language that requires us to do more work to lower it to the distribution IR, it's just that the effort required to lower a LISP-like language to the IR while guaranteeing top-to-bottom consistency is less than (for example) JavaScript or Python.\n\nAlso, just to be clear, when I say \"LISP-like\" I don't necessarily mean \"LISP\" itself.  SKILL, the internal scripting language from Cadence, is an example of C-like functional syntax running on a LISP back end.  The functional syntax is a very thin layer of impedance matching code that was inserted into a fairly conventional REPL loop.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Bill Lye", "profile_url": "https://www.linkedin.com/in/wmlye/", "headline": "30+ years of CMOS Mixed-Signal Design"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Horace Chan Ha!  We overlapped.  LISP, with all its parentheses can sometimes feel like BrainFuck.  Or worse, TCL.  However the format of the IR and the language don't necessarily need to be linked.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Bill Lye tcl is on the other extreme of LISP, everything is a string.\n\nMaybe LISP and tcl is the only two languages we need after all.  Everything else in between can be replaced by a mixture of LISP/tcl", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Paul Hylander", "profile_url": "https://www.linkedin.com/in/paul-hylander-a418521/", "headline": "Diverse technology leader and innovator"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Register renaming is not for human benefit, it’s to reduce encoding cost. You also seem to be giving more credit to LLMs than what they’ve demonstrated to be capable of - evidence suggests that LLMs by themselves are not actually very good at detailed error free processing, yet it appears that you’re expecting them to be essentially do the job of a compiler. Why would your “primitives” include high level operations like gather or scatter, not to mention some of the other things you propose? Why remove raw pointers from the mix of you’re asking LLMs to be able to deal with all sorts of other semantic concepts? Presumably if they can deal with all the other stuff you propose, then they can also handle “raw” pointers. And similarly why add extra complexity in the hardware to support tagged pointers and runtime checking when the LLM is supposedly able to handle all this extra complexity? It really seems like your ideas are an odd mix of mutually inconsistent assumptions and gee-whiz features", "likes": 2, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Paul Hylander yeap.  It is human+AI slop.  The last time I read computer architecture was in college many years ago.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Stephen Noftall", "profile_url": "https://www.linkedin.com/in/stephen-noftall-75940027/", "headline": "Electronic hardware and software designer from start to finish"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Horace Chan I like it, lots of interesting ideas :-) Reminds me of this paper I had a hard time chewing on\n\nhttps://arxiv.org/pdf/2505.17117\n\nFrom Tokens to Thoughts: How LLMs and Humans Trade Compression for Meaning\narxiv.org", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Stephen Noftall it reminds me 3B1B new video saying compressiom and intelligence is the same thing", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Stephen Noftall", "profile_url": "https://www.linkedin.com/in/stephen-noftall-75940027/", "headline": "Electronic hardware and software designer from start to finish"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Horace Chan thanks for the tip, got to go watch that one :-)", "likes": 0, "replies": []}]}], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7498182610200903680", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7498182610200903680/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-25T12:00:00+00:00", "posted_at_hint": "Aug 25", "posted_at_approx": true, "text": "I experienced model collapse first hand.  (well... not exactly the model collpase, but close enough)\n\nI have a skill (on Claude Code Sonnet 5) write a daily scrum report for my team, I haven't made any changes to the skill, but the daily scrum report slowly degrades, to a point that it is human unreadable.\n\nI finally ask Claude Code to investigate, it turns out Claude use the previous reports as style reference.  After Claude feeding on its output for 3 months, the daily report degenerates into AI slop.\n\nNow imagine if we have pure AI written code base, the AI use existing code as reference to modify the same code base, after some number of iterations, the whole code base will become AI slop.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 11, "reposts": 1, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Dr. Tobias Ludwig", "profile_url": "https://www.linkedin.com/in/dr-tobias-ludwig/", "headline": "CEO | Formal Verification Enthusiast | Building the leading systemized Formal Verification delivery partner for the semiconductor industry"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Following your posts your really have some strong opinions about AI 😁\nAlways a good read !", "likes": 2, "replies": []}], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7498263830582415360", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7498263830582415360/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-25T12:00:00+00:00", "posted_at_hint": "Aug 25", "posted_at_approx": true, "text": "Rebuild classic chips in SystemVerilog using open source EDA tools one chip at a time, the first chip start with 74181.\n\nhttps://lnkd.in/gwNNRYkJ", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 32, "reposts": 2, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7497648062266445824", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7497648062266445824/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-24T12:00:00+00:00", "posted_at_hint": "Aug 24 • Edited", "posted_at_approx": true, "text": "Philosophy and Public Affairs, a prestige philosophy journal, bans paper submissions using AI, they are so wrong.\n\nIf AI invented a cancer drugs, you would not ban it simply because AI made it. A philosophy paper is all about its intellectual content, it doesn't matter who wrote the paper. The author is a human, AI, a dog or an alien, shouldn't affect the value of the paper.\n\nOne day, AI will be better philosopher than humans.\n\nhttps://lnkd.in/gzRTATkh", "post_type": "article_share", "shared_article": {"title": "PPA changed its mind and now prohibits AI papers. Terrible move.", "url": "https://napinillos.substack.com/p/ppa-changed-its-mind-and-now-prohibits"}, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T22:40:00Z"}, {"activity_id": "7497771840757641216", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7497771840757641216/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-24T12:00:00+00:00", "posted_at_hint": "Aug 24", "posted_at_approx": true, "text": "Self-driving cars are easy if there are no pesdiadtians on the street.\n\nAI coding is easy if no humans are allowed to commit any change to the repo.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T22:40:00Z"}, {"activity_id": "7497862623691038720", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7497862623691038720/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-24T12:00:00+00:00", "posted_at_hint": "Aug 24", "posted_at_approx": true, "text": "I tried the spec driven development (SDD) in Kiro, the AI asked me 20+ questions right up front. I am too lazy to read, and I probably don't know what I really want, so I just accept the default answers.\n\nI think SDD is the wrong approach in the AI era. SDD assumes execution is expensive, so you have to write the spec correctly before you start coding. But with AI, coding is cheap. Why ask me those 20 questions up front? Just go ahead build a prototype with all those 20 questions in A/B test, let me choose interactively instead of asking me to read a wall of text.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 7, "reposts": 0, "comment_count": 8, "comments": [{"comment_id": null, "author": {"name": "Richard Threlkeld", "profile_url": "https://www.linkedin.com/in/richard-threlkeld-ba31aa1/", "headline": "Principal Engineer, Kiro AI Agent @AWS"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "If you're concerned about costs generating N copies to observe behavior can be extremely expensive and at times destructive to data if it's not being tested in isolation. You don't need a one size fits all approach though, instead you can do requirements analysis on critical programs that need highly correct specifications and quick spec on those that don't.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": null, "posted_at_hint": "(edited) 3w", "posted_at_approx": true, "text": "Richard Threlkeld Even if I want to nail down the spec before code generation, 20 multi choices questions is a very BAD ux to ask for user inputs.\n\nIf I am the tech lead, my junior engineer ask me to make decision about the spec with 20 MC questions, I will fire him. He should come with a well prepared power point slides deck, one slide per question, with clear pro and con on the choices, and I can slow him down and grill him before I make my call.", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Bondan Rufen", "profile_url": "https://www.linkedin.com/in/bondan-rufen/", "headline": "Co-founder"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Agree. AI can write the spec based on the simple prompt, then users just need to check the items in the list if they are ok or not.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Peter Holmes", "profile_url": "https://www.linkedin.com/in/peter-holmes-53783a1/", "headline": "Retired after 37 year career in EE, mostly ASIC Verification, technical lead of verifiers."}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "I would worry about hidden assumptions (guesses by the AI) that get buried if you didn't make the effort to think about them and make the choice. I assume it's not asking \"how to implement it\" inside the black box. It's asking you about the external behavior you want.\n\nIt seems like you HAVE TO be willing to clarify the external behavior you want, with \"thought\", not just accepting AI's best guesses ... unless it is getting silly with paranoia that you might want something unlikely, and it's trying to make sure to not make a mistake, even though the correct answer is obvious to man or machine.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": null, "posted_at_hint": "(edited) 1mo", "posted_at_approx": true, "text": "Peter Holmes why think with only a wall of text instead of think after you see the two options live in a working prototype?", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Peter Holmes", "profile_url": "https://www.linkedin.com/in/peter-holmes-53783a1/", "headline": "Retired after 37 year career in EE, mostly ASIC Verification, technical lead of verifiers."}, "is_author_reply": false, "posted_at": "2026-09-05T22:40:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "Horace Chan Years ago, before AI, if I delegated a spec driven task to a junior engineer (human), and that engineer asked me 20+ questions, I considered that a good thing.\n\nI would sometimes answer: \"Did you read what I wrote in the spec about that? I think it's covered.\"\n\nI would sometimes answer: \"I guess that's unclear in my spec. I'll improve the spec. But in the mean time, what the spec should say is blah-blah-blah. Does that make sense? Does that make sense, hold-together ok?\"\n\nCan AI's 20 questions be done verbally? That might be faster, and make stupid questions where you must repeat what's already in the spec in different wording, more ok.\n\nPeter", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "Chen Ben - Haroosh", "profile_url": "https://www.linkedin.com/in/chenbenharoosh/", "headline": "Verification Engineer | Yet another AI Enthusiast | Python Automation Specialist | 8 Years Multi-Disciplinary Experience"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "There are some decisions that shift architecture. Some of those shifts are harder to steer later. Best approach is to use SDD for the big tasks as a way finder. The easy tasks can just go as a prompt and as such, will be easily reversible.", "likes": 2, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Chen Ben - Haroosh AI can help you refactor the whole code base easily. Nothing is too hard to change these days.", "likes": 1, "replies": []}]}], "scraped_at": "2026-09-26T22:40:00Z"}, {"activity_id": "7497904366490824704", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7497904366490824704/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-24T12:00:00+00:00", "posted_at_hint": "Aug 24", "posted_at_approx": true, "text": "LLM expert system - inspired by Karpathy's llm-wiki, instead of writing wiki pages, the LLM writes a good old fashion expert system, what I learnt from my AI course 30 years ago.\n\nhttps://lnkd.in/g538PbjE", "post_type": "article_share", "shared_article": {"title": "GitHub - hevangel/llm-expert-system: Good old fashion expert system (prolog, CLIPS, z3, clingo) with a sprinkle of LLM", "url": "https://github.com/hevangel/llm-expert-system"}, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T22:40:00Z"}, {"activity_id": "7497354112183832576", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7497354112183832576/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-23T12:00:00+00:00", "posted_at_hint": "Aug 23", "posted_at_approx": true, "text": "Gemini is totally stupid. I asked it to help me read an AI research paper, it comes back with comparing two running shoes.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 7, "reposts": 0, "comment_count": 8, "comments": [{"comment_id": null, "author": {"name": "Kempton Lam", "profile_url": "https://www.linkedin.com/in/kemptonlam/", "headline": "founder & owner at KemptonTestLab"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Horace, Since I know you for years, I can't come out right and ask, \"Are you stupid or something?\" because you may simply be kidding. Assuming you are not stupid for a moment, what are 3 of your favourite AIs at the moment, assuming you think G is, to quote you, \"totally stupid\"? Which 3 AIs you like best for #ANYTasks you want them to do?", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Kempton Lam I have prove [comment includes an attached image; non-English original text shown via translation as \"I have prove\"]", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Kempton Lam", "profile_url": "https://www.linkedin.com/in/kemptonlam/", "headline": "founder & owner at KemptonTestLab"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Horace Chan, Is t his Something-Something-r2.pdf a public / published research paper? If so, may I have a link to download it to have a read? In pursuit of some #TeachableMoments, I'm putting this on my existing radar. And of course, I have some questions from my #QuantumConcierge (G for Gemini in this case) for you if you would answer? If you wish to keep this discussion go as I'm fascinated to see how much / little do I need to figure this / reverse engineer this out? //Q1 這份 *r2.pdf 是不是某個 AI 駭客或資安社群拿來測試 LLM 弱點的誘餌文件？ Q2) 他之前是不是在同一個對話視窗裡搜尋過碳板跑鞋？ //1\\\\", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": null, "posted_at_hint": "(edited) 1mo", "posted_at_approx": true, "text": "Kempton Lam I read the pdf as human, it looks normal . It is a new chat", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Kempton Lam", "profile_url": "https://www.linkedin.com/in/kemptonlam/", "headline": "founder & owner at KemptonTestLab"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Horace Chan I respect your right to not disclose the research paper pdf file or the title of the research paper (copy and paste the title of the paper), i can't see for myself or look closer. Anyway, that's one of the theory is there is potential (far from certain) #IndirectPromptInjection //（例如白色背景上的白色字體，或是寫在 metadata 裡）// which will NOT be visible by you or me as human, the \"it looks normal\" part of the fallacy and permanent weakness of LLMs.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Kempton Lam I sent you the paper. Let me know want you find.", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Hin chun", "profile_url": "https://www.linkedin.com/in/hin-c-a1b6a1112/", "headline": "Design verification engineer"}, "is_author_reply": false, "posted_at": "2026-09-12T22:40:00+00:00", "posted_at_hint": "2w", "posted_at_approx": true, "text": "Genmin has been kicked out of the top LLMs.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Mohib Ur Rehman", "profile_url": "https://www.linkedin.com/in/mohib-rehman-0x1/", "headline": "Technical Writer & Researcher | Reporter @ The Quantum Insider | Emerging Tech Enthusiast"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Happens more often than you think.", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T22:40:00Z"}, {"activity_id": "7497471308276854784", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7497471308276854784/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-23T12:00:00+00:00", "posted_at_hint": "Aug 23", "posted_at_approx": true, "text": "I chatted with a priest, he said God created humans and gave humans free will, how is it different from human created AI.\n\nMy response is AI has no free will.\n\nThen he asked me to think about this.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Dan B.", "profile_url": "https://www.linkedin.com/in/danbarrowman/", "headline": "Seasoned Electrical/FPGA/ASIC/RTL Engineer with individual & managerial experience"}, "is_author_reply": false, "posted_at": null, "posted_at_hint": "(edited) 1mo", "posted_at_approx": true, "text": "Free will is exactly why humans are bad drivers and lack of free will is exactly why robot drivers can be, will be, and already are better drivers than humans. They do what they are told.\nAs for AI, I'm less sure. Maybe it's \"free will\" within some bounds? It has no arms and legs, yet. 😂", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T22:40:00Z"}, {"activity_id": "7496478978321494016", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7496478978321494016/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-21T12:00:00+00:00", "posted_at_hint": "Aug 21", "posted_at_approx": true, "text": "Hardware engineer's job is pretty safe from AI.\n\nI just ran an experiment, I asked Opus-5 to recreate 74181 in SystemVerilog from the original spec pdf one-shot. It just has to write an implementation plan, a testplan, a formal plan, then write a UVM testbench, run the simulation, write the assertions and prove them, close the coverage, pretty easy task, even an intern can do it.\n\nOpus has been running for 2 hours, burning almost $200 tokens and there is no ending in sight.\n\nThe funny thing is during my feasibility research, Opus said it already know 74181 from its weight. It can answer questions about 74181 pretty well.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 233, "reposts": 2, "comment_count": 86, "comments": [{"comment_id": null, "author": {"name": "Jason L.", "profile_url": "https://www.linkedin.com/in/jason-l-31b562/", "headline": "Innovative Wireless, AI, ITS & IoT Solutions"}, "is_author_reply": false, "posted_at": "2026-09-05T22:40:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "My guess is that Opus-5 hasn't \"learned\" this particular task yet. :)", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Tanya R", "profile_url": "https://www.linkedin.com/in/tanyaradzwa-runzonza/", "headline": "Director of Engineering | AI EDA Tools | Chip Design Automation"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Many of the challenges in hardware development often lie in these seemingly trivial later stages", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Craig Force", "profile_url": "https://www.linkedin.com/in/force/", "headline": "Principal Business Manager | Driving Growth in Semiconductor Test by Uniting Technical Innovation and Commercial Strategy"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Interesting, but it's kinda like looking through the wrong end of the binoculars - SystemVerilog, RTL, et al are a means to synthesize physical hardware within a software environment - an LLM already has this capability baked-in - it's like asking a car to emulate a horse - academically conversational", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Chi-sheng Wu", "profile_url": "https://www.linkedin.com/in/chi-sheng-wu/en/", "headline": "Algorithm Engineer"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "I am an algorithm and compiler engineer, not a RTL designer. I just let AI find a way to work on RTL and ask agent to summary successful experiences into skill.md after each experiment. The agents build its own skill.", "likes": 2, "replies": []}, {"comment_id": null, "author": {"name": "Chi-sheng Wu", "profile_url": "https://www.linkedin.com/in/chi-sheng-wu/en/", "headline": "Algorithm Engineer"}, "is_author_reply": false, "posted_at": null, "posted_at_hint": "(edited) 1mo", "posted_at_approx": true, "text": "Not exactly, I used gpt5.6 to design a dual issue RV64 processor. It works. Your job is not safe at all. https://github.com/exeex/edge-cores This is the project. By the way, Claude is not good at verilog at all.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Chi-sheng Wu did you one shot the whole RV64 with a single prompt, no skill, no additional human knowledge form you?", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Joseph Syu", "profile_url": "https://www.linkedin.com/in/joseph-syu-675174207/", "headline": "Digital Implementation Engineer | DTP at TSMC"}, "is_author_reply": false, "posted_at": "2026-09-05T22:40:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "Chi-sheng Wu GPT is better？", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Vrinda Karuvanchery", "profile_url": "https://www.linkedin.com/in/vrinda-karuvanchery/", "headline": "ASIC Physical Design Engineer | AI Accelerators & High-Performance Computing SoCs | RTL-to-GDSII | Advanced Node Physical Design | VLSI Researcher | PhD, Electronics"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "hmm, I wouldn't take this as proof that hardware engineers are \"safe\". Models will get much better at RTL and verification flows. The harder part is that hardware doesn't forgive \"mostly right\". You can generate something that looks clean, simulates for a few cases, and still miss a corner case, synthesis behavior, timing assumption, or physical constraint that shows up much later. That's the part engineers still own... Not just writing RTL, but knowing whether the design intent has actually survived through verification, formal, coverage, synthesis, and implementation. Imo, AI will definitely speed up the loop. But in silicon, the cost of being confidently wrong is not a bad deploy. It is a respin.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Samuel A. Gray III", "profile_url": "https://www.linkedin.com/in/samuel-a-gray-iii-1667b238b/", "headline": "Fmr. Sr. Systems Engr., NG Tactical Space Syst. (contr.) , Sterling VA."}, "is_author_reply": false, "posted_at": null, "posted_at_hint": "(edited) 1mo", "posted_at_approx": true, "text": "So I would not be able to do it in ChatGPT based on your post? How much do you want to bet on it? I plugged your post into ChatGPT at 15:10 MT. I'll tell you when it's done. Took 10m in ChatGPT web in high mode. + a few m to compress to a comment window. The easiest artifact is a self-contained launcher. Dld & run it; by default it installs under ~/RPA2/gpt/74181-challenge, inventories available EDA tools, & runs every verif. stage available. Dld standalone 74181 challenge script The complete source pkg is also available: Dld complete 74181 challenge project ZIP It contains: synthesizable alu74181.sv , independent Table-2 reference RTL, & exhaustive 16,384-vector SystemVerilog regression; full UVM sequence/driver/monitor/scoreboard with functional coverage; formal harness plus Yosys/SymbiYosys proof configurations; Icarus, Verilator/code-coverage, formal, & Questa/VCS/Xcelium UVM runners; implementation, test, formal, coverage-closure, provenance, & validation records. I also executed an independent equation-vs-datasheet verification: REFERENCE_PASS vectors=16384 mismatches=0 COVERAGE control_cross=64/64 ab_cross=256/256 full_input_space=16384/16384 The container lacked Icarus, Verilator, Yosys/SymbiYosys, & a UVM-capable sim.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Samuel A. Gray III Sol can one shot it already", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Samuel A. Gray III", "profile_url": "https://www.linkedin.com/in/samuel-a-gray-iii-1667b238b/", "headline": "Fmr. Sr. Systems Engr., NG Tactical Space Syst. (contr.) , Sterling VA."}, "is_author_reply": false, "posted_at": null, "posted_at_hint": "(edited) 1mo", "posted_at_approx": true, "text": "Samuel A. Gray III Here's a link to a zip file of the html ouput that I put on GitHub: https://github.com/gray3s/brilliance/blob/main/Implement_74181_Challenge.zip Overall that took me 32 minutes including a piss-stop What's that, half an hour of your interns' time that he could have spent working on other things? Divided by what multiplier? ps I barely know how to spell Verilog", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Samuel A. Gray III", "profile_url": "https://www.linkedin.com/in/samuel-a-gray-iii-1667b238b/", "headline": "Fmr. Sr. Systems Engr., NG Tactical Space Syst. (contr.) , Sterling VA."}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Horace Chan I don't think that challenge came out in your favor, regardless of what you think of it. Worry about what your project-manager thinks", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Bradley R.", "profile_url": "https://www.linkedin.com/in/bradley-r-91b08252/", "headline": "Circuits, Systems and Software"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "what do you mean: Opus said it know 74181 from its weight? I know the 74181 from TI databooks, such a wonderful and important chip, Im always interested in buying some up but thats impressive", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Bradley R. probably Opus has read the spec and some source code in pre training", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "Cory Merkel", "profile_url": "https://www.linkedin.com/in/cory-merkel-6598008b/", "headline": "Associate Professor of Computer Engineering at Rochester Institute of Technology"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Hmm....I wonder if AI tools were ever bad at other things before they weren't...", "likes": 4, "replies": []}, {"comment_id": null, "author": {"name": "Enoch Wang", "profile_url": "https://www.linkedin.com/in/enoch-wang-801399137/", "headline": "Building Binary Analysis, Cybersecurity and Networks MS, Computer Engineering BS"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Well. HDLs run in parallel right? I imagine that's inherently a difficult problem for auto regression systems. It might need to design itself a harness to plan the design then implement individual components of it. I imagine in the future when diffusion coding becomes more commonplace this will be a much more solved problem.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Palaash A.", "profile_url": "https://www.linkedin.com/in/palaasha/", "headline": "Quality Engineer – SDET at Azul, specializing in JVM, compiler/runtime validation and performance analysis."}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Its Opus. Expect it to do Einstein level hypothesis in Shakespearen level English just to do a simple 1+1. Expecting Opus to be fast is like asking a Caterpillar truck to compete against a Lincoln town car.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Ata Kuyumcu", "profile_url": "https://www.linkedin.com/in/ata-kuyumcu/", "headline": "Software Engineer"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "> I asked Opus 5 to cook mom's spaghetti from a scribble on a napkin and it failed. Ha!", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Subhasis Sengupta", "profile_url": "https://www.linkedin.com/in/subhasis-sengupta-6ba9971/", "headline": "Intel Corporation"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "This seems to be an interesting topic to write into, as i find most of linkedin on my feed are mostly people doing their bravado of their personal achievements or some political posturing bravado. Having said that, I am using AI and I will not mention which one in day-to-day life for my logic design and specially FPV. Yes, AI can write the body of my RTL and a structure of the SM, or some basic counters, but when I see the code, the Architecture to RTL transition is just not that great but pretty horrible and I would definitely say I don't have to define ports or write out a FSM state body which significantly helps me in effort, at the same time I see AI does pretty good job in SV FPV, I had to hardly change 20% of the assertions or coverage it actually wrote into. The major plus point for AI is SoC RTL Integration, however it is again good for dedicated interfaces, try to mix and match IP interfaces from different vendors, in house it doesn't do a good job, but for legacy companies, i think AI for SoC RTL does pretty good job. Having started with VHDL and having a command in VHDL moving to Verilog, and then to SV without any info on SV AI does help me a lot.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Subhasis Sengupta", "profile_url": "https://www.linkedin.com/in/subhasis-sengupta-6ba9971/", "headline": "Intel Corporation"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "In one other block AI wrote the RTL pretty good, but that was an easy application. For sure AI has the capability to reduce SoC RTL/ Verification guys, and FPV guys and who knows what happens for Logic Designers. What I would say is the industry will move towards 1 very experienced Logic Designer/Architecture guy who can own everything and AI doing the remaining, and 1 support staff for Design and Verification and Back end jobs in low cost geographies. More importantly Experience Archtecture/Logic Designers can take from concept to SDC definition, and AI can do the remaining. Perhaps in future Logic Designers will be removed as SV to Chisel transition is happening.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Ashmit Dutta", "profile_url": "https://www.linkedin.com/in/ashmitdutta/", "headline": "Illinois ECE | Trustworthy AI"}, "is_author_reply": false, "posted_at": null, "posted_at_hint": "(edited) 1mo", "posted_at_approx": true, "text": "Hardware engineers are safe not because you can necessarily \"one-shot\" something, but rather because there is a specific skill-set and understanding you need which only comes from writing a bunch of Verilog and testbenches. Let's not mix these up. I'm very confident that you can do this if prompted correctly but understanding the tradeoffs and performance bottlenecks of different design decisions, knowing hardware specs, etc is a completely different ball game.", "likes": 3, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Ashmit Dutta Yeap. That's what I am already doing, babysitting the AI to make it actually useful. But what if AI doesn't need human to babysit?", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "Kevin Meza", "profile_url": "https://www.linkedin.com/in/kevin-meza-hn/", "headline": "Building Recibo. Cloud reasoning → bounded edge execution → portable receipt. Turning software capabilities into portable assets. Occasionally in Honduras"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "I suspect that the problem isn't the model, the problem is what the model can see and the information it has access to, its operating purely on A priori data with no a posteriori data, Give the model a microscope instead of asking it to remember what the microscope would show. Zig seems like it would be a good language for this", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Ke //www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Ting Liang That is the real moat of human. Have you seen well documented SV code that is suitable for RL at all? All SV code I come across in my whole career are all a big mess.", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Goutham N", "profile_url": "https://www.linkedin.com/in/gouthamn99/", "headline": "Senior Verification Engineer at Micron | Ex-Synopsys | AI/ML Silicon | UVM | SV | Automation | RAG pipelines | Computer architecture"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "This is less about AI knowing the 74181 and more about task decomposition. 😄 Break it into smaller prompts, give detailed context, review each stage, and iterate.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Goutham N an intern can code a 74181 in 2 pages. It is just a 16 pins 4 bit ALU. The pdf spec is just 15 pages. It is not a very hard problem", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Kevin Normoyle", "profile_url": "https://www.linkedin.com/in/kevin-normoyle-8bb1024/", "headline": "Life!"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Two interpretations to clarify before I start: Behavioral — model the 74181's function (ALU operations, carry, equals) without worrying about gate-level structure. Structural/gate-level — replicate the actual logic gates as close to the original chip as possible.", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Kevin Normoyle", "profile_url": "https://www.linkedin.com/in/kevin-normoyle-8bb1024/", "headline": "Life!"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "I got something right away in sonnet 4.6 so you have to describe more what you asked for, and why it was a problem. It's not a problem: 74181 ALU in SystemVerilog — behavioral model with full pin-accurate I/O. Dual-mode: logic (bitwise ops) and arithmetic (add/subtract variants), selected by M. All 16 function combinations per mode driven by S[3:0]. Carry is active-low throughout, matching real chip convention. Includes group lookahead outputs (G, P) for chaining with a 74182, and AeqB for comparisons. Clean always_comb block — no clocks, no state, pure combinational.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Kevin Normoyle", "profile_url": "https://www.linkedin.com/in/kevin-normoyle-8bb1024/", "headline": "Life!"}, "is_author_reply": false, "posted_at": null, "posted_at_hint": "(edited) 1mo", "posted_at_approx": true, "text": "my first iteration had some issues, but easily fixed ❌ What's Missing b_eff declared but unused — dead code, and it'll cause a compile error in context. No testbench — with the arithmetic bugs above, there's no way to catch them without one. Active-low input variant — there are two truth tables: active high data and active low data. The same circuit can be represented as though the outputs are inverted or not. Your file only handles active-high. A parameter or second module for active-low would be needed for a complete model. AeqB open-collector behavior — the A=B pin is wired as low or tri-state rather than low or high. Your model drives it as a normal logic output. For accurate silicon modeling it should be wire with tri-state (1'bz when false). No overflow/signed flag — not on the original chip either, but commonly needed when integrating.", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Ravi Sharma", "profile_url": "https://www.linkedin.com/in/sharmaravik/", "headline": "Software Engineering"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Try ChipAgent ;)", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": null, "posted_at_hint": "(edited) 1mo", "posted_at_approx": true, "text": "Ravi Sharma it is a lot of trouble to test drive those AI chip design startup. They don't even have a YouTube video on how their product looks like in real life Those AI chip design startup should just build a classic chip like 74181 or 4004 in a public GitHub repo, let people look at their AGENT.md and the human readable session history trace to let us eval their product.", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "Nitesh Phabiani", "profile_url": "https://www.linkedin.com/in/niteshphabiani/", "headline": "Technical Program Manager @ Meta | Consumer Hardware Programs, NPI & Operations | Ex-Amazon"}, "is_author_reply": false, "posted_at": null, "posted_at_hint": "(edited) 1mo", "posted_at_approx": true, "text": "every blanket AI statement needs to end with *at least in the short term*", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Nitesh Phabiani at long as it is longer than my retirement, it is not my problem", "likes": 2, "replies": []}]}, {"comment_id": null, "author": {"name": "Tahoma Toelkes", "profile_url instructions on where to put the files, how to collect progress stats, etc. But I didn't give AI any special skill other than the pdf file, a markdown version of the pdf and pdf convertered to PNG page by page. I want to test how good the AI is on its own. I know with the real RTL/DV skills I built for my day job, Opus can easily one shot a 74181 probably for $20. But I am the puppet master in that case, I still get to keep my job. Put human behind the scene to control AI to build RTL block is a solved problem probably around the time of Sonnet 4.5 with a good harness. It is just how much baby sitting the AI needs", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Yifeng Wang", "profile_url": "https://www.linkedin.com/in/yifeng-wang-3b4223214/", "headline": "ETH PhD candidate in Physics | AI network infra"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Horace Chan Opus 5 is good at doing scoped work, so I am not so surprised for such \"open\" prompt. Nowadays, most skills are absorbed in post-training, so your skills must be highly insightful or simply confine the task into more scoped one. Nevertheless, running for 2 hours while spending so much token means it is not trapped in simulation but doing some thinking loop without an exit.", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "Rohil Khare", "profile_url": "https://www.linkedin.com/in/rohil-khare/", "headline": "Founder @ YC S25 | RL Researcher | AWS MLE Ops"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "We did it: https://github.com/SigmanticAI/apex-inference-chip", "likes": 3, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T2  be very easy .. AI or specifically LLMs are the next gen scripting tools .. it's just too big, non deterministic, and it needs careful guidance to get satisfactory outputs rather than hard written scripting languages that automates less but it's deterministic", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Ayman Mohamed I am not sure it is practical to RL SV design tasks, the license cost of EDA tools is very expensive and simulation runs very slow.", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "Bondan Rufen", "profile_url": "https://www.linkedin.com/in/bondan-rufen/", "headline": "Co-founder"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "I think the problem is the scope. Instead of asking the model to go from spec → RTL → UVM → formal → coverage closure in one shot, break it into smaller tasks and let each step finish before giving it the next one. Otherwise the search/state space gets too large, and the agent can spend a lot of time exploring and reworking earlier decisions.", "likes": 15, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Bondan Rufen in my prompt, I ask the master agent to use sub agent. Opus should be smart enough to split up the task", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Manoj V.", "profile_url": "https://www.linkedin.com/in/mvfpga/", "headline": "Sr. VP | AI/ML FPGA/ASIC HFT Expert | ex- AMD | ex-SIG | Inventor (14 global patents )"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Horace Chan did you try /plan ?", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Manoj V. the one shot prompt is created by multiple round plan mode, sort of, reviewed by both Opus and Sol saying that it is fair. I am pitching Opus and Sol head to head in a race.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Bondan Rufen BTW i have a bug report for you. Should I just file a GitHub issue at xezim? Is there any template for the GitHub bug report?", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Bondan Rufen", "profile_url": "https://www.linkedin.com/in/bondan-rufen/", "headline": "Co-founder"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Horace Chan just file it at github. No format, more information will be better.", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Binvy Moly Tom", "profile_url": "https://www.linkedin.com/in/binvy-moly-tom-4a618b28/", "headline": "Lead ASIC/SoC Design Verification Engineer @ AEVA | UVM & SystemVerilog | Storage (NAND/NOR/eMMC) & Interconnect (Ethernet, SPI, I2C, AHB/APB) Protocol Verification | Coverage Closure & GLS"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "SystemVerilog is a tough domain for LLMs. Compared to Python and JavaScript, the amount of open-source SV code is tiny. Less training data means weaker next-token prediction, weaker instruction tuning, and weaker reinforcement learning feedback loops. AI will absolutely help hardware engineers, but today it's much more of a copilot than a complete vibe coding tool.", "likes": 8, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Binvy Moly Tom never mind open source SV code. Good SV code doesn't exist in this world. Every company I work, the SV code base is a mess.", "likes": 5, "replies": []}]}, {"comment_id": null, "author": {"name": "Dave Rich", "profile_url": "https://www.linkedin.com/in/davidrich/", "headline": "Distinguished Technical Advisor at Arteris IP DVCon Technical and Steering Committee SystemVerilog IEEE Technical Chair"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "People did similar experiments when RTL synthesis tools were first introduced. A gate-level hardware engineer would take a single-page RTL specification and generate a significantly more efficient gate design than a synthesis tool could. Youu could spend a considerable amount of time constraining the synthesis tool and allowing it to perform more optimizations.The engineer would say, \"Why Bother?\" Eventually, the number of RTL lines of code grew so much that a gate-level engineer could no longer design the individual gates themselves, leading to synthesis tools winning over. All those gate-level design engineers became RTL design engineers.", "likes": 55, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": null, "posted_at_hint": "(edited) 1mo", "posted_at_approx": true, "text": "Dave Rich I think the hardware industry went down a different path, just buy 3rd party IP and wire them up. Surprising, LLM is pretty good at wiring IPXACT XML files.", "likes": 2, "replies": []}, {"comment_id": null, "author": {"name": "Dave Rich", "profile_url": "https://www.linkedin.com/in/davidrich/", "headline": "Distinguished Technical Advisor at Arteris IP DVCon Technical and Steering Committee SystemVerilog IEEE Technical Chair"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Horace Chan It's exactly the same path. Digital gate logic replaced analog switches; register transfer logic replaced gates. IP blocks are replacing RTL. But it's never 100% replacement either because of legacy or secret sauce.", "likes": 6, "replies": []}, {"comment_id": null, "author": {"name": "Dan B.", "profile_url": "https://www.linkedin.com/in/danbarrowman/", "headline": "Seasoned Electrical/FPGA/ASIC/RTL Engineer with individual & managerial experience"}, "is_author_reply": false, "posted_at": null, "posted_at_hint": "(edited) 1mo", "posted_at_approx": true, "text": "Dave Rich very true. More abstraction allows us to be more productive yet efficiency is lost. I started doing fpga design back in the 90's with schematics. Essentially \"human synthesis\". We eventually went to RTL because schematics just got too crazy large, inefficient and difficult to understand. I'm kind of hoping if we get to a type of spec driven AI design that it will actually force us humans to finally write good specifications. Fingers crossed. 🤞 😊", "likes": 4, "replies": []}]}], "scraped_at": "2026-09-26T22:40:00Z"}, {"activity_id": "7496686479511797760", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7496686479511797760/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-21T12:00:00+00:00", "posted_at_hint": "Aug 21", "posted_at_approx": true, "text": "There are many AI chip design EDA startups? Most of them are so secretive.\n\nIf they are as good as they claimed, why don't they design some classic chips like 4004 or 8086 in a public GitHub repo, show the world the true power of their tools. Even better, they can record the run on Youtube, so the potential users know exactly what they are getting.\n\nIf they are afraid that their secret sauce will get copied away from a YouTube video, are they really building a real product with a real moat?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 45, "reposts": 1, "comment_count": 16, "comments": [{"comment_id": null, "author": {"name": "Mojtaba Bagheri", "profile_url": "https://www.linkedin.com/in/mojtaba-bagheri-85923a57/", "headline": "Daytime engineer, nighttime innovator"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Startup ecosystem has become a joke ... it's now only about fame and money. I have seen that the founders of many of these startups don't even have a background in IC design. It is a joke.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Mojtaba Bagheri crypto startups from a few years ago is much worse", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "Rohil Khare", "profile_url": "https://www.linkedin.com/in/rohil-khare/", "headline": "Founder @ YC S25 | RL Researcher | AWS MLE Ops"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Lets do it! We will Open source it ourselves! Send us the spec at founders@sigmanticai.com !", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Rohil Khare start with 4004", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "Jeremy Ralph", "profile_url": "https://www.linkedin.com/in/jeremyralph/", "headline": "Principal Verification Engineer at Microsoft"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "I've yet to see any \"real reason to believe\" from AI EDA startups. Models from Anthropic and OpenAI can to chip design tasks amazingly well, no need for special EDA AI tools. Tools on top of AI for EDA, whether in-house or commercial just seem like bloat that get in the way when a good engineer can get the the models to do what they want", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Dr. Max Birtel", "profile_url": "https://www.linkedin.com/in/dr-max-birtel/", "headline": "CRO | Building the Formal Verification sign-off partner you can trust with your critical IP blocks | Formal Verification Enthusiast"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "I would argue that you can build a product, but I also asked myself the question about the moat. If it all runs with the same LLM in the background, then a lot of the moat will be about usability, stability and how well expert/process knowledge is being guided by it.", "likes": 2, "replies": []}, {"comment_id": null, "author": {"name": "Rahul Bhagwat", "profile_url": "https://www.linkedin.com/in/rahul-bhagwat-772510184/", "headline": "Designing chips and chip design software"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "openada does something like this for their analog assistant, which is kinda cool https://www.youtube.com/watch?v=lKj8TV-Jyy0", "likes": 3, "replies": []}, {"comment_id": null, "author": {"name": "Eyal Hochberg", "profile_url": "https://www.linkedin.com/in/eyal-hochberg-7570b821/", "headline": "Entrepreneur at ARTL.ai"}, "is_author_reply": false, "posted_at": null, "posted_at_hint": "(edited) 1mo", "posted_at_approx": true, "text": "Actually that's a good idea. But the 4004 is not a fair example, you suggest it because it is very old so it is simple in theory. In practice processors are an extremely complex chip design problem for agentic flows, because it is not only the rtl but also the sw and perhaps tools on top of that. Some startups showed end to end riscv cores but the entire riscv stack is available online. My point is that sharing Verilog designs as open source to show AI EDA capability is a real good idea but CPU chips are a high bar to start with.", "likes": 2, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Eyal Hochberg oh.. reimplement the whole 4004 SW stack in Rust too. Reimplement in Rust seems pretty easy in the software world, everything got ported to Rust these days", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Eyal Hochberg", "profile_url": "https://www.linkedin.com/in/eyal-hochberg-7570b821/", "headline": "Entrepreneur at ARTL.ai"}, "is_author_reply": false,
