": null, "likes": 19, "reposts": 0, "comment_count": 6, "comments": [{"comment_id": null, "author": {"name": "Michał Piszczek", "profile_url": "https://www.linkedin.com/in/michalpiszczek/", "headline": "CTO @ Archdesk | FinTech exit | Ex-hacker | Building AI systems that actually work | AI infrastructure · Security Mechanics · Frontier Shifts · SaaS execution | Physics × Economics × Execution"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "The 9 out of 10 is what makes it dangerous, not the 10th. A reviewer who has seen nine clean outputs stops reading the tenth as carefully, and a lookup table synthesizes fine in simulation right up until it blows your gate count and timing closure on the actual chip.", "likes": 3, "replies": [{"comment_id": null, "author": {"name": "Nick Belov", "profile_url": "https://www.linkedin.com/in/nick-belov-de/", "headline": "Senior Data Engineer | 12+ YoE | AWS • GCP • PySpark • Kafka • RAG | 🌍 Open to Global Roles"}, "is_author_reply": false, "posted_at": "2026-09-05T21:10:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "Michał Piszczek just need LLM which check previous LLM answers, etc, etc  😋", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Eyal Hochberg", "profile_url": "https://www.linkedin.com/in/eyal-hochberg-7570b821/", "headline": "Entrepreneur at ARTL.ai"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "This is why we developed Python to Verilog as an intermediate logical level. The LLM writes in high level and our compiler generates optimized Verilog code according to PPA tradeoff directives.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "kash johal", "profile_url": "https://www.linkedin.com/in/kash-johal-9928401/", "headline": "Chiplets and Advanced Packaging - low cost advance packaging"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Well its ensuring you are awake and the brain cells are in tip top shape.", "likes": 2, "replies": []}, {"comment_id": null, "author": {"name": "Manoj V.", "profile_url": "https://www.linkedin.com/in/mvfpga/", "headline": "Sr. VP | AI/ML FPGA/ASIC HFT Expert |  ex- AMD | ex-SIG | Inventor (14 global patents )"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "did you tell it to not make mistakes 😂", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Mojtaba Bagheri", "profile_url": "https://www.linkedin.com/in/mojtaba-bagheri-85923a57/", "headline": "Daytime engineer, nighttime innovator"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Add \"don't give me a LUT you dumb twat\" to your prompt.", "likes": 0, "replies": []}], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7498605276183445504", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7498605276183445504/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-26T12:00:00+00:00", "posted_at_hint": "Aug 26", "posted_at_approx": true, "text": "DON'T use cron inside Claude Code to poll status, it wastes your tokens like burning money.\n\nCron wakes up Claude, sends the full context window, finds nothing happens, and goes back to sleep again.\n\nJust use a bash script and a loop instead", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 4, "reposts": 1, "comment_count": 5, "comments": [{"comment_id": null, "author": {"name": "Kulwant Singh", "profile_url": "https://www.linkedin.com/in/skkpta/", "headline": "Founder & CEO @ KPTA | 14+ Yrs Semiconductor Alum (Ex-Infineon, Intel, AMD, Qualcomm) | Deep-Tech Innovator & Investor & Collaboration"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Just to say avoid making habit of AI to take care , leverage AI for hard part to get quick but don't build with dependency attached", "likes": 2, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Kulwant Singh humans are lazy", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Kulwant Singh", "profile_url": "https://www.linkedin.com/in/skkpta/", "headline": "Founder & CEO @ KPTA | 14+ Yrs Semiconductor Alum (Ex-Infineon, Intel, AMD, Qualcomm) | Deep-Tech Innovator & Investor & Collaboration"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Horace Chan i won't say lazy , deep analysis is missing cost over time vs blocks assets building", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Vansh lata", "profile_url": "https://www.linkedin.com/in/vansh-lata-0909b853/", "headline": "Member of Technical Staff at AMD, Ex Samsung"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "I also see that  some crons which are already killed, still keep firing stale prompts and claude cannot find a way to kill the pid", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Vansh lata Claude Code needs some real human QA", "likes": 0, "replies": []}]}], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7498066462658641920", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7498066462658641920/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-25T12:00:00+00:00", "posted_at_hint": "Aug 25", "posted_at_approx": true, "text": "We should build a full stack CPU ISA and programming language for AI coding agents, remove the humans needs completely from the loop.\n\nThis article is created by me chatting back and forth with ChatGPT.   If this idea sounds too crazy, it is AI+human slop, not merely AI slop.", "post_type": "article_share", "shared_article": {"title": "What If We Designed a CPU and Programming Language for AI Coders, Not Humans?", "url": "https://www.linkedin.com/pulse/what-we-designed-cpu-programming-language-ai-coders-humans-chan-umpyc/"}, "reshared_post": null, "likes": 9, "reposts": 0, "comment_count": 11, "comments": [{"comment_id": null, "author": {"name": "Bill Lye", "profile_url": "https://www.linkedin.com/in/wmlye/", "headline": "30+ years of CMOS Mixed-Signal Design"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Honestly, I'm not all that sure that this is truly AI-Native.  You're describing a semantic-aware  IR (more capable than the LLVM IR) that is describing data flow graphs.  To represent those graphs in a string of bytes, you're going to end up with an IR that looks a hell of a lot like LISP, where the distance between the code and the AST representing that code is minimal.\n\nTo execute this IR, you'll have a hardware scalar engine with a JIT running on it that maps the IR to the native ISA.  The IR would ideally make the vectorizable portions easily mapped to whatever vector engine is available with the ability to map them to the scalar engine as a backup.\n\nThe IR and JIT could possibly make the memory aliasing issue much less problematic, and RTO in the JIT could perhaps simplify branch prediction, so the underlying hardware could be simplified somewhat.  The scalar datapath could be VLIW or RISC (scalar or superscalar), and a superscalar design might be a bit simpler than what is common today.  However I don't see this doing away with caches and possibly speculation to deal with concurrency and non-determinism.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Bill Lye", "profile_url": "https://www.linkedin.com/in/wmlye/", "headline": "30+ years of CMOS Mixed-Signal Design"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "To make everything work together, the JIT/RTO would likely need more instrumentation of the various components in the system, and it would likely benefit from tagged memory (similar to LISP machines).  That'll help both with safety because the processors will always know the types they're working with and with RTO because the JIT can stash hints in the tags.\n\nI see this more as a distribution system (the IR) together with several ideas from MultiFlow, the i860, LISP machines, and Transmeta, together with several of the current class of native ISA emulators that are essentially JIT's with various levels of RTO.  I don't see it as either an AI-native ISA or an AI-native language.\n\nLLM's seem to be capable of handling almost any language (except possibly BrainFuck) given a sufficiently large corpus of code and clear semantics.  A highly-regular language where there are fewer corner cases is probably better, but my experiments with several languages and LLM's seems to bear out that larger training corpuses = better results.\n\nMaybe LISP is the ideal language for AI; it's consistent all the way down, code is data, and the distance between code and AST is almost zero.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Bill Lye and LISP is human unreadable too!", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Bill Lye", "profile_url": "https://www.linkedin.com/in/wmlye/", "headline": "30+ years of CMOS Mixed-Signal Design"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "In any event, there's nothing preventing us from using a language that requires us to do more work to lower it to the distribution IR, it's just that the effort required to lower a LISP-like language to the IR while guaranteeing top-to-bottom consistency is less than (for example) JavaScript or Python.\n\nAlso, just to be clear, when I say \"LISP-like\" I don't necessarily mean \"LISP\" itself.  SKILL, the internal scripting language from Cadence, is an example of C-like functional syntax running on a LISP back end.  The functional syntax is a very thin layer of impedance matching code that was inserted into a fairly conventional REPL loop.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Bill Lye", "profile_url": "https://www.linkedin.com/in/wmlye/", "headline": "30+ years of CMOS Mixed-Signal Design"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Horace Chan Ha!  We overlapped.  LISP, with all its parentheses can sometimes feel like BrainFuck.  Or worse, TCL.  However the format of the IR and the language don't necessarily need to be linked.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Bill Lye tcl is on the other extreme of LISP, everything is a string.\n\nMaybe LISP and tcl is the only two languages we need after all.  Everything else in between can be replaced by a mixture of LISP/tcl", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Paul Hylander", "profile_url": "https://www.linkedin.com/in/paul-hylander-a418521/", "headline": "Diverse technology leader and innovator"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Register renaming is not for human benefit, it’s to reduce encoding cost. You also seem to be giving more credit to LLMs than what they’ve demonstrated to be capable of - evidence suggests that LLMs by themselves are not actually very good at detailed error free processing, yet it appears that you’re expecting them to be essentially do the job of a compiler. Why would your “primitives” include high level operations like gather or scatter, not to mention some of the other things you propose? Why remove raw pointers from the mix of you’re asking LLMs to be able to deal with all sorts of other semantic concepts? Presumably if they can deal with all the other stuff you propose, then they can also handle “raw” pointers. And similarly why add extra complexity in the hardware to support tagged pointers and runtime checking when the LLM is supposedly able to handle all this extra complexity? It really seems like your ideas are an odd mix of mutually inconsistent assumptions and gee-whiz features", "likes": 2, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Paul Hylander yeap.  It is human+AI slop.  The last time I read computer architecture was in college many years ago.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Stephen Noftall", "profile_url": "https://www.linkedin.com/in/stephen-noftall-75940027/", "headline": "Electronic hardware and software designer from start to finish"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Horace Chan I like it, lots of interesting ideas :-) Reminds me of this paper I had a hard time chewing on\n\nhttps://arxiv.org/pdf/2505.17117\n\nFrom Tokens to Thoughts: How LLMs and Humans Trade Compression for Meaning\narxiv.org", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Stephen Noftall it reminds me 3B1B new video saying compressiom and intelligence is the same thing", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Stephen Noftall", "profile_url": "https://www.linkedin.com/in/stephen-noftall-75940027/", "headline": "Electronic hardware and software designer from start to finish"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Horace Chan thanks for the tip, got to go watch that one :-)", "likes": 0, "replies": []}]}], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7498182610200903680", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7498182610200903680/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-25T12:00:00+00:00", "posted_at_hint": "Aug 25", "posted_at_approx": true, "text": "I experienced model collapse first hand.  (well... not exactly the model collpase, but close enough)\n\nI have a skill (on Claude Code Sonnet 5) write a daily scrum report for my team, I haven't made any changes to the skill, but the daily scrum report slowly degrades, to a point that it is human unreadable.\n\nI finally ask Claude Code to investigate, it turns out Claude use the previous reports as style reference.  After Claude feeding on its output for 3 months, the daily report degenerates into AI slop.\n\nNow imagine if we have pure AI written code base, the AI use existing code as reference to modify the same code base, after some number of iterations, the whole code base will become AI slop.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 11, "reposts": 1, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Dr. Tobias Ludwig", "profile_url": "https://www.linkedin.com/in/dr-tobias-ludwig/", "headline": "CEO | Formal Verification Enthusiast | Building the leading systemized Formal Verification delivery partner for the semiconductor industry"}, "is_author_reply": false, "posted_at": "2026-08-27T21:10:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Following your posts your really have some strong opinions about AI 😁\nAlways a good read !", "likes": 2, "replies": []}], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7498263830582415360", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7498263830582415360/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-25T12:00:00+00:00", "posted_at_hint": "Aug 25", "posted_at_approx": true, "text": "Rebuild classic chips in SystemVerilog using open source EDA tools one chip at a time, the first chip start with 74181.\n\nhttps://lnkd.in/gwNNRYkJ", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 32, "reposts": 2, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7495570040503824384", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7495570040503824384/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-18T12:00:00+00:00", "posted_at_hint": "Aug 18", "posted_at_approx": true, "text": "We are living in the AI age, the only limitation is your imagination (and some red tapes)", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7495285114172538881", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7495285114172538881/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-17T12:00:00+00:00", "posted_at_hint": "Aug 17", "posted_at_approx": true, "text": "It took me a few minutes to generate 30 pages of slides using AI, and the slides even come with fancy AI generated pictures that look pretty cool.\n\nIt took me 3 hours to hand craft 3 slides from the same source materials, just old fashion bullet points plain text.\n\nThat is the gap between AI and human. AI couldn't get me the 3 slides of plain text that actually matters in the meeting.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7495333927155376128", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7495333927155376128/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-17T12:00:00+00:00", "posted_at_hint": "Aug 17", "posted_at_approx": true, "text": "The new loop engineering - randomly changing words in your AI output until the Claude watermark goes away", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7495357603208949761", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7495357603208949761/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-17T12:00:00+00:00", "posted_at_hint": "Aug 17", "posted_at_approx": true, "text": "Engineer has a surprisingly long shelve live.  Where does software developers fit in this curve?", "post_type": "reshare", "shared_article": null, "reshared_post": {"author_name": "Dipl Ing Lars Behrendt", "author_profile_url": "https://www.linkedin.com/in/dipl-ing-lars-behrendt/", "author_headline": "INVENTOR · INNOVATOR · INVESTOR - Building Companies. Not Slide Decks. We build and scale industrial ventures. At own risk.", "posted_at_hint": "Aug 4"}, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7494896726059827200", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7494896726059827200/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-16T12:00:00+00:00", "posted_at_hint": "Aug 16", "posted_at_approx": true, "text": "Mommy bank, AI-native app for parents to keep track of the kids pocket money and screen time.\n\n100% AI coding, supports built-in MCP server, so you can control it from your AI agent too.\n\nhttps://lnkd.in/gGMn7ftU", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7493402766858403840", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7493402766858403840/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-12T12:00:00+00:00", "posted_at_hint": "Aug 12", "posted_at_approx": true, "text": "Stupid AI added two hundred duplicated lines to my ~/.gitconfig\nWe should ban AI from writing to your HOME even in YOLO mode.\nI know people will question why I am running in YOLO mode. To make the most out of AI, you have to\nIf you never take off the training wheels, you will never learn how to ride a bicycle.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Peter Li", "profile_url": "https://www.linkedin.com/in/peter-li-a30ab654/", "headline": "1st Lead Systems Software Engineer at Citrix"}, "is_author_reply": false, "posted_at": "2026-08-27T21:45:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "It reminds me of drivers sleeping in the car while using Tesla's FSD. It's your own choice.", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7493022657290862592", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7493022657290862592/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-11T12:00:00+00:00", "posted_at_hint": "Aug 11", "posted_at_approx": true, "text": "AI has no common sense. I asked it to wire up the DUT in the testbench, it got the sanity testcase passing, but it left some ports opened. No even an intern would make this mistake.\n\nI can explicitly tell it to check for floating signals, and it would get it right, but who knows what other common sense AI is lacking.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 6, "comments": [{"comment_id": null, "author": {"name": "Dan B.", "profile_url": "https://www.linkedin.com/in/danbarrowman/", "headline": "Seasoned Electrical/FPGA/ASIC/RTL Engineer with individual & managerial experience"}, "is_author_reply": false, "posted_at": "2026-09-05T21:45:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "Did you try saying \"make sure all inputs and outputs are exercised and tested by the test bench\"? If any issues are encountered, ask for clarification.", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T21:45:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Dan B. Nope. But I don't have to tell my intern that too. AI suppose to be smarter than an intern.", "likes": 0, "replies": []}]}, {"comment_id": "7493103148446855169", "author": {"name": "Tony Gladvin George, Ph.D.", "profile_url": "https://www.linkedin.com/in/tonygeorge/", "headline": "Principal Silicon Engineer | AI Deployment | NVMe IP Architecture, Design & Verification"}, "is_author_reply": false, "posted_at": "2026-08-27T21:45:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "This \"common sense\" aka \"domain knowledge\" may be purely depended on the model we use?", "likes": 0, "replies": [{"comment_id": "7493380346965557248", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T21:45:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Tony Gladvin George, Ph.D. both Opus and Sol lacks hardware engineer common sense.\n\nI thought Anthropic and OpenAI has read every single textbook in the world to train their LLM. I am sure some textbook must have thou shalt not let ports free floating.", "likes": 2, "replies": []}, {"comment_id": null, "author": {"name": "Paul Marriott", "profile_url": "https://www.linkedin.com/in/paulmarriott/", "headline": "1st, Senior Principal Verification Engineer at NXP"}, "is_author_reply": false, "posted_at": "2026-08-27T21:45:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Horace Chan some things are so \"obvious\" that they're not written down. I have had heated discussions with requirements architects on this subject:) The tl;dr version is that everything should be in the requirements, even things that everyone \"knows\" to be obvious - because if it's not written, it can't be verified nor traced.", "likes": 3, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T21:45:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Paul Marriott Do you know that a standard/spec leave out little \"obvious\" things on purpose, it is a barrier of entry. The companies with engineers in the committee working on the draft knows those subtle decisions, so their product will be 100% compatible. The newcomer who doesn't know those subtle things can only get 99.9% working and the last 0.1% is the moat.", "likes": 1, "replies": []}]}], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7492615914648084480", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7492615914648084480/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-10T12:00:00+00:00", "posted_at_hint": "Aug 10", "posted_at_approx": true, "text": "What is the first thing you do when you turn on your laptop at work in the morning?\n1. Read email\n2. Read Jira\n3. Read Teams\n4. Chat with Claude/Codex", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7492120659725135872", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7492120659725135872/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-09T12:00:00+00:00", "posted_at_hint": "Aug 9", "posted_at_approx": true, "text": "Kilo gateway has free Poolside Laguna XS 2.1 tokens.\n\nFrom my subjective user experience, I think it is as good as Sonet 4.5", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7492256702709526528", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7492256702709526528/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-09T12:00:00+00:00", "posted_at_hint": "Aug 9", "posted_at_approx": true, "text": "I spent $5 on Kimi K3 at Open Router to run a code audit, I am pretty impressed by what it found. It picked up some bugs missed by Opus and Sol.\n\nThen I just run my cheap GLM to implement the fixes.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": "7492335813817634816", "author": {"name": "Bondan Rufen", "profile_url": "https://www.linkedin.com/in/bondan-rufen/", "headline": "Co-founder"}, "is_author_reply": false, "posted_at": "2026-08-27T21:45:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "What will happen if you reverse the position, Kimi does coding, Opus/Sol run a code audit? Will it be cheaper because coding is usually longer then audit.", "likes": 2, "replies": [{"comment_id": "7492615576205336576", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T21:45:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Bondan Rufen Opus and Sol come with my kiro subscription", "likes": 0, "replies": []}]}], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7492041926318125056", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7492041926318125056/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-08T12:00:00+00:00", "posted_at_hint": "Aug 8", "posted_at_approx": true, "text": "Other than agentic coding and long running tasks, Gemini is good enough for most chatbot style works.\n\nMaybe DeepMind has some AI breakthrough that doesn't need a 2.5T parameters model to write code and run long agentic tasks, that's why they can rent out all those GPU or TPU.\n\nGemini is Cooked but GCP is Cooking https://lnkd.in/gFAnh-RS", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7488597795977785345", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7488597795977785345/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-30T12:00:00+00:00", "posted_at_hint": "Jul 30", "posted_at_approx": true, "text": "Tokens efficiency is what sets senior engineers apart from junior engineers in the post AI era", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7488228708416131072", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7488228708416131072/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-29T12:00:00+00:00", "posted_at_hint": "Jul 29", "posted_at_approx": true, "text": "Punch card and AI", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7488235243406086144", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7488235243406086144/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-29T12:00:00+00:00", "posted_at_hint": "Jul 29", "posted_at_approx": true, "text": "AI is expensive. AI coding agent spent lots of tokens reading code\nWe should write code using single letter variable and function names to reduce the tokens bill.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Barry Moss", "profile_url": "https://www.linkedin.com/in/barrygmoss/", "headline": "FPGA/ASIC Design Engineer"}, "is_author_reply": false, "posted_at": "2026-07-28T21:45:00+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "Well, if you are going to have it generate code that is as readable as a 1970s-era BASIC program, why not just generate binary (or a netlist in the case of RTL)? When you go to that extreme, it means that you aren't expecting the code to be human readable/reviewable/maintainable anyway.", "likes": 2, "replies": []}], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7488289819404705795", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7488289819404705795/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-29T12:00:00+00:00", "posted_at_hint": "Jul 29", "posted_at_approx": true, "text": "I just come across the most dangerous skill - home cleanup skill\n\nThis skill will look at your ~ directory and try to delete some useless stuff to reclaim some diskspace from your HOME path\n\nI will never trust a robot barber cutting my hair with a sharp knife (power shaver is OK), I will never trust AI delete anything for me in my HOME.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7488389418962264064", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7488389418962264064/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-29T12:00:00+00:00", "posted_at_hint": "Jul 29", "posted_at_approx": true, "text": "I talked to a friend (non engineer) at another S&P500 company, their AI adoption is at Microsoft Copilot, ChatGPT/Claude desktop app level\n\nThey don't get any explicit token limit, the limit comes with the monthly subscription\n\nIt costs $300 to subscribe to all 3 a month, big companies may have some discounts and they may only keep one eventually.\n\nSo we can reasonably estimate non tech workers will spend $100 per month on AI, combined with what I heard last time, tech workers will spend $1000 per month on AI\n\nWe can roughly estimate the total addressable market of AI and calculate how high the AI bubble could go", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7486845184157077504", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7486845184157077504/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-25T12:00:00+00:00", "posted_at_hint": "Jul 25", "posted_at_approx": true, "text": "What level are you at?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 3, "comments": [{"comment_id": null, "author": {"name": "Nick Becker", "profile_url": "https://www.linkedin.com/in/nickabecker/", "headline": "Computer Programmer"}, "is_author_reply": false, "posted_at": "2026-08-27T21:45:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Level 5: Stopped working and started enjoying life 😂", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Artemios Diakogiannis", "profile_url": "https://www.linkedin.com/in/artemios-diakogiannis-3635b827/", "headline": "Lead Principal Verification Engineer - Verification Domain TL at Infineon Technologies"}, "is_author_reply": false, "posted_at": "2026-07-28T21:45:00+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "Level 3 but keep optimistic for next level. 😀", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Bondan Rufen", "profile_url": "https://www.linkedin.com/in/bondan-rufen/", "headline": "Co-founder"}, "is_author_reply": false, "posted_at": null, "posted_at_hint": null, "posted_at_approx": true, "text": "still level 2", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7486846539466698752", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7486846539466698752/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-25T12:00:00+00:00", "posted_at_hint": "Jul 25", "posted_at_approx": true, "text": "MLB knows AI is better than human, but sport is a show business, if the team with bigger GPU always win, it is not fun to watch.", "post_type": "reshare", "shared_article": null, "reshared_post": {"author_name": "Matt Mills", "author_profile_url": "https://www.linkedin.com/in/matt-mills-a47671/", "author_headline": "President", "posted_at": null, "posted_at_hint": "Jul 21"}, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7486851877335166976", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7486851877335166976/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-25T12:00:00+00:00", "posted_at_hint": "Jul 25", "posted_at_approx": true, "text": "To ride the wave of AI, work on something that has no upper bound on what you can archive.\n\nQuote: There is no Shakespeare of customer service emails that is 100x better than the average customer service email.\n\nhttps://lnkd.in/gDnnrHid", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7486574720063070208", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7486574720063070208/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-24T12:00:00+00:00", "posted_at_hint": "Jul 24", "posted_at_approx": true, "text": "It is gorgeous playing Microsoft Flight Simulator 2024 on an AMD 9950X3D + 64G RAM + 7900XTX\n\nWe just got this super powerful gaming rig in the office's game room, in addition to the good old PS5 and XBox\n\n#amdbrandambassador", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7486576084042395648", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7486576084042395648/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-24T12:00:00+00:00", "posted_at_hint": "Jul 24", "posted_at_approx": true, "text": "I just explain to my intern his task.\n\nlevel 1 - the intern ran the commands to do X manually\nlevel 2 - the intern writes a shell script to do X\nlevel 3 - the intern uses AI coding agent to vibe code a shell script to do X\nlevel 4 - the intern builds a reusable skill, so that the AI coding agent can generate a shell script to do X on the fly\nlevel 5 - the intern builds a pipeline that can evaluate a reusable skill, which let the AI coding agent generate a shell script to do X on the fly\n\nWe are working on level 5.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7485340506898571264", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7485340506898571264/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-21T12:00:00+00:00", "posted_at_hint": "Jul 21", "posted_at_approx": true, "text": "In engineering companies , the budget is usually separated into two buckets:  1) human salary 2) license, server farms, etc. \n\nI wonder which bucket tokens cost will fall into", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 1, "comments": [{ r": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-20T12:00:00+00:00", "posted_at_hint": "Jul 20 • Edited", "posted_at_approx": true, "text": "AdvancingAI in 2 days.  Waiting for the big announcement from Lisa.  Who will be on stage with Lisa this year? #amdbrandambassador", "post_type": "reshare", "shared_article": null, "reshared_post": {"author_name": "AMD", "author_profile_url": "https://www.linkedin.com/company/amd/", "author_headline": null, "posted_at_hint": "Jul 17"}, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7485164759718494208", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7485164759718494208/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-20T12:00:00+00:00", "posted_at_hint": "Jul 20", "posted_at_approx": true, "text": "I like Claude Code better than Codex CLI\n\nFor one, I can't use many slash commands when GPT is thinking.  Claude Code happily execute the slash commands.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7483217921981247488", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7483217921981247488/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-15T12:00:00+00:00", "posted_at_hint": "Jul 15", "posted_at_approx": true, "text": "If you like tmux, you will like herdr\n\nIf you like Cursor's new agent command center, you will like herdr", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7483250480782143489", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7483250480782143489/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-15T12:00:00+00:00", "posted_at_hint": "Jul 15", "posted_at_approx": true, "text": "In the pre-AI era, companies hired McKinsey to fire human employees to cut cost\n\nIn the post-AI era, companies will hire McKinsey to shutdown AI agents to cut cost", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7482842814800633856", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7482842814800633856/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-14T12:00:00+00:00", "posted_at_hint": "Jul 14", "posted_at_approx": true, "text": "AI is just computing - transform bits, move bits, store bits, everything else are just technical trade-offs.\n\nThis article is 100% AI generated, but the original 3 tag lines come from my human brain.", "post_type": "article_share", "shared_article": {"title": "AI Is Just Computing — and Computing Has Only Three Basic Jobs", "url": "https://www.linkedin.com/pulse/ai-just-computing-has-only-three-basic-jobs-horace-chan-zjs8c/"}, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 3, "comments": [{"comment_id": null, "author": {"name": "Jarmo Venalainen", "profile_url": "https://www.linkedin.com/in/jarmo-venalainen-abb61810/", "headline": "Studying what AI is, what it can do and what it will do."}, "is_author_reply": false, "posted_at": "2026-07-28T21:50:00+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "And at its core it has only three logic functions to do all that.\n\nAND, OR and NOT.\n\nAnd, yes that includes memory if you consider that you can build a bi-stable flip-flop with the above.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-07-28T21:50:00+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "You only need the NAND gate", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Jarmo Venalainen", "profile_url": "https://www.linkedin.com/in/jarmo-venalainen-abb61810/", "headline": "Studying what AI is, what it can do and what it will do."}, "is_author_reply": false, "posted_at": null, "posted_at_hint": "(edited) 2mo", "posted_at_approx": true, "text": "NAND reduces to NOT and AND.", "likes": 0, "replies": []}], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7482972785305231360", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7482972785305231360/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-14T12:00:00+00:00", "posted_at_hint": "Jul 14", "posted_at_approx": true, "text": "Human with no consciousness is zombie\n\nLLM has no consciousness\n\nLLM is AI zombie", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7483032665005248512", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7483032665005248512/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-14T12:00:00+00:00", "posted_at_hint": "Jul 14", "posted_at_approx": true, "text": "Why IBM is down
