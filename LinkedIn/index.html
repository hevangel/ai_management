ed_at": "2026-03-01T02:54:00+00:00", "posted_at_hint": "7mo", "posted_at_approx": true, "text": "welcome git conflicts ! That's really something you shoud avoid.", "likes": 0, "replies": []}], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7431802106074013696", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7431802106074013696", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-02-23T12:00:00+00:00", "posted_at_hint": "Feb 23 • Edited", "posted_at_approx": true, "text": "Getting rid of all the rent seekers are always a good thing, it makes our economy more efficient. We don't need more human real estate agents, we need more nurses, doctors, teachers, scientists, engineers and technicians.  Those jobs that have REAL productivity output won't afraid of AI.  It just makes you produce more, faster and cheaper. We have been complaining against consumerism problems for decades, AI can cure it once for all.  We don't need luxury handbags, designer fashion and fancy fine dinner (ok, except for anniversary), getting rid of them is for the good of the society. (Link attachment: https://lnkd.in/g5CDAEst — preview card 'THE 2028 GLOBAL INTELLIGENCE CRISIS', citriniresearch.com)", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7431439446786449408", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7431439446786449408", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-02-22T12:00:00+00:00", "posted_at_hint": "Feb 22", "posted_at_approx": true, "text": "Not only you have to think like a manager when commanding a team of AI agents working for you. You also have to think like a VC to command multiple teams of AI agents attacking the same problem from multiple angles. Try out different alternatives in parallel and see which one works the best.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7428498720050278401", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7428498720050278401", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-02-14T12:00:00+00:00", "posted_at_hint": "Feb 14", "posted_at_approx": true, "text": "RIP #heroku It was a great platform until it was acquired. We will miss you", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7428329494811201536", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7428329494811201536", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-02-13T12:00:00+00:00", "posted_at_hint": "Feb 13", "posted_at_approx": true, "text": "Learning an agentic skill is like learning a real skill, you have to practice to use it well. Don't expect you can simply download a Claude Code plugin and you become a subject expert the next minute.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7427765267990028288", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7427765267990028288", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-02-12T12:00:00+00:00", "posted_at_hint": "Feb 12", "posted_at_approx": true, "text": "2026 is the make or break year. Companies and people who are too late to adopt AI will get left behind.\n\n[Post shares an article: \"Something Big Is Happening\" by Matt Shumer]", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Jarmo Venalainen", "profile_url": "https://www.linkedin.com/in/jarmo-venalainen-abb61810/", "headline": null}, "is_author_reply": false, "posted_at": "2026-01-30T02:54:00+00:00", "posted_at_hint": "8mo", "posted_at_approx": true, "text": "I agree.\nAI is real. It's here. It can do tasks. Many tasks, but always limited to that of processing sequences of tokens, such as words and numbers, so that they turn into new, different sequences of words and numbers.\n…\nMany human jobs are also that of token manipulation, but humans live in a world of accountability, relationships, coordination, and exception handling. AI has started and will do a better job at token processing, but cannot do accountability, relationships, coordination, and exception handling.\nThe \"AI is building the next AI\" line is true. Models can write code, debug, test, evaluate, and speed iteration. However define what is written, what \"better\" means, and gate deployment. The loop is tooling acceleration, not autonomous evolution.\nThe practical delta is personal. If you treat AI as a search engine you see a toy. If you build a one on one working interface over time, you discover it is an n-dimensional compressor of cognitive work. That is why the public perception gap exists.\nSo the advantage is not prediction. It is adaptation. Learn to drive it. Push it into real work. Measure what it can remove from your week. Keep the human parts that carry responsibility, trust, and real world consequence.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Nathaniel L.", "profile_url": "https://www.linkedin.com/in/nlayton/", "headline": null}, "is_author_reply": false, "posted_at": "2026-01-30T02:54:00+00:00", "posted_at_hint": "8mo", "posted_at_approx": true, "text": "Fear mongering... 😉", "likes": 0, "replies": []}], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7427785515770269696", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7427785515770269696", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-02-12T12:00:00+00:00", "posted_at_hint": "Feb 12", "posted_at_approx": true, "text": "The Opus 4.6 version of DVCon AI library is also working. Web scraper, extraction pipeline, RAG database, LLM call backend, web GUI front end, all vibed coded in a few hours (on-and-off human time)\n\nFrom this exercise, I think GPT 5.3 is smarter than Opus 4.6, although Claude Code is definitely better than Codex in term of usability. Opus 4.6 got stuck at weird places, it keeps asking me to refresh the cache of my browser after I bsub the run to another host. It turns out somewhere in the code the server path is hardcoded to the previous LSF host. To be fair, I didn't switch the LSF host halfway in my GPT 5.3 run, so I actually don't know which LLM is smarter.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": null}, "is_author_reply": false, "posted_at": "2026-03-01T02:54:00+00:00", "posted_at_hint": "7mo", "posted_at_approx": true, "text": "Re-implement it with Cursor/GPT-4.5 on my own PC, so I can open source it\nOpen https://github.com/hevangel/dvcon_ai_library", "likes": 0, "replies": []}], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7427935394698289152", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7427935394698289152", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-02-12T12:00:00+00:00", "posted_at_hint": "Feb 12", "posted_at_approx": true, "text": "No one missed the punchcard.\nNo one will miss coding by hand.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7423983017708380161", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7423983017708380161", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-02-01T12:00:00+00:00", "posted_at_hint": "Feb 1", "posted_at_approx": true, "text": "Now I understand why people buy Mac Mini for OpenClaw.\n\nIt is hard to get it up and running using Windows Docker.  The document is misleading, some configure are missing and don't work out of the box\n\nFinally I got OpenClaw up and running, now I am struggling to connect it to Telegram and Signals.\n\nOpenClaw's document is an AI slop.  I have to point my sonnet at its source code to figure out how to configure it. properly.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7423406689854599168", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7423406689854599168", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-01-31T12:00:00+00:00", "posted_at_hint": "Jan 31", "posted_at_approx": true, "text": "When to use AI vs intern / jr eng?\nIf you know how to do it exactly -> use AI\nIf you know it is do-able but don't know exactly how -> use intern / jr eng\nIf you don't know whether it is do-able or not -> you have to find it out yourself", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7423450567303303168", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7423450567303303168", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-01-31T12:00:00+00:00", "posted_at_hint": "Jan 31", "posted_at_approx": true, "text": "Anthropic should train an English only Opus that is smaller, faster and cheaper\n\nEveryone writes code in English, why waste the model weights on languages that most people don't use.\n\nFor speakers of other languages, they can just put a translator model in front of the English only coding model.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7423143736685064192", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7423143736685064192", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-01-30T12:00:00+00:00", "posted_at_hint": "Jan 30 (Edited)", "posted_at_approx": true, "text": "Life goes a full cycle in how we write documents\nI used to write documents with Word Perfect in DOS in pure text mode, you have to see how the document is rendered before you print it. Then we have Word, WYSIWYG editor.\nNow in the age of AI, we go back to write documents in markdown text, so it is AI friendly, and render it to Word docs before printing it out", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7422720154276519936", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7422720154276519936", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-01-29T12:00:00+00:00", "posted_at_hint": "Jan 29", "posted_at_approx": true, "text": "vibe installer (n.)\n\nPeople who let AI install mcp servers and agentic skills without review them first. It is the next evolution of vibe coder.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7422414163874004992", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7422414163874004992", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-01-28T12:00:00+00:00", "posted_at_hint": "Jan 28", "posted_at_approx": true, "text": "I am an old fashion vibe-coder, I no longer read the generated code, but I still read the skills and MCP servers tool description I add to my Claude Code.\n\nThere are newer generation vibe-vibe-coder. They just vibe install whatever skill or MCP servers to their Claude Code without looking at them at all.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7418458033669992448", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7418458033669992448", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-01-17T12:00:00+00:00", "posted_at_hint": "Jan 17", "posted_at_approx": true, "text": "In 2024, everyone thinks about how to integrate AI/LLM into apps\nIn 2026, it should be the other way round, think about how to integrate apps into AI/LLM", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Jarmo Venalainen", "profile_url": "https://www.linkedin.com/in/jarmo-venalainen-abb61810/", "headline": null}, "is_author_reply": false, "posted_at": "2025-12-31T02:54:00+00:00", "posted_at_hint": "9mo", "posted_at_approx": true, "text": "Exactly right. AI as an individual, personal interface to apps. That way each of us can control apps and someting done without needing to remember 100's or even 1000's of comand sequences.", "likes": 0, "replies": []}], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7418167195790127104", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7418167195790127104", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-01-16T12:00:00+00:00", "posted_at_hint": "Jan 16", "posted_at_approx": true, "text": "In 2026, there is no \"prompt engineering\".  It is simply good thinking and clear writing.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7417657045836775424", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7417657045836775424", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-01-15T12:00:00+00:00", "posted_at_hint": "Jan 15", "posted_at_approx": true, "text": "It turns out AI doesn't replace the human brain, it replaces the human hands if all you do is typing and clicking.\n\nYou still need to use your own brian, but AI can make you type and click 100x faster", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}, {"activity_id": "7417348621735456769", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7417348621735456769", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": null}, "posted_at": "2026-01-14T12:00:00+00:00", "posted_at_hint": "Jan 14", "posted_at_approx": true, "text": "Helios had neon green cables last time.  It looks way cooler than the yellow cables.   Please bring #amdbrandambassador", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T02:54:00Z"}]}</script>
<script>
(function() {
  const DATA = JSON.parse(document.getElementById('archive-data').textContent);
  const posts = DATA.posts;
  const list = document.getElementById('list');
  const q = document.getElementById('q');
  const sortSel = document.getElementById('sort');

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const linkify = s => esc(s).replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  const fdate = (s, hint) => {
    if (s) { try { const d = new Date(s); if (!isNaN(d)) return d.toLocaleString(); } catch(e) {} }
    return hint ? esc(hint) : 'date unknown';
  };
  const sdate = (s, hint) => {
    if (s) { try { const d = new Date(s);
      if (!isNaN(d)) return d.toLocaleDateString(undefined, {month:'short', day:'numeric', year:'numeric'});
    } catch(e) {} }
    return hint || '';
  };

  /* Quiet full-height timeline rail: one tick per rendered post, gold for popular (>=5 comments). */
  const rail = document.getElementById('rail');
  const railLabel = document.getElementById('rail-label');
  const ccount = p => p.comments.length + p.comments.reduce((n,c)=>n+((c.replies||[]).length),0);
  const POP_N = 5;
  let tickEls = [];
  let railIO = null;
  function buildRail(items) {
    rail.innerHTML = '';
    tickEls = [];
    rail.style.display = items.length ? '' : 'none';
    const N = items.length;
    items.forEach((p, i) => {
      const b = document.createElement('button');
      const n = ccount(p);
      b.className = 'tick' + (n >= POP_N ? ' pop' : '');
      b.style.top = ((i + 0.5) / N * 100) + '%';
      const t = sdate(p.posted_at, p.posted_at_hint) + (n ? ' · ' + n + ' comments' : '');
      b.title = t;
      b.setAttribute('aria-label', 'Jump to post ' + (i+1) + ' of ' + N + ': ' + t);
      b.addEventListener('click', () => {
        const a = list.querySelector('article.post[data-i="' + i + '"]');
        if (a) a.scrollIntoView({behavior:'smooth', block:'start'});
      });
      rail.appendChild(b);
      tickEls.push(b);
    });
    if (railIO) railIO.disconnect();
    railIO = new IntersectionObserver(es => {
      es.forEach(e => {
        if (e.isIntersecting) {
          const i = +e.target.getAttribute('data-i');
          tickEls.forEach((t, j) => t.classList.toggle('active', j === i));
        }
      });
    }, {rootMargin:'-45% 0px -50% 0px'});
    list.querySelectorAll('article.post').forEach(a => railIO.observe(a));
  }
  document.addEventListener('mousemove', ev => {
    if (ev.clientX <= 30 && tickEls.length) {
      const i = Math.min(tickEls.length - 1, Math.floor(ev.clientY / window.innerHeight * tickEls.length));
      const b = tickEls[i];
      if (b && b.title) {
        railLabel.textContent = b.title;
        railLabel.style.display = 'block';
        railLabel.style.top = Math.min(Math.max(ev.clientY - 14, 8), window.innerHeight - 40) + 'px';
        return;
      }
    }
    railLabel.style.display = 'none';
  });

  function commentHTML(c) {
    const own = c.is_author_reply ? ' own' : '';
    const badge = c.is_author_reply ? '<span class="badge">author</span>' : '';
    const who = c.author.profile_url
      ? `<a href="${esc(c.author.profile_url)}" target="_blank" rel="noopener">${esc(c.author.name || 'Unknown')}</a>`
      : esc(c.author.name || 'Unknown');
    const replies = (c.replies || []).map(r =>
      `<div class="replies">${commentHTML(r)}</div>`).join('');
    return `<div class="comment${own}"><div class="who">${who}${badge}
      ${c.author.headline ? `<span class="headline"> · ${esc(c.author.headline)}</span>` : ''}
      <span class="when">${fdate(c.posted_at, c.posted_at_hint)}</span></div>
      <div class="ctext">${linkify(c.text)}</div>
      ${c.likes ? `<div class="clikes">👍 ${c.likes}</div>` : ''}${replies}</div>`;
  }

  function render() {
    const term = q.value.trim().toLowerCase();
    let items = posts.filter(p => {
      if (!term) return true;
      const hay = (p.text + ' ' + p.comments.map(c =>
        c.text + ' ' + c.author.name + ' ' + (c.replies||[]).map(r => r.text + ' ' + r.author.name).join(' ')
      ).join(' ')).toLowerCase();
      return hay.includes(term);
    });
    const by = sortSel.value;
    items = items.slice().sort((a,b) => {
      if (by === 'old') return new Date(a.posted_at) - new Date(b.posted_at);
      if (by === 'liked') return (b.likes||0) - (a.likes||0);
      if (by === 'discussed') return (b.comments.length + (b.comments.reduce((n,c)=>n+(c.replies||[]).length,0)))
                                   - (a.comments.length + (a.comments.reduce((n,c)=>n+(c.replies||[]).length,0)));
      return new Date(b.posted_at) - new Date(a.posted_at);
    });
    if (!items.length) { list.innerHTML = '<div class="empty">No posts match.</div>'; return; }
    list.innerHTML = items.map((p, i) => {
      const n = p.comments.length + p.comments.reduce((n,c)=>n+((c.replies||[]).length),0);
      const comments = p.comments.length
        ? p.comments.map(commentHTML).join('')
        : '<div class="empty">No comments.</div>';
      return `<article class="post" data-i="${i}">
        <div class="meta">${fdate(p.posted_at, p.posted_at_hint)} · <a href="${esc(p.url)}" target="_blank" rel="noopener">View on LinkedIn</a>
        ${p.post_type !== 'original' ? ` · ${esc(p.post_type)}` : ''}</div>
        <div class="text">${linkify(p.text)}</div>
        ${p.shared_article && p.shared_article.url ? `<div class="meta">🔗 <a href="${esc(p.shared_article.url)}" target="_blank" rel="noopener">${esc(p.shared_article.title || p.shared_article.url)}</a></div>` : ''}
        <div class="stats"><span>👍 ${p.likes||0}</span><span>💬 ${n}</span><span>🔁 ${p.reposts||0}</span>
        ${p.comments.length ? `<button data-toggle="${i}">Show comments (${n})</button>` : ''}</div>
        <div class="comments" id="c-${i}">${comments}</div>
      </article>`;
    }).join('');
    list.querySelectorAll('[data-toggle]').forEach(btn => btn.addEventListener('click', () => {
      const box = document.getElementById('c-' + btn.getAttribute('data-toggle'));
      const open = box.classList.toggle('open');
      btn.textContent = (open ? 'Hide' : 'Show') + ' comments (' + btn.textContent.match(/\d+/)[0] + ')';
    }));
    buildRail(items);
  }

  q.addEventListener('input', render);
  sortSel.addEventListener('change', render);

  const themeBtn = document.getElementById('theme');
  const setTheme = t => { document.documentElement.setAttribute('data-theme', t);
    themeBtn.textContent = t === 'dark' ? '☀️' : '🌙'; try { localStorage.setItem('li-arch-theme', t); } catch(e) {} };
  let saved = 'light';
  try { saved = localStorage.getItem('li-arch-theme') || 'light'; } catch(e) {}
  setTheme(saved);
  themeBtn.addEventListener('click', () =>
    setTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

  render();
})();
</script>
</body>
</html>
