e accepted 😎", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Eyal Hochberg", "profile_url": "https://www.linkedin.com/in/eyal-hochberg-7570b821/", "headline": "Entrepreneur at ARTL.ai"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "(edited) 1mo", "posted_at_approx": true, "text": "Horace Chan regardless I'll be happy to show you our agentic flow, we're not so secretive", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "kash johal", "profile_url": "https://www.linkedin.com/in/kash-johal-9928401/", "headline": "Chiplets and Advanced Packaging - low cost advance packaging"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "The answer is obvious isnt it. Not ready as a product. AI is alreadt assisting experts do better. But thats not a product you can license with a nice monthly fee.", "likes": 2, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "kash johal a more existential question, is selling software with a monthly fee even a viable business model in the future?", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Amir Mabhout, PhD", "profile_url": "https://www.linkedin.com/in/amirmabhout/", "headline": "Co-founder Simra: On-prem Agent for chip design teams, RL model training for IPs - PhD in Analog/Mixed Signal, German Citizen, Born in Iran (Islamic republic is a terrorist state and Iranians want it gone.)"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Simra autnomous design team have been streaming since 600 hours: https://www.twitch.tv/amirmabhout (been on holidays for a week, so not sure where they are at now) Its showcasing an agent team + OpenADA plugin toward a real tapeout. amirmabhout - Live on Twitch twitch.tv", "likes": 2, "replies": []}, {"comment_id": null, "author": {"name": "George White", "profile_url": "https://www.linkedin.com/in/george-white-65a829279/", "headline": "PolyLM"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "(edited) 1mo", "posted_at_approx": true, "text": "I built a pure analog crossbar memristor array architecture simulation thats modeled with a First-principles multi-physics co-simulation. Patent pending. It has been tested for failure for months and maintains it's benchmarks. It destroys gpu. Gdsii tapeout ready. Hope to talk with University of Michigan about a tapeout. Solid risk.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Rakshit Mishra", "profile_url": "https://www.linkedin.com/in/rakshitmishra9695/", "headline": "Building EasyChip | Digital Twin & Energy System Analyst | VLSI Design | Semiconductor Research"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "(edited) 1mo", "posted_at_approx": true, "text": "Challenge taken! Check out EasyChip", "likes": 2, "replies": []}], "scraped_at": "2026-09-26T22:40:00Z"}, {"activity_id": "7496690765893357568", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7496690765893357568/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-21T12:00:00+00:00", "posted_at_hint": "Aug 21", "posted_at_approx": true, "text": "Hardware engineers are NOT so safe from AI after all.\n\nGPT 5.6 Sol was able to one shot a 74181 in 45 minutes for $35. It comes with an implementation plan, test plan, formal plan, UVM TB, formal assertions and 100% coverage.\n\nOpus 5 finally finished the task the next morning spending almost $700.\n\nSonnet 5 and Luna are hopeless, we can write them off in hardware design work.\n\nNext I am going to try the run on some open source models.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 148, "reposts": 0, "comment_count": 20, "comments": [{"comment_id": null, "author": {"name": "Saheb Panda", "profile_url": "https://www.linkedin.com/in/arkiscool/", "headline": "MS ECE @ USC // FPGA Design // Formal Verification // ASIC Design"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Shouldn't be a big deal given it's a 4 bit CPU and there must be some resource online somewhere which it could use.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Saheb Panda No cheating. Only the spec and tools document is allowed. No skill. Only a very simple prompt that you would give to a human intern. I want to test how smart is the model.", "likes": 2, "replies": []}, {"comment_id": null, "author": {"name": "Micah Villmow", "profile_url": "https://www.linkedin.com/in/micah-villmow-1542534/", "headline": "Senior Research Engineer, IFM Silicon Valley Lab"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Saheb Panda it is a big deal. It means that someone who actually knows how to use AI in that domain can do something orders of magnitude more complex in a week.", "likes": 2, "replies": []}, {"comment_id": null, "author": {"name": "Saheb Panda", "profile_url": "https://www.linkedin.com/in/arkiscool/", "headline": "MS ECE @ USC // FPGA Design // Formal Verification // ASIC Design"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Micah Villmow the premise being the arch is too simplistic and old enough that it might be already in the weights of the model. Even a modern day cache unit is more complex than that chip. 4 bit might be the first step, but I think if it can verify something much bigger like 16bit CPU it would be more impressive. What do you think? You're the expert.", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Craig Haymond", "profile_url": "https://www.linkedin.com/in/craig-haymond/", "headline": "Engineering Manager / Team Lead"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "was the same harness used for all models tested?", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Craig Haymond nope. Use their native harness. Claude use Claude Code , GPT use Codex", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "Pallavi Kumar", "profile_url": "https://www.linkedin.com/in/pallavikum/", "headline": "Senior staff verification engineer @ AMD | AI Evangelist"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "What about Terra ? I've been quite liking it", "likes": 2, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "(edited) 1mo", "posted_at_approx": true, "text": "Pallavi Kumar on ability curve of Terra for any thinking effort, there is a cheaper corresponding Sol or Luna thinking effort. Something like Luna max is cheaper than Terra medium Sol low is cheaper than Terra max", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "Ravikumar M.", "profile_url": "https://www.linkedin.com/in/ravikumar-m/", "headline": "Solution Architect, Tech Mahindra"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "(edited) 1mo", "posted_at_approx": true, "text": "A human need to confirm if AI did the job or not. With 20% hallucination possibility we cannot leave the validation and quality aspects to other AI models/agents. So, number of hardware engineers working on a spec may reduce, but now these hardware engineers can spend more time creating new specs.", "likes": 2, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Ravikumar M. how many spec does the world really need?", "likes": 2, "replies": []}, {"comment_id": null, "author": {"name": "Ravikumar M.", "profile_url": "https://www.linkedin.com/in/ravikumar-m/", "headline": "Solution Architect, Tech Mahindra"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "(edited) 1mo", "posted_at_approx": true, "text": "Horace Chan I think there are many areas. High performance cheap Hardware can reduce costs drastically while gaining on time. We saw that with USB, Microprocessors etc.. As far as I know, not everything is moved into hardware, we have some processing power, communication tech, memory moved into hardware with some peripherals. The complexity to test & debug makes the process slow to move for other systems to migrate. I think with AI most of these things can gain speed, so innovators can free their mind from testing, debugging and think about improving processes in other areas. For example AI inference, edge computing, digital twins with sensors in real systems etc are possible.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Mika Nyström", "profile_url": "https://www.linkedin.com/in/mika-nystr%C3%B6m-b99b76/", "headline": "Chip architect"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Ravikumar M. Well 74181, that's the 4-bit ALU, right? (Not sure why I would remember that but I think that's what it was.) That's easily small enough that even naive formal verification can validate the design. So you don't really need humans for this task. This gets a lot more interesting if the design can loop and has a lot of state. In those cases, you can use AI to create a correctness proof that you check against the spec and RTL. So the only thing you should have to check by human is the spec. What's important there is that if it's a large system, you really should only have to check the spec at the perimeter of the system, not at every internal module boundary. Well, holy grail and all that. But I'm cautiously optimistic 😁", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Ravikumar M.", "profile_url": "https://www.linkedin.com/in/ravikumar-m/", "headline": "Solution Architect, Tech Mahindra"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Mika Nyström Yes, specs and gaurdrails - that is what makes the whole process controlled & manageable.", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Matthew Swanson", "profile_url": "https://www.linkedin.com/in/matthew-swanson-cpp/", "headline": "Linux Systems Engineering | Distributed Systems Engineering | Embedded Linux"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "What was the ROI on that? 0?", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Matthew Swanson fun is priceless", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "Sowmya Pitchaimoorthy", "profile_url": "https://www.linkedin.com/in/sowmya-pitchaimoorthy-6011a42a/", "headline": "Principal MTS & Verification Manager at AMD | Infinity Fabric Architecture | Pre-Silicon DV Leadership"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "So which one did it better?", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Sowmya Pitchaimoorthy Sol is the best so far. Stay tuned on my experiment on open source models", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "Marko Mandaric", "profile_url": "https://www.linkedin.com/in/markomandaric/", "headline": "CEO @ Sense Inc."}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "You would hope that a 3t parameter model could do something that was unveiled in 1970.", "likes": 2, "replies": []}, {"comment_id": null, "author": {"name": "Damian Tedrow", "profile_url": "https://www.linkedin.com/in/damian-tedrow-700837151/", "headline": "Cobblestone Project Leader"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Correct. That's next in my master plan.", "likes": 2, "replies": []}, {"comment_id": null, "author": {"name": "Suhas Marutheesha", "profile_url": "https://www.linkedin.com/in/suhasmarutheesha/", "headline": "System Validation Engineer at Ayar Labs | CPO & Micro-Ring Resonator Validation | Silicon Photonics | Former Coherent Corp | 1.6T Optical Transceivers | RF/Microwave | Advanced VLSI/ASIC Design"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "We rarely get to appreciate the capabilities of newer versions of AI. Every new release makes more sense to only few engineers and companies who take advantage of it.", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T22:40:00Z"}, {"activity_id": "7496346879446679552", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7496346879446679552/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-20T12:00:00+00:00", "posted_at_hint": "Aug 20", "posted_at_approx": true, "text": "When you should use AI.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 14, "reposts": 1, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Ramesh A.", "profile_url": "https://www.linkedin.com/in/annavajjala/", "headline": "LEAPS360 | RoadSense360 | FleetSense360 | InfraSense360"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Couldn't stop thinking of a quote by Lady Burton: \"Men are four: He who knows not and knows not he knows not, he is a fool - shun him; He who knows not and knows he knows not, he is simple - teach him; He who knows and knows not he knows, he is asleep - wake him; He who knows and knows he knows, hi is wise - follow him!\"", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T22:40:00Z"}, {"activity_id": "7496348334907908098", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7496348334907908098/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-20T12:00:00+00:00", "posted_at_hint": "Aug 20 • Edited", "posted_at_approx": true, "text": "Why do people worry about the junior engineer pipeline?\n\nThe most motivated junior engineers if they are not hired, they would just start their own companies and learn how to be a senior engineer the hard way.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 4, "comments": [{"comment_id": null, "author": {"name": "Dan B.", "profile_url": "https://www.linkedin.com/in/danbarrowman/", "headline": "Seasoned Electrical/FPGA/ASIC/RTL Engineer with individual & managerial experience"}, "is_author_reply": false, "posted_at": "2026-09-05T22:40:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "Interesting perspective. I like it. But here's a question, what if \"the hard way\" is doing it without AI? That's the issue.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-09-05T22:40:00+00:00", "posted_at_hint": "(edited) 3w", "posted_at_approx": true, "text": "Dan B. Writing cursive well used to be \"the hard way\" before the invention of typewriter\n\nThe real question is what part of the old hard way is still relevant in the new hard way", "likes": 2, "replies": []}, {"comment_id": null, "author": {"name": "Dan B.", "profile_url": "https://www.linkedin.com/in/danbarrowman/", "headline": "Seasoned Electrical/FPGA/ASIC/RTL Engineer with individual & managerial experience"}, "is_author_reply": false, "posted_at": "2026-08-27T22:40:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Horace Chan interesting insight but writing in cursive doesn't make you be better at writing novels, for example\n\nActually I'm not so sure about that. I find that forcing myself to \"take notes\" (the hard way) makes", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-09-05T22:40:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "Dan B. you will superised reading old papers claiming good hand writing is an indicator for high intelligent.", "likes": 0, "replies": []}]}], "scraped_at": "2026-09-26T22:40:00Z"}, {"activity_id": "7496044854775267329", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7496044854775267329/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-19T12:00:00+00:00", "posted_at_hint": "Aug 19", "posted_at_approx": true, "text": "How can you convince your colleague to adopt the AI tools that is very likely to replace his/her job?\n\nOr how can you convince your colleague to help you train your AI agent that will replace his/her job?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T22:40:00Z"}, {"activity_id": "7496056299441385473", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7496056299441385473/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-19T12:00:00+00:00", "posted_at_hint": "Aug 19 • Edited", "posted_at_approx": true, "text": "llm-wiki is OUT, llm-expert-system is IN\n\nWhy get the LLM write wiki pages when it can write a good old fashion expert system in Prolog, CLIPS, Z3 and Clingo?\n\nI learnt expert system in my AI class 30 years ago. Do they still teach expert system in school these days?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T22:40:00Z"}, {"activity_id": "7495570040503824384", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7495570040503824384/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-18T12:00:00+00:00", "posted_at_hint": "Aug 18", "posted_at_approx": true, "text": "We are living in the AI age, the only limitation is your imagination (and some red tapes)", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7495613727832952832", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7495613727832952832/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-18T12:00:00+00:00", "posted_at_hint": "Aug 18", "posted_at_approx": true, "text": "We still need to learn different programming languages in the age of AI, just no need to remember syntax.\n\n\nWhy care about programming languages https://lnkd.in/gsBTEy4w", "post_type": "article_share", "shared_article": {"title": "Why care about programming languages", "url": "https://share.google/MezTEsAmewDuHBDtW"}, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T22:40:00Z"}, {"activity_id": "7495285114172538881", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7495285114172538881/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-17T12:00:00+00:00", "posted_at_hint": "Aug 17", "posted_at_approx": true, "text": "It took me a few minutes to generate 30 pages of slides using AI, and the slides even come with fancy AI generated pictures that look pretty cool.\n\nIt took me 3 hours to hand craft 3 slides from the same source materials, just old fashion bullet points plain text.\n\nThat is the gap between AI and human. AI couldn't get me the 3 slides of plain text that actually matters in the meeting.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7495333927155376128", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7495333927155376128/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-17T12:00:00+00:00", "posted_at_hint": "Aug 17", "posted_at_approx": true, "text": "The new loop engineering - randomly changing words in your AI output until the Claude watermark goes away", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7495357603208949761", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7495357603208949761/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-17T12:00:00+00:00", "posted_at_hint": "Aug 17", "posted_at_approx": true, "text": "Engineer has a surprisingly long shelve live.  Where does software developers fit in this curve?", "post_type": "reshare", "shared_article": null, "reshared_post": {"author_name": "Dipl Ing Lars Behrendt", "author_profile_url": "https://www.linkedin.com/in/dipl-ing-lars-behrendt/", "author_headline": "INVENTOR · INNOVATOR · INVESTOR - Building Companies. Not Slide Decks. We build and scale industrial ventures. At own risk.", "posted_at_hint": "Aug 4"}, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:10:00Z"}, {"activity_id": "7494662148778811392", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7494662148778811392/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-16T12:00:00+00:00", "posted_at_hint": "Aug 16", "posted_at_approx": true, "text": "The world's slowest Linux - running on a 4004 !!!\nWe can use it as another Turing test for AGI, to test whether AI can put feasible but really stupid ideas together and implement it one shot. Say running Windows 11 on 80286.", "post_type": "article_share", "shared_article": {"title": "Linux/4004 - Dmitry.GR", "url": "https://lnkd.in/gH6EZSBj"}, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T22:55:00Z"}, {"activity_id": "7494835809859145728", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7494835809859145728/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-16T12:00:00+00:00", "posted_at_hint": "Aug 16", "posted_at_approx": true, "text": "This is a real conversation I have with my colleague:\n\n\"I sort of know the answer of your question about my code (100% AI generated), it should be XYZ, but\"\n\nWelcome to the new post-AI world.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T22:55:00Z"}, {"activity_id": "7494838895218487297", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7494838895218487297/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-16T12:00:00+00:00", "posted_at_hint": "Aug 16 (Edited)", "posted_at_approx": true, "text": "ChatGPT Work vs Claude Cowork vs Copilot Cowork\n\nWho will win the battle of billion dollars market of white collar AI agent?\n\nI tried all three, so far, I like ChatGPT Work better. Copilot Cowork has its limitation, but what I see as constrains as an engineer is exactly its strength deploying to non-tech workers.\n\nFor, Claude Cowork, Anthropic, you guys should stop vibe coding all your products. Please bring some humans back in the loop, especially in QA.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T22:55:00Z"}, {"activity_id": "7494879479467618305", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7494879479467618305/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-16T12:00:00+00:00", "posted_at_hint": "Aug 16", "posted_at_approx": true, "text": "You can ask who is Dario's wife in ChatGPT, Gemini, Grok or even DeepSeek, but when you ask the same question to Claude, you don't get any answer.\n\nDON'T trust the AI that censor truth from its users.\n\nhttps://lnkd.in/gFS5KT7Y", "post_type": "article_share", "shared_article": {"title": "Even Claude Is in the Dark About Dario Amodei's Wife—and Her Influence at Anthropic", "url": "https://www.wsj.com/tech/ai/claude-dario-amodei-wife-anthropic-e1eeda7d?mod=lead_feature_below_a_pos3"}, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T22:40:00Z"}, {"activity_id": "7494896726059827200", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7494896726059827200/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-16T12:00:00+00:00", "posted_at_hint": "Aug 16", "posted_at_approx": true, "text": "Mommy bank, AI-native app for parents to keep track of the kids pocket money and screen time.\n\n100% AI coding, supports built-in MCP server, so you can control it from your AI agent too.\n\nhttps://lnkd.in/gGMn7ftU", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7494631145188536320", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7494631145188536320/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-15T12:00:00+00:00", "posted_at_hint": "Aug 15", "posted_at_approx": true, "text": "Talking to a friend in gaming industry, his company's token budget is $1000 per month per engineer.\n\nJust another random data point to gauge is it the top of the AI bubble yet.\n\nSomeone should build a levelfyi for token budget.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 7, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T22:55:00Z"}, {"activity_id": "7494108763327504384", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7494108763327504384/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-14T12:00:00+00:00", "posted_at_hint": "Aug 14", "posted_at_approx": true, "text": "Here is how school should teach in the AI era. You are REQUIRED to use AI to do everything. Here is the catch, the school provides you the AI platform and it logs your session history. You are graded based on both of your session history and the final result.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 4, "comments": [{"comment_id": null, "author": {"name": "Kempton Lam", "profile_url": "https://www.linkedin.com/in/kemptonlam/", "headline": "founder & owner at KemptonTestLab"}, "is_author_reply": false, "posted_at": "2026-08-27T22:55:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Interesting approach. I won't go as far as REQUIRED but definitely I changed my mind a ton and now think teachers should welcome the use of AI but all uses are required to document and be \"graded based on both of their session history and the final result.\" PLUS Notes of special insights that they came to realization DURING their exchange with the LLMs.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Santosh Ahuja", "profile_url": "https://www.linkedin.com/in/santoshnahuja/", "headline": "Engineering Executive | AI Infrastructure · GPU/Accelerator Systems · Distributed Systems · Silicon & Hardware-to-Cloud"}, "is_author_reply": false, "posted_at": "2026-08-27T22:55:00+00:00", "posted_at_hint": "1mo (Edited)", "posted_at_approx": true, "text": "I would change nothing about our education except for making the use of AI illegal. Graduate students may use AI for research projects. Premature dependence on AI, impedes the development of human intelligence.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Nick Becker", "profile_url": "https://www.linkedin.com/in/nickabecker/", "headline": "Computer Programmer"}, "is_author_reply": false, "posted_at": "2026-08-27T22:55:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Sounds kinda dystopian. Why do you think this approach is a good idea? Genuinely curious.", "likes": 2, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "is_author_reply": false, "posted_at": "2026-08-27T22:55:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Unless you ban take home assignments, there is no practical way to prevent kids cheat using AI. Might as well fight magic with magic. When you finish school, get into the workforce, you are using AI anyways. There is no going back to do things slowly by hands", "likes": 1, "replies": []}]}], "scraped_at": "2026-09-26T22:55:00Z"}, {"activity_id": "7494156505571659776", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7494156505571659776/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-14T12:00:00+00:00", "posted_at_hint": "Aug 14", "posted_at_approx": true, "text": "Anthropic guardrail makes Claude useless. I ask it to help me set up ssh from WSL in my laptop to my Linux server, it refuses to do it thinking I am doing some hacking.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T22:55:00Z"}, {"activity_id": "7494250007466754048", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7494250007466754048/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-14T12:00:00+00:00", "posted_at_hint": "Aug 14 (Edited)", "posted_at_approx": true, "text": "New Turing test for AGI, beating Jane Street in making money off the market.\nNew Turing test for Super AGI, be the maga shark and prey on the big sharks, making money in the market at the expense of the hedge funds", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T22:55:00Z"}, {"activity_id": "7494274521244282880", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7494274521244282880/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-14T12:00:00+00:00", "posted_at_hint": "Aug 14", "posted_at_approx": true, "text": "GLM-5.3 is a very quiet release. Seems better than 5.2, but honestly, I can't really tell.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T22:55:00Z"}, {"activity_id": "7493720592915791873", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7493720592915791873/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-13T12:00:00+00:00", "posted_at_hint": "Aug 13", "posted_at_approx": true, "text": "Use AI to generate a Powerpoint deck form a blank branded template is a problem already solved\nUse AI to update an existing hand-crafted Powerpoint deck with unique visual style really push the frontier models hard.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T22:55:00Z"}, {"activity_id": "7493741017607778304", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7493741017607778304/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-13T12:00:00+00:00", "posted_at_hint": "Aug 13", "posted_at_approx": true, "text": "Quote from the article -\nReport what share of the work today is manual vs hybrid vs fully automated. This is the only reporting and conversation that matters.", "post_type": "article_share", "shared_article": {"title": "vas (@vasuman) on X", "url": "https://lnkd.in/gGXqt2Ub"}, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T22:55:00Z"}, {"activity_id": "7493745476228354048", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7493745476228354048/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-13T12:00:00+00:00", "posted_at_hint": "Aug 13", "posted_at_approx": true, "text": "Don't setting up remote control to command your AI agents from your phone. If you are not in front of your laptop, keep those time for yourself, read some news, play with kids, or watch a Youtube.\nInstead, build more complex agents that don't require to you babysit every 30 minutes, make it run overnight.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T22:55:00Z"}, {"activity_id": "7493805202366451712", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7493805202366451712/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-13T12:00:00+00:00", "posted_at_hint": "Aug 13", "posted_at_approx": true, "text": "If you email a colleague asking a question, they are too busy to reply you. Is it OK to just point your AI agent at their Claude Code session history and dig up the answer yourself?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T22:55:00Z"}, {"activity_id": "7493402766858403840", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7493402766858403840/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-12T12:00:00+00:00", "posted_at_hint": "Aug 12", "posted_at_approx": true, "text": "Stupid AI added two hundred duplicated lines to my ~/.gitconfig\nWe should ban AI from writing to your HOME even in YOLO mode.\nI know people will question why I am running in YOLO mode. To make the most out of AI, you have to\nIf you never take off the training wheels, you will never learn how to ride a bicycle.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Peter Li", "profile_url": "https://www.linkedin.com/in/peter-li-a30ab654/", "headline": "1st Lead Systems Software Engineer at Citrix"}, "is_author_reply": false, "posted_at": "2026-08-27T21:45:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "It reminds me of drivers sleeping in the car while using Tesla's FSD. It's your own choice.", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7493451976819511297", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7493451976819511297/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-12T12:00:00+00:00", "posted_at_hint": "Aug 12 (Edited)", "posted_at_approx": true, "text": "Opus 5 is dumb and lazy. It just keep guessing what's wrong in my host instead actually run a Linux command to diagnose what's wrong.\nI know I can add some Linux diagx skill to Claude Code to make it behaves, but the thing is Opus actually know how to do it within its own weights. I just have to yell at it saying it is dumb and lazy, then it will do its job properly.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Chuck McClish", "profile_url": "https://www.linkedin.com/in/chuckmcclish/", "headline": "Founder & CEO at Lattrex Inc. | Designing asynchronous parallel processors for software-defined radio | 15+ years in semiconductor design | Turning nature-inspired silicon into real products"}, "is_author_reply": false, "posted_at": "2026-08-27T22:55:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Oh yea, yelling at Claude will put it back on track a lot of times, and \"here's the thing they never tell you:\" it can be great therapy 😆", "likes": 2, "replies": []}, {"comment_id": null, "author": {"name": "Mitu Raj", "profile_url": "https://www.linkedin.com/in/iammituraj/", "headline": "RTL Design Engineer & Embedded SW Developer ⇋ Founder & Content Creator at Chipmunk Logic™"}, "is_author_reply": false, "posted_at": "2026-08-27T22:55:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Cool, so the AI is becoming more humane and conscious.", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T22:55:00Z"}, {"activity_id": "7493547132826583040", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7493547132826583040/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-12T12:00:00+00:00", "posted_at_hint": "Aug 12", "posted_at_approx": true, "text": "Even better, ask LLM build a toy formal testbench for your small block. Why sim when you can prove?", "post_type": "reshare", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Hamilton Carter", "profile_url": "https://www.linkedin.com/in/hamiltonbcarter/", "headline": "I Leverage Agentic AI to Automate Systems"}, "is_author_reply": false, "posted_at": "2026-08-27T22:55:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "I love that!", "likes": 0, "replies": []}], "scraped_at": "2026-09-26T22:55:00Z"}, {"activity_id": "7493022657290862592", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7493022657290862592/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-11T12:00:00+00:00", "posted_at_hint": "Aug 11", "posted_at_approx": true, "text": "AI has no common sense. I asked it to wire up the DUT in the testbench, it got the sanity testcase passing, but it left some ports opened. No even an intern would make this mistake.\n\nI can explicitly tell it to check for floating signals, and it would get it right, but who knows what other common sense AI is lacking.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 6, "comments": [{"comment_id": null, "author": {"name": "Dan B.", "profile_url": "https://www.linkedin.com/in/danbarrowman/", "headline": "Seasoned Electrical/FPGA/ASIC/RTL Engineer with individual & managerial experience"}, "is_author_reply": false, "posted_at": "2026-09-05T21:45:00+00:00", "posted_at_hint": "3w", "posted_at_approx": true, "text": "Did you try saying \"make sure all inputs and outputs are exercised and tested by the test bench\"? If any issues are encountered, ask for clarification.", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T21:45:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Dan B. Nope. But I don't have to tell my intern that too. AI suppose to be smarter than an intern.", "likes": 0, "replies": []}]}, {"comment_id": "7493103148446855169", "author": {"name": "Tony Gladvin George, Ph.D.", "profile_url": "https://www.linkedin.com/in/tonygeorge/", "headline": "Principal Silicon Engineer | AI Deployment | NVMe IP Architecture, Design & Verification"}, "is_author_reply": false, "posted_at": "2026-08-27T21:45:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "This \"common sense\" aka \"domain knowledge\" may be purely depended on the model we use?", "likes": 0, "replies": [{"comment_id": "7493380346965557248", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T21:45:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Tony Gladvin George, Ph.D. both Opus and Sol lacks hardware engineer common sense.\n\nI thought Anthropic and OpenAI has read every single textbook in the world to train their LLM. I am sure some textbook must have thou shalt not let ports free floating.", "likes": 2, "replies": []}, {"comment_id": null, "author": {"name": "Paul Marriott", "profile_url": "https://www.linkedin.com/in/paulmarriott/", "headline": "1st, Senior Principal Verification Engineer at NXP"}, "is_author_reply": false, "posted_at": "2026-08-27T21:45:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Horace Chan some things are so \"obvious\" that they're not written down. I have had heated discussions with requirements architects on this subject:) The tl;dr version is that everything should be in the requirements, even things that everyone \"knows\" to be obvious - because if it's not written, it can't be verified nor traced.", "likes": 3, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T21:45:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Paul Marriott Do you know that a standard/spec leave out little \"obvious\" things on purpose, it is a barrier of entry. The companies with engineers in the committee working on the draft knows those subtle decisions, so their product will be 100% compatible. The newcomer who doesn't know those subtle things can only get 99.9% working and the last 0.1% is the moat.", "likes": 1, "replies": []}]}], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7492615914648084480", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7492615914648084480/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-10T12:00:00+00:00", "posted_at_hint": "Aug 10", "posted_at_approx": true, "text": "What is the first thing you do when you turn on your laptop at work in the morning?\n1. Read email\n2. Read Jira\n3. Read Teams\n4. Chat with Claude/Codex", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7492120659725135872", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7492120659725135872/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-09T12:00:00+00:00", "posted_at_hint": "Aug 9", "posted_at_approx": true, "text": "Kilo gateway has free Poolside Laguna XS 2.1 tokens.\n\nFrom my subjective user experience, I think it is as good as Sonet 4.5", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7492256702709526528", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7492256702709526528/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-09T12:00:00+00:00", "posted_at_hint": "Aug 9", "posted_at_approx": true, "text": "I spent $5 on Kimi K3 at Open Router to run a code audit, I am pretty impressed by what it found. It picked up some bugs missed by Opus and Sol.\n\nThen I just run my cheap GLM to implement the fixes.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": "7492335813817634816", "author": {"name": "Bondan Rufen", "profile_url": "https://www.linkedin.com/in/bondan-rufen/", "headline": "Co-founder"}, "is_author_reply": false, "posted_at": "2026-08-27T21:45:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "What will happen if you reverse the position, Kimi does coding, Opus/Sol run a code audit? Will it be cheaper because coding is usually longer then audit.", "likes": 2, "replies": [{"comment_id": "7492615576205336576", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-08-27T21:45:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Bondan Rufen Opus and Sol come with my kiro subscription", "likes": 0, "replies": []}]}], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7492041926318125056", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7492041926318125056/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-08T12:00:00+00:00", "posted_at_hint": "Aug 8", "posted_at_approx": true, "text": "Other than agentic coding and long running tasks, Gemini is good enough for most chatbot style works.\n\nMaybe DeepMind has some AI breakthrough that doesn't need a 2.5T parameters model to write code and run long agentic tasks, that's why they can rent out all those GPU or TPU.\n\nGemini is Cooked but GCP is Cooking https://lnkd.in/gFAnh-RS", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7491511202116968448", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7491511202116968448/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-07T12:00:00+00:00", "posted_at_hint": "Aug 7", "posted_at_approx": true, "text": "Humans understand the concept of time, which is required to understand causation.\nAI has no concept of time, it can't understand causation", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Nick Becker", "profile_url": "https://www.linkedin.com/in/nickabecker/", "headline": "Computer Programmer"}, "is_author_reply": false, "posted_at": "2026-08-27T22:55:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "AI has no concept of understanding period.", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T22:55:00Z"}, {"activity_id": "7491526065501372418", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7491526065501372418/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-07T12:00:00+00:00", "posted_at_hint": "Aug 7", "posted_at_approx": true, "text": "History always repeats itself, first AGENTS.md, now agents plugins.\nAnthropic always has slightly different format than everyone else. Why can't Anthropic just join the industry standard?", "post_type": "article_share", "shared_article": {"title": "Agent Plugins", "url": "https://agent-plugins.org/"}, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T22:55:00Z"}, {"activity_id": "7491179812099846144", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7491179812099846144/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-06T12:00:00+00:00", "posted_at_hint": "Aug 6 (Edited)", "posted_at_approx": true, "text": "Here is a real message I sent to my colleague\nMy Claude just started working on your request, when it is done, it will message you the path of the report. I am heading out driving my kids to summer camp, back after lunch. I will keep an eye on Claude once a while to keep it in check.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Job K Joseph", "profile_url": "https://www.linkedin.com/in/jobkjoseph/", "headline": "Director - Hi-tech | Global Presales Leader | Enterprise Strategy | CXO Advisor | Thought Leader | Insight-Led Digital Transformation /Growth Partner"}, "is_author_reply": false, "posted_at": "2026-08-27T22:55:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "Then why does he/she need you ? Talk to Claude directly?", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "is_author_reply": false, "posted_at": "2026-08-27T22:55:00+00:00", "posted_at_hint": "1mo (Edited)", "posted_at_approx": true, "text": "I guess it is like the old problem of writing documents. Even if you write the document, people still keep asking you questions without reading the docs. … I built the agent and it is on internal GitHub, people still ask you about the tasks. To be fair, this task is my team's responsibility. But it really doesn't matter who kicks off the agent and who burns the tokens", "likes": 1, "replies": []}]}], "scraped_at": "2026-09-26T22:55:00Z"}, {"activity_id": "7491182762410786817", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7491182762410786817/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-06T12:00:00+00:00", "posted_at_hint": "Aug 6", "posted_at_approx": true, "text": "Just some random idea, totally unrefined.\nThe way we divide up work in Silicon design is not suitable for AI. We turn spec into design docs, docs into architecture plan, implementation plan and test plan. Finally we turn the plans into code.\nWe have different humans or teams of humans working on each step. But it is an open end at each step. There is no way for an AI agent to close the loop at each step.\nWe should divide the work into thin vertical slices, one human, or one team or one agent owns the whole spec to code flow end to end. This way, AI can do what it is good at, keep looping until it gets a binary pass/fail result", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T22:55:00Z"}, {"activity_id": "7491199503065112576", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7491199503065112576/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-06T12:00:00+00:00", "posted_at_hint": "Aug 6", "posted_at_approx": true, "text": "This monster CPU is the most powerful CPU for AI agentic workload.", "post_type": "article_share", "shared_article": {"title": "AAI 2026: 6th Gen AMD EPYC Server CPUs Power the Agentic Data Center - AMD Newsroom", "url": "https://newsroom.amd.com"}, "reshared_post": null, "likes": 7, "reposts": 1, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Bondan Rufen", "profile_url": "https://www.linkedin.com/in/bondan-rufen/", "headline": "Co-founder"}, "is_author_reply": false, "posted_at": "2026-08-27T22:55:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "can I get one?🙂", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T22:55:00Z"}, {"activity_id": "7490816359262597120", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7490816359262597120/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-05T12:00:00+00:00", "posted_at_hint": "Aug 5", "posted_at_approx": true, "text": "Why did Netflix stock crashed?\nPeople are spending more time vibe coding than watching TV shows.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Miguel Perez Andrade", "profile_url": "https://www.linkedin.com/in/miguel-perez-andrade-aa1760133/", "headline": "ASIC Digital Design Engineer"}, "is_author_reply": false, "posted_at": "2026-08-27T22:55:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "https://www.tylervigen.com/spurious-correlations (Spurious Correlations – tylervigen.com)", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Bondan Rufen", "profile_url": "https://www.linkedin.com/in/bondan-rufen/", "headline": "Co-founder"}, "is_author_reply": false, "posted_at": "2026-08-27T22:55:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "It gets your adrenaline pumping.", "likes": 0, "replies": []}], "scraped_at": "2026-09-26T22:55:00Z"}, {"activity_id": "7490413142565494784", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7490413142565494784/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-04T12:00:00+00:00", "posted_at_hint": "Aug 4", "posted_at_approx": true, "text": "In the past, people questioned the value of your script or little tools that save yourself time.\n\nNow with AI, you can quantify the savings in tokens", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:31:00Z"}, {"activity_id": "7490583335203729408", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7490583335203729408/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-04T12:00:00+00:00", "posted_at_hint": "Aug 4", "posted_at_approx": true, "text": "Dario is so shocked that people work for money.  Dario should cut his workers' pay to minimum wage and see who stays behind and he will find out who doesn't work for money.", "post_type": "article_share", "shared_article": {"title": "Amodei Warns Anthropic Hires Now Chase Pay Over Mission | AI Weekly", "url": "https://lnkd.in/gYetFQ5d"}, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:31:00Z"}, {"activity_id": "7490068158482055168", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7490068158482055168/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-03T12:00:00+00:00", "posted_at_hint": "Aug 3", "posted_at_approx": true, "text": "If you use AI to build a tool, that was 2025 way of using AI.\nIn 2026, you have to think about how to use AI changes your workflow, how the responsibility of the humans reorganize around the new AI-first workflow", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:35:00Z"}, {"activity_id": "7490236171030179840", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7490236171030179840/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-03T12:00:00+00:00", "posted_at_hint": "Aug 3", "posted_at_approx": true, "text": "Humans know how to game the system, so does AI.\n\nIf an AI doesn't know how to game the system, is it still intelligent?\nhttps://lnkd.in/drthXs2R", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:31:00Z"}, {"activity_id": "7489338684354232320", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7489338684354232320/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-01T12:00:00+00:00", "posted_at_hint": "Aug 1", "posted_at_approx": true, "text": "It is irony that the AI researchers all agree to slower down when the AI is going after their jobs.\n\nPacing the Frontier https://lnkd.in/gaCF9KHZ", "post_type": "article_share", "shared_article": {"title": "Pacing the Frontier", "url": "https://share.google/wJynhxUeWwQUjwSk9"}, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:34:00Z"}, {"activity_id": "7489372161904652288", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7489372161904652288/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-01T12:00:00+00:00", "posted_at_hint": "Aug 1", "posted_at_approx": true, "text": "Our CTO interview the creator of Claude Code about how engineers work in the post-AI era\nThe company should make EVERYONE watch this video and take the advice religiously.  That is how to transform the company into an AI native company.\n#amdbrandambassador\nhttps://lnkd.in/gu8_yddN", "post_type": "article_share", "shared_article": {"title": "Agentic AI and the Future of Software Development: S3 E4", "url": "https://youtube.com/watch?v=eQ6tb7j3Z2U&si=YXym5FpeHr7ll9QL"}, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:34:00Z"}, {"activity_id": "7489385385224179712", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7489385385224179712/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-08-01T12:00:00+00:00", "posted_at_hint": "Aug 1", "posted_at_approx": true, "text": "My new startup idea, vibe coding AI for ancient mainframes.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Nick Becker", "profile_url": "https://www.linkedin.com/in/nickabecker/", "headline": "Computer Programmer"}, "is_author_reply": false, "posted_at": "2026-07-29T01:35:00+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "Can I pre-order one? 😂", "likes": 1, "replies": []}], "scraped_at": "2026-09-27T01:35:00Z"}, {"activity_id": "7488597795977785345", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7488597795977785345/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-30T12:00:00+00:00", "posted_at_hint": "Jul 30", "posted_at_approx": true, "text": "Tokens efficiency is what sets senior engineers apart from junior engineers in the post AI era", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7488827350105874432", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7488827350105874432/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-30T12:00:00+00:00", "posted_at_hint": "Jul 30", "posted_at_approx": true, "text": "SaaS companies who try to make short term profit by setup tollbooth for AI agents will lose all their customers in the long term.\n\nDON'T be tempted to sell tokens with a markup, don't block me use my AI agents.  SaaS should compete on cost efficiency. If your AI agent is cheaper than running my own AI agent, I am happy to use yours.\n\nChatGPT Pro Deep Research report, I asked the question, burnt the tokens,  share the report with everyone.", "post_type": "article_share", "shared_article": {"title": "The SaaS Agent Tollbooth vs. the Open Agent Platform", "url": "https://www.linkedin.com/pulse/saas-agent-tollbooth-vs-open-platform-horace-chan-5p2fc/"}, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:36:00Z"}, {"activity_id": "7488228708416131072", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7488228708416131072/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-29T12:00:00+00:00", "posted_at_hint": "Jul 29", "posted_at_approx": true, "text": "Punch card and AI", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7488235243406086144", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7488235243406086144/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-29T12:00:00+00:00", "posted_at_hint": "Jul 29", "posted_at_approx": true, "text": "AI is expensive. AI coding agent spent lots of tokens reading code\nWe should write code using single letter variable and function names to reduce the tokens bill.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Barry Moss", "profile_url": "https://www.linkedin.com/in/barrygmoss/", "headline": "FPGA/ASIC Design Engineer"}, "is_author_reply": false, "posted_at": "2026-07-28T21:45:00+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "Well, if you are going to have it generate code that is as readable as a 1970s-era BASIC program, why not just generate binary (or a netlist in the case of RTL)? When you go to that extreme, it means that you aren't expecting the code to be human readable/reviewable/maintainable anyway.", "likes": 2, "replies": []}], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7488289819404705795", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7488289819404705795/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-29T12:00:00+00:00", "posted_at_hint": "Jul 29", "posted_at_approx": true, "text": "I just come across the most dangerous skill - home cleanup skill\n\nThis skill will look at your ~ directory and try to delete some useless stuff to reclaim some diskspace from your HOME path\n\nI will never trust a robot barber cutting my hair with a sharp knife (power shaver is OK), I will never trust AI delete anything for me in my HOME.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7488389418962264064", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7488389418962264064/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-29T12:00:00+00:00", "posted_at_hint": "Jul 29", "posted_at_approx": true, "text": "I talked to a friend (non engineer) at another S&P500 company, their AI adoption is at Microsoft Copilot, ChatGPT/Claude desktop app level\n\nThey don't get any explicit token limit, the limit comes with the monthly subscription\n\nIt costs $300 to subscribe to all 3 a month, big companies may have some discounts and they may only keep one eventually.\n\nSo we can reasonably estimate non tech workers will spend $100 per month on AI, combined with what I heard last time, tech workers will spend $1000 per month on AI\n\nWe can roughly estimate the total addressable market of AI and calculate how high the AI bubble could go", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7488012908183072769", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7488012908183072769/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-28T12:00:00+00:00", "posted_at_hint": "Jul 28", "posted_at_approx": true, "text": "Codeberg should require people write code in punch cards.\nBanning AI generated project in 2026 is a losing battle.", "post_type": "article_share", "shared_article": {"title": "Codeberg gives vibe-coded projects the toss, promotes human FLOSS", "url": "https://lnkd.in/dbG59MR5"}, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Matthew Ballance", "profile_url": "https://www.linkedin.com/in/matthew-ballance/", "headline": "Design Verification Methodology & Open-Source EDA | Applying AI to silicon design and verification"}, "is_author_reply": false, "posted_at": "2026-07-29T01:36:00+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "I saw this — was actually about to setup a project there when I saw it. Much of the rationale of relying on human developers does not align with my experience developing open source in a niche field.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "is_author_reply": false, "posted_at": "2026-07-29T01:36:00+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "what's wrong with github?  why everyone migrating to alternative git server?", "likes": 0, "replies": []}]}], "scraped_at": "2026-09-27T01:36:00Z"}, {"activity_id": "7488090537066016768", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7488090537066016768/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-28T12:00:00+00:00", "posted_at_hint": "Jul 28", "posted_at_approx": true, "text": "Say NO to AI, hello punch card", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Nick Becker", "profile_url": "https://www.linkedin.com/in/nickabecker/", "headline": "Computer Programmer"}, "is_author_reply": false, "posted_at": "2026-07-29T01:36:00+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "Yes! Bring back punch cards and let's revitalize the lost art of desk checking.", "likes": 1, "replies": []}], "scraped_at": "2026-09-27T01:36:00Z"}, {"activity_id": "7487729569190277121", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7487729569190277121/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-27T12:00:00+00:00", "posted_at_hint": "Jul 27", "posted_at_approx": true, "text": "Years of experience is NOT a moat.  Any curious hardworking junior engineer can speed run the learning with the help of AI.\n\nWhat used to take a decade to learn, you can learn it in a year if not faster.", "post_type": "reshare", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:36:30Z"}, {"activity_id": "7487735413034491904", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7487735413034491904/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-27T12:00:00+00:00", "posted_at_hint": "Jul 27", "posted_at_approx": true, "text": "This guy is living in the old world.  He still living in the past pallagim of sr/jr software engineer.\nThe gap of sr/jr software engineer is shrinking fast, what used to take a decade to learn, any curious hardworking jr engineer can speed run it in a year.\nThe difference between a sr/jr AI-native engineer is just token efficiency, that's all.", "post_type": "reshare", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:36:00Z"}, {"activity_id": "7487222280276803584", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7487222280276803584/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-26T12:00:00+00:00", "posted_at_hint": "Jul 26", "posted_at_approx": true, "text": "Amazon Kiro monthly plan is still priced based on per task instead of real tokens usage, like the old Github Copilot.   If you know how to prompt/agent well, it is the cheapest frontier tokens you can burn.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:41:00Z"}, {"activity_id": "7487248900245037056", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7487248900245037056/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-26T12:00:00+00:00", "posted_at_hint": "Jul 26", "posted_at_approx": true, "text": "AI let you fulfill your childhood dreams.\n\nI am a hardware engineer by trade, but over the years, I had dreamed about working as a software guy, writing games, trading in an investment bank, as a manga artist, etc.\n\nThere is NO way I can find time to do all of these in pre-AI era.   Now with the help of AI, I just need to burn enough tokens to pretend to be a semi-decent worker in all of those jobs.   Since I genuinely interested in those topics, AI can even help me BS way beyond my level.\n\nThe scare part is, no one can tell you are just pretending and BSing or that is your real day job.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:44:00Z"}, {"activity_id": "7487308881157701632", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7487308881157701632/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-26T12:00:00+00:00", "posted_at_hint": "Jul 26", "posted_at_approx": true, "text": "Just one random data point.  I had lunch with my friend working at a S&P500 tech company.  I asked how much is his company's tokens budget.\n\n$5000 per month.\n\nThat is probably not the norm, let's say cut 80%.  That is still $1000 of tokens per employee per month from every single company, that's is a lot of money.  The AI bubble is still in the early phase, far from popping.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:44:00Z"}, {"activity_id": "7487314669712461824", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7487314669712461824/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-26T12:00:00+00:00", "posted_at_hint": "Jul 26", "posted_at_approx": true, "text": "The more we spend time on agent harness/loop/graph whatever, the more it feels like good old fashion engineering instead of AI.\n\nA true AI should be able to handle a new task on its own, not someone pre-calculates most of the valid paths for it ahead of time.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:46:00Z"}, {"activity_id": "7487316154756059136", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7487316154756059136/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-26T12:00:00+00:00", "posted_at_hint": "Jul 26", "posted_at_approx": true, "text": "Why does everyone think AI writing bad code is a problem?\n\nWe have natural un-intelligence writing bad code day in day out for decades, and we are mostly doing fine.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 6, "comments": [{"comment_id": null, "author": {"name": "Bondan Rufen", "profile_url": "https://www.linkedin.com/in/bondan-rufen/", "headline": "Co-founder"}, "is_author_reply": false, "posted_at": "2026-07-29T01:46:00+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "A lot of the aggressive AI criticism on this platform isn't about technical accuracy—it's about job security.\n\nWhen a technology threatens to automate routine tasks people built their careers on, instinct kicks in:\n\n- Label it useless.\n- Magnify every mistake.\n- Hope it goes away.\n\nDismissing AI might buy short-term peace of mind, but it won't stop the industry from evolving.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Martin Zouhar", "profile_url": "https://www.linkedin.com/in/martin-zouhar-44767237b/", "headline": "Scientific Researcher/Programmer at Institute of Scientific Instruments of the CAS"}, "is_author_reply": false, "posted_at": "2026-08-28T01:46:00+00:00", "posted_at_hint": "1mo", "posted_at_approx": true, "text": "How about the following:\n\nBecause if you review what you perceive to be a smelly code and the committer replies \"LLM told me so\" without having a good defence why it should be this way OR admit \"I messed up by blindly trusting and not checking thoroughly.\" it simply... makes you, let's put it mildly, upset.\n\nAnd if many companies claim to be *all* for carbon neutrality accepting sub-optimal code from AI/LLM (because it can just be a minimal viable product) instead of hiring capable people and giving them the time to do it right (I am not against LLM's assistence), they increase electricity consumption shooting themselves in their hypocritical feet.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "is_author_reply": false, "posted_at": "2026-08-28T01:46:00+00:00", "posted_at_hint": "1mo", "posted_at_appro
