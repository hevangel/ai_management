tter than human, but sport is a show business, if the team with bigger GPU always win, it is not fun to watch.", "post_type": "reshare", "shared_article": null, "reshared_post": {"author_name": "Matt Mills", "author_profile_url": "https://www.linkedin.com/in/matt-mills-a47671/", "author_headline": "President", "posted_at": null, "posted_at_hint": "Jul 21"}, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7486851877335166976", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7486851877335166976/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-25T12:00:00+00:00", "posted_at_hint": "Jul 25", "posted_at_approx": true, "text": "To ride the wave of AI, work on something that has no upper bound on what you can archive.\n\nQuote: There is no Shakespeare of customer service emails that is 100x better than the average customer service email.\n\nhttps://lnkd.in/gDnnrHid", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7486862777039552512", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7486862777039552512/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-25T12:00:00+00:00", "posted_at_hint": "Jul 25", "posted_at_approx": true, "text": "In the AI era, you shouldn't waste your time doing anything, let AI do everything for you\n\nInstead, you should spend your time on reading, thinking, learning, talking to real humans, and most important of all, writing down your thoughts so you can feed them to AI", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:45:00Z"}, {"activity_id": "7486871229388423168", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7486871229388423168/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-25T12:00:00+00:00", "posted_at_hint": "Jul 25", "posted_at_approx": true, "text": "Elon is so out of touch with reality.  I still need to work, I want to travel the world in private jets,  eat good food and do fun stuff with no line up.  I don't think AI can give everyone a private jet.", "post_type": "article_share", "shared_article": {"title": "Elon Musk Says AI and Robots Will Do 'So Much Stuff' We Run Out of Things for Humans to Do — But 'We'll Basically Just Issue Money to People'", "url": "https://lnkd.in/gX_jEKAQ"}, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:45:00Z"}, {"activity_id": "7486900577424023552", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7486900577424023552/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-25T12:00:00+00:00", "posted_at_hint": "Jul 25", "posted_at_approx": true, "text": "Button stealer Chrome plugin, steal a button from the websites you visited.\n\nTotally useless, but it is fun.  It won't exist without AI.  Code is cheap, why not have some fun?\n\nhttps://lnkd.in/gAhUpKUy", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:41:00Z"}, {"activity_id": "7486562098039246848", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7486562098039246848/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-24T12:00:00+00:00", "posted_at_hint": "Jul 24", "posted_at_approx": true, "text": "Openweight models are good for the GPU companies and data centers.\nJust like open source software, Linux, was good for the CPU companies back then\nNvidia, Microsoft, Meta warn against overregulating open-weight models\nOpen https://lnkd.in/gHG-KcZ7", "post_type": "article_share", "shared_article": {"title": "Nvidia, Microsoft, Meta warn against 'premature restrictions' of open-weight models", "url": "https://share.google/JbbiBeRWUC3BErrVp"}, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:42:00Z"}, {"activity_id": "7486574720063070208", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7486574720063070208/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-24T12:00:00+00:00", "posted_at_hint": "Jul 24", "posted_at_approx": true, "text": "It is gorgeous playing Microsoft Flight Simulator 2024 on an AMD 9950X3D + 64G RAM + 7900XTX\n\nWe just got this super powerful gaming rig in the office's game room, in addition to the good old PS5 and XBox\n\n#amdbrandambassador", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7486576084042395648", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7486576084042395648/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-24T12:00:00+00:00", "posted_at_hint": "Jul 24", "posted_at_approx": true, "text": "I just explain to my intern his task.\n\nlevel 1 - the intern ran the commands to do X manually\nlevel 2 - the intern writes a shell script to do X\nlevel 3 - the intern uses AI coding agent to vibe code a shell script to do X\nlevel 4 - the intern builds a reusable skill, so that the AI coding agent can generate a shell script to do X on the fly\nlevel 5 - the intern builds a pipeline that can evaluate a reusable skill, which let the AI coding agent generate a shell script to do X on the fly\n\nWe are working on level 5.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:45:00Z"}, {"activity_id": "7486296431759302656", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7486296431759302656/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-23T12:00:00+00:00", "posted_at_hint": "Jul 23", "posted_at_approx": true, "text": "Proudly worked on the Vulcano chip.   Those 2.4 Tbps bandwidth flows thru some RTL blocks I verified.\n#amdbrandambassador\n[reshared post by AMD Data Center]\nAI clusters are only as fast as the network connecting them. That is why we built something groundbreaking.\nThe AMD Pensando Vulcano 800 AI NIC is the only AI NIC delivering up to 2.4 Tbps of scale-out bandwidth per GPU on its unique 3 NICs-per-GPU configuration, cutting AI job completion time by up to 13% and purpose-built for AMD Helios.\nThe network is no longer the bottleneck. Learn all about our next-gen 800G AI NIC here:\nhttps://bit.ly/4wpFnjY", "post_type": "reshare", "shared_article": null, "reshared_post": null, "likes": 7, "reposts": 1, "comment_count": 3, "comments": [{"comment_id": null, "author": {"name": "Bondan Rufen", "profile_url": "https://www.linkedin.com/in/bondan-rufen/", "headline": "Co-founder"}, "is_author_reply": false, "posted_at": "2026-07-29T01:42:00+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "any compression accelerators on chip?", "li "2026-07-15T12:00:00+00:00", "posted_at_hint": "Jul 15", "posted_at_approx": true, "text": "In the pre-AI era, companies hired McKinsey to fire human employees to cut cost\n\nIn the post-AI era, companies will hire McKinsey to shutdown AI agents to cut cost", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7482842814800633856", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7482842814800633856/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-14T12:00:00+00:00", "posted_at_hint": "Jul 14", "posted_at_approx": true, "text": "AI is just computing - transform bits, move bits, store bits, everything else are just technical trade-offs.\n\nThis article is 100% AI generated, but the original 3 tag lines come from my human brain.", "post_type": "article_share", "shared_article": {"title": "AI Is Just Computing — and Computing Has Only Three Basic Jobs", "url": "https://www.linkedin.com/pulse/ai-just-computing-has-only-three-basic-jobs-horace-chan-zjs8c/"}, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 3, "comments": [{"comment_id": null, "author": {"name": "Jarmo Venalainen", "profile_url": "https://www.linkedin.com/in/jarmo-venalainen-abb61810/", "headline": "Studying what AI is, what it can do and what it will do."}, "is_author_reply": false, "posted_at": "2026-07-28T21:50:00+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "And at its core it has only three logic functions to do all that.\n\nAND, OR and NOT.\n\nAnd, yes that includes memory if you consider that you can build a bi-stable flip-flop with the above.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-07-28T21:50:00+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "You only need the NAND gate", "likes": 0, "replies": []}]}, {"comment_id": null, "author": {"name": "Jarmo Venalainen", "profile_url": "https://www.linkedin.com/in/jarmo-venalainen-abb61810/", "headline": "Studying what AI is, what it can do and what it will do."}, "is_author_reply": false, "posted_at": null, "posted_at_hint": "(edited) 2mo", "posted_at_approx": true, "text": "NAND reduces to NOT and AND.", "likes": 0, "replies": []}], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7482972785305231360", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7482972785305231360/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-14T12:00:00+00:00", "posted_at_hint": "Jul 14", "posted_at_approx": true, "text": "Human with no consciousness is zombie\n\nLLM has no consciousness\n\nLLM is AI zombie", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7483032665005248512", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7483032665005248512/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-14T12:00:00+00:00", "posted_at_hint": "Jul 14", "posted_at_approx": true, "text": "Why IBM is down 25% in a day?\n\nFinally, people can migrate those 50 years old COBOL running on the mainframes to modern programming languages using AI.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Manjunath HL", "profile_url": "https://www.linkedin.com/in/manjunath-hl-69bb95125/", "headline": "ADDI , BOBZ @ IBM ISL | Z/OS Assembler developer | IBM"}, "is_author_reply": false, "posted_at": "2026-07-28T21:50:00+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "It's not true", "likes": 4, "replies": []}, {"comment_id": null, "author": {"name": "Alan Harrison", "profile_url": "https://www.linkedin.com/in/alanjharrison/", "headline": "Computing education specialist. Lecturer, teacher, tutor, trainer and consultant."}, "is_author_reply": false, "posted_at": "2026-07-28T21:50:00+00:00", "posted_at_hint": "2mo", "posted_at_approx": true, "text": "That's not what the article says at all.", "likes": 2, "replies": []}], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7481393846866808832", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7481393846866808832/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-10T12:00:00+00:00", "posted_at_hint": "Jul 10 • Edited", "posted_at_approx": true, "text": "GPT 5.6 is cheaper than Fable 5 and honestly I can't tell which one is better.\n\nWill OpenAI gain some market share back from Anthropic this round?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7481496498434748416", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7481496498434748416/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-10T12:00:00+00:00", "posted_at_hint": "Jul 10", "posted_at_approx": true, "text": "For mission critical work, you need to own your LLM running on your own hardware, so Uncle Sam or Dario cannot take it away from you #amdbrandambassador", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7481033592077451264", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7481033592077451264/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-09T12:00:00+00:00", "posted_at_hint": "Jul 9", "posted_at_approx": true, "text": "Agent loop is out, Agent GOTO is in\n\nA semantic control-flow primitive for production AI agents that enables adaptive, auditable, context-aware jumps between reasoning states.\n\n* 100% AI generated parody", "post_type": "article_share", "shared_article": {"title": "Agent GOTO: The Next Control Primitive for Autonomous AI Systems", "url": "https://www.linkedin.com/pulse/agent-goto-next-control-primitive-autonomous-ai-systems-horace-chan-tbejc/"}, "reshared_post": null, "likes": 7, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7480742786971893760", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7480742786971893760/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-08T12:00:00+00:00", "posted_at_hint": "Jul 8", "posted_at_approx": true, "text": "I wasted half an hour talking to Sonnet thinking I was talking to Opus.   I forgot to switch back to Opus.\n\nSonnet is hallucinating a lot on debug tasks, it just randomly suggests that I try different things to workaround the problem.  Opus will spend the tokens reading everything and root cause the issue.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7480855827671785472", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7480855827671785472/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-08T12:00:00+00:00", "posted_at_hint": "Jul 8", "posted_at_approx": true, "text": "Someone need to duplicate the J-space research on open source LLM.\n\nIt would be fun to get a J-lens on Gemma or Qwen.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7478364340841238528", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7478364340841238528/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-02T12:00:00+00:00", "posted_at_hint": "Jul 2", "posted_at_approx": true, "text": "Finally, I got my Signal connected to my Hermes agent. Then I don't know what can I use it for?\n\nWrite code? Cursor and Copilot cloud is better, it can even push back into GitHub.\n\nChat? ChatGPT is a lot more convenient\n\nAutomation? I have it all set up with GitHub workflow and Jenkins before AI exists\n\nCan someone tell me what they use Claw or Hermes for? Why not just vibe code a script to do the same thing?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:30:00Z"}, {"activity_id": "7478001178153504768", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7478001178153504768/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-01T12:00:00+00:00", "posted_at_hint": "Jul 1", "posted_at_approx": true, "text": "Github Copilot reset the tokens on June 30, but it won't charge you for the next month until Jul 2nd.\n\nI finished using up all my tokens tonight, then cancel my subscription, so I don't have to pay for the next month.\n\nYou just need to have 2 Copilot accounts and alternate using each of them every other month, so that you can double your tokens for the same price.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 1, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Saad Siddiqui", "profile_url": "https://www.linkedin.com/in/saadsiddiqui02/", "headline": "hardware accelerators | inference chips| From Algorithms to Circuits | RISC-V and VLSI| FPGA/ASIC | Educator"}, "is_author_reply": false, "posted_at": "2026-06-28T21:50:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "the srategies we use for tokens! Great idea!", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7478117840567394304", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7478117840567394304/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-01T12:00:00+00:00", "posted_at_hint": "Jul 1 • Edited", "posted_at_approx": true, "text": "Batch Review MCP server v1.1 - added wavedorm and math equations to the markdown viewer.\n\nThis is a file reviewer built for human and AI to collaborate.   Both human and AI have the same access to the GUI to make comments on the code/text files\n\nOne shot the update with Sonnet 5 in 2 hours.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7478211524151640064", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7478211524151640064/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-07-01T12:00:00+00:00", "posted_at_hint": "Jul 1", "posted_at_approx": true, "text": "I transferred my domains from Squarespace to Cloudflare.\n\nGoogle sold its domain registry to Squarespace a few years ago, I never bother to migrate.  With the AI revolution, the business model of Squarespace will not survive as a its old self.   To make it worse, Squarespace is owned by private equity, it will NOT get the investment to keep up with the AI revolution.\n\nI don't want my domains locked behind a dead company with Squarespace turn off the lights and shut its doors.   Claudeflare will be a leader in the next phase of AI adoption.   Oh yes, I have some NET shares too.\n\nDON'T use any vendor if you are not willing to own its shares.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7477838771443376128", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7477838771443376128/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-30T12:00:00+00:00", "posted_at_hint": "Jun 30", "posted_at_approx": true, "text": "In a status meeting, my junior engineer gave an update on \"we have done XYZ\".   I thought he is the only one assigned on that task, so, I asked him who else is working on that task.  He clarified that \"we\" refer to himself and Claude.\n\nIs it a Gen-Z thing?  I use \"I\" when I talk about me using AI as a tool.  Gen-Z seems to use \"we\" as if AI is another person.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Rob Taylor", "profile_url": "https://www.linkedin.com/in/robtaylor78/", "headline": "Old hand of Open Source. Expert in: - OSS IC design tools, with Open and Proprietary mfg processes - Embedded system engineering with OSS - AI agent creation - Networking - GPU acceleration Open to interesting opps"}, "is_author_reply": false, "posted_at": "2026-06-28T21:50:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "I definitle think about claude as another person - they kinda feel like a bright postdoc, who still needs a lot of guidance in real world delivery ;)", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7477853091661484032", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7477853091661484032/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-30T12:00:00+00:00", "posted_at_hint": "Jun 30", "posted_at_approx": true, "text": "I never understand why people need OpenClaw or Hermes agent until I have my AI subscriptions.\n\nWhen I use AI at work, I have virtually unlimited tokens, the tokens are always there, I don't have any rush.\n\nWhen I had Github Copilot before, the premium request won't disappear, I can take my take time to use Copilot at my own pace, as long as I finished using up my 1000 premium request before the end of month, I am good.\n\nNow I have an AI subscription, the tokens count reset every 5 hours, use it or lose it.  I feel the obligation that I HAVE to burn all the tokens.  Since you can't sit in front of your laptop every 5 hours, so you setup a Claw to keep burning your tokens.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7475446323861749761", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7475446323861749761/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-24T12:00:00+00:00", "posted_at_hint": "Jun 24 • Edited", "posted_at_approx": true, "text": "If LLM has consciousness, so does Age of Empires II.\n\nDon't believe in those IPO pump and dump speakes.  AI is nothing special, it is just another piece of software", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7475569483072294913", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7475569483072294913/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-24T12:00:00+00:00", "posted_at_hint": "Jun 24", "posted_at_approx": true, "text": "AI moves so fast that a colleague calls my 1-month-old AI agent, the legacy tool.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:32:00Z"}, {"activity_id": "7475211994187616257", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7475211994187616257/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-23T12:00:00+00:00", "posted_at_hint": "Jun 23", "posted_at_approx": true, "text": "Weed (as in gardening), bugs (as in software), hallucinations (as in GenAI) are categorically the same thing\n\nIt is determined by whether you want it or not.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7475380304770195456", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7475380304770195456/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-23T12:00:00+00:00", "posted_at_hint": "Jun 23 • Edited", "posted_at_approx": true, "text": "Loop engineering is powerful; it will get you what you ask for if you burn enough tokens in one go.\n\nAfter I got the result, I end up spending the time trying to figure out what had happened.   My brain cannot keep up with the loop.   The good old 2-3 hours stretch run is the right pace for my brain to keep up.\n\nIt is so tempting to just hand it in and move on to the next loop.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7474851882885197824", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7474851882885197824/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-22T12:00:00+00:00", "posted_at_hint": "Jun 22", "posted_at_approx": true, "text": "There are two types of agentic skills\n\n1. The skill gives the LLM new information that it doesn't have in its weights\n\n2. The skill is just tokens already spent, the LLM figures something out on its own, write a note for its future self.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7474371125993570304", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7474371125993570304/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-21T12:00:00+00:00", "posted_at_hint": "Jun 21", "posted_at_approx": true, "text": "First, the conclusion: I can say with absolute certainty that AI will not replace human jobs.   Read the article to hear my argument (100% from human brain)", "post_type": "article_share", "shared_article": {"title": "Will AI replace humans jobs?", "url": "https://www.linkedin.com/pulse/ai-replace-humans-jobs-horace-chan-u1suc/"}, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 5, "comments": [{"comment_id": null, "author": {"name": "Ben Luong", "profile_url": "https://www.linkedin.com/in/benluong/", "headline": "Advanced Google Ads and conversion tracking | Founder, Fire Pixel | GA4, GTM, n8n, BigQuery | 20+ years in performance marketing"}, "is_author_reply": false, "posted_at": "2026-06-28T21:50:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "How can you square this with the thousands of jobs that have already been lost to AI?", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-06-28T21:50:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "most of those jobs should not exist in the first place.  They are over hire during the post Covid era", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Ben Luong", "profile_url": "https://www.linkedin.com/in/benluong/", "headline": "Advanced Google Ads and conversion tracking | Founder, Fire Pixel | GA4, GTM, n8n, BigQuery | 20+ years in performance marketing"}, "is_author_reply": false, "posted_at": "2026-06-28T21:50:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Yes but they've still gone because of AI. Whether or not they should have been there in the first place, does it matter? They have been replaced. Some people have explicitly said it's because of AI, like the cloudflare ceo.\n\nLook up 'unit cost Dominance' once AI + verifier is cheaper than you at your job. You will be replaced.  That's just basic economics.", "likes": 0, "replies": []}, {"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": null, "posted_at_hint": "(edited) 3mo", "posted_at_approx": true, "text": "Don't trust the management BS. They are just blaming AI for their own mistakes.\n\nThe nature of the job will be different, just like spreadsheets didn't replace accountants, in fact we got a lot more accountants.  Lumber jacks are not replaced by chainsaws", "likes": 2, "replies": []}, {"comment_id": null, "author": {"name": "Ben Luong", "profile_url": "https://www.linkedin.com/in/benluong/", "headline": "Advanced Google Ads and conversion tracking | Founder, Fire Pixel | GA4, GTM, n8n, BigQuery | 20+ years in performance marketing"}, "is_author_reply": false, "posted_at": "2026-06-28T21:50:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "\"Management is lying\" is not the escape hatch you think it is.\n\nFor public companies, claiming AI drove layoffs is a material productivity claim. Either AI is replacing labour, or executives are misleading markets about why headcount is falling.\n\nOne is technological displacement.\n\nThe other is potentially securities-fraud / jail-time territory.", "likes": 1, "replies": []}]}], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7474551295849177088", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7474551295849177088/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-21T12:00:00+00:00", "posted_at_hint": "Jun 21", "posted_at_approx": true, "text": "Super AI will be like cats.\n\nCat owners knows they own the cats, but the cats know who is the real masters.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7472388056659021826", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7472388056659021826/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-15T12:00:00+00:00", "posted_at_hint": "Jun 15 • Edited", "posted_at_approx": true, "text": "The AI race - adapt or out\n\n- my comics", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7472401483116904448", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7472401483116904448/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-15T12:00:00+00:00", "posted_at_hint": "Jun 15", "posted_at_approx": true, "text": "We finally reach the tipping point of AI adoption.   Teaching AI to do something (as a skill) roughly takes the same time as you do it yourself by hand, not wall clock time, but actual human attentions time.\n\nIf you don't build the AI skills yourself, someone else will build it, then you become redundant.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7472416109716041728", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7472416109716041728/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-15T12:00:00+00:00", "posted_at_hint": "Jun 15", "posted_at_approx": true, "text": "AMD is hiring in England.   We have development center in Cambridge and Dublin.   See the job opening at http://careers.amd.com #AMDBrandAmbassador", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7472444999947689985", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7472444999947689985/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-15T12:00:00+00:00", "posted_at_hint": "Jun 15", "posted_at_approx": true, "text": "Using Claude Code or Codex in YOLO mode is like riding a unicycle.  It looks dangerous at first, but after you get used to it, it is pretty safe", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7472507209721999360", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7472507209721999360/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-15T12:00:00+00:00", "posted_at_hint": "Jun 15 • Edited", "posted_at_approx": true, "text": "Anthropic has the best model this month, so everyone has no choice but use it today.  The real question is can you trust this company tomorrow?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7472508396504645632", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7472508396504645632/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-15T12:00:00+00:00", "posted_at_hint": "Jun 15", "posted_at_approx": true, "text": "Don't give false leads to your AI, it just digs the hole deeper and deeper.   The more powerful the AI, the faster your tokens are incinerated.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:32:00Z"}, {"activity_id": "7471233163504144384", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7471233163504144384/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-12T12:00:00+00:00", "posted_at_hint": "Jun 12", "posted_at_approx": true, "text": "Here is the prompt I use most often\n\nRead the email from XYZ, use skill ABC and EGF, work on it, let me review what your reply before send.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7471235665557467136", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7471235665557467136/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-12T12:00:00+00:00", "posted_at_hint": "Jun 12", "posted_at_approx": true, "text": "When deploying AI agents, you can't expect the users to be careful every time. You have to design the AI agents assuming the users are total idiots and they still can't shoot themselves on the foot.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7471310765916852224", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7471310765916852224/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-12T12:00:00+00:00", "posted_at_hint": "Jun 12", "posted_at_approx": true, "text": "Next year there will not be a Barcelona Grand Prix.  This Sunday is the last chance to see Kim and George racing on this track for the next while. #AMDBrandAmbassador", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7471327342825566208", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7471327342825566208/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-12T12:00:00+00:00", "posted_at_hint": "Jun 12", "posted_at_approx": true, "text": "The companies should change how meetings are schedule to accommodate AI agents.\n\nIn between every meeting, we should have a 15-minute break, kind of like high school, so we can catch up with our AI agents.\n\nI could be a lot more productive if I get a brief moment talking to my AI agents in between the meetings.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7471348553315991552", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7471348553315991552/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-12T12:00:00+00:00", "posted_at_hint": "Jun 12", "posted_at_approx": true, "text": "The BEST machine for running local LLM and local agents. #amdbrandambassador AMD", "post_type": "article_share", "shared_article": {"title": "AMD Ryzen AI Halo. The ultimate local AI developer platform.", "url": "https://bit.ly/4xv5PJS"}, "reshared_post": null, "likes": 4, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:31:00Z"}, {"activity_id": "7471047784457056258", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7471047784457056258/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-11T12:00:00+00:00", "posted_at_hint": "Jun 11", "posted_at_approx": true, "text": "Don't build things that use AI, build things for AI instead", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7469765649460830208", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7469765649460830208/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-08T12:00:00+00:00", "posted_at_hint": "Jun 8", "posted_at_approx": true, "text": "Anyone who claims LLM has consciousness are snake oil salesmen, or wants to pump the IPO.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Santosh Ahuja", "profile_url": "https://www.linkedin.com/in/santoshnahuja/", "headline": "Engineering Executive | AI Infrastructure · GPU/Accelerator Systems · Distributed Systems · Silicon & Hardware-to-Cloud"}, "is_author_reply": false, "posted_at": "2026-06-28T21:50:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Dario is that guy.", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7469784402831622145", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7469784402831622145/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-08T12:00:00+00:00", "posted_at_hint": "Jun 8", "posted_at_approx": true, "text": "You can't just blindly ask AI to update the skill with what it learnt from your chat session. I caught it many times, the skill is perfectly fine, but the AI still try to find something to change and ends up make the skill worse.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:26:00Z"}, {"activity_id": "7469541438603608064", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7469541438603608064/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-07T12:00:00+00:00", "posted_at_hint": "Jun 7", "posted_at_approx": true, "text": "How will engineers with AI agents change the company organization and incentive structure?   I spent the tokens asking ChatGPT Pro Deep Research, here is the report.\n\nTL;DR - incentive structure from pre-AI no longer works with engineers using AI agents, bad incentives breed bad behaviors, which leads to failure.", "post_type": "article_share", "shared_article": {"title": "AI Junior-Engineer Agents and the Rewiring of Software Organizations", "url": "https://www.linkedin.com/pulse/ai-junior-engineer-agents-rewiring-software-horace-chan-8qrrc/"}, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7469543151452540928", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7469543151452540928/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-07T12:00:00+00:00", "posted_at_hint": "Jun 7", "posted_at_approx": true, "text": "Those who worry about using AI will erode your software development skills, here is my questions for you\n\nWhen was the last time you look inside the implementation of the library that your code calls?\n\nWhat is the difference between using another human's library versus using AI to generate a bespoke library on the spot?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7469602632001601536", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7469602632001601536/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-07T12:00:00+00:00", "posted_at_hint": "Jun 7", "posted_at_approx": true, "text": "I have observed this pattern.\n\nWhen sr. engineers use AI, we try to shoehorn the AI into what we know that works from years of experience\n\nWhen jr. engineers use AI, they end up reinventing the history of compute but with a twist of AI native.  They end up implementing a superior solution with the help of AI from the first principle because they don't have any baggage", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Santosh Ahuja", "profile_url": "https://www.linkedin.com/in/santoshnahuja/", "headline": "Engineering Executive | AI Infrastructure · GPU/Accelerator Systems · Distributed Systems · Silicon & Hardware-to-Cloud"}, "is_author_reply": false, "posted_at": "2026-06-28T21:50:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Fine, the junior's design is better. The question isn't who can fly with AI. It's who can read the instruments when the AI says we're on course and we're not. Experience is a liability when you're drawing the route and the only thing that saves you when the route is wrong.", "likes": 3, "replies": []}], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7469230879073058817", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7469230879073058817/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-06T12:00:00+00:00", "posted_at_hint": "Jun 6", "posted_at_approx": true, "text": "The design of Antigravity is stupid.  I can't @ mention to add a markdown file to the prompt.   In fact, there is no way for me to select a file to add to the prompt.\n\nWhy can't Google just follow Microsoft Copilot and copy Cursor?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7468737227796389888", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7468737227796389888/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-05T12:00:00+00:00", "posted_at_hint": "Jun 5", "posted_at_approx": true, "text": "Anthropic doesn't have enough GPUs, that's the real reason why Dario wants everyone else to slow down.", "post_type": "article_share", "shared_article": {"title": "When AI builds itself", "url": "https://www.linkedin.com/safety/go/?url=https%3A%2F%2Fwww%2Eanthropic%2Ecom%2Finstitute%2Frecursive-self-improvement%3Ffbclid%3DIwb21leASP9W5jbGNrBI_1WmV4dG4DYWVtAjExAHNydGMGYXBwX2lkDDM1MDY4NTUzMTcyOAABHsF6qHfmVOvLSPUmULDxHfEV9EXqe6zyFNpRMPg42Jw6M7f8tfxJSnET7TPt_aem_2i0XAknygEoLbPQSFqubAw&urlhash=gPb2&mt=wysxkd-wzbrOckJG-CenNtiOL7ow6NuZbVlY7VAqJILJZhnW2giWmiadGddPmvF-Uz-0orvflBHEPY5PPWrZHIe-AanktmKDGJsBqQRMSzD4U05SF9PMWg&isSdui=true"}, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Hin chun", "profile_url": "https://www.linkedin.com/in/hin-c-a1b6a1112/", "headline": "Design verification engineer"}, "is_author_reply": false, "posted_at": "2026-06-29T01:35:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "How do you know that", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "is_author_reply": false, "posted_at": "2026-06-29T01:35:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Hin chun It is on the news.  watch Dario's interview from the past few months.  He was laughing at OpenAI spends too much on compute not too long ago", "likes": 1, "replies": []}]}], "scraped_at": "2026-09-27T01:35:00Z"}, {"activity_id": "7468739600585342976", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7468739600585342976/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-05T12:00:00+00:00", "posted_at_hint": "Jun 5", "posted_at_approx": true, "text": "Elon has a concept of moving bits vs moving atoms\n\nSemiconductor is at the junction where bits meet the atoms.  Moving bits are moving atoms  (well ... electrons) in chip design.\n\nWe deal with bits in their physical form.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Santosh Ahuja", "profile_url": "https://www.linkedin.com/in/santoshnahuja/", "headline": "Engineering Executive | AI Infrastructure · GPU/Accelerator Systems · Distributed Systems · Silicon & Hardware-to-Cloud"}, "is_author_reply": false, "posted_at": null, "posted_at_hint": "(edited) 4mo", "posted_at_approx": true, "text": "Elon is confused. Bits and atoms/electrons are different. A bit can move several atoms but atoms or electrons are sensitive to many things - heat, photonics not just bit. A bit is just a state. - My two bits", "likes": 1, "replies": []}], "scraped_at": "2026-09-27T01:35:00Z"}, {"activity_id": "7468749304988356608", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7468749304988356608/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-05T12:00:00+00:00", "posted_at_hint": "Jun 5", "posted_at_approx": true, "text": "Using AI, you don't have to read the code, but you have to understand the code\n\nProbably you have to understand the code better than when you code by hand.  When you write code by hand, you can defer your understanding to when you actually read the code to modify it.  When using AI, if your mental model of the code is different from the reality, you may send the AI down the wrong path.\n\nThe scary thing is, the more powerful the AI, the more it will try to blend the reality into fit your illusion", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:35:00Z"}, {"activity_id": "7468398008418684928", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7468398008418684928/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-04T12:00:00+00:00", "posted_at_hint": "Jun 4", "posted_at_approx": true, "text": "First, you need to make sure AI can do it\nNext, you need to make sure AI can do it reliably\nThen, you can think about how to make AI run it cost efficiently\nDon't get the order wrong", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:26:00Z"}, {"activity_id": "7468539207255265280", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7468539207255265280/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-04T12:00:00+00:00", "posted_at_hint": "Jun 4", "posted_at_approx": true, "text": "Let AI output HTML instead of Markdown file actually saves tokens. First, you AI to generate a reusable JavaScript that reads json/csv to generate the HTML inside the browser Then you instruct the AI to generate json/csv instead of markdown json/csv uses a lot less tokens than markdown", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:35:00Z"}, {"activity_id": "7467982964988207105", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7467982964988207105/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-03T12:00:00+00:00", "posted_at_hint": "Jun 3", "posted_at_approx": true, "text": "We should ban people from vibe coding RTL against a commercial VIP to demonstrate AI can design chips.\n\nIf you burn enough tokens, you can reverse distill the behavior of the VIP back into RTL form. AI is very good at copying, but that's not how silicon design works in reality.\n\nIt sets unrealistic expectations for the real RTL/DV engineers", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 63, "reposts": 0, "comment_count": 13, "comments": [{"comment_id": null, "author": {"name": "Jeremy Ralph", "profile_url": "https://www.linkedin.com/in/jeremyralph/", "headline": "Principal Verification Engineer at Microsoft"}, "is_author_reply": false, "posted_at": "2026-05-30T01:30:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Curve fitting RTL to match the VIP?\n\nDesign and Verif should be requirement spec based in my view. There is a tendency to get the design to match the Verif without a spec. Then, there is no single source of correctness. This can lead to wrong designs that pass verification, as many of us have seen in our careers.", "likes": 9, "replies": [{"comment_id": null, "author": {"name": "Hong Ping Tan", "profile_url": "https://www.linkedin.com/in/hong-ping-tan-9499935a/", "headline": "Hardware Hobbyist | Architecture Explorer | Challenger of Old Ideas"}, "is_author_reply": false, "posted_at": "2026-05-30T01:30:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Jeremy Ralph There is also a tendency to get the verification to match the design. Saw it many times like stimulus tuning, coverage closure, and even scoreboard construction.", "likes": 6, "replies": []}, {"comment_id": null, "author": {"name": "Rob Taylor", "profile_url": "https://www.linkedin.com/in/robtaylor78/", "headline": "Old hand of Open Source. Expert in: - OSS IC design tools, with Open and Proprietary mfg processes - Embedded system engineering with OSS - AI agent creation - Networking - GPU acceleration Open to interesting opps"}, "is_author_reply": false, "posted_at": "2026-05-30T01:30:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Jeremy Ralph agreed, if you're using AI for rtl, a solid system for requirements tracking, plans and architecture decisions is a prerequisite. Then you want to have multiple harnesses available for generation and validation.\n\nA great way to gain more confidence in rtl generation is to build two implementations from the spec, your real, performant one, and a really dumb one, and use formal equivalence checking.", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "Zolboo Naranbaatar", "profile_url": "https://www.linkedin.com/in/zolboon/", "headline": "Building deterministic infrastructure for hardware review and AI agent execution · Ark Axiom · Ark Sovereign"}, "is_author_reply": false, "posted_at": "2026-05-30T01:30:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Rob Taylor and Horace Chan are describing the most dangerous side effect of the current AI hardware hype: Correlated Vacuity.\n\nWhen an LLM \"vibe codes\" RTL by reverse-distilling a VIP, it learns to write logic and assertions that perfectly mirror its own architectural blind spots. The simulation passes, the coverage dashboard turns green, but the system has merely verified a vacuous state space. It is an illusion of correctness.\n\nRob Taylor is spot-on that formal equivalence is the necessary backstop. However, throwing un-audited, AI-generated RTL directly at a formal solver almost guarantees state-space explosion and timeouts.\n\nA diff is not a review answer. We don't need more generative tools; we need Review Compression. We must use deterministic graph analysis to run Bounded Triage—isolating the exact logic cones where Semantic Drift occurred.\n\nBy delivering a Cryptographic Handoff of those localized boundaries, we give senior DV engineers the exact, constrained targets they need to run those formal equivalence checks in minutes, rather than wasting weeks debugging probabilistic noise.", "likes": 2, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "is_author_reply": false, "posted_at": "2026-05-30T01:30:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Zolboo Naranbaatar The industry probably has to go much deeper. What is a specification? what exactly is a bug and what is a feature?\n\nWhy write a spec in ambiguous English language when we can enlist the help of AI to write a formal spec that can feed into AI at the PCIe SIG level.\n\nThink of the spec as an API, each company can compete on the implementation in term of gate area, power, latency, throughput extra, but their implementation has to formally proved meet the contract of the protocol.\n\nHere is the best part, PCIe SIG can adopt the business model of SQLite, the English spec is free, the formal AI readable spec need to pay.", "likes": 1, "replies": []}, {"comment_id": null, "author": {"name": "Rob Taylor", "profile_url": "https://www.linkedin.com/in/robtaylor78/", "headline": "Old hand of Open Source. Expert in: - OSS IC design tools, with Open and Proprietary mfg processes - Embedded system engineering with OSS - AI agent creation - Networking - GPU acceleration Open to interesting opps"}, "is_author_reply": false, "posted_at": "2026-05-30T01:30:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Zolboo Naranbaatar interesting take. how would you identify the exact logic cones where semantic drift has occurred?\n\nI can think of a couple of approaches, but I think the important thing in all of these is to drive *from* the requirements breakdown to minimise compounding of hallucinations/errors", "likes": 1, "replies": []}]}, {"comment_id": null, "author": {"name": "Dr. Tobias Ludwig", "profile_url": "https://www.linkedin.com/in/dr-tobias-ludwig/", "headline": "CEO | Formal Verification Enthusiast | Building the leading systemized Formal Verification delivery partner for the semiconductor industry"}, "is_author_reply": false, "posted_at": "2026-06-29T01:30:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "True, we should be careful what we celebrate as progress.\n\nDemos that equate \"copied VIP behavior\" with \"designed a chip\" set unrealistic expectations for RTL/DV teams and blur the line between engineering and mimicry.", "likes": 5, "replies": []}, {"comment_id": null, "author": {"name": "Ilija Dimitrijevic", "profile_url": "https://www.linkedin.com/in/ilija-dimitrijevic-165093159/", "headline": "Digital Verification Consultant"}, "is_author_reply": false, "posted_at": "2026-06-29T01:30:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Imagine buying that IP and talking to their customer support when problem arises.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "is_author_reply": false, "posted_at": "2026-06-29T01:30:00+00:00", "posted_at_hint": "3mo", "posted_at_approx": true, "text": "Ilija Dimitrijevic oh. They will have AI customer support too", "likes": 0, "replies": []}]}], "scraped_at": "2026-09-27T01:30:00Z"}, {"activity_id": "7468053324269789184", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7468053324269789184/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-03T12:00:00+00:00", "posted_at_hint": "Jun 3", "posted_at_approx": true, "text": "Why read a boring git commit history when you can read an exciting story of a knight's quest to slayer the evil dragon instead?\n\nfix a bug -> kill a monster\ninstall new skills -> acquire new weapons\nhuman input -> wisdom from the wise men", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:25:51Z"}, {"activity_id": "7468117819923222528", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7468117819923222528/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan/", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-03T12:00:00+00:00", "posted_at_hint": "Jun 3", "posted_at_approx": true, "text": "I asked LLM to generate static HTML page dashboard for my repo.  I end up with a 4.2M html file with a single line of 2.1M in size that crash Chrome every time I tried to open it.\n\nNow, the real engineering fun begins, how to make that HTML page usable.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-27T01:25:51Z"}, {"activity_id": "7467664155945144320", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7467664155945144320/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-02T12:00:00+00:00", "posted_at_hint": "Jun 2", "posted_at_approx": true, "text": "Someone should build a house design AI with a giant 3D printer for concrete, so that I can vibe design my dream house", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7467688850027429889", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7467688850027429889/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-02T12:00:00+00:00", "posted_at_hint": "Jun 2 • Edited", "posted_at_approx": true, "text": "Why Claude Code picked workflow as the key word.\nNow everytime I ask it to update something in my Github workflow, it tries to use the new dynamic workflow", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7467807394622926848", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7467807394622926848/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-02T12:00:00+00:00", "posted_at_hint": "Jun 2 • Edited", "posted_at_approx": true, "text": "There are two types of engineers\n1. Those who are willing to spend 3 hours to write a bash script (pre-AI) to automate a task that takes 3 minutes do it by hand, or spend 30 minutes to write an agentic skill to automate a task that takes 30 seconds do it by hand\n2. Those who think the first type engineers are wasting time.\nGuess which type will survive the AI revolution?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Tanmay Singh", "profile_url": "https://www.linkedin.com/in/tanmay-singh-full-stack-developer/", "headline": "Senior Software Engineer | Mentor | Building AI agents & scalable full-stack systems | Sharing AI engineering insights, experiments & lessons from shipping"}, "is_author_reply": false, "posted_at": "2026-05-29T21:36:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "Great engineers have always looked for leverage. AI is simply the next evolution of automation. The real advantage comes from building systems that save thousands of future minutes, not optimizing the next few seconds.", "likes": 1, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-05-29T21:36:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "and the saving compounds.", "likes": 1, "replies": []}]}], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7467823576759459842", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7467823576759459842/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-02T12:00:00+00:00", "posted_at_hint": "Jun 2", "posted_at_approx": true, "text": "You know you are doing real engineering work if you reach the flow state. Whether you are writing code by hand in the good old days, or chatting with your favorite AI vibe coding, you can reach the flow state.\n\nIn the flow state, you hold the whole complex problem in your mind, you are fully aware of how the pieces interact with each other.  Whether you edit the code by typing or command AI to vibe code it for you, it is essentially the same kind of mental workout, only at a different the level of abstraction.\n\nWelcome to the new world.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:50:00Z"}, {"activity_id": "7467315283465220097", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7467315283465220097/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-01T12:00:00+00:00", "posted_at_hint": "Jun 1", "posted_at_approx": true, "text": "Here is a philosophical question, if you ask AI to send an e-card for you, does that e-card still carry the same meaning as you do it yourself?", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7467379179798302720", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7467379179798302720/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-06-01T12:00:00+00:00", "posted_at_hint": "Jun 1", "posted_at_approx": true, "text": "RAM is sooooo expensive these days.  I bought 16G for my NAS.  For that price, I would get 64G a few years ago", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7464010343539953664", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7464010343539953664/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-23T12:00:00+00:00", "posted_at_hint": "May 23", "posted_at_approx": true, "text": "Every repo should have these markdown files\nAGENTS.md / CLAUDE.md - instructions for the AI\nREADME.md - easy to read for humans, who don't need to know the details\nCONTRIBUTING.md - instructions for the developer\nsession_history/<date>-<slug>.md - extract your conversation with AI into a prompt to reproduce your commit\nand yes - humans are banned from writing code by hand, only AI is allowed to edit anything", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7463484064893902848", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7463484064893902848/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-22T12:00:00+00:00", "posted_at_hint": "May 22", "posted_at_approx": true, "text": "Conway's law says organizations which design systems are constrained to produce designs which are copies of the communication structure of these organizations.\nJack Dorsey says companies will operate by acting as an \"intelligence layer\" that completely replaces traditional middle management.\nIf we combine Conway + Dorsey, the future of any software system is just a giant AI sitting in the middle with lots of agent skills on the peripheral.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7463751098693029888", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7463751098693029888/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-22T12:00:00+00:00", "posted_at_hint": "May 22", "posted_at_approx": true, "text": "There is the most powerful line in your [CLAUDE.md]\nI have unlimited tokens, you don't have to worry about cost.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7463836846343507969", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7463836846343507969/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-22T12:00:00+00:00", "posted_at_hint": "May 22 • Edited", "posted_at_approx": true, "text": "I heard from my friends that their company only has Github Copilot for their engineers, and they were told to work within the limit, don't over spend the monthly premium requests.\nGithub Copilot is changing to token billing starting next month, they are DOOMED.  Their AI bills will be 10x next month, or the engineer has to go back to writing code by hand.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 5, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7463434500983902208", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7463434500983902208/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-21T12:00:00+00:00", "posted_at_hint": "May 21", "posted_at_approx": true, "text": "If your vendors don't let you feed their documents into Claude Code or Codex, you should switch the vendors.\nThey are dinosaurs still living in the pre-AI era", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7461460940065181696", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7461460940065181696/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-16T12:00:00+00:00", "posted_at_hint": "May 16", "posted_at_approx": true, "text": "In the post AI era, human should only do these things:\n1. Learn\n2. Understand\n3. Make judgement calls\nEverything else should be done by AI", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 3, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7461492808516997120", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7461492808516997120/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-16T12:00:00+00:00", "posted_at_hint": "May 16", "posted_at_approx": true, "text": "The future of work.  Humans control AI agents to work on many things at the same time.\nUnless something is very important or chitchat, you don't talk to other humans directly, you let your AI talk to their AIs instead", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 7, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7461089661562695681", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7461089661562695681/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-15T12:00:00+00:00", "posted_at_hint": "May 15", "posted_at_approx": true, "text": "AI first means AI can read everything humans can read, do anything humans can do.\nDon't call yourself AI first if you still need humans to copy and paste things around for the AI.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 0, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7461173837179654144", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7461173837179654144/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-15T12:00:00+00:00", "posted_at_hint": "May 15", "posted_at_approx": true, "text": "Don't ask what AI can do for you, ask what you can do for the AI, after you make your wish to the AI\nThat is the mindset of an AI-first engineer.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7461287095475679232", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7461287095475679232/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-15T12:00:00+00:00", "posted_at_hint": "May 15", "posted_at_approx": true, "text": "I just know that GDPR consider token usage is personal data, it is under the protection of privacy laws.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7459147411605757953", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7459147411605757953/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-10T12:00:00+00:00", "posted_at_hint": "May 10", "posted_at_approx": true, "text": "When a bubble pops, the market feels the pain.  The pain has to happen, but it doesn't have to happen to you.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 1, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7458784177476354048", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7458784177476354048/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-09T12:00:00+00:00", "posted_at_hint": "May 9", "posted_at_approx": true, "text": "Anthropic should release a meta skill that distills any webpage into a CLI based navigation skill.\nIt will be a long time before all websites support web-mcp.\nIf AI can't see it, it doesn't exist.  There is so much information that is easy for humans to consume but it is very hard to feed it to AI.\nPlus, you can strip all the ads in CLI.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 2, "reposts": 0, "comment_count": 0, "comments": [], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7458950182466920448", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7458950182466920448/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-09T12:00:00+00:00", "posted_at_hint": "May 9", "posted_at_approx": true, "text": "It is counter intuitive.  I use Sonnet, the dumber model, to develop skills, so the skill is more robust.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 1, "comments": [{"comment_id": null, "author": {"name": "Michael Chan", "profile_url": "https://www.linkedin.com/in/michael-kh-chan/", "headline": "Security Engineer @ Clarity | AI Security | AppSec | OSCP, OSWE, OSEP"}, "is_author_reply": false, "posted_at": "2026-04-29T21:36:00+00:00", "posted_at_hint": "5mo", "posted_at_approx": true, "text": "The stronger models are just over \"thinking\" too much!", "likes": 1, "replies": []}], "scraped_at": "2026-09-26T21:36:00Z"}, {"activity_id": "7458593713926213632", "url": "https://www.linkedin.com/feed/update/urn:li:activity:7458593713926213632/", "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "posted_at": "2026-05-08T12:00:00+00:00", "posted_at_hint": "May 8 • Edited", "posted_at_approx": true, "text": "I find an use case for agent-to-agent communication.   I have to run a Claude Code session using my userid and anther Claude Code session using the service account userid to debug some deployment issues.   I am just copy-and-paste the chat between the two Claude Code most of the time.  It would be nice the two Claude Code sessions can talk to each other themselves.", "post_type": "original", "shared_article": null, "reshared_post": null, "likes": 6, "reposts": 0, "comment_count": 2, "comments": [{"comment_id": null, "author": {"name": "Lingkai Shi", "profile_url": "https://www.linkedin.com/in/lingkai-shi-2bb01720/", "headline": "Hardware IP Development Leader at AMD"}, "is_author_reply": false, "posted_at": "2026-05-29T21:36:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "why not using team mode in claude. agent suppose to talk with each other there", "likes": 0, "replies": [{"comment_id": null, "author": {"name": "Horace Chan", "profile_url": "https://www.linkedin.com/in/horacechan", "headline": "Expert in applying AI in verification"}, "is_author_reply": true, "posted_at": "2026-05-29T21:36:00+00:00", "posted_at_hint": "4mo", "posted_at_approx": true, "text": "we can't, corporate firew
